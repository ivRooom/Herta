# Local PostgreSQL topology (default). Preserve this path for existing operators.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    extends:
      file: docker-compose.common.yml
      service: redis
  migrator:
    extends:
      file: docker-compose.common.yml
      service: migrator
    entrypoint:
      [
        'sh',
        '-ec',
        'test "$$HERTA_DATABASE_MODE" = local || { echo "Wrong database topology" >&2; exit 2; }; exec "$$@"',
        '--',
      ]
    environment:
      HERTA_DATABASE_MODE: ${HERTA_DATABASE_MODE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    extends:
      file: docker-compose.common.yml
      service: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
  studio:
    extends:
      file: docker-compose.common.yml
      service: studio
  bot:
    extends:
      file: docker-compose.common.yml
      service: bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  whisper:
    extends:
      file: docker-compose.common.yml
      service: whisper
  worker:
    extends:
      file: docker-compose.common.yml
      service: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      bot:
        condition: service_healthy
  caddy:
    extends:
      file: docker-compose.common.yml
      service: caddy
  nginx:
    extends:
      file: docker-compose.common.yml
      service: nginx

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
