# Common service definitions. Use a root local/external Compose file.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ${HERTA_IMAGE:-herta-app:latest}
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    <<: *app
    command:
      - /app/packages/db/node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema
      - /app/packages/db/prisma/schema.prisma
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  api:
    <<: *app
    command: node apps/api/dist/main.js
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      API_PORT: ${API_PORT:-3001}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?INTERNAL_JWT_SECRET is required}
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  studio:
    <<: *app
    command: node apps/studio/.next/standalone/apps/studio/server.js
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      API_URL: ${API_URL:?API_URL is required}
      BOT_HEALTH_URL: ${BOT_HEALTH_URL:-http://bot:3000/healthz}
      BOT_HEALTH_REQUEST_TIMEOUT_MS: ${BOT_HEALTH_REQUEST_TIMEOUT_MS:-}
      BOT_INTERNAL_API_SECRET: ${BOT_INTERNAL_API_SECRET:?BOT_INTERNAL_API_SECRET is required}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-3000}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      DISCORD_BOT_PERMISSIONS: ${DISCORD_BOT_PERMISSIONS:-1374725106838}
      TEAM_SPLIT_SECRET: ${TEAM_SPLIT_SECRET:?TEAM_SPLIT_SECRET is required}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      HERTA_RUNTIME_SECRET_KEY: ${HERTA_RUNTIME_SECRET_KEY:-}
      HERTA_AI_PROVIDER: ${HERTA_AI_PROVIDER:-openai}
      HERTA_AI_MODEL_PROFILE: ${HERTA_AI_MODEL_PROFILE:-balanced}
      HERTA_AI_REASONING_EFFORT: ${HERTA_AI_REASONING_EFFORT:-low}
      STUDIO_SEMANTIC_SEARCH_PROVIDER: ${STUDIO_SEMANTIC_SEARCH_PROVIDER:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      IVRM_INTEGRATION_TOKEN: ${IVRM_INTEGRATION_TOKEN:-}
      DAILY_BONUS_ENABLED: ${DAILY_BONUS_ENABLED:-false}
      IVRM_INTEGRATION_GUILD_ID: ${IVRM_INTEGRATION_GUILD_ID:-}
      IVRM_WEB_API_BASE_URL: ${IVRM_WEB_API_BASE_URL:-}
      HERTA_MBTI_SYNC_SECRET: ${HERTA_MBTI_SYNC_SECRET:-}
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  bot:
    <<: *app
    command: node apps/bot/dist/main.js
    ports:
      # コンテナ内は0.0.0.0で待受するが、Lightsailホストではloopbackだけへ公開する。
      - '${HEALTH_PUBLISH_HOST:-127.0.0.1}:${HEALTH_PUBLISH_PORT:-3000}:${HEALTH_PORT:-3000}'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      HERTA_RUNTIME_SECRET_KEY: ${HERTA_RUNTIME_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HERTA_AI_ENABLED: ${HERTA_AI_ENABLED:-false}
      HERTA_AI_KILL_SWITCH: ${HERTA_AI_KILL_SWITCH:-false}
      HERTA_AI_PROVIDER: ${HERTA_AI_PROVIDER:-openai}
      HERTA_AI_MODEL_PROFILE: ${HERTA_AI_MODEL_PROFILE:-balanced}
      HERTA_AI_REASONING_EFFORT: ${HERTA_AI_REASONING_EFFORT:-low}
      HERTA_AI_MAX_INPUT_CHARS: ${HERTA_AI_MAX_INPUT_CHARS:-8000}
      HERTA_AI_MAX_INPUT_BYTES: ${HERTA_AI_MAX_INPUT_BYTES:-24000}
      HERTA_AI_MAX_OUTPUT_TOKENS: ${HERTA_AI_MAX_OUTPUT_TOKENS:-800}
      HERTA_AI_MAX_OUTPUT_CHARS: ${HERTA_AI_MAX_OUTPUT_CHARS:-6000}
      HERTA_AI_TIMEOUT_MS: ${HERTA_AI_TIMEOUT_MS:-30000}
      HERTA_AI_PROVIDER_RESPONSE_MAX_BYTES: ${HERTA_AI_PROVIDER_RESPONSE_MAX_BYTES:-524288}
      HERTA_AI_USER_RATE_LIMIT: ${HERTA_AI_USER_RATE_LIMIT:-6}
      HERTA_AI_GUILD_RATE_LIMIT: ${HERTA_AI_GUILD_RATE_LIMIT:-30}
      HERTA_AI_RATE_WINDOW_MS: ${HERTA_AI_RATE_WINDOW_MS:-60000}
      HERTA_AI_GUILD_QUOTA_MICRO_USD: ${HERTA_AI_GUILD_QUOTA_MICRO_USD:-1000000}
      HERTA_AI_QUOTA_WINDOW_MS: ${HERTA_AI_QUOTA_WINDOW_MS:-86400000}
      HERTA_AI_GLOBAL_CONCURRENCY: ${HERTA_AI_GLOBAL_CONCURRENCY:-4}
      HERTA_AI_PER_REQUEST_COST_LIMIT_MICRO_USD: ${HERTA_AI_PER_REQUEST_COST_LIMIT_MICRO_USD:-120000}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      BOT_INTERNAL_API_SECRET: ${BOT_INTERNAL_API_SECRET:?BOT_INTERNAL_API_SECRET is required}
      LFG_COMPONENT_SECRET: ${LFG_COMPONENT_SECRET:?LFG_COMPONENT_SECRET is required}
      TEAM_SPLIT_SECRET: ${TEAM_SPLIT_SECRET:?TEAM_SPLIT_SECRET is required}
      DISCORD_ENABLE_MESSAGE_CONTENT_INTENT: ${DISCORD_ENABLE_MESSAGE_CONTENT_INTENT:-false}
      # Config Studio User Picker / Moderationの再参加監視で必要。
      # Discord Developer Portal側でもServer Members Intentを有効化する。
      # 本番標準機能のため.env.productionの古いfalse設定よりこちらを優先する。
      DISCORD_ENABLE_GUILD_MEMBERS_INTENT: 'true'
      # Community Activityのオンライン(在席)時間・プレイ中ゲーム集計で使用。
      # Discord Developer Portal側でPresence Intentを有効化した上でtrueにする。
      DISCORD_ENABLE_PRESENCE_INTENT: ${DISCORD_ENABLE_PRESENCE_INTENT:-false}
      DISCORD_GUILD_ID_DEV: ${DISCORD_GUILD_ID_DEV:-}
      BOT_LOG_LEVEL: ${BOT_LOG_LEVEL:-info}
      HERTA_VERSION: ${HERTA_VERSION:-0.1.0}
      HEALTH_ENABLED: ${HEALTH_ENABLED:-true}
      HEALTH_HOST: ${HEALTH_HOST:-0.0.0.0}
      HEALTH_PORT: ${HEALTH_PORT:-3000}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-3000}
      HEALTH_CACHE_TTL_MS: ${HEALTH_CACHE_TTL_MS:-5000}
      HEALTH_HEARTBEAT_STALE_MS: ${HEALTH_HEARTBEAT_STALE_MS:-120000}
      IVRM_INTEGRATION_GUILD_ID: ${IVRM_INTEGRATION_GUILD_ID:-}
      IVRM_WEB_API_BASE_URL: ${IVRM_WEB_API_BASE_URL:-}
      HERTA_MBTI_SYNC_SECRET: ${HERTA_MBTI_SYNC_SECRET:-}
      HERTA_ACTIVITY_SYNC_SECRET: ${HERTA_ACTIVITY_SYNC_SECRET:-}
      DAILY_BONUS_ENABLED: ${DAILY_BONUS_ENABLED:-false}
      DAILY_BONUS_RESULT_CARD_ENABLED: ${DAILY_BONUS_RESULT_CARD_ENABLED:-false}
      DAILY_PARTICIPATION_ENABLED: ${DAILY_PARTICIPATION_ENABLED:-false}
      HERTA_POINTS_SECRET: ${HERTA_POINTS_SECRET:-}
      HENRIKDEV_API_KEY: ${HENRIKDEV_API_KEY:-}
      STUDIO_PUBLIC_BASE_URL: ${STUDIO_PUBLIC_BASE_URL:-}
      # VC要約のAWS Transcribe Streaming。認証情報はRuntime Secret Store優先、未設定時のみenvを使う。
      # regionが無いと認証情報があっても文字起こしがスキップされるため、既定でTokyoを渡す。
      # OpenAI raw voice is fail-closed until policy disclosure, opt-in, and
      # deletion safeguards have been released and verified.
      VC_RECAP_TRANSCRIPTION_PROVIDER: ${VC_RECAP_TRANSCRIPTION_PROVIDER:-aws}
      VC_RECAP_OPENAI_AUDIO_CONSENT_READY: ${VC_RECAP_OPENAI_AUDIO_CONSENT_READY:-false}
      VC_RECAP_LOCAL_WHISPER_ENABLED: ${VC_RECAP_LOCAL_WHISPER_ENABLED:-false}
      VC_RECAP_LOCAL_WHISPER_TOKEN: ${VC_RECAP_LOCAL_WHISPER_TOKEN:-}
      VC_RECAP_LOCAL_WHISPER_BACKEND: ${VC_RECAP_LOCAL_WHISPER_BACKEND:-python}
      VC_RECAP_NATIVE_WHISPER_ACCEPTED: ${VC_RECAP_NATIVE_WHISPER_ACCEPTED:-false}
      VC_RECAP_OPENAI_SESSION_MAX_AUDIO_MINUTES: ${VC_RECAP_OPENAI_SESSION_MAX_AUDIO_MINUTES:-120}
      AWS_TRANSCRIBE_REGION: ${AWS_TRANSCRIBE_REGION:-ap-northeast-1}
      AWS_TRANSCRIBE_ACCESS_KEY_ID: ${AWS_TRANSCRIBE_ACCESS_KEY_ID:-}
      AWS_TRANSCRIBE_SECRET_ACCESS_KEY: ${AWS_TRANSCRIBE_SECRET_ACCESS_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.HEALTH_PORT || '3000') + '/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: node apps/worker/dist/main.js
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      BOT_HEALTH_URL: ${BOT_HEALTH_URL:-http://bot:3000/healthz}
      BOT_INTERNAL_API_SECRET: ${BOT_INTERNAL_API_SECRET:?BOT_INTERNAL_API_SECRET is required}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      LFG_COMPONENT_SECRET: ${LFG_COMPONENT_SECRET:?LFG_COMPONENT_SECRET is required}
      TEAM_SPLIT_SECRET: ${TEAM_SPLIT_SECRET:?TEAM_SPLIT_SECRET is required}
      DISCORD_ROLE_OPERATION_SCAN_INTERVAL_SECONDS: ${DISCORD_ROLE_OPERATION_SCAN_INTERVAL_SECONDS:-15}
      DAILY_CONTENT_SCAN_INTERVAL_SECONDS: ${DAILY_CONTENT_SCAN_INTERVAL_SECONDS:-30}
      LFG_SCAN_INTERVAL_SECONDS: ${LFG_SCAN_INTERVAL_SECONDS:-30}
      TEAM_SPLIT_SCAN_INTERVAL_SECONDS: ${TEAM_SPLIT_SCAN_INTERVAL_SECONDS:-30}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-info}
      DAILY_BONUS_ENABLED: ${DAILY_BONUS_ENABLED:-false}
      HEALTH_HEARTBEAT_STALE_MS: ${HEALTH_HEARTBEAT_STALE_MS:-120000}
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      bot:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
      studio:
        condition: service_started
    restart: unless-stopped

  # Only created by docker compose --profile whisper; never exposed on host.
  whisper:
    profiles: ['whisper']
    build:
      context: ./services/whisper
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    mem_limit: 1024m
    cpus: '1.0'
    pids_limit: 96
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - type: bind
        source: ${VC_RECAP_WHISPER_MODEL_DIR:-./var/whisper-model}
        target: /models/model
        read_only: true
        bind:
          create_host_path: false
    environment:
      WHISPER_MODEL_PATH: /models/model
      VC_RECAP_LOCAL_WHISPER_TOKEN: ${VC_RECAP_LOCAL_WHISPER_TOKEN:-}
    # No ports: other Compose services only, not public or host network.
    expose: ['8765']

  # Dedicated native security candidate. OFF by default; no network alias
  # colliding with the legacy Python "whisper" profile, no public host ports.
  # Actual inference requires separate approval/consent and operator acceptance.
  whisper-native:
    profiles: ['whisper-native']
    build:
      context: ./services/whisper-cpp
      dockerfile: Dockerfile
    restart: 'no'
    read_only: true
    init: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: '1.0'
    pids_limit: 96
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - type: bind
        source: ${VC_RECAP_NATIVE_WHISPER_MODEL_FILE:-./var/whisper-ggml/ggml-tiny.bin}
        target: /models/ggml-tiny.bin
        read_only: true
        bind:
          create_host_path: false
    environment:
      WHISPER_MODEL_PATH: /models/ggml-tiny.bin
      VC_RECAP_LOCAL_WHISPER_TOKEN: ${VC_RECAP_LOCAL_WHISPER_TOKEN:-}
    # Docker-private port; never publish to the host or Cloudflare.
    expose: ['8765']

volumes:
  redis_data:
  caddy_data:
  caddy_config:
