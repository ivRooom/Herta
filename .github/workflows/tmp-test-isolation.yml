name: Temporary Test Isolation

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma Generate
        run: pnpm --filter @herta/db generate
      - name: Studio Tests
        continue-on-error: true
        run: pnpm --filter @herta/studio test
      - name: Bot Tests
        continue-on-error: true
        run: pnpm --filter @herta/bot test
      - name: Full Tests
        continue-on-error: true
        run: pnpm test
