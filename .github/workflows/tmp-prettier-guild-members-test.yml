name: Temporary Prettier Guild Member Test

on:
  push:
    branches:
      - feat/team-split-user-picker
    paths:
      - .github/workflows/tmp-prettier-guild-members-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/team-split-user-picker
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/studio/src/lib/bot-guild-members.test.ts
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-prettier-guild-members-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: Guild Member検索テストを自動整形"
          git push origin HEAD:feat/team-split-user-picker
