name: Nanoid Lockfile Diagnostic

on:
  push:
    branches:
      - feature/console-command-palette

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update nanoid override only
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.pnpm.overrides.nanoid = '3.3.18';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile
          git diff -- package.json pnpm-lock.yaml
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "nanoid override is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "nanoidの脆弱性修正版へ更新する"
          git push origin HEAD:feature/console-command-palette
