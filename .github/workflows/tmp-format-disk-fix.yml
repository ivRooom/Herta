name: Temporary format disk fix

on:
  push:
    branches: [fix/production-disk-reclamation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write .github/scripts/deploy-scripts.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/scripts/deploy-scripts.test.mjs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/deploy-scripts.test.mjs
          git commit -m 'style: format deploy disk reclamation test'
          git push origin HEAD:fix/production-disk-reclamation
