name: Apply moderation auto case UI

on:
  push:
    branches:
      - feat/moderation-auto-case-on-confirmed
    paths:
      - .github/workflows/apply-moderation-auto-case-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-auto-case-on-confirmed
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: レビューUIを更新
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/studio/src/components/moderation-detection-review.tsx')
          source = path.read_text()
          source = source.replace(
              """type ReviewResponse = {\n  error?: string;\n  reviewStatus?: ModerationDetectionReviewStatus;\n  reviewNote?: string | null;\n};""",
              """type ReviewResponse = {\n  error?: string;\n  reviewStatus?: ModerationDetectionReviewStatus;\n  reviewNote?: string | null;\n  automaticCase?: { caseNumber?: number; created?: boolean } | null;\n};""",
              1,
          )
          before = """      setSavedStatus(resolvedStatus);\n      setSavedNote(resolvedNote);\n      setMessage('保存しました');\n      router.refresh();"""
          after = """      setSavedStatus(resolvedStatus);\n      setSavedNote(resolvedNote);\n\n      const automaticCaseNumber = readCaseNumber(body.automaticCase ?? {});\n      if (automaticCaseNumber !== null) {\n        setCaseNumber(automaticCaseNumber);\n        setCaseMessage(\n          body.automaticCase?.created === false\n            ? `対象ルールのCase #${automaticCaseNumber}を表示します`\n            : `対象ルールのためCase #${automaticCaseNumber}を自動作成しました`,\n        );\n      } else if (resolvedStatus !== 'confirmed') {\n        setCaseNumber(null);\n        setCaseMessage(null);\n      }\n\n      setMessage('保存しました');\n      router.refresh();"""
          if before not in source:
              raise SystemExit('save result marker not found')
          source = source.replace(before, after, 1)
          path.write_text(source)
          PY

          pnpm exec prettier --write \
            apps/studio/src/components/moderation-detection-review.tsx \
            'apps/studio/src/app/api/guilds/[guildId]/moderation/detections/[detectionId]/route.ts' \
            plugins/moderation/src/auto-case.test.ts

          rm .github/workflows/apply-moderation-auto-case-ui.yml
      - name: 変更をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 自動ケース化結果をレビューUIへ表示"
          git push origin HEAD:feat/moderation-auto-case-on-confirmed
