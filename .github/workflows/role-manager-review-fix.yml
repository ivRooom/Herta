name: Role Manager review fix

on:
  push:
    branches:
      - feat/role-manager-v2-panels

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/bot/src/plugins/role-manager.ts')
          text = path.read_text()
          old = '''  const seenRoleIds = new Set<string>();
          const groups = normalizedGroups.map((group) => {
            const roleIds = group.roleIds.filter((roleId) => {
              if (seenRoleIds.has(roleId)) return false;
              seenRoleIds.add(roleId);
              return true;
            });
            return {
              ...group,
              roleIds,
              maxSelections:
                group.mode === 'single' ? 1 : Math.min(group.maxSelections, Math.max(roleIds.length, 1)),
            };
          });'''
          new = '''  const seenGroupIds = new Set<string>();
          const seenRoleIds = new Set<string>();
          const groups = normalizedGroups.flatMap((group) => {
            if (seenGroupIds.has(group.id)) return [];
            seenGroupIds.add(group.id);
            const roleIds = group.roleIds.filter((roleId) => {
              if (seenRoleIds.has(roleId)) return false;
              seenRoleIds.add(roleId);
              return true;
            });
            return [
              {
                ...group,
                roleIds,
                maxSelections:
                  group.mode === 'single'
                    ? 1
                    : Math.min(group.maxSelections, Math.max(roleIds.length, 1)),
              },
            ];
          });'''
          if old not in text:
              raise SystemExit('normalize block not found')
          text = text.replace(old, new, 1)
          old = "  const current = new Set(group.roleIds.filter((roleId) => new Set(currentRoleIds).has(roleId)));"
          new = "  const currentRoleIdSet = new Set(currentRoleIds);\n  const current = new Set(group.roleIds.filter((roleId) => currentRoleIdSet.has(roleId)));"
          if old not in text:
              raise SystemExit('selection block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('apps/bot/src/plugins/role-manager.test.ts')
          text = path.read_text()
          old = '''  it('Roleのグループ間重複だけを除去する', () => {
            const config = normalizeRoleManagerConfig({
              groups: [
                { id: 'color', name: '旧Color', roleIds: ['100', '200'] },
                { id: 'color', name: '新Color', roleIds: ['300'] },
                { id: 'game', name: 'Game', roleIds: ['300', '400'] },
              ],
            });
            expect(config.groups.map((group) => group.name)).toEqual(['旧Color', '新Color', 'Game']);
            expect(config.groups[0]?.roleIds).toEqual(['100', '200']);
            expect(config.groups[1]?.roleIds).toEqual(['300']);
            expect(config.groups[2]?.roleIds).toEqual(['400']);
          });'''
          new = '''  it('重複Group IDは後続Groupを除外しRoleのグループ間重複も除去する', () => {
            const config = normalizeRoleManagerConfig({
              groups: [
                { id: 'color', name: '旧Color', roleIds: ['100', '200'] },
                { id: 'color', name: '新Color', roleIds: ['300'] },
                { id: 'game', name: 'Game', roleIds: ['300', '400'] },
              ],
            });
            expect(config.groups.map((group) => group.name)).toEqual(['旧Color', 'Game']);
            expect(config.groups.map((group) => group.id)).toEqual(['color', 'game']);
            expect(config.groups[0]?.roleIds).toEqual(['100', '200']);
            expect(config.groups[1]?.roleIds).toEqual(['300', '400']);
          });'''
          if old not in text:
              raise SystemExit('test block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/bot/src/plugins/role-manager.ts apps/bot/src/plugins/role-manager.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/role-manager.ts apps/bot/src/plugins/role-manager.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Role PanelのGroup IDを一意に正規化する"
          git push
