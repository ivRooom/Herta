name: Temporary Mini Games v2 review fixes

on:
  push:
    branches:
      - feature/mini-games-v2-stats-challenges

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v2-stats-challenges
      - name: Apply review fixes
        run: python3 .github/scripts/temp-mini-games-v2-review-fixes.py
      - name: Remove temporary files
        run: |
          rm .github/scripts/temp-mini-games-v2-review-fixes.py
          rm .github/workflows/temporary-mini-games-v2-review-fixes.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins packages/shared/src .github
          git commit -m "Mini Games v2の同期・通知・実績判定を修正する"
          git push origin HEAD:feature/mini-games-v2-stats-challenges
