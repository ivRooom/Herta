name: Message Target Sync Main

on:
  push:
    branches:
      - feat/config-studio-message-target

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-message-target
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: mainを取り込む
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X ours
      - name: Security overrideを正規化
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides.nanoid = '3.3.17';
          pkg.pnpm.overrides.postcss = '8.5.23';
          pkg.pnpm.overrides.qs = '6.15.2';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: mainのlockfileを基準に再生成
        run: |
          git show origin/main:pnpm-lock.yaml > pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: 同期結果をcommitして一時Workflowを削除
        run: |
          git rm .github/workflows/message-target-sync-main.yml
          git add package.json pnpm-lock.yaml
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: main同期とSecurity overrideを正規化"
          fi
          git push origin HEAD:feat/config-studio-message-target
