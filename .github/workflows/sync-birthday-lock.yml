name: Sync Birthday v2 lockfile

on:
  push:
    branches:
      - feat/birthday-card-v2

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/birthday-card-v2
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit refreshed lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/sync-birthday-lock.yml
          git commit -m "Birthday v2のlockfileを同期する"
          git push origin HEAD:feat/birthday-card-v2
