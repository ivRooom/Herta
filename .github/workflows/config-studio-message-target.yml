name: Config Studio Message Target

on:
  push:
    branches:
      - feat/config-studio-message-target

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-message-target
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-config-studio-message-target.py
      - run: pnpm exec prettier --write apps/studio/src/lib/discord-message-target.ts apps/studio/src/lib/discord-message-target.test.ts apps/studio/src/lib/plugin-config-studio.ts apps/studio/src/components/discord-message-target-picker.tsx apps/studio/src/components/plugin-config-studio-form.tsx
      - run: pnpm --dir apps/studio typecheck
      - run: pnpm --dir apps/studio test
      - name: commitして一時ファイルを削除
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/config-studio-message-target.yml scripts/patch-config-studio-message-target.py
          git add apps/studio/src/lib/discord-message-target.ts apps/studio/src/lib/discord-message-target.test.ts apps/studio/src/lib/plugin-config-studio.ts apps/studio/src/components/discord-message-target-picker.tsx apps/studio/src/components/plugin-config-studio-form.tsx
          git commit -m "feat: Config StudioにDiscord Message Target Pickerを追加"
          git push origin HEAD:feat/config-studio-message-target
