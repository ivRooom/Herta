name: Temporary Mini Games v3 patch

on:
  push:
    branches:
      - feature/mini-games-v3-dice-chinchiro-leaderboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v3-dice-chinchiro-leaderboard
      - name: Apply patch
        run: python3 .github/scripts/mini-games-v3-patch.py
      - name: Commit patched files
        run: |
          rm .github/workflows/temporary-mini-games-v3-patch.yml
          rm .github/scripts/mini-games-v3-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mini Games v3をBotと自動同期へ接続する'
          git push origin HEAD:feature/mini-games-v3-dice-chinchiro-leaderboard
