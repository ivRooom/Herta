name: Temporary Layout Format Diff

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/studio/src/app/dashboard/layout.tsx
          git diff -- apps/studio/src/app/dashboard/layout.tsx
