name: Account Menu Prettier

on:
  push:
    branches:
      - feature/studio-account-menu
    paths:
      - .github/workflows/account-menu-prettier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-account-menu
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format account menu files
        run: >-
          pnpm exec prettier --write
          apps/studio/src/app/dashboard/account/page.tsx
          apps/studio/src/components/account-menu.tsx
          apps/studio/src/lib/auth-navigation.ts
          apps/studio/src/lib/studio-navigation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/studio/src/app/dashboard/account/page.tsx \
            apps/studio/src/components/account-menu.tsx \
            apps/studio/src/lib/auth-navigation.ts \
            apps/studio/src/lib/studio-navigation.test.ts
          git commit -m "Account Menu実装をPrettierで整形する"
          git push origin HEAD:feature/studio-account-menu
