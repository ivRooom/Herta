name: Auto Response v1 Finalize

on:
  push:
    branches:
      - feat/auto-response-plugin-v1
    paths:
      - '.github/workflows/auto-response-v1-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final changes
        run: node .github/scripts/finalize-auto-response-v1.mjs
      - name: Format repository
        run: pnpm format
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No final changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'fix(auto-response): RuntimeとStudioの最終整合性を修正'
          git push origin HEAD:feat/auto-response-plugin-v1
          echo 'Auto Response v1 finalization completed.'
