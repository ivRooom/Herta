name: Temporary VC Recap docs prettier snapshot

on:
  pull_request:
    types: [synchronize]
    branches: [main]
  push:
    branches:
      - docs/vc-recap-lifecycle-design-20261030

permissions:
  contents: read

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - name: Emit formatted Markdown snapshot
        shell: bash
        run: |
          set -euo pipefail
          f1="docs/PRIVACY_POLICY.md"
          f2="docs/VC_RECAP_STORAGE_COST_ESTIMATE.md"
          pnpm exec prettier --write "$f1" "$f2"
          echo "__HERTA_DOC_FMT_START_1__"
          cat "$f1"
          echo "__HERTA_DOC_FMT_END_1__"
          echo "__HERTA_DOC_FMT_START_2__"
          cat "$f2"
          echo "__HERTA_DOC_FMT_END_2__"
