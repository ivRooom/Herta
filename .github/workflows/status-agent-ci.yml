# ============================================================
# ivrm-status-agent CI
# ============================================================
name: Status Agent CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'deploy/scripts/ivrm-status-agent.sh'
      - 'deploy/scripts/ivrm-status-agent.test.sh'
      - 'deploy/scripts/ivrm-status-agent-url.test.sh'
      - 'deploy/systemd/herta-status-agent.service'
      - 'deploy/systemd/herta-status-agent.timer'
      - 'deploy/systemd/status-agent.env.example'
      - 'docs/STATUS_AGENT.md'
      - 'docs/HEALTH.md'
      - '.github/workflows/status-agent-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'deploy/scripts/ivrm-status-agent.sh'
      - 'deploy/scripts/ivrm-status-agent.test.sh'
      - 'deploy/scripts/ivrm-status-agent-url.test.sh'
      - 'deploy/systemd/herta-status-agent.service'
      - 'deploy/systemd/herta-status-agent.timer'
      - 'deploy/systemd/status-agent.env.example'
      - 'docs/STATUS_AGENT.md'
      - 'docs/HEALTH.md'
      - '.github/workflows/status-agent-ci.yml'

permissions:
  contents: read

concurrency:
  group: status-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shell, signature and systemd validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shell構文を検証
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/scripts/ivrm-status-agent.sh
          bash -n deploy/scripts/ivrm-status-agent.test.sh
          bash -n deploy/scripts/ivrm-status-agent-url.test.sh

      - name: 署名・最小payload・異常系を検証
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/scripts/ivrm-status-agent.test.sh
          bash deploy/scripts/ivrm-status-agent-url.test.sh

      - name: systemd unitを実配置相当で検証
        shell: bash
        run: |
          set -euo pipefail

          sudo useradd \
            --system \
            --no-create-home \
            --home-dir /nonexistent \
            --shell /usr/sbin/nologin \
            herta-status-agent

          sudo install -d \
            --owner root \
            --group root \
            --mode 0755 \
            /app/herta/deploy/scripts \
            /app/herta/docs
          sudo install -d \
            --owner root \
            --group root \
            --mode 0700 \
            /etc/herta

          sudo install \
            --owner root \
            --group root \
            --mode 0644 \
            deploy/scripts/ivrm-status-agent.sh \
            /app/herta/deploy/scripts/ivrm-status-agent.sh
          sudo install \
            --owner root \
            --group root \
            --mode 0644 \
            docs/STATUS_AGENT.md \
            /app/herta/docs/STATUS_AGENT.md
          sudo install \
            --owner root \
            --group root \
            --mode 0600 \
            deploy/systemd/status-agent.env.example \
            /etc/herta/status-agent.env

          systemd-analyze verify --recursive-errors=yes \
            deploy/systemd/herta-status-agent.service \
            deploy/systemd/herta-status-agent.timer

      - name: セキュリティ境界を静的検証
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'X-IVRM-Signature-Version: v1' deploy/scripts/ivrm-status-agent.sh
          grep -q 'X-IVRM-Timestamp:' deploy/scripts/ivrm-status-agent.sh
          grep -q 'X-IVRM-Nonce:' deploy/scripts/ivrm-status-agent.sh
          grep -q 'X-IVRM-Signature: sha256=' deploy/scripts/ivrm-status-agent.sh
          grep -q 'STATUS_INGEST_URLにはHTTPS URL' deploy/scripts/ivrm-status-agent.sh
          grep -q 'HEALTH_URLは既定でloopback' deploy/scripts/ivrm-status-agent.sh
          grep -q 'flock -n' deploy/scripts/ivrm-status-agent.sh
          grep -q -- '--max-filesize' deploy/scripts/ivrm-status-agent.sh
          grep -q -- '--output /dev/null' deploy/scripts/ivrm-status-agent.sh

          if grep -q 'guild_count:' deploy/scripts/ivrm-status-agent.sh; then
            echo '::error::公開payloadへguild_countを追加しないでください'
            exit 1
          fi

          grep -q '^User=herta-status-agent$' deploy/systemd/herta-status-agent.service
          grep -q '^NoNewPrivileges=true$' deploy/systemd/herta-status-agent.service
          grep -q '^ProtectSystem=strict$' deploy/systemd/herta-status-agent.service
          grep -q '^ProtectHome=true$' deploy/systemd/herta-status-agent.service
          grep -q '^CapabilityBoundingSet=$' deploy/systemd/herta-status-agent.service
          grep -q '^TimeoutStartSec=75s$' deploy/systemd/herta-status-agent.service
          grep -q '^OnUnitActiveSec=1min$' deploy/systemd/herta-status-agent.timer
          grep -q '^STATUS_SIGNING_SECRET=$' deploy/systemd/status-agent.env.example
