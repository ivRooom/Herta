name: Temporary format managed access

on:
  push:
    branches:
      - feat/studio-managed-access-policies-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/studio-managed-access-policies-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync Prisma schema and format changed files
        run: |
          if ! grep -q '^model StudioAccessPolicy {' packages/db/prisma/schema.prisma; then
            cat >> packages/db/prisma/schema.prisma <<'PRISMA'

model StudioAccessPolicy {
  id          String   @id @db.Uuid
  guildId     String   @map("guild_id")
  name        String   @db.VarChar(100)
  description String?  @db.VarChar(500)
  document    Json
  revision    Int      @default(1)
  createdBy   String   @map("created_by")
  updatedBy   String   @map("updated_by")
  createdAt   DateTime @default(now()) @map("created_at") @db.Timestamptz(3)
  updatedAt   DateTime @updatedAt @map("updated_at") @db.Timestamptz(3)

  attachments StudioAccessPolicyAttachment[]

  @@unique([guildId, name])
  @@unique([id, guildId])
  @@index([guildId, updatedAt(sort: Desc)])
  @@map("studio_access_policies")
}

model StudioAccessGroup {
  id          String   @id @db.Uuid
  guildId     String   @map("guild_id")
  name        String   @db.VarChar(100)
  description String?  @db.VarChar(500)
  createdBy   String   @map("created_by")
  updatedBy   String   @map("updated_by")
  createdAt   DateTime @default(now()) @map("created_at") @db.Timestamptz(3)
  updatedAt   DateTime @updatedAt @map("updated_at") @db.Timestamptz(3)

  members StudioAccessGroupMember[]

  @@unique([guildId, name])
  @@unique([id, guildId])
  @@index([guildId, updatedAt(sort: Desc)])
  @@map("studio_access_groups")
}

model StudioAccessGroupMember {
  groupId   String   @map("group_id") @db.Uuid
  guildId   String   @map("guild_id")
  userId    String   @map("user_id")
  createdBy String   @map("created_by")
  createdAt DateTime @default(now()) @map("created_at") @db.Timestamptz(3)

  group StudioAccessGroup @relation(fields: [groupId, guildId], references: [id, guildId], onDelete: Cascade, onUpdate: Cascade)

  @@id([groupId, userId])
  @@index([guildId, userId])
  @@map("studio_access_group_members")
}

model StudioAccessPolicyAttachment {
  id            String   @id @db.Uuid
  policyId      String   @map("policy_id") @db.Uuid
  guildId       String   @map("guild_id")
  principalType String   @map("principal_type") @db.VarChar(16)
  principalId   String   @map("principal_id")
  createdBy     String   @map("created_by")
  createdAt     DateTime @default(now()) @map("created_at") @db.Timestamptz(3)

  policy StudioAccessPolicy @relation(fields: [policyId, guildId], references: [id, guildId], onDelete: Cascade, onUpdate: Cascade)

  @@unique([policyId, principalType, principalId])
  @@index([guildId, principalType, principalId])
  @@index([guildId, policyId])
  @@map("studio_access_policy_attachments")
}
PRISMA
          fi

          pnpm --filter @herta/db exec prisma format
          pnpm prettier --write \
            apps/studio/package.json \
            apps/studio/src/app/api/guilds/[guildId]/access-groups \
            apps/studio/src/app/api/guilds/[guildId]/access-policies \
            apps/studio/src/app/api/guilds/[guildId]/role-policies/route.ts \
            apps/studio/src/app/dashboard/guilds/[guildId]/access/page.tsx \
            apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx \
            apps/studio/src/components/access-group-manager.tsx \
            apps/studio/src/components/managed-policy-manager.tsx \
            apps/studio/src/lib/studio-access-policy.ts \
            apps/studio/src/lib/studio-access.ts \
            apps/studio/src/lib/studio-managed-access.test.ts \
            apps/studio/src/lib/studio-plugin-permissions.ts \
            apps/studio/src/lib/studio-plugin-permissions.test.ts \
            packages/db/src/discord-role-references.ts \
            packages/db/src/index.ts \
            packages/db/src/studio-access-control.ts \
            packages/db/src/studio-access-control.test.ts \
            packages/db/src/studio-access-groups-admin.ts
      - name: Commit schema and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio packages/db
          git commit -m "style: sync schema and format managed access changes"
          git push origin HEAD:feat/studio-managed-access-policies-v1
