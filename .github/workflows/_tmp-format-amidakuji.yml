name: Temporary Amidakuji Formatter

on:
  push:
    branches:
      - feature/amidakuji-mini-game-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/amidakuji-mini-game-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Amidakuji files
        run: >-
          pnpm exec prettier --write
          apps/bot/src/plugins/mini-games-amidakuji-core.test.ts
          apps/bot/src/plugins/mini-games-amidakuji-core.ts
          apps/bot/src/plugins/mini-games-amidakuji.ts
          apps/bot/src/plugins/mini-games-v3.ts
          packages/plugin-catalog/src/manifests/mini-games.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/mini-games-amidakuji-core.test.ts \
            apps/bot/src/plugins/mini-games-amidakuji-core.ts \
            apps/bot/src/plugins/mini-games-amidakuji.ts \
            apps/bot/src/plugins/mini-games-v3.ts \
            packages/plugin-catalog/src/manifests/mini-games.ts
          git commit -m "Format Amidakuji implementation"
          git push origin HEAD:feature/amidakuji-mini-game-v1
