name: Auto Response Finalize

on:
  push:
    branches:
      - feat/auto-response-plugin-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
          persist-credentials: false

      - name: Apply final review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('packages/db/prisma/schema.prisma'): [
                  (
                      '  @@index([guildId, executedAt(sort: Desc)])\n  @@index([ruleId, executedAt(sort: Desc)])',
                      '  @@index([executedAt(sort: Desc)])\n  @@index([guildId, executedAt(sort: Desc)])\n  @@index([ruleId, executedAt(sort: Desc)])',
                  ),
              ],
              Path('plugins/auto-response/src/service.test.ts'): [
                  (
                      ").resolves.toBe(false);\n    expect(tx.autoResponse.update).not.toHaveBeenCalled();\n  });\n\n  it('Guild Cooldown中は別Ruleでも実行権を取得しない'",
                      ").resolves.toBe('rule_cooldown');\n    expect(tx.autoResponse.update).not.toHaveBeenCalled();\n  });\n\n  it('Guild Cooldown中は別Ruleでも実行権を取得しない'",
                  ),
                  (
                      ").resolves.toBe(false);\n    expect(tx.autoResponse.update).not.toHaveBeenCalled();\n    expect(tx.autoResponseExecutionEvent.findFirst).not.toHaveBeenCalled();",
                      ").resolves.toBe('guild_cooldown');\n    expect(tx.autoResponse.update).not.toHaveBeenCalled();\n    expect(tx.autoResponseExecutionEvent.findFirst).not.toHaveBeenCalled();",
                  ),
                  (
                      ").resolves.toBe(true);\n    expect(tx.autoResponse.update).toHaveBeenCalledWith({",
                      ").resolves.toBe('claimed');\n    expect(tx.autoResponse.update).toHaveBeenCalledWith({",
                  ),
              ],
          }

          updated = {}
          for path, operations in replacements.items():
              text = path.read_text()
              for before, after in operations:
                  if after in text:
                      continue
                  if text.count(before) != 1:
                      raise RuntimeError(f'{path}: expected exactly one source block')
                  text = text.replace(before, after, 1)
              updated[path] = text

          for path, text in updated.items():
              path.write_text(text)
          PY

      - name: Commit product changes and remove workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm .github/workflows/auto-response-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/db/prisma/schema.prisma plugins/auto-response/src/service.test.ts .github/workflows/auto-response-finalize.yml
          git commit -m 'fix(auto-response): Cooldown判定と保持期間Indexを整合させる'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/auto-response-plugin-v1
