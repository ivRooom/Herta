name: Apply moderation case advisory lock fix

on:
  push:
    branches:
      - fix/moderation-case-advisory-lock
    paths:
      - .github/workflows/apply-moderation-case-advisory-lock.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/moderation-case-advisory-lock
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Advisory Lock修正を適用
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plugins/moderation/src/service.ts')
          source = path.read_text()
          before = "await tx.$queryRawUnsafe('SELECT pg_advisory_xact_lock(hashtext($1))', input.guildId);"
          after = "await tx.$executeRawUnsafe('SELECT pg_advisory_xact_lock(hashtext($1))', input.guildId);"
          if source.count(before) != 1:
              raise SystemExit(f'置換対象が1件ではありません: {source.count(before)}')
          path.write_text(source.replace(before, after, 1))
          PY

          pnpm exec prettier --write \
            plugins/moderation/src/service.ts \
            plugins/moderation/src/service-advisory-lock.test.ts

          rm .github/workflows/apply-moderation-case-advisory-lock.yml
      - name: 修正結果をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 通常ケースのAdvisory Lock実行を修正"
          git push origin HEAD:fix/moderation-case-advisory-lock
