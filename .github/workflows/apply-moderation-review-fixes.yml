name: Apply moderation review fixes

on:
  push:
    branches:
      - feat/moderation-enforcement
    paths:
      - .github/workflows/apply-moderation-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-enforcement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: レビュー指摘修正を適用
        run: |
          node scripts/apply-moderation-review-fixes.mjs
          pnpm exec prettier --write \
            apps/bot/src/bot.ts \
            plugins/moderation/src/automatic-runtime.ts
      - name: 修正結果をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 自動Moderationのレビュー指摘を修正"
          git push origin HEAD:feat/moderation-enforcement
