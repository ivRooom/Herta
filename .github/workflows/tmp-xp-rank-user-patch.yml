name: Temporary XP Rank User Patch
on:
  push:
    branches:
      - tmp/xp-rank-user-patch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/xp-rank-user-patch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch rank target user
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/bot/src/plugins/xp-level.ts')
          s = p.read_text()
          old = "interface XpCommandInteraction {\n  guildId: string | null;\n  user: { id: string };\n  reply(options: ReplyOptions): Promise<unknown>;\n}"
          new = "interface XpCommandInteraction {\n  guildId: string | null;\n  user: { id: string };\n  options: { getUser(name: string): { id: string } | null };\n  reply(options: ReplyOptions): Promise<unknown>;\n}"
          if old not in s:
            raise SystemExit('interaction pattern not found')
          s = s.replace(old, new, 1)
          old = "  const [profile, rank] = await Promise.all([\n    getXpProfile(context.prisma, interaction.guildId, interaction.user.id),\n    getXpRank(context.prisma, interaction.guildId, interaction.user.id),\n  ]);\n  await interaction.reply({\n    content: formatRankMessage(profile, rank, interaction.user.id),"
          new = "  const targetUserId = interaction.options.getUser('user')?.id ?? interaction.user.id;\n  const [profile, rank] = await Promise.all([\n    getXpProfile(context.prisma, interaction.guildId, targetUserId),\n    getXpRank(context.prisma, interaction.guildId, targetUserId),\n  ]);\n  await interaction.reply({\n    content: formatRankMessage(profile, rank, targetUserId),"
          if old not in s:
            raise SystemExit('rank query pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          pnpm exec prettier --write apps/bot/src/plugins/xp-level.ts packages/plugin-catalog/src/manifests/xp-level.ts
          rm .github/workflows/tmp-xp-rank-user-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/bot/src/plugins/xp-level.ts packages/plugin-catalog/src/manifests/xp-level.ts .github/workflows/tmp-xp-rank-user-patch.yml
          git commit -m 'rankで他メンバーを参照できるようにする'
          git push origin HEAD:tmp/xp-rank-user-patch
