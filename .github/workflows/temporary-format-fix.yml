name: Temporary Prettier Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier差分を生成
        shell: bash
        run: |
          set -euo pipefail
          pnpm format
          git diff --binary > prettier.patch

      - name: Prettier差分をアップロード
        uses: actions/upload-artifact@v4.6.2
        with:
          name: prettier-patch
          path: prettier.patch
          if-no-files-found: error
          retention-days: 1
