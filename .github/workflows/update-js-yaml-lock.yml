name: Update js-yaml lockfile

on:
  push:
    branches:
      - feat/moderation-rule-builder-ui
    paths:
      - .github/workflows/update-js-yaml-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-rule-builder-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: lockfileを更新
        run: |
          pnpm install --lockfile-only
          node -e "const fs=require('fs'); const lock=fs.readFileSync('pnpm-lock.yaml','utf8'); if (!lock.includes('js-yaml: 4.3.1') || !lock.includes('js-yaml@4.3.1')) process.exit(1)"
          rm .github/workflows/update-js-yaml-lock.yml
      - name: lockfileをcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: js-yaml 4.3.1へlockfileを更新"
          git push origin HEAD:feat/moderation-rule-builder-ui
