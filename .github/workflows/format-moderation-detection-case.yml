name: Format moderation detection case

on:
  push:
    branches:
      - feat/moderation-detection-case
    paths:
      - .github/workflows/format-moderation-detection-case.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-detection-case
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettierを適用
        run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/api/guilds/[guildId]/moderation/detections/[detectionId]/case/route.ts' \
            'apps/studio/src/components/moderation-detection-review.tsx' \
            'plugins/moderation/src/detection-case.test.ts' \
            'plugins/moderation/src/detection-case.ts' \
            'plugins/moderation/src/service.ts'
          rm .github/workflows/format-moderation-detection-case.yml
      - name: 整形結果をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: 自動検知ケース機能を整形"
          git push origin HEAD:feat/moderation-detection-case
