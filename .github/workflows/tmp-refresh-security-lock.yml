name: Temporary refresh security lockfile

on:
  push:
    branches: [fix/production-disk-reclamation]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify resolved security override
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'deepmerge-ts: 8.0.0' pnpm-lock.yaml
          grep -q 'deepmerge-ts@8.0.0' pnpm-lock.yaml
          if grep -q 'deepmerge-ts@7.1.5' pnpm-lock.yaml; then
            echo 'ERROR: vulnerable deepmerge-ts 7.1.5 remains in lockfile' >&2
            exit 1
          fi
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: refresh lockfile for deepmerge-ts security fix'
          git push origin HEAD:fix/production-disk-reclamation
