name: Temporary leaderboard navigation patch

on:
  push:
    branches:
      - feature/leaderboard-v2
    paths:
      - .github/workflows/temporary-leaderboard-nav.yml

permissions:
  contents: write

jobs:
  patch-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/leaderboard-v2
          fetch-depth: 0
      - name: Add Leaderboard navigation
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/studio/src/app/dashboard/guilds/[guildId]/page.tsx')
          text = path.read_text()
          needle = '''            <Link
              href={`/dashboard/guilds/${guildId}/audit-logs`}
              className="inline-flex items-center gap-2 rounded-xl border border-border bg-background/70 px-4 py-2.5 text-sm font-semibold"
            >
              <History className="h-4 w-4" /> 監査ログ
            </Link>'''
          replacement = '''            <Link
              href={`/dashboard/guilds/${guildId}/leaderboard`}
              className="inline-flex items-center gap-2 rounded-xl border border-border bg-background/70 px-4 py-2.5 text-sm font-semibold"
            >
              <Trophy className="h-4 w-4" /> Leaderboard
            </Link>
            <Link
              href={`/dashboard/guilds/${guildId}/audit-logs`}
              className="inline-flex items-center gap-2 rounded-xl border border-border bg-background/70 px-4 py-2.5 text-sm font-semibold"
            >
              <History className="h-4 w-4" /> 監査ログ
            </Link>'''
          if needle not in text:
              raise SystemExit('navigation insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit navigation and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-leaderboard-nav.yml
          git add 'apps/studio/src/app/dashboard/guilds/[guildId]/page.tsx'
          git diff --cached --check
          git commit -m 'Guild DashboardからLeaderboardへ遷移できるようにする'
          git push origin HEAD:feature/leaderboard-v2
