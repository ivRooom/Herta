name: PR232 Format Fix

on:
  push:
    branches:
      - feature/message-studio-drafts-voice-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/message-studio-drafts-voice-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PR232 files
        run: |
          pnpm exec prettier --write \
            apps/bot/src/health/message-studio-send.test.ts \
            apps/bot/src/health/message-studio-send.ts \
            'apps/studio/src/app/api/guilds/[guildId]/message-studio/drafts/route.ts' \
            apps/studio/src/components/message-studio-quick-send.tsx \
            apps/studio/src/lib/message-studio-discord.ts \
            apps/studio/src/lib/message-studio-drafts.test.ts \
            apps/studio/src/lib/message-studio-drafts.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/bot/src/health/message-studio-send.test.ts \
            apps/bot/src/health/message-studio-send.ts \
            'apps/studio/src/app/api/guilds/[guildId]/message-studio/drafts/route.ts' \
            apps/studio/src/components/message-studio-quick-send.tsx \
            apps/studio/src/lib/message-studio-discord.ts \
            apps/studio/src/lib/message-studio-drafts.test.ts \
            apps/studio/src/lib/message-studio-drafts.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Message Studio drafts and voice files'
            git push origin HEAD:feature/message-studio-drafts-voice-v1
          fi
