name: Temporary Mini Games v2 autosync run

on:
  push:
    branches:
      - feature/mini-games-v2-stats-challenges

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v2-stats-challenges
      - run: python3 scripts/temporary-mini-games-v2-autosync-patch.py
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/achievements.ts apps/bot/src/plugins/community-challenge.ts packages/plugin-catalog/src/manifests/achievements.ts packages/plugin-catalog/src/manifests/community-challenge.ts
      - name: Commit changes
        run: |
          rm scripts/temporary-mini-games-v2-autosync-patch.py
          rm .github/workflows/temporary-mini-games-v2-autosync-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mini Games後にAchievementとChallengeを自動同期する'
          git push origin HEAD:feature/mini-games-v2-stats-challenges
