name: Apply Discord Visual UI

on:
  push:
    branches:
      - feat/discord-embed-ui
    paths:
      - .github/scripts/apply-discord-visual-ui.py
      - .github/workflows/apply-discord-visual-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/discord-embed-ui
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply visual UI patch
        run: python3 .github/scripts/apply-discord-visual-ui.py

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            plugins/moderation/src/discord-ui.ts \
            plugins/moderation/src/discord-ui.test.ts \
            plugins/moderation/src/automatic-runtime.ts \
            plugins/moderation/src/plugin.ts \
            'apps/studio/src/app/api/discord-assets/moderation/[variant]/route.tsx'

      - name: Remove temporary apply files
        run: |
          rm -f .github/scripts/apply-discord-visual-ui.py
          rm -f .github/workflows/apply-discord-visual-ui.yml

      - name: Commit applied changes
        run: |
          git config user.name 'mizzz-ivr'
          git config user.email '86910433+mizzz-ivr@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: Discord通知を画像付きビジュアルUIへ刷新'
          git push origin HEAD:feat/discord-embed-ui
