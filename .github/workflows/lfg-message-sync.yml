name: LFG Message Sync

on:
  push:
    branches: [feat/lfg-plugin-v1]
  pull_request:
    branches: [feat/daily-content-plugin-v1]

permissions:
  contents: write

concurrency:
  group: lfg-message-sync
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/lfg-plugin-v1
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Discord表示同期hardeningを適用
        run: node .github/scripts/apply-lfg-message-sync.mjs
      - name: Prisma Generate
        run: pnpm --filter @herta/db generate
      - name: Format
        run: pnpm format
      - name: LFG test
        run: pnpm --filter @herta/plugin-lfg test
      - name: Typecheck
        run: pnpm typecheck
      - name: 全体Test
        run: pnpm test
      - name: Production Compose Validation
        run: |
          POSTGRES_DB=herta \
          POSTGRES_USER=herta \
          POSTGRES_PASSWORD=dummy \
          DATABASE_URL=postgresql://herta:dummy@postgres:5432/herta \
          REDIS_URL=redis://redis:6379 \
          CORS_ORIGINS=https://studio.example.com \
          JWT_SECRET=dummy-jwt \
          JWT_REFRESH_SECRET=dummy-refresh \
          INTERNAL_JWT_SECRET=dummy-internal \
          API_URL=http://api:3001 \
          DISCORD_CLIENT_ID=dummy-client \
          DISCORD_CLIENT_SECRET=dummy-secret \
          DISCORD_BOT_TOKEN=dummy-bot-token \
          LFG_COMPONENT_SECRET=12345678901234567890123456789012 \
          NEXTAUTH_URL=https://studio.example.com \
          NEXTAUTH_SECRET=dummy-nextauth \
          docker compose --env-file /dev/null -f docker-compose.prod.yml config >/dev/null
      - name: 一時Workflowを削除して反映
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-lfg-message-sync.mjs
          git rm .github/workflows/lfg-message-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(lfg): Discord表示をWorkerで確実に再同期'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/lfg-plugin-v1
