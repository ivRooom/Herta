name: Config Studio Emoji Picker

on:
  push:
    branches: [feat/config-studio-emoji-picker]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-emoji-picker
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Emoji options / Picker / Config Studioを実装
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/bot/src/health/guild-options.ts')
          text = path.read_text()
          role_interface = '''export interface GuildRoleOption {
            id: string;
            name: string;
            color: string;
            position: number;
            managed: boolean;
            mentionable: boolean;
            editable: boolean;
          }
          '''
          emoji_interface = role_interface + '''
          export interface GuildEmojiOption {
            id: string;
            name: string;
            animated: boolean;
            available: boolean;
            managed: boolean;
          }
          '''
          if 'export interface GuildEmojiOption' not in text:
              if role_interface not in text:
                  raise SystemExit('GuildRoleOption interface target not found')
              text = text.replace(role_interface, emoji_interface, 1)

          text = text.replace(
              '  roles: GuildRoleOption[];\n  bot: GuildBotPermissionSnapshot;',
              '  roles: GuildRoleOption[];\n  emojis: GuildEmojiOption[];\n  bot: GuildBotPermissionSnapshot;',
              1,
          )
          text = text.replace(
              '''  const [channels, roles, me] = await Promise.all([
              guild.channels.fetch(),
              guild.roles.fetch(),
              guild.members.me ? Promise.resolve(guild.members.me) : guild.members.fetchMe(),
            ]);''',
              '''  const [channels, roles, emojis, me] = await Promise.all([
              guild.channels.fetch(),
              guild.roles.fetch(),
              guild.emojis.fetch(),
              guild.members.me ? Promise.resolve(guild.members.me) : guild.members.fetchMe(),
            ]);''',
              1,
          )
          return_marker = '''  return {
              guildId: guild.id,
              guildName: guild.name,
              channels: channelOptions,
              roles: roleOptions,
              bot: {'''
          if return_marker not in text:
              raise SystemExit('guild options return marker not found')
          emoji_options = '''  const emojiOptions = [...emojis.values()]
              .map((emoji) => ({
                id: emoji.id,
                name: emoji.name ?? emoji.id,
                animated: Boolean(emoji.animated),
                available: emoji.available !== false,
                managed: emoji.managed,
              }))
              .sort((a, b) => a.name.localeCompare(b.name, 'ja'));

          '''
          text = text.replace('  return {\n    guildId: guild.id,', emoji_options + '  return {\n    guildId: guild.id,', 1)
          text = text.replace('    roles: roleOptions,\n    bot: {', '    roles: roleOptions,\n    emojis: emojiOptions,\n    bot: {', 1)
          path.write_text(text)

          path = Path('apps/studio/src/lib/bot-guild-options.ts')
          text = path.read_text()
          role_schema_end = '''const guildRoleOptionSchema = z.object({
            id: z.string().regex(/^\\d+$/u),
            name: z.string().min(1),
            color: z.string(),
            position: z.number().int(),
            managed: z.boolean(),
            mentionable: z.boolean(),
            editable: z.boolean(),
          });
          '''
          emoji_schema = role_schema_end + '''
          const guildEmojiOptionSchema = z.object({
            id: z.string().regex(/^\\d+$/u),
            name: z.string().min(1),
            animated: z.boolean(),
            available: z.boolean(),
            managed: z.boolean(),
          });
          '''
          if 'const guildEmojiOptionSchema' not in text:
              if role_schema_end not in text:
                  raise SystemExit('guildRoleOptionSchema target not found')
              text = text.replace(role_schema_end, emoji_schema, 1)
          text = text.replace(
              '  roles: z.array(guildRoleOptionSchema),\n  bot: z.object({',
              '  roles: z.array(guildRoleOptionSchema),\n  emojis: z.array(guildEmojiOptionSchema),\n  bot: z.object({',
              1,
          )
          text = text.replace(
              "export type GuildRoleOption = GuildConfigurationOptions['roles'][number];",
              "export type GuildRoleOption = GuildConfigurationOptions['roles'][number];\nexport type GuildEmojiOption = GuildConfigurationOptions['emojis'][number];",
              1,
          )
          path.write_text(text)

          path = Path('apps/studio/src/components/discord-entity-picker.tsx')
          text = path.read_text()
          text = text.replace(
              "import { Check, ChevronDown, Hash, Search, Shield, X } from 'lucide-react';",
              "import { Check, ChevronDown, Hash, Search, Shield, Smile, X } from 'lucide-react';",
              1,
          )
          text = text.replace(
              "import type { GuildChannelOption, GuildRoleOption } from '@/lib/bot-guild-options';",
              "import type { GuildChannelOption, GuildEmojiOption, GuildRoleOption } from '@/lib/bot-guild-options';",
              1,
          )
          text = text.replace("  icon: 'channel' | 'role';", "  icon: 'channel' | 'role' | 'emoji';", 1)
          role_index = text.find('export function DiscordRolePicker({')
          if role_index < 0:
              raise SystemExit('DiscordRolePicker not found')
          entity_index = text.find('\nfunction DiscordEntityPicker(', role_index)
          if entity_index < 0:
              raise SystemExit('DiscordEntityPicker boundary not found')
          if 'export function DiscordEmojiPicker' not in text:
              emoji_picker = '''

          export function DiscordEmojiPicker({
            options,
            value,
            onChange,
            multiple = false,
            placeholder = 'Emoji名またはIDを検索',
          }: {
            options: GuildEmojiOption[];
            value: string | string[] | null;
            onChange: (value: string | string[] | null) => void;
            multiple?: boolean;
            placeholder?: string;
          }) {
            const selected = Array.isArray(value) ? value : value ? [value] : [];
            const normalized = options.map((option) => ({
              id: option.id,
              name: option.name,
              disabled: !option.available,
              meta: !option.available
                ? '現在利用不可'
                : option.managed
                  ? option.animated
                    ? '管理Emoji・アニメーション'
                    : '管理Emoji'
                  : option.animated
                    ? 'アニメーション'
                    : undefined,
            }));
            return (
              <DiscordEntityPicker
                options={normalized}
                value={selected}
                onChange={(values) => onChange(multiple ? values : (values[0] ?? null))}
                multiple={multiple}
                placeholder={placeholder}
                emptyMessage="利用できるGuild Emojiが見つかりません"
                icon="emoji"
              />
            );
          }
          '''
              text = text[:entity_index] + emoji_picker + text[entity_index:]
          text = text.replace(
              "  const Icon = icon === 'channel' ? Hash : Shield;",
              "  const Icon = icon === 'channel' ? Hash : icon === 'role' ? Shield : Smile;",
              1,
          )
          path.write_text(text)

          path = Path('apps/studio/src/components/plugin-config-studio-form.tsx')
          text = path.read_text()
          text = text.replace(
              "import { DiscordChannelPicker, DiscordRolePicker } from './discord-entity-picker';",
              "import { DiscordChannelPicker, DiscordEmojiPicker, DiscordRolePicker } from './discord-entity-picker';",
              1,
          )
          user_branch = '''  if (ui?.widget === 'discord-user' && supportsDiscordPicker) {
              return (
                <FieldShell title={title} schema={schema} required={required}>
                  <DiscordUserPicker
                    guildId={guildId}
                    value={normalizeDiscordEntityValue(value, discordMultiple)}
                    multiple={discordMultiple}
                    placeholder={ui.placeholder}
                    onChange={(next) => onChange(path, next)}
                  />
                </FieldShell>
              );
            }
          '''
          emoji_branch = user_branch + '''
            if (ui?.widget === 'discord-emoji' && supportsDiscordPicker) {
              return (
                <FieldShell title={title} schema={schema} required={required}>
                  <DiscordEmojiPicker
                    options={discordOptions?.emojis ?? []}
                    value={normalizeDiscordEntityValue(value, discordMultiple)}
                    multiple={discordMultiple}
                    placeholder={ui.placeholder}
                    onChange={(next) => onChange(path, next)}
                  />
                </FieldShell>
              );
            }
          '''
          if "ui?.widget === 'discord-emoji'" not in text:
              if user_branch not in text:
                  raise SystemExit('discord-user renderer target not found')
              text = text.replace(user_branch, emoji_branch, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/bot/src/health/guild-options.ts apps/studio/src/lib/bot-guild-options.ts apps/studio/src/components/discord-entity-picker.tsx apps/studio/src/components/plugin-config-studio-form.tsx
      - run: pnpm --filter @herta/bot typecheck
      - run: pnpm --dir apps/studio typecheck
      - name: commitして一時Workflowを削除
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/config-studio-emoji-picker.yml
          git add apps/bot/src/health/guild-options.ts apps/studio/src/lib/bot-guild-options.ts apps/studio/src/components/discord-entity-picker.tsx apps/studio/src/components/plugin-config-studio-form.tsx
          git commit -m "feat: Config StudioにDiscord Emoji Pickerを追加"
          git push origin HEAD:feat/config-studio-emoji-picker
