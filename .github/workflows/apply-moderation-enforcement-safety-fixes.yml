name: Apply moderation enforcement safety fixes

on:
  push:
    branches:
      - feat/moderation-enforcement
    paths:
      - .github/workflows/apply-moderation-enforcement-safety-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-enforcement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安全修正を適用
        run: |
          node scripts/apply-moderation-enforcement-safety-fixes.mjs
          pnpm exec prettier --write \
            plugins/moderation/src/automatic-runtime.ts \
            apps/studio/src/components/moderation-enforcement-form.tsx
      - name: 修正結果をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 自動対応の型境界とブラックリスト永続化を改善"
          git push origin HEAD:feat/moderation-enforcement
