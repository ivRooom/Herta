name: VALORANT one-time formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feat/valorant-vc-random-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/valorant-vc-random-20261029
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed code
        run: |
          pnpm exec prettier --write             apps/bot/src/plugins/valorant-random.test.ts             apps/bot/src/plugins/valorant.test.ts             apps/bot/src/plugins/valorant.ts             apps/studio/src/components/valorant-config-form.tsx             packages/plugin-catalog/src/index.ts
      - name: Commit formatting and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/valorant-format-once.yml
          git add apps/bot/src/plugins/valorant-random.test.ts             apps/bot/src/plugins/valorant.test.ts             apps/bot/src/plugins/valorant.ts             apps/studio/src/components/valorant-config-form.tsx             packages/plugin-catalog/src/index.ts
          git commit -m "style(valorant): apply Prettier and remove temporary formatter"
          git push origin HEAD:feat/valorant-vc-random-20261029
