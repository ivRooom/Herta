name: Temporary Build Reminder v1

on:
  push:
    branches: [tmp/reminder-v1-builder]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Reminder一覧を安全にページ分割する
        shell: bash
        run: |
          git fetch origin feat/reminder-v1
          git checkout -B feat/reminder-v1 origin/feat/reminder-v1
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/bot/src/plugins/reminder.ts')
          text = path.read_text()
          text = text.replace(
              "  reply(options: {\n    content: string;\n    flags?: number;\n    allowedMentions: { parse: [] };\n  }): Promise<unknown>;\n",
              "  reply(options: {\n    content: string;\n    flags?: number;\n    allowedMentions: { parse: [] };\n  }): Promise<unknown>;\n  followUp(options: {\n    content: string;\n    flags?: number;\n    allowedMentions: { parse: [] };\n  }): Promise<unknown>;\n",
          )
          old = '''export function formatReminderList(reminders: readonly ReminderRecord[]): string {
            if (reminders.length === 0) return '未配信のリマインダーはありません。';

            const lines = reminders.map((reminder) => {
              const unix = Math.floor(reminder.remindAt.getTime() / 1000);
              const preview = reminder.message.replace(/\\s+/g, ' ').slice(0, 80);
              const target = reminder.delivery === 'dm' ? 'DM' : 'チャンネル';
              return `\\`${reminder.id}\\`\\n<t:${unix}:F> (${target}) — ${preview}`;
            });

            const pages: string[] = [];
            let current = '**未配信Reminder一覧**';
            for (const line of lines) {
              const next = `${current}\\n\\n${line}`;
              if (next.length > MAX_LIST_LENGTH) {
                pages.push(current);
                current = `**未配信Reminder一覧（続き）**\\n\\n${line}`;
              } else {
                current = next;
              }
            }
            pages.push(current);
            return pages.join('\\n\\n---\\n\\n');
          }
          '''
          new = '''export function formatReminderListPages(reminders: readonly ReminderRecord[]): string[] {
            if (reminders.length === 0) return ['未配信のリマインダーはありません。'];

            const lines = reminders.map((reminder) => {
              const unix = Math.floor(reminder.remindAt.getTime() / 1000);
              const preview = reminder.message.replace(/\\s+/g, ' ').slice(0, 80);
              const target = reminder.delivery === 'dm' ? 'DM' : 'チャンネル';
              return `\\`${reminder.id}\\`\\n<t:${unix}:F> (${target}) — ${preview}`;
            });

            const pages: string[] = [];
            let current = '**未配信Reminder一覧**';
            for (const line of lines) {
              const next = `${current}\\n\\n${line}`;
              if (next.length > MAX_LIST_LENGTH) {
                pages.push(current);
                current = `**未配信Reminder一覧（続き）**\\n\\n${line}`;
              } else {
                current = next;
              }
            }
            pages.push(current);
            return pages;
          }
          '''
          if old not in text:
              raise SystemExit('formatReminderList block not found')
          text = text.replace(old, new)
          text = text.replace(
              "    await reply(context, interaction, formatReminderList(reminders));\n",
              "    await replyPages(context, interaction, formatReminderListPages(reminders));\n",
          )
          marker = '''async function reply(
            context: ReminderRuntimeContext,
            interaction: ReminderCommandInteraction,
            content: string,
          ): Promise<void> {
          '''
          helper = '''async function replyPages(
            context: ReminderRuntimeContext,
            interaction: ReminderCommandInteraction,
            pages: readonly string[],
          ): Promise<void> {
            const [first, ...rest] = pages;
            await reply(context, interaction, first ?? '未配信のリマインダーはありません。');
            const config = normalizeReminderConfig(context.config);
            for (const content of rest) {
              await interaction.followUp({
                content,
                ...(config.ephemeralResponses ? { flags: EPHEMERAL_FLAG } : {}),
                allowedMentions: { parse: [] },
              });
            }
          }

          '''
          if marker not in text:
              raise SystemExit('reply marker not found')
          text = text.replace(marker, helper + marker)
          path.write_text(text)

          test = Path('apps/bot/src/plugins/reminder.test.ts')
          t = test.read_text().replace('formatReminderList, normalizeReminderConfig', 'formatReminderListPages, normalizeReminderConfig')
          t = t.replace('const result = formatReminderList([reminder]);', 'const [result] = formatReminderListPages([reminder]);')
          t = t.replace("expect(formatReminderList([])).toBe('未配信のリマインダーはありません。');", "expect(formatReminderListPages([])).toEqual(['未配信のリマインダーはありません。']);")
          test.write_text(t)
          PY
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/bot/src/plugins/reminder.ts apps/bot/src/plugins/reminder.test.ts
          git config user.name 'mizzz（ずーみー）/いゔる。'
          git config user.email 'mizzz._.dev@outlook.jp'
          git add apps/bot/src/plugins/reminder.ts apps/bot/src/plugins/reminder.test.ts
          git commit -m 'Reminder一覧を複数メッセージへ分割する'
          git push origin HEAD:feat/reminder-v1
