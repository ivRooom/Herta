name: Temporary Build Event RSVP v1 v2

on:
  push:
    branches:
      - tmp/event-rsvp-builder-v2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/event-rsvp-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reuse and fix Event RSVP builder
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin tmp/event-rsvp-builder
          git show origin/tmp/event-rsvp-builder:.github/workflows/tmp-build-event-rsvp.yml > /tmp/original.yml
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/original.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          body = []
          for line in lines[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break

          fixed = []
          for line in body:
              stripped = line.strip()
              if stripped == 'packages/db/prisma/schema.prisma \\':
                  continue
              if stripped == 'packages/db/prisma/migrations/20260811230000_event_rsvp_v1/migration.sql':
                  if fixed and fixed[-1].rstrip().endswith('\\'):
                      fixed[-1] = fixed[-1].rstrip()[:-1].rstrip()
                  continue
              fixed.append(line)

          script = '\n'.join(fixed) + '\n'
          script = script.replace("category: 'community',", "category: 'utility',")

          marker = 'pnpm prettier --write \\\n'
          patch = r'''python - <<'PYFIX'
          from pathlib import Path

          runtime = Path('apps/bot/src/plugins/event-rsvp.ts')
          text = runtime.read_text()
          text = text.replace(
              "  reply(options: ReplyOptions): Promise<unknown>;\n  update(options: EventMessage): Promise<unknown>;",
              "  reply(options: ReplyOptions): Promise<unknown>;\n  followUp?(options: ReplyOptions): Promise<unknown>;\n  update(options: EventMessage): Promise<unknown>;",
          )
          text = text.replace(
              "    await interaction.reply?.({ content: '定員に達しているためWaiting Listへ登録しました。', flags: EPHEMERAL_FLAG, allowedMentions: { parse: [] } }).catch(() => undefined);",
              "    await interaction.followUp?.({ content: '定員に達しているためWaiting Listへ登録しました。', flags: EPHEMERAL_FLAG, allowedMentions: { parse: [] } }).catch(() => undefined);",
          )
          runtime.write_text(text)

          repository = Path('apps/bot/src/plugins/event-rsvp-repository.ts')
          text = repository.read_text()
          text = text.replace(
              "async function promoteWaitlist(prisma: PrismaClient, eventId: string): Promise<string | undefined> {",
              "async function promoteWaitlist(prisma: Pick<PrismaClient, '$queryRaw'>, eventId: string): Promise<string | undefined> {",
          )
          text = text.replace("await promoteWaitlist(tx as PrismaClient, input.eventId)", "await promoteWaitlist(tx, input.eventId)")
          repository.write_text(text)
          PYFIX

          '''
          if marker not in script:
              raise SystemExit('prettier marker missing')
          script = script.replace(marker, patch + marker, 1)
          Path('/tmp/build.sh').write_text(script)
          PY
          bash -n /tmp/build.sh
          bash /tmp/build.sh
