name: AI Foundation Finalize Source

on:
  push:
    branches:
      - feat/ai-foundation-console-credentials

permissions:
  contents: write

jobs:
  finalize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Normalize reviewed integration generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/ai-foundation-generator.yml')
          text = path.read_text()

          model_compose = '                HERTA_AI_MODEL: ${HERTA_AI_MODEL:-}\n'
          if model_compose not in text:
              raise SystemExit('generated HERTA_AI_MODEL compose line not found')
          text = text.replace(model_compose, '', 1)

          model_env = '          # 通常は空欄。server-side allowlist内で明示overrideする場合のみ指定する。\n          HERTA_AI_MODEL=\n'
          if model_env not in text:
              raise SystemExit('generated HERTA_AI_MODEL env block not found')
          text = text.replace(model_env, '', 1)

          text = text.replace('\n                HERTA_', '\n      HERTA_')
          text = text.replace('\n                OPENAI_API_KEY:', '\n      OPENAI_API_KEY:')
          text = text.replace('\n                DISCORD_CLIENT_ID:', '\n      DISCORD_CLIENT_ID:')

          old_failure = "            } catch (error) {\n              if (error instanceof RuntimeSecretError) {\n                return { apiKey: null, source: null, failure: error.code };\n              }\n              // DB障害時だけmigration/emergency fallbackを許可する。\n              // raw provider errorやcredential値はここではlogしない。\n            }\n"
          new_failure = "            } catch (error) {\n              const failure =\n                error instanceof RuntimeSecretError ? error.code : 'runtime_secret_unavailable';\n              return { apiKey: null, source: null, failure };\n            }\n"
          if old_failure not in text:
              raise SystemExit('credential failure block not found')
          text = text.replace(old_failure, new_failure, 1)

          text = text.replace("            it('DB unavailable時はemergency env fallbackを許可する', async () => {", "            it('DB unavailable時もenv fallbackへ逃がさずfail closedする', async () => {", 1)
          old_db_expect = "                  throw new Error('database unavailable');\n                },\n              });\n              expect(result).toEqual({ apiKey: 'env-key', source: 'environment', failure: null });"
          new_db_expect = "                  throw new Error('database unavailable');\n                },\n              });\n              expect(result).toEqual({\n                apiKey: null,\n                source: null,\n                failure: 'runtime_secret_unavailable',\n              });"
          if old_db_expect not in text:
              raise SystemExit('DB fallback regression expectation not found')
          text = text.replace(old_db_expect, new_db_expect, 1)

          text = text.replace('           * encrypted secretが存在するのにmaster key不正/復号失敗ならfail closedし、envへ逃がさない。', '           * Runtime Secret Storeのread/decrypt障害はfail closedし、envへ逃がさない。', 1)
          text = text.replace('- `OPENAI_API_KEY`: migration / emergency fallback only', '- `OPENAI_API_KEY`: migration fallback only (secret未登録時のみ)', 1)
          old_docs = "          1. encrypted Runtime Secret Store `openai.api_key`\n          2. secret未登録時のみ `OPENAI_API_KEY`\n          3. DB自体がunavailableの場合はemergency fallbackとして `OPENAI_API_KEY`\n\n          Runtime Secretが存在するのにmaster key不正/復号失敗の場合はfail closedし、env fallbackへ逃がしません。credential値はstructured log、telemetry、Plugin configへ出しません。\n"
          new_docs = "          1. encrypted Runtime Secret Store `openai.api_key`\n          2. secret-store readが成功しsecret未登録の場合のみ `OPENAI_API_KEY`\n          3. DB/master key/decrypt等のsecret-store read障害はfail closed\n\n          Runtime Secret Storeのreadに失敗した場合はcredentialの有無を安全に判定できないため、legacy env fallbackへ逃がしません。credential値はstructured log、telemetry、Plugin configへ出しません。\n"
          if old_docs not in text:
              raise SystemExit('credential resolution docs block not found')
          text = text.replace(old_docs, new_docs, 1)

          path.write_text(text)
          PY

      - name: Apply AI Foundation integration as source files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/ai-foundation-generator.yml').read_text().splitlines()
          start_marker = '      - name: Apply AI Foundation integration'
          end_marker = '      - name: Prisma Generate'
          start = source.index(start_marker)
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          end = source.index(end_marker, run_line + 1)
          raw = source[run_line + 1:end]
          prefix = '          '
          script = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in raw) + '\n'
          Path('/tmp/apply-ai-foundation.sh').write_text(script)
          PY
          bash /tmp/apply-ai-foundation.sh

      - name: Enforce profile-only production model selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          compose = Path('docker-compose.prod.yml')
          text = compose.read_text()
          text = text.replace('      HERTA_AI_MODEL: ${HERTA_AI_MODEL:-}\n', '', 1)
          compose.write_text(text)

          for env_name in ['.env.example', '.env.production.example']:
              path = Path(env_name)
              text = path.read_text()
              text = text.replace('# 通常は空欄。server-side allowlist内で明示overrideする場合のみ指定する。\nHERTA_AI_MODEL=\n', '', 1)
              path.write_text(text)
          PY
          git diff --check

      - name: Prepare final source tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ignore = Path('.prettierignore')
          text = ignore.read_text()
          text = text.replace('\n.env.example\n.env.production.example', '')
          ignore.write_text(text)
          PY
          rm -f \
            .github/ai-foundation-generator.yml \
            .github/workflows/ai-foundation-compose-fix.yml
          git diff --check

      - name: Prisma Generate
        run: pnpm db:generate
      - name: Format Check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Production Compose Validation
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null

      - name: Final source verification
        shell: bash
        run: |
          test ! -e .github/ai-foundation-generator.yml
          test ! -e .github/workflows/ai-foundation-compose-fix.yml
          test ! -e .github/workflows/ai-foundation-draft-validate.yml
          test ! -e .github/workflows/ai-foundation-finalize-validation.yml
          ! grep -q '^\.env\.example$' .prettierignore
          ! grep -q '^\.env\.production\.example$' .prettierignore
          ! grep -q 'HERTA_AI_MODEL:' docker-compose.prod.yml
          ! grep -q '^HERTA_AI_MODEL=' .env.example
          ! grep -q '^HERTA_AI_MODEL=' .env.production.example
          grep -q "failure: 'runtime_secret_unavailable'" apps/bot/src/ai/factory.ts
          grep -q "DB unavailable時もenv fallbackへ逃がさずfail closedする" apps/bot/src/ai/factory.test.ts
          ! grep -q 'DB自体がunavailableの場合はemergency fallback' docs/AI_FOUNDATION.md
          git diff --check
          pnpm format:check
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null

      - name: Commit validated source integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ai): finalize runtime credential foundation'
          git push origin HEAD:feat/ai-foundation-console-credentials
