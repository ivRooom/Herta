name: AI Foundation Finalize Validation

on:
  push:
    branches:
      - feat/ai-foundation-console-credentials

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Reuse reviewed integration generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/ai-foundation-draft-validate.yml').read_text().splitlines()
          start_marker = '      - name: Apply AI Foundation integration'
          end_marker = '      - name: Prisma Generate'
          start = source.index(start_marker)
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          end = source.index(end_marker, run_line + 1)
          script = textwrap.dedent('\n'.join(source[run_line + 1:end])) + '\n'
          Path('/tmp/apply-ai-foundation.sh').write_text(script)
          PY
          bash /tmp/apply-ai-foundation.sh

      - name: Keep production model selection profile-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          compose = Path('docker-compose.prod.yml')
          text = compose.read_text()
          line = '      HERTA_AI_MODEL: ${HERTA_AI_MODEL:-}\n'
          if line not in text:
              raise SystemExit('generated HERTA_AI_MODEL compose line not found')
          compose.write_text(text.replace(line, '', 1))

          for env_name in ['.env.example', '.env.production.example']:
              path = Path(env_name)
              text = path.read_text()
              text = text.replace(
                  '# 通常は空欄。server-side allowlist内で明示overrideする場合のみ指定する。\nHERTA_AI_MODEL=\n',
                  '',
                  1,
              )
              path.write_text(text)
          PY
          git diff --check

      - name: Prisma Generate
        run: pnpm db:generate
      - name: Format Check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Production Compose Validation
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null

      - name: Commit validated implementation only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/plugin-catalog/src/ai-service.ts \
            packages/plugin-catalog/src/ai-service.test.ts \
            apps/bot/src/plugins/registry.ts \
            apps/bot/src/ai/factory.ts \
            apps/bot/src/ai/factory.test.ts \
            docker-compose.prod.yml \
            .env.example \
            .env.production.example \
            docs/AI_FOUNDATION.md
          git commit -m 'feat(ai): integrate runtime credential foundation'
          git push origin HEAD:feat/ai-foundation-console-credentials
