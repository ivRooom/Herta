name: Temporary clean Mini Games v3 wiring

on:
  push:
    branches:
      - feature/mini-games-v3-arcade-games-clean

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v3-arcade-games-clean
      - run: python3 .github/scripts/temp-mini-games-v3-clean-wire.py
      - name: Remove temporary files and commit
        run: |
          rm .github/scripts/temp-mini-games-v3-clean-wire.py
          rm .github/workflows/temporary-mini-games-v3-clean-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins .github
          git commit -m "Mini Games v3を最新v2へ接続する"
          git push origin HEAD:feature/mini-games-v3-arcade-games-clean
