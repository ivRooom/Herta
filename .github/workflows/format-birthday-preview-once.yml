name: Format birthday preview once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-birthday-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format birthday preview and push
        shell: bash
        run: |
          set -euo pipefail
          target='apps/studio/src/components/birthday-card-live-preview.tsx'
          pnpm exec prettier --write "$target"
          if git diff --quiet -- "$target"; then
            echo 'Birthday preview is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'style(birthday): format member preview'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
