name: Temporary PR214 Formatter

on:
  push:
    branches:
      - feature/amidakuji-mini-game-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/amidakuji-mini-game-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PR214 test files
        run: pnpm exec prettier --write apps/bot/src/plugins/mini-games.test.ts apps/bot/src/plugins/mini-games-v3.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/mini-games.test.ts apps/bot/src/plugins/mini-games-v3.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Format Mini Games tests"
          git push origin HEAD:feature/amidakuji-mini-game-v1
