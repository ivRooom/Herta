name: Config Studio Array Constraints Apply

on:
  push:
    branches: [feat/config-studio-array-constraints]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-array-constraints
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/apply-config-studio-array-constraints.py
      - run: >-
          pnpm exec prettier --write
          apps/studio/src/lib/plugin-config-studio.ts
          apps/studio/src/lib/plugin-config-studio.test.ts
          apps/studio/src/components/plugin-config-studio-form.tsx
      - run: pnpm --dir apps/studio typecheck
      - run: pnpm --dir apps/studio test
      - name: 変更をコミットして一時ファイルを削除
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mizzz（ずーみー）/いゔる。'
          git config user.email 'mizzz._.dev@outlook.jp'
          git rm .github/workflows/config-studio-array-constraints-apply.yml scripts/apply-config-studio-array-constraints.py
          git add \
            apps/studio/src/lib/plugin-config-studio.ts \
            apps/studio/src/lib/plugin-config-studio.test.ts \
            apps/studio/src/components/plugin-config-studio-form.tsx
          git commit -m 'feat: Config Studioで配列件数制約を適用'
          git push origin HEAD:feat/config-studio-array-constraints
