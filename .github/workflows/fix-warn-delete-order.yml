name: Fix warn delete order

on:
  push:
    branches:
      - feat/moderation-enforcement
    paths:
      - .github/workflows/fix-warn-delete-order.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-enforcement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node scripts/fix-warn-delete-order.mjs
          pnpm exec prettier --write plugins/moderation/src/automatic-runtime.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 警告削除はメッセージ削除を優先する"
          git push origin HEAD:feat/moderation-enforcement
