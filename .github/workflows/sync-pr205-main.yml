name: Sync PR205 with main

on:
  push:
    branches:
      - feature/studio-account-menu
    paths:
      - .github/workflows/sync-pr205-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-account-menu
          fetch-depth: 0

      - name: Merge latest main and resolve Command Palette
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="apps/studio/src/components/console-command-palette.tsx"
            if [ "$conflicts" != "$expected" ]; then
              echo "::error::Unexpected merge conflicts: $conflicts"
              exit 1
            fi
            git checkout --theirs "$expected"
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/studio/src/components/console-command-palette.tsx')
          text = path.read_text()

          if '  UserRound,\n' not in text:
              marker = '  UsersRound,\n  X,\n'
              if marker not in text:
                  raise SystemExit('UserRound import insertion point not found')
              text = text.replace(marker, '  UsersRound,\n  UserRound,\n  X,\n', 1)

          if '  account: UserRound,\n' not in text:
              marker = '  xp: Trophy,\n};'
              if marker not in text:
                  raise SystemExit('Account icon insertion point not found')
              text = text.replace(marker, '  xp: Trophy,\n  account: UserRound,\n};', 1)

          path.write_text(text)
          PY

          git add apps/studio/src/components/console-command-palette.tsx

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error::Unresolved merge conflicts: $unresolved"
            exit 1
          fi

          if git diff --cached --quiet && git diff --quiet; then
            echo "Already up to date"
            exit 0
          fi

          git add -A
          git commit -m "PR #204マージ後のmainへ追従する"
          git push origin HEAD:feature/studio-account-menu
