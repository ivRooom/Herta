name: PR220 Format Fix

on:
  push:
    branches:
      - 'feature/mini-games-visual-console-v4'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-visual-console-v4
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Presenceフォームを更新
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/studio/src/components/bot-profile-settings.tsx')
          text = path.read_text()

          replacements = [
              (
                  """              onChange={(value) =>\n                setConfig((current) => ({ ...current, activityType: value as BotActivityType }))\n              }\n""",
                  """              onChange={(value) =>\n                setConfig((current) => ({\n                  ...current,\n                  activityType: value as BotActivityType,\n                  media: value === 'listening' ? current.media : null,\n                }))\n              }\n""",
              ),
              (
                  """              onChange={(event) =>\n                setConfig((current) => ({\n                  ...current,\n                  activityText: event.target.value.slice(0, 128),\n                }))\n              }\n""",
                  """              onChange={(event) =>\n                setConfig((current) => ({\n                  ...current,\n                  activityText: event.target.value.slice(0, 128),\n                  media: null,\n                }))\n              }\n""",
              ),
              (
                  """            <SpotifyPresencePicker\n              onSelect={(presenceText) =>\n                setConfig((current) => ({\n                  ...current,\n                  activityType: 'listening',\n                  activityText: presenceText,\n                }))\n              }\n            />\n""",
                  """            <SpotifyPresencePicker\n              selectedMedia={config.media?.provider === 'spotify' ? config.media : null}\n              onSelect={(presenceText, media) =>\n                setConfig((current) => ({\n                  ...current,\n                  activityType: 'listening',\n                  activityText: presenceText,\n                  media,\n                }))\n              }\n            />\n""",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('target snippet not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Prettierを適用
        run: |
          pnpm exec prettier --write \
            apps/bot/src/plugins/mini-games-amidakuji-core.test.ts \
            apps/bot/src/plugins/mini-games-amidakuji-core.ts \
            apps/bot/src/plugins/mini-games-amidakuji.ts \
            apps/bot/src/plugins/mini-games-v3.test.ts \
            apps/bot/src/plugins/mini-games-v3.ts \
            packages/plugin-catalog/src/manifests/mini-games.ts \
            apps/studio/src/components/bot-profile-settings.tsx \
            apps/studio/src/components/spotify-presence-picker.tsx \
            apps/studio/src/lib/bot-presence-store.ts \
            packages/shared/src/bot-presence.ts

      - name: branchへ反映
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/plugins packages/plugin-catalog/src/manifests/mini-games.ts apps/studio/src/components/bot-profile-settings.tsx apps/studio/src/components/spotify-presence-picker.tsx apps/studio/src/lib/bot-presence-store.ts packages/shared/src/bot-presence.ts
          git commit -m 'chore: format PR220 and wire Spotify media'
          git push origin HEAD:feature/mini-games-visual-console-v4
