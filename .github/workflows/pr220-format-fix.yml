name: PR220 Format Fix

on:
  push:
    branches: [feature/mini-games-visual-console-v4]

permissions:
  contents: write

jobs:
  format-and-wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-visual-console-v4
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Spotify選択メディアをPresenceフォームへ接続
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('apps/studio/src/components/bot-profile-settings.tsx')
          text = path.read_text()

          old = """              onChange={(value) =>
                setConfig((current) => ({ ...current, activityType: value as BotActivityType }))
              }
"""
          new = """              onChange={(value) =>
                setConfig((current) => ({
                  ...current,
                  activityType: value as BotActivityType,
                  media: value === 'listening' ? current.media : null,
                }))
              }
"""
          if old not in text:
              raise SystemExit('activity type snippet not found')
          text = text.replace(old, new, 1)

          old = """              onChange={(event) =>
                setConfig((current) => ({
                  ...current,
                  activityText: event.target.value.slice(0, 128),
                }))
              }
"""
          new = """              onChange={(event) =>
                setConfig((current) => ({
                  ...current,
                  activityText: event.target.value.slice(0, 128),
                  media: null,
                }))
              }
"""
          if old not in text:
              raise SystemExit('activity text snippet not found')
          text = text.replace(old, new, 1)

          old = """            <SpotifyPresencePicker
              onSelect={(presenceText) =>
                setConfig((current) => ({
                  ...current,
                  activityType: 'listening',
                  activityText: presenceText,
                }))
              }
            />
"""
          new = """            <SpotifyPresencePicker
              selectedMedia={config.media?.provider === 'spotify' ? config.media : null}
              onSelect={(presenceText, media) =>
                setConfig((current) => ({
                  ...current,
                  activityType: 'listening',
                  activityText: presenceText,
                  media,
                }))
              }
            />
"""
          if old not in text:
              raise SystemExit('Spotify picker snippet not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Prettierを適用
        run: |
          pnpm exec prettier --write \
            apps/bot/src/plugins/mini-games-amidakuji-core.test.ts \
            apps/bot/src/plugins/mini-games-amidakuji-core.ts \
            apps/bot/src/plugins/mini-games-amidakuji.ts \
            apps/bot/src/plugins/mini-games-v3.test.ts \
            apps/bot/src/plugins/mini-games-v3.ts \
            packages/plugin-catalog/src/manifests/mini-games.ts \
            apps/studio/src/components/bot-profile-settings.tsx \
            apps/studio/src/components/spotify-presence-picker.tsx \
            apps/studio/src/lib/bot-presence-store.ts \
            packages/shared/src/bot-presence.ts

      - name: 変更をcommitしてbranchへ反映
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/bot/src/plugins/mini-games-amidakuji-core.test.ts \
            apps/bot/src/plugins/mini-games-amidakuji-core.ts \
            apps/bot/src/plugins/mini-games-amidakuji.ts \
            apps/bot/src/plugins/mini-games-v3.test.ts \
            apps/bot/src/plugins/mini-games-v3.ts \
            packages/plugin-catalog/src/manifests/mini-games.ts \
            apps/studio/src/components/bot-profile-settings.tsx \
            apps/studio/src/components/spotify-presence-picker.tsx \
            apps/studio/src/lib/bot-presence-store.ts \
            packages/shared/src/bot-presence.ts
          git commit -m 'chore: format PR220 and wire Spotify media'
          git push origin HEAD:feature/mini-games-visual-console-v4
