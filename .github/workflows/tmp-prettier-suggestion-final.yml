name: Temporary Prettier Suggestion Final

on:
  push:
    branches: [tmp/prettier-suggestion-161-final]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/suggestion.ts
      - run: pnpm exec prettier --check apps/bot/src/plugins/suggestion.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet -- apps/bot/src/plugins/suggestion.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/suggestion.ts
          git commit -m "Suggestion Runtimeを最終整形する"
          git push
