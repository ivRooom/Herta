name: Achievement Builder Format

on:
  push:
    branches:
      - feature/achievements-v3-1-studio-builder
    paths:
      - 'apps/studio/src/components/achievement-builder-manager.tsx'
      - 'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/page.tsx'
      - '.github/workflows/achievements-builder-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/achievements-v3-1-studio-builder
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Builder files
        run: pnpm exec prettier --write 'apps/studio/src/components/achievement-builder-manager.tsx' 'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/page.tsx'
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/src/components/achievement-builder-manager.tsx 'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/page.tsx'
          git commit -m 'Achievement Builderのコード整形を適用'
          git push origin HEAD:feature/achievements-v3-1-studio-builder
