name: Config Studio Format

on:
  push:
    branches:
      - feat/config-studio-v1
    paths:
      - apps/studio/src/components/plugin-config-studio-form.tsx
      - .github/workflows/config-studio-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Config Studio
        run: pnpm exec prettier --write apps/studio/src/components/plugin-config-studio-form.tsx
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/config-studio-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/components/plugin-config-studio-form.tsx .github/workflows/config-studio-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: Config Studioを整形"
          git push origin HEAD:feat/config-studio-v1
