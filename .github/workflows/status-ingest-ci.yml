name: Status Ingest CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/status-ingest/**'
      - '.github/workflows/status-ingest-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/status-ingest/**'
      - '.github/workflows/status-ingest-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: status-ingest-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/ivrooom/herta-status-ingest

jobs:
  test:
    name: Python, API and container validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/oci-status-ingest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 一時レビュー修正を作業ツリーへ適用
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-status-ingest-review-fixes.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          cd services/status-ingest"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = textwrap.dedent(workflow[start:end])
          try:
              exec(compile(code, '<status-ingest-review-fixes>', 'exec'))
          except SystemExit as error:
              if error.code not in (None, 0):
                  raise

          source_path = Path('services/status-ingest/status_ingest.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''                if existing_nonce is not None:\n                    connection.execute("ROLLBACK")\n                    if hmac.compare_digest(\n                        existing_nonce["request_fingerprint"],\n                        request_fingerprint,\n                    ):\n                        return False\n                    raise RequestError('''
          new = '''                if existing_nonce is not None:\n                    if hmac.compare_digest(\n                        existing_nonce["request_fingerprint"],\n                        request_fingerprint,\n                    ):\n                        connection.execute("ROLLBACK")\n                        return False\n                    raise RequestError('''
          if old in source:
              source_path.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('二重ROLLBACK修正対象が見つかりません')
          PY

      - name: レビュー修正をcommit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            services/status-ingest/status_ingest.py \
            services/status-ingest/test_app.py \
            docs/STATUS_INGEST_OCI.md
          if git diff --cached --quiet; then
            echo 'commit対象の変更はありません。'
          else
            git commit -m 'fix: Nonce再利用時の二重rollbackを防止'
            git push origin HEAD:feat/oci-status-ingest
          fi

      - name: Python構文と単体テスト
        working-directory: services/status-ingest
        run: |
          set -euo pipefail
          python -m compileall -q status_ingest.py runner.py test_app.py
          python -m unittest -v test_app.py 2>&1 | tee /tmp/status-ingest-tests.log

      - name: 失敗テストログを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: status-ingest-test-failure
          path: /tmp/status-ingest-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: ComposeとCaddy設定を検証
        working-directory: services/status-ingest
        env:
          STATUS_INGEST_IMAGE: ghcr.io/ivrooom/herta-status-ingest:test
          STATUS_PUBLIC_HOST: stats.example.com
        run: |
          set -euo pipefail
          cp status-ingest.env.example .env
          sed -i 's/^STATUS_SIGNING_SECRET=.*/STATUS_SIGNING_SECRET=test-signing-secret-0123456789abcdef/' .env
          docker compose config --quiet
          docker run --rm \
            -e STATUS_PUBLIC_HOST=stats.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
          rm -f .env

      - name: status-ingest imageをbuild
        run: |
          set -euo pipefail
          docker build \
            --tag herta-status-ingest:ci \
            services/status-ingest

      - name: 非root runtime・health・正常終了を検証
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id herta-status-ingest:ci -u)" != '0'

          docker volume create herta-status-ingest-ci-data >/dev/null
          docker run -d \
            --name herta-status-ingest-ci \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e STATUS_SIGNING_SECRET=test-signing-secret-0123456789abcdef \
            -e STATUS_DATABASE_PATH=/data/status.sqlite3 \
            -v herta-status-ingest-ci-data:/data \
            -p 127.0.0.1:18080:8080 \
            herta-status-ingest:ci

          cleanup() {
            docker rm -f herta-status-ingest-ci >/dev/null 2>&1 || true
            docker volume rm herta-status-ingest-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/tmp/status-health.json; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/status-health.json').read_text())
          assert payload == {
              'service': 'ivrm-status-ingest',
              'status': 'ok',
              'database': 'ok',
          }
          PY

          test "$(docker inspect herta-status-ingest-ci --format '{{.Config.User}}')" = '10001:10001'
          docker stop --time 5 herta-status-ingest-ci >/dev/null
          test "$(docker inspect herta-status-ingest-ci --format '{{.State.ExitCode}}')" = '0'

      - name: Docker Buildxを準備
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: GHCRへログイン
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: GHCRへSHA imageを公開
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: services/status-ingest
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha,scope=status-ingest
          cache-to: type=gha,mode=max,scope=status-ingest
