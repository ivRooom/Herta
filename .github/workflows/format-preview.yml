name: Format Preview

on:
  push:
    branches:
      - feat/ai-provider-credentials-console

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec prettier --write \
            apps/studio/src/app/api/admin/runtime-secrets/openai/route.ts \
            apps/studio/src/app/api/search/semantic/route.ts \
            apps/studio/src/components/ai-provider-credential-settings.tsx \
            apps/studio/src/lib/ai-provider-credential-policy.test.ts \
            packages/db/src/runtime-secrets.ts
      - name: Print formatting diff
        run: git diff --no-ext-diff --unified=200
