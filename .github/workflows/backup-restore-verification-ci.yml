# ============================================================
# Backup Restore Verification CI
# ============================================================
name: Backup Restore Verification CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'deploy/scripts/verify-backup-restore.sh'
      - 'deploy/scripts/verify-backup-restore.test.sh'
      - 'deploy/scripts/verify-vc-recap-restore-fences.py'
      - 'deploy/scripts/verify-vc-recap-restore-fences.test.py'
      - 'deploy/scripts/vc-recap-erasure-ledger-contract.mjs'
      - 'deploy/scripts/vc-recap-erasure-ledger-contract.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-write-first.mjs'
      - 'deploy/scripts/vc-recap-erasure-write-first.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-v3-adapter.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-v3-adapter.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-inventory.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-inventory.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-signed-audit.mjs'
      - 'deploy/scripts/vc-recap-erasure-signed-audit.test.mjs'
      - 'deploy/scripts/vc-recap-restore-quarantine.mjs'
      - 'deploy/scripts/vc-recap-restore-quarantine.test.mjs'
      - 'deploy/scripts/vc-recap-restore-pinned-audit.mjs'
      - 'deploy/scripts/vc-recap-restore-pinned-audit.test.mjs'
      - 'deploy/scripts/vc-recap-restore-fence-replay.mjs'
      - 'deploy/scripts/vc-recap-restore-fence-replay.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-purge.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-purge.test.mjs'
      - 'docs/VC_RECAP_ERASURE_LEDGER_DESIGN.md'
      - 'deploy/systemd/herta-backup-restore-verification.service'
      - 'deploy/systemd/herta-backup-restore-verification.timer'
      - 'deploy/systemd/backup-restore-verification.env.example'
      - 'docs/BACKUP_RESTORE_VERIFICATION.md'
      - 'docs/VC_RECAP_RESTORE_FENCE_VERIFICATION.md'
      - '.github/workflows/backup-restore-verification-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'deploy/scripts/verify-backup-restore.sh'
      - 'deploy/scripts/verify-backup-restore.test.sh'
      - 'deploy/scripts/verify-vc-recap-restore-fences.py'
      - 'deploy/scripts/verify-vc-recap-restore-fences.test.py'
      - 'deploy/scripts/vc-recap-erasure-ledger-contract.mjs'
      - 'deploy/scripts/vc-recap-erasure-ledger-contract.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-write-first.mjs'
      - 'deploy/scripts/vc-recap-erasure-write-first.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-v3-adapter.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-v3-adapter.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-inventory.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-inventory.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-signed-audit.mjs'
      - 'deploy/scripts/vc-recap-erasure-signed-audit.test.mjs'
      - 'deploy/scripts/vc-recap-restore-quarantine.mjs'
      - 'deploy/scripts/vc-recap-restore-quarantine.test.mjs'
      - 'deploy/scripts/vc-recap-restore-pinned-audit.mjs'
      - 'deploy/scripts/vc-recap-restore-pinned-audit.test.mjs'
      - 'deploy/scripts/vc-recap-restore-fence-replay.mjs'
      - 'deploy/scripts/vc-recap-restore-fence-replay.test.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-purge.mjs'
      - 'deploy/scripts/vc-recap-erasure-s3-purge.test.mjs'
      - 'docs/VC_RECAP_ERASURE_LEDGER_DESIGN.md'
      - 'deploy/systemd/herta-backup-restore-verification.service'
      - 'deploy/systemd/herta-backup-restore-verification.timer'
      - 'deploy/systemd/backup-restore-verification.env.example'
      - 'docs/BACKUP_RESTORE_VERIFICATION.md'
      - 'docs/VC_RECAP_RESTORE_FENCE_VERIFICATION.md'
      - '.github/workflows/backup-restore-verification-ci.yml'

permissions:
  contents: read

concurrency:
  group: backup-restore-verification-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shell and systemd validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Shell構文を検証
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/scripts/verify-backup-restore.sh
          bash -n deploy/scripts/verify-backup-restore.test.sh

      - name: 外部依存をモックして動作を検証
        shell: bash
        run: bash deploy/scripts/verify-backup-restore.test.sh

      - name: VC Recap restore fence reconciliation (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/scripts/verify-vc-recap-restore-fences.test.py -v

      - name: VC Recap erasure ledger receipt contract (synthetic only)
        run: node --test deploy/scripts/vc-recap-erasure-ledger-contract.test.mjs

      - name: VC Recap write-first fail-closed sequence (synthetic only)
        run: node --test deploy/scripts/vc-recap-erasure-write-first.test.mjs

      - name: Independent S3 ledger v3 conditional write contract (synthetic only)
        run: node --test deploy/scripts/vc-recap-erasure-s3-v3-adapter.test.mjs

      - name: Independent S3 ledger version inventory vs external audit (synthetic only)
        run: node --test deploy/scripts/vc-recap-erasure-s3-inventory.test.mjs

      - name: Independently pinned Ed25519 ledger audit proof (synthetic only)
        run: node --test deploy/scripts/vc-recap-erasure-signed-audit.test.mjs

      - name: VC Recap restore quarantine proof sequence (synthetic only)
        run: node --test deploy/scripts/vc-recap-restore-quarantine.test.mjs

      - name: Pinned ledger audit + restore quarantine integration (synthetic only)
        run: node --test deploy/scripts/vc-recap-restore-pinned-audit.test.mjs

      - name: Offline owner-locked restore fence replay (synthetic only)
        run: node --test deploy/scripts/vc-recap-restore-fence-replay.test.mjs

      - name: Single-key S3 full-version and multipart purge (synthetic only)
        run: node --test deploy/scripts/vc-recap-erasure-s3-purge.test.mjs

      - name: systemd unitを検証
        shell: bash
        run: |
          set -euo pipefail
          systemd-analyze verify \
            deploy/systemd/herta-backup-restore-verification.service \
            deploy/systemd/herta-backup-restore-verification.timer

      - name: 安全設定を検証
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--network none' deploy/scripts/verify-backup-restore.sh
          grep -q 'flock -n' deploy/scripts/verify-backup-restore.sh
          grep -q 'docker rm --force' deploy/scripts/verify-backup-restore.sh
          grep -q 'RESTORE_MEMORY_LIMIT' deploy/scripts/verify-backup-restore.sh
          grep -q 'RESTORE_CPU_LIMIT' deploy/scripts/verify-backup-restore.sh
