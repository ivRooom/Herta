              isRoot: false,
              roleIds: [ROLE_ID, secondRoleId],
              policies: [
                { discordRoleId: ROLE_ID, policy: allowed },
                { discordRoleId: secondRoleId, policy: denied },
              ],
            };

            assert.equal(hasEffectivePluginPermission(access, 'studio.settings.write', resource), false);
          });
          '''))

