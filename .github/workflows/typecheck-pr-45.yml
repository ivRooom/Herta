name: Typecheck PR 45 Diagnostics

on:
  push:
    branches: [feat/guild-install-onboarding]

permissions:
  contents: write

concurrency:
  group: typecheck-pr-45
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guild-install-onboarding

      - name: 診断済みなら終了
        id: guard
        shell: bash
        run: |
          if [ -f typecheck-pr-45.log ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.guard.outputs.skip != 'true'
        run: pnpm db:generate

      - name: Typecheck結果を保存
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck-pr-45.log 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Typecheck成功"
            rm -f typecheck-pr-45.log
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-pr-45.log
          git commit -m "ci(temp): typecheck診断ログを保存"
          git push origin HEAD:feat/guild-install-onboarding
