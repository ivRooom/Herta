name: Typecheck PR 45 Diagnostics

on:
  push:
    branches: [feat/guild-install-onboarding]

permissions:
  contents: write

concurrency:
  group: typecheck-pr-45
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'typecheck診断ログ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guild-install-onboarding

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Typecheck結果を保存
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck-pr-45.log 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Typecheck成功"
            rm -f typecheck-pr-45.log
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-pr-45.log
          git commit -m "ci(temp): typecheck診断ログを保存"
          git push origin HEAD:feat/guild-install-onboarding
