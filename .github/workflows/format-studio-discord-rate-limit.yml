name: Format Studio Discord rate limit

on:
  push:
    branches:
      - fix/studio-discord-rate-limit
    paths:
      - .github/workflows/format-studio-discord-rate-limit.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/studio-discord-rate-limit
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettierを適用
        run: |
          pnpm exec prettier --write apps/studio/src/lib/guild-plugins.ts
          rm .github/workflows/format-studio-discord-rate-limit.yml
      - name: 整形結果をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: Discord 429対応を整形"
          git push origin HEAD:fix/studio-discord-rate-limit
