name: Message Target Review Fixes

on:
  push:
    branches:
      - feat/config-studio-message-target

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-message-target
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-message-target-review-fixes.py
      - run: pnpm exec prettier --write apps/studio/src/components/plugin-config-studio-form.tsx
      - run: pnpm --dir apps/studio typecheck
      - name: commitして一時ファイルを削除
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/message-target-review-fixes.yml scripts/patch-message-target-review-fixes.py
          git add apps/studio/src/components/plugin-config-studio-form.tsx
          git commit -m "fix: Message Targetのnull・兄弟設定更新を整合"
          git push origin HEAD:feat/config-studio-message-target
