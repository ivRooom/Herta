name: Temporary Studio Test Errors Only

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @herta/db generate
      - name: Studio Test errors only
        run: pnpm turbo run test --filter=@herta/studio --output-logs=errors-only
