name: Temporary VC Recap Prettier
on:
  push:
    branches:
      - docs/vc-recap-lifecycle-design-20261030
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[vc-format-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/studio/src/app/privacy/page.tsx"
      - name: Commit format only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "apps/studio/src/app/privacy/page.tsx"
            git commit -m "style(vc-recap): apply Prettier [vc-format-skip]"
            git push origin HEAD:docs/vc-recap-lifecycle-design-20261030
          fi
