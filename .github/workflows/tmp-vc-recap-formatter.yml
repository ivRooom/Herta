name: Temporary VC Recap Branch Formatter
on:
  push:
    branches:
      - feat/vc-recap-export-20261030
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[vc-format-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/studio/src/app/dashboard/guilds/[guildId]/vc-recap/[sessionId]/page.tsx" "apps/studio/src/app/dashboard/guilds/[guildId]/vc-recap/page.tsx"
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "apps/studio/src/app/dashboard/guilds/[guildId]/vc-recap/[sessionId]/page.tsx" "apps/studio/src/app/dashboard/guilds/[guildId]/vc-recap/page.tsx"
            git commit -m "style(vc-recap): format changed files [vc-format-skip]"
            git push origin HEAD:feat/vc-recap-export-20261030
          fi
