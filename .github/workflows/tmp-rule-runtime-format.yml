name: Temporary Rule Runtime Formatter

on:
  push:
    branches:
      - feat/rule-engine-production-runtime-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rule-engine-production-runtime-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format affected files
        run: |
          pnpm exec prettier --write \
            apps/bot/src/main.ts \
            apps/bot/src/rules/runtime.ts \
            apps/bot/src/rules/runtime.test.ts \
            apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx \
            apps/studio/src/components/rule-execution-history.tsx \
            docs/RULE_ENGINE_RUNTIME.md \
            packages/db/src/rule-runtime.ts \
            packages/rule-engine/src/evaluator.ts \
            packages/rule-engine/src/evaluator.test.ts \
            packages/rule-engine/src/index.ts \
            packages/shared/src/types/rule.ts
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-rule-runtime-format.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format rule runtime changes"
          git push origin HEAD:feat/rule-engine-production-runtime-v1
