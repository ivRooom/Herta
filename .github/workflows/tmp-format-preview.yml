name: Temporary Format Preview

on:
  push:
    branches:
      - feature/plugin-management-console-ux

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed Studio files
        run: >-
          pnpm exec prettier --write
          apps/studio/src/app/dashboard/page.tsx
          apps/studio/src/lib/studio-navigation.test.ts
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet -- apps/studio/src/app/dashboard/page.tsx apps/studio/src/lib/studio-navigation.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/app/dashboard/page.tsx apps/studio/src/lib/studio-navigation.test.ts
          git commit -m "Studio UI差分をPrettier整形"
          git push origin HEAD:feature/plugin-management-console-ux
