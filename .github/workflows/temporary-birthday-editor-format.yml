name: Temporary Birthday Editor Format

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 300 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/birthday-card-asset-library
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format editor and clean diagnostic files
        run: |
          pnpm exec prettier --write apps/studio/src/components/birthday-card-editor.tsx
          git show 094059b0ec263144ae1ef5a48b2b6275ed07e387:package.json > package.json
          rm .github/workflows/temporary-birthday-editor-format.yml
      - name: Commit formatting fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/src/components/birthday-card-editor.tsx package.json .github/workflows/temporary-birthday-editor-format.yml
          git commit -m 'fix(birthday): format active asset guard'
          git push origin HEAD:feat/birthday-card-asset-library
