name: Temporary security test formatting #376

on:
  push:
    branches:
      - fix/376-security-gate
    paths:
      - .github/workflows/security-format-376.yml

permissions:
  contents: write

jobs:
  format-security-test:
    name: Format security regression test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format regression test
        run: pnpm exec prettier --write .github/scripts/security-overrides.test.mjs

      - name: Verify formatting
        run: pnpm exec prettier --check .github/scripts/security-overrides.test.mjs

      - name: Commit formatted regression test
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/scripts/security-overrides.test.mjs; then
            echo 'No formatting change was produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/security-overrides.test.mjs
          git commit -m 'style(security): format override regression test'
          git push origin HEAD:fix/376-security-gate
