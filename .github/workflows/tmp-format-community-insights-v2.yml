name: Temporary Community Insights v2 Format

on:
  push:
    branches:
      - feat/community-insights-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/community-insights-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/bot/src/commands/community-activity.ts \
            apps/studio/src/app/dashboard/community/page.tsx
          git rm .github/workflows/tmp-format-community-insights-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/commands/community-activity.ts apps/studio/src/app/dashboard/community/page.tsx
          git commit -m 'Community Insights v2のコードを整形する'
          git push origin HEAD:feat/community-insights-v2
