name: Auto Response Concurrency Fix

on:
  push:
    branches:
      - feat/auto-response-plugin-v1
    paths:
      - 'auto-response-concurrency-fix.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply concurrency fix
        run: node .github/scripts/apply-auto-response-concurrency-fix.mjs
      - name: Format repository
        run: pnpm format
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/auto-response/src/service.ts plugins/auto-response/src/service.test.ts packages/db/prisma/schema.prisma docs/plugins/AUTO_RESPONSE.md
          git commit -m 'fix(auto-response): Guild Cooldownの同時実行競合を防止'
          git push origin HEAD:feat/auto-response-plugin-v1
