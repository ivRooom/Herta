name: Refresh Vulnerable JS Dependencies

on:
  push:
    branches:
      - feat/config-studio-message-target

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-message-target
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security overrideを更新
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides.nanoid = '3.3.17';
          pkg.pnpm.overrides.postcss = '8.5.23';
          pkg.pnpm.overrides.qs = '6.15.2';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test
      - name: commitして一時Workflowを削除
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-vulnerable-js-deps.yml
          git add package.json pnpm-lock.yaml
          git commit -m "fix: Production imageの脆弱なJS依存を更新"
          git push origin HEAD:feat/config-studio-message-target
