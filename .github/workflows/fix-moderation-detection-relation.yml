name: Temporary fix moderation detection relation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/moderation-detection-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-detection-history
          fetch-depth: 0

      - name: Align Prisma relation with migration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('packages/db/prisma/schema.prisma')
          content = path.read_text()
          old = '  guild          Guild     @relation(fields: [guildId], references: [id])'
          new = '  guild          Guild     @relation(fields: [guildId], references: [id], onDelete: Cascade)'
          if old not in content:
              raise SystemExit('Target relation was not found')
          path.write_text(content.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/prisma/schema.prisma
          git commit -m "fix: 自動検知履歴のGuild削除規則を統一"
          git push origin HEAD:feat/moderation-detection-history
