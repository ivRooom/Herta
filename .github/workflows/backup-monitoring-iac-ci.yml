name: Backup Monitoring IaC CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'deploy/aws/backup-monitoring/**'
      - '.github/workflows/backup-monitoring-iac-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'deploy/aws/backup-monitoring/**'
      - '.github/workflows/backup-monitoring-iac-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: デプロイスクリプトの構文を検証
        run: bash -n deploy/aws/backup-monitoring/deploy.sh

      - name: cfn-lintをインストール
        run: pipx install cfn-lint

      - name: CloudFormationテンプレートを検証
        run: cfn-lint deploy/aws/backup-monitoring/template.yml

      - name: 安全設定を検証
        run: |
          set -euo pipefail
          template='deploy/aws/backup-monitoring/template.yml'
          grep -q 'ResourceNameSuffix' "$template"
          grep -q 'DeadLetterConfig' "$template"
          grep -q 'MaximumRetryAttempts: 2' "$template"
          grep -q 'Architectures: \[arm64\]' "$template"
          grep -q 'LogRetentionDays' "$template"
          grep -q 'AWS::CloudWatch::Dashboard' "$template"
          grep -q 'Herta/BackupMonitoring' "$template"
          grep -q 'cloudwatch:PutMetricData' "$template"
          grep -q 'LatestBackupAgeHours' "$template"
          grep -q 'cloudwatch_metric_publish_failed' "$template"
          grep -q 'except Exception as error:' "$template"
          grep -q 'DashboardUrl' "$template"
          grep -q 'CAPABILITY_NAMED_IAM' deploy/aws/backup-monitoring/deploy.sh
