name: LFG Preset Config

on:
  push:
    branches:
      - feat/lfg-presets-config

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/lfg-presets-config
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-lfg-presets-config.py
      - run: pnpm exec prettier --write plugins/lfg/src/config.ts plugins/lfg/src/config.test.ts plugins/lfg/src/manifest.ts apps/studio/src/components/lfg-manager.tsx apps/studio/src/app/dashboard/guilds/'[guildId]'/lfg/page.tsx
      - run: pnpm --filter @herta/discord-ui build
      - run: pnpm --filter @herta/plugin-lfg test
      - run: pnpm --filter @herta/plugin-lfg typecheck
      - run: pnpm --dir apps/studio typecheck
      - name: commitして一時ファイルを削除
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lfg-presets-config.yml scripts/patch-lfg-presets-config.py
          git add plugins/lfg/src/config.ts plugins/lfg/src/config.test.ts plugins/lfg/src/manifest.ts apps/studio/src/components/lfg-manager.tsx apps/studio/src/app/dashboard/guilds/'[guildId]'/lfg/page.tsx
          git commit -m "feat: LFG募集PresetをGuild設定へ昇格"
          git push origin HEAD:feat/lfg-presets-config
