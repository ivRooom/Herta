name: Temporary Ops Incident Boundary

on:
  push:
    branches:
      - feat/operations-health-history
    paths:
      - .github/workflows/tmp-ops-incident-boundary.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operations-health-history
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply boundary-aware history query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/studio/src/app/dashboard/operations/page.tsx')
          text = path.read_text()
          replacements = [
            (
              "import { listServiceHealthSnapshots, type ServiceHealthSnapshotRecord } from '@herta/db';",
              "import {\n  getServiceHealthSnapshotBefore,\n  listServiceHealthSnapshots,\n  type ServiceHealthSnapshotRecord,\n} from '@herta/db';",
            ),
            (
              "  const summary = summarizeOperationsHistory(history.snapshots, rangeStart, rangeEnd);",
              "  const summary = summarizeOperationsHistory(\n    history.snapshots,\n    rangeStart,\n    rangeEnd,\n    history.previousSnapshot?.status,\n  );",
            ),
            (
              "async function loadHistory(\n  since: Date,\n): Promise<{ available: boolean; snapshots: ServiceHealthSnapshotRecord[] }> {\n  try {\n    const snapshots = await listServiceHealthSnapshots(prisma, 'herta-discord-bot', since, 10_000);\n    return { available: true, snapshots };",
              "async function loadHistory(since: Date): Promise<{\n  available: boolean;\n  snapshots: ServiceHealthSnapshotRecord[];\n  previousSnapshot: ServiceHealthSnapshotRecord | null;\n}> {\n  try {\n    const [snapshots, previousSnapshot] = await Promise.all([\n      listServiceHealthSnapshots(prisma, 'herta-discord-bot', since, 10_000),\n      getServiceHealthSnapshotBefore(prisma, 'herta-discord-bot', since),\n    ]);\n    return { available: true, snapshots, previousSnapshot };",
            ),
            (
              "    return { available: false, snapshots: [] };",
              "    return { available: false, snapshots: [], previousSnapshot: null };",
            ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/studio/src/app/dashboard/operations/page.tsx apps/studio/src/lib/operations-history.ts packages/db/src/health-snapshots.ts
      - run: pnpm db:generate
      - run: pnpm --filter @herta/db typecheck
      - run: pnpm --filter @herta/studio typecheck
      - run: pnpm --filter @herta/studio test
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-ops-incident-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Operationsの期間境界Incidentを正しく集計"
          git push origin HEAD:feat/operations-health-history
