name: Role Reference Format Once

on:
  push:
    branches:
      - feat/role-manager-lifecycle

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Role reference protection and remove this workflow
        shell: bash
        run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/api/guilds/[guildId]/roles/route.ts' \
            packages/db/src/discord-role-references.ts
          rm .github/workflows/role-reference-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/studio/src/app/api/guilds/[guildId]/roles/route.ts' \
            packages/db/src/discord-role-references.ts \
            .github/workflows/role-reference-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format Discord Role reference protection'
          git push origin HEAD:feat/role-manager-lifecycle
