name: Achievement Operations Format

on:
  push:
    branches:
      - feature/achievements-v3-3-operations
    paths:
      - 'apps/studio/src/app/api/guilds/[guildId]/achievements/operations/route.ts'
      - 'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/operations/page.tsx'
      - 'apps/studio/src/components/achievement-operations-dashboard.tsx'
      - 'apps/studio/src/lib/achievement-operations.ts'
      - '.github/workflows/achievements-ops-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/achievements-v3-3-operations
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Achievement Operations files
        run: >-
          pnpm exec prettier --write
          'apps/studio/src/app/api/guilds/[guildId]/achievements/operations/route.ts'
          'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/operations/page.tsx'
          'apps/studio/src/components/achievement-operations-dashboard.tsx'
          'apps/studio/src/lib/achievement-operations.ts'
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/studio/src/app/api/guilds/[guildId]/achievements/operations/route.ts' 'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/operations/page.tsx' apps/studio/src/components/achievement-operations-dashboard.tsx apps/studio/src/lib/achievement-operations.ts
          git commit -m 'Achievement Operationsのコード整形を適用'
          git push origin HEAD:feature/achievements-v3-3-operations
