name: Temporary Mini Games v2 atomic format

on:
  push:
    branches:
      - feature/mini-games-v2-stats-challenges

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v2-stats-challenges
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/bot/src/plugins/mini-games-repository.ts
          apps/bot/src/plugins/mini-games-repository-transaction.test.ts
          apps/bot/src/plugins/mini-games.ts
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/temporary-mini-games-v2-atomic-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins .github/workflows
          git commit -m "Mini Games transaction修正を整形する"
          git push origin HEAD:feature/mini-games-v2-stats-challenges
