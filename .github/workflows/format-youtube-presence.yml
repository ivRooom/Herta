name: Format YouTube Presence

on:
  push:
    branches:
      - feature/youtube-presence-media

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/youtube-presence-media
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/studio/src/components/youtube-presence-picker.tsx
          apps/studio/src/lib/youtube-catalog.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/src/components/youtube-presence-picker.tsx apps/studio/src/lib/youtube-catalog.ts
          git commit -m 'style: YouTube Presence差分を整形'
          git push origin HEAD:feature/youtube-presence-media
