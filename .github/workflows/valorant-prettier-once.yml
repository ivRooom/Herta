name: VALORANT temporary source formatter
on:
  push:
    branches: [codex/valorant-random-589]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/valorant-random-589
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and self-remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/bot/src/plugins/valorant-session-repository.integration.test.ts apps/bot/src/plugins/valorant-session-repository.ts apps/bot/src/plugins/valorant.ts
          git rm .github/workflows/valorant-prettier-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(valorant): format integration test and remove temporary workflow'
          git push origin HEAD:codex/valorant-random-589
