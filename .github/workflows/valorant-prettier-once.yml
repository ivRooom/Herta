name: VALORANT temporary source formatter
on:
  push:
    branches:
      - codex/valorant-random-589
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/valorant-random-589
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only PR-changed source files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -d '' paths < <(git diff --name-only -z origin/main HEAD -- '*.ts' '*.tsx' '*.js' '*.json' '*.md' '*.yml' '*.yaml')
          if (( ${#paths[@]} )); then
            pnpm exec prettier --write "${paths[@]}"
          fi
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style(valorant): apply Prettier to changed sources'
            git push origin HEAD:codex/valorant-random-589
          fi
