name: PR348 maintenance

on:
  push:
    branches:
      - 'feat/345-python-code-execution'

permissions:
  contents: write

jobs:
  repair-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve execution failure categories
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/bot/src/ai/code-execution-service.ts';
          let source = fs.readFileSync(path, 'utf8');

          const replaceExact = (from, to, label) => {
            if (!source.includes(from)) {
              throw new Error(`Expected source fragment not found: ${label}`);
            }
            source = source.replace(from, to);
          };

          replaceExact(
            `interface CapturedExecution {\n  files: AiCodeExecutionFile[];\n  sandboxDestroyed: boolean;\n}`,
            `interface CapturedExecution {\n  files: AiCodeExecutionFile[];\n  sandboxDestroyed: boolean;\n  error: AiCodeExecutionError | null;\n}`,
            'captured execution error slot',
          );

          replaceExact(
            `const captured: CapturedExecution = { files: [], sandboxDestroyed: false };`,
            `const captured: CapturedExecution = { files: [], sandboxDestroyed: false, error: null };`,
            'captured execution initialization',
          );

          replaceExact(
            `    const response = await generationService.generate({\n      feature: 'ai.code_execution',\n      input: request.input,\n      guildId: request.guildId,\n      scopeGuildId: request.scopeGuildId,\n      userId: request.userId,\n      authorized: request.authorized,\n      pluginEnabled: request.pluginEnabled,\n      guildOptIn: request.guildOptIn,\n      responseMode: 'artifact',\n      groundingState: 'not_required',\n      trustedInstructions: [EXECUTION_INSTRUCTION],\n    });`,
            `    const response = await generationService\n      .generate({\n        feature: 'ai.code_execution',\n        input: request.input,\n        guildId: request.guildId,\n        scopeGuildId: request.scopeGuildId,\n        userId: request.userId,\n        authorized: request.authorized,\n        pluginEnabled: request.pluginEnabled,\n        guildOptIn: request.guildOptIn,\n        responseMode: 'artifact',\n        groundingState: 'not_required',\n        trustedInstructions: [EXECUTION_INSTRUCTION],\n      })\n      .catch((error: unknown) => {\n        if (captured.error) throw captured.error;\n        throw error;\n      });`,
            'execution error restoration',
          );

          replaceExact(
            `    if (failure) throw failure;\n    if (!responseResult) throw new AiCodeExecutionError('malformed_output');`,
            `    if (failure) {\n      if (failure instanceof AiCodeExecutionError) {\n        captured.error = failure;\n        throw new AiFoundationError('internal_error');\n      }\n      throw failure;\n    }\n    if (!responseResult) {\n      captured.error = new AiCodeExecutionError('malformed_output');\n      throw new AiFoundationError('internal_error');\n    }`,
            'execution failure normalization',
          );

          fs.writeFileSync(path, source);
          NODE
      - name: Format changed PR files
        run: >-
          pnpm exec prettier --write
          apps/bot/src/ai/artifact-message-handler-execution.test.ts
          apps/bot/src/ai/artifact-message-handler.ts
          apps/bot/src/ai/artifact-runtime-execution.test.ts
          apps/bot/src/ai/artifact-runtime.ts
          apps/bot/src/ai/code-execution-service.test.ts
          apps/bot/src/ai/code-execution-service.ts
          apps/bot/src/ai/discord-artifact-delivery.ts
          apps/bot/src/ai/factory.ts
          apps/bot/src/plugins/ai.ts
          docs/AI_ARTIFACT_RUNTIME.md
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/ai apps/bot/src/plugins/ai.ts docs/AI_ARTIFACT_RUNTIME.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ai): preserve execution failure categories'
          git push
