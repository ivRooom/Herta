name: Temporary Rule Studio Formatter

on:
  push:
    branches:
      - feat/rule-studio-v1
    paths:
      - .github/workflows/tmp-rule-studio-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rule-studio-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Rule Studio files
        run: >-
          pnpm prettier --write
          'apps/studio/src/app/api/guilds/[guildId]/rules/route.ts'
          'apps/studio/src/app/dashboard/guilds/[guildId]/rules/page.tsx'
          apps/studio/src/components/rule-studio-manager.tsx
          apps/studio/src/lib/rule-studio.test.ts
          apps/studio/src/lib/rule-studio.ts
      - name: Commit formatting
        run: |
          git config user.name "mizzz-ivr"
          git config user.email "mizzz._.dev@outlook.jp"
          git add apps/studio
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(studio): format Rule Studio v1"
          git push origin HEAD:feat/rule-studio-v1
