name: Sync Discord Visual Kit Lockfile

on:
  push:
    branches:
      - feat/discord-visual-kit
    paths:
      - .github/workflows/sync-discord-visual-kit-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/discord-visual-kit
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Update workspace lockfile
        run: pnpm install --lockfile-only

      - name: Format
        run: |
          pnpm exec prettier --write \
            packages/discord-ui/package.json \
            packages/discord-ui/tsconfig.json \
            packages/discord-ui/src/index.ts \
            plugins/moderation/package.json \
            plugins/moderation/src/discord-ui.ts
          rm -f .github/workflows/sync-discord-visual-kit-lock.yml

      - name: Commit
        run: |
          git config user.name 'mizzz-ivr'
          git config user.email '86910433+mizzz-ivr@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: Discord Visual Kitのworkspace lockを同期'
          git push origin HEAD:feat/discord-visual-kit
