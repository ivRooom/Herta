name: AI Foundation Validation Cleanup

on:
  push:
    branches:
      - feat/ai-foundation-console-credentials

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Remove superseded helper workflows
        run: |
          rm -f \
            .github/workflows/ai-foundation-workflow-fix.yml \
            .github/workflows/ai-foundation-test-type-fix.yml \
            .github/workflows/ai-foundation-test-type-fix2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'chore(ci): remove superseded AI validation helpers'
          git push origin HEAD:feat/ai-foundation-console-credentials
