name: Message Target Nullable Fix

on:
  push:
    branches: [feat/config-studio-message-target]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-message-target
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-message-target-nullable-prop.py
      - run: >-
          pnpm exec prettier --write
          apps/studio/src/components/discord-message-target-picker.tsx
          apps/studio/src/components/plugin-config-studio-form.tsx
          apps/studio/src/lib/discord-message-target.ts
      - run: pnpm --dir apps/studio typecheck
      - run: pnpm --dir apps/studio test
      - name: 修正をコミットして一時ファイルを削除
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mizzz（ずーみー）/いゔる。'
          git config user.email 'mizzz._.dev@outlook.jp'
          git rm .github/workflows/message-target-nullable-fix.yml scripts/patch-message-target-nullable-prop.py
          git add \
            apps/studio/src/components/discord-message-target-picker.tsx \
            apps/studio/src/components/plugin-config-studio-form.tsx \
            apps/studio/src/lib/discord-message-target.ts
          git commit -m 'fix: Message Targetのnullableとobject保持を修正'
          git push origin HEAD:feat/config-studio-message-target
