name: Temporary Server Context Runtime Patch

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-server-context-bot-profile
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply targeted source patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              if old not in content:
                  raise RuntimeError(f'pattern not found: {path}: {old[:80]!r}')
              target.write_text(content.replace(old, new, 1))

          bot = 'apps/bot/src/bot.ts'
          replace_once(bot, "import {\n  Client,\n", "import {\n  ActivityType,\n  Client,\n")
          replace_once(
              bot,
              "import { HERTA_WORKER_HEARTBEAT_KEY, type XpRoleSweepEvent } from '@herta/shared';",
              "import {\n  BOT_PRESENCE_CONFIG_KEY,\n  DEFAULT_BOT_PRESENCE_CONFIG,\n  HERTA_WORKER_HEARTBEAT_KEY,\n  normalizeBotPresenceConfig,\n  type BotPresenceConfig,\n  type XpRoleSweepEvent,\n} from '@herta/shared';",
          )
          replace_once(
              bot,
              "import { PluginRuntimeEventSubscriber } from './plugins/runtime-events.js';",
              "import { PluginRuntimeEventSubscriber } from './plugins/runtime-events.js';\nimport { BotPresenceEventSubscriber } from './presence/runtime-events.js';",
          )
          replace_once(
              bot,
              "function guildMembersIntentEnabled(): boolean {\n  return envFlagEnabled('DISCORD_ENABLE_GUILD_MEMBERS_INTENT');\n}\n\n",
              "function guildMembersIntentEnabled(): boolean {\n  return envFlagEnabled('DISCORD_ENABLE_GUILD_MEMBERS_INTENT');\n}\n\nconst BOT_ACTIVITY_TYPE_MAP: Record<BotPresenceConfig['activityType'], ActivityType> = {\n  playing: ActivityType.Playing,\n  listening: ActivityType.Listening,\n  watching: ActivityType.Watching,\n  competing: ActivityType.Competing,\n};\n\n",
          )
          replace_once(
              bot,
              "  private readonly runtimeEvents: PluginRuntimeEventSubscriber;\n  private readonly xpRoleReconciliation: XpRoleReconciliationSubscriber;",
              "  private readonly runtimeEvents: PluginRuntimeEventSubscriber;\n  private readonly presenceEvents: BotPresenceEventSubscriber;\n  private readonly xpRoleReconciliation: XpRoleReconciliationSubscriber;",
          )
          replace_once(
              bot,
              "    this.runtimeEvents = new PluginRuntimeEventSubscriber(\n      (guildId) => this.resyncGuild(guildId),\n      this.logger,\n    );\n    this.xpRoleReconciliation",
              "    this.runtimeEvents = new PluginRuntimeEventSubscriber(\n      (guildId) => this.resyncGuild(guildId),\n      this.logger,\n    );\n    this.presenceEvents = new BotPresenceEventSubscriber(\n      (config) => this.applyBotPresence(config),\n      this.logger,\n    );\n    this.xpRoleReconciliation",
          )
          replace_once(
              bot,
              "    await this.client.login(token);\n\n    this.discordHealth.observe(this.client);",
              "    await this.client.login(token);\n    this.applyBotPresence(DEFAULT_BOT_PRESENCE_CONFIG);\n\n    this.discordHealth.observe(this.client);",
          )
          replace_once(
              bot,
              "    try {\n      await this.healthRedis.connect();\n    } catch {\n      this.logger.warn('ヘルスチェック用Redisの初期接続に失敗しました');\n    }\n\n    try {\n      await this.runtimeEvents.start(redisUrl);",
              "    try {\n      await this.healthRedis.connect();\n    } catch {\n      this.logger.warn('ヘルスチェック用Redisの初期接続に失敗しました');\n    }\n\n    try {\n      const storedPresence = await this.healthRedis.get(BOT_PRESENCE_CONFIG_KEY);\n      if (storedPresence) {\n        this.applyBotPresence(normalizeBotPresenceConfig(JSON.parse(storedPresence) as unknown));\n      }\n    } catch (error) {\n      this.logger.warn({ err: error }, '保存済みBot Presence設定の読み込みに失敗しました');\n    }\n\n    try {\n      await this.runtimeEvents.start(redisUrl);",
          )
          replace_once(
              bot,
              "    try {\n      await this.xpRoleReconciliation.start(redisUrl);",
              "    try {\n      await this.presenceEvents.start(redisUrl);\n    } catch (error) {\n      this.logger.error(\n        { err: error },\n        'Bot Presenceイベント購読の開始に失敗しました。保存済みPresenceで継続します',\n      );\n    }\n\n    try {\n      await this.xpRoleReconciliation.start(redisUrl);",
          )
          replace_once(
              bot,
              "  async getGuildConfigurationOptions(guildId: string): Promise<GuildConfigurationOptions | null> {",
              "  private applyBotPresence(config: BotPresenceConfig): void {\n    const user = this.client.user;\n    if (!user) {\n      this.logger.warn('Discord ClientがReadyではないためBot Presenceを適用できません');\n      return;\n    }\n\n    user.setPresence({\n      status: config.status,\n      activities: [\n        {\n          name: config.activityText,\n          type: BOT_ACTIVITY_TYPE_MAP[config.activityType],\n        },\n      ],\n    });\n    this.logger.info(\n      { status: config.status, activityType: config.activityType },\n      'Bot Presenceを更新しました',\n    );\n  }\n\n  async getGuildConfigurationOptions(guildId: string): Promise<GuildConfigurationOptions | null> {",
          )
          replace_once(
              bot,
              "      this.runtimeEvents.stop(),\n      this.xpRoleReconciliation.stop(),",
              "      this.runtimeEvents.stop(),\n      this.presenceEvents.stop(),\n      this.xpRoleReconciliation.stop(),",
          )

          palette = 'apps/studio/src/components/console-command-palette.tsx'
          replace_once(
              palette,
              "import { getGuildConsoleContext } from '@/lib/guild-context-nav';\n",
              "import { useStudioServerContext } from '@/components/studio-server-context';\n",
          )
          replace_once(
              palette,
              "interface CommandPaletteGuild {\n  id: string;\n  name: string;\n}\n\n",
              "",
          )
          replace_once(
              palette,
              "export function ConsoleCommandPaletteController({ guilds }: { guilds: CommandPaletteGuild[] }) {\n  const pathname = usePathname();\n  const router = useRouter();",
              "export function ConsoleCommandPaletteController() {\n  const pathname = usePathname();\n  const router = useRouter();\n  const { selectedGuild } = useStudioServerContext();",
          )
          replace_once(
              palette,
              "  const context = getGuildConsoleContext(pathname);\n  const currentGuild = context\n    ? (guilds.find((guild) => guild.id === context.guildId) ?? null)\n    : null;\n  const commands = useMemo(\n    () => buildStudioCommandItems(context?.guildId ?? null, currentGuild?.name ?? null),\n    [context?.guildId, currentGuild?.name],\n  );",
              "  const commands = useMemo(\n    () => buildStudioCommandItems(selectedGuild?.id ?? null, selectedGuild?.name ?? null),\n    [selectedGuild?.id, selectedGuild?.name],\n  );",
          )

          layout = 'apps/studio/src/app/dashboard/layout.tsx'
          replace_once(layout, '<ConsoleCommandPaletteController guilds={guilds} />', '<ConsoleCommandPaletteController />')

      - name: Format patched files
        run: pnpm exec prettier --write apps/bot/src/bot.ts apps/studio/src/components/console-command-palette.tsx apps/studio/src/app/dashboard/layout.tsx
      - name: Commit patch and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-server-context-runtime-patch.yml
          git config user.name "mizzz-ivr"
          git config user.email "86910433+mizzz-ivr@users.noreply.github.com"
          git add apps/bot/src/bot.ts apps/studio/src/components/console-command-palette.tsx apps/studio/src/app/dashboard/layout.tsx
          git commit -m "Selected ServerとBot PresenceのRuntime連携を追加"
          git push origin HEAD:feature/studio-server-context-bot-profile
