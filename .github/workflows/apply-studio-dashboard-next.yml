name: Apply Studio Dashboard Next

on:
  push:
    branches:
      - feat/studio-dashboard-next
    paths:
      - .github/workflows/apply-studio-dashboard-next.yml
      - scripts/apply-studio-dashboard-next.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/studio-dashboard-next
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply implementation patches
        run: python3 scripts/apply-studio-dashboard-next.py

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/bot/src/bot.ts \
            apps/bot/src/main.ts \
            apps/bot/src/health/server.ts \
            apps/bot/src/health/guild-options.ts \
            apps/studio/src/app/globals.css \
            apps/studio/src/app/dashboard/layout.tsx \
            apps/studio/src/app/dashboard/page.tsx \
            apps/studio/src/app/dashboard/custom-plugins/page.tsx \
            'apps/studio/src/app/dashboard/guilds/[guildId]/plugins/page.tsx' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/plugins/[pluginId]/page.tsx' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/moderation/enforcement/page.tsx' \
            apps/studio/src/components/dashboard-nav.tsx \
            apps/studio/src/components/discord-entity-picker.tsx \
            apps/studio/src/components/moderation-config-form.tsx \
            apps/studio/src/components/moderation-enforcement-form.tsx \
            apps/studio/src/lib/bot-guild-options.ts \
            plugins/moderation/src/automatic-runtime.ts \
            plugins/moderation/src/automatic-runtime.test.ts

      - name: Typecheck and tests
        run: |
          pnpm --filter @herta/bot typecheck
          pnpm --filter @herta/plugin-moderation typecheck
          pnpm --filter @herta/plugin-moderation test
          pnpm --filter @herta/studio typecheck
          pnpm --filter @herta/studio test

      - name: Remove temporary files
        run: |
          rm -f .github/workflows/apply-studio-dashboard-next.yml
          rm -f scripts/apply-studio-dashboard-next.py

      - name: Commit verified implementation
        run: |
          git config user.name 'mizzz-ivr'
          git config user.email '86910433+mizzz-ivr@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: Studio Next UIとDiscordスマート設定を実装'
          git push origin HEAD:feat/studio-dashboard-next
