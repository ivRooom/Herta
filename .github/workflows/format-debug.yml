name: Format Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/studio/src/components/birthday-card-live-preview.tsx \
            apps/studio/src/lib/birthday-card-preview.ts
          git diff -- \
            apps/studio/src/components/birthday-card-live-preview.tsx \
            apps/studio/src/lib/birthday-card-preview.ts
          exit 1
