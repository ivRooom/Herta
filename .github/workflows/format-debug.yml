name: Format Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/api/birthday-card-presets/[asset]/route.ts' \
            'apps/studio/src/app/birthday/register/[guildId]/page.tsx' \
            apps/studio/src/components/birthday-registration-share.tsx \
            apps/studio/src/lib/auth-navigation.test.ts \
            apps/studio/src/lib/birthday-self-registration-core.ts
          git diff -- \
            'apps/studio/src/app/api/birthday-card-presets/[asset]/route.ts' \
            'apps/studio/src/app/birthday/register/[guildId]/page.tsx' \
            apps/studio/src/components/birthday-registration-share.tsx \
            apps/studio/src/lib/auth-navigation.test.ts \
            apps/studio/src/lib/birthday-self-registration-core.ts
