name: PR223 Format Debug

on:
  push:
    branches:
      - feature/message-studio-calendar

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/dashboard/guilds/[guildId]/daily-content/calendar/page.tsx' \
            apps/studio/src/components/message-studio-quick-send.tsx \
            apps/studio/src/lib/message-studio-calendar.ts
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/studio/src/app/dashboard/guilds/[guildId]/daily-content/calendar/page.tsx' \
            apps/studio/src/components/message-studio-quick-send.tsx \
            apps/studio/src/lib/message-studio-calendar.ts
          git commit -m 'style: PrettierでMessage Studio変更を整形'
          git push origin HEAD:feature/message-studio-calendar
