name: Temporary Studio Navigation Formatter

on:
  push:
    branches:
      - feat/studio-navigation-context-settings

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Studio navigation files
        run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/api/guilds/[guildId]/studio-navigation/route.ts' \
            'apps/studio/src/app/dashboard/settings/page.tsx' \
            'apps/studio/src/components/dashboard-nav.tsx' \
            'apps/studio/src/components/studio-navigation-context.tsx' \
            'apps/studio/src/components/studio-navigation-settings.tsx' \
            'apps/studio/src/lib/studio-navigation-config.test.ts' \
            'apps/studio/src/lib/studio-navigation-config.ts' \
            'apps/studio/src/lib/studio-selected-server-navigation.ts'
      - name: Upload formatted sources
        uses: actions/upload-artifact@v7.0.1
        with:
          name: studio-nav-prettier
          path: |
            apps/studio/src/app/api/guilds/[guildId]/studio-navigation/route.ts
            apps/studio/src/app/dashboard/settings/page.tsx
            apps/studio/src/components/dashboard-nav.tsx
            apps/studio/src/components/studio-navigation-context.tsx
            apps/studio/src/components/studio-navigation-settings.tsx
            apps/studio/src/lib/studio-navigation-config.test.ts
            apps/studio/src/lib/studio-navigation-config.ts
            apps/studio/src/lib/studio-selected-server-navigation.ts
          retention-days: 1
