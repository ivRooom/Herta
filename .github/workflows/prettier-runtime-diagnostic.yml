name: Prettier Runtime Diagnostic

on:
  pull_request:
    paths:
      - 'apps/studio/src/app/dashboard/plugins/operations/page.tsx'
      - 'apps/studio/src/lib/plugin-operations-core.ts'
      - '.github/workflows/prettier-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write apps/studio/src/app/dashboard/plugins/operations/page.tsx apps/studio/src/lib/plugin-operations-core.ts
      - name: Print Prettier diff
        run: git diff -- apps/studio/src/app/dashboard/plugins/operations/page.tsx apps/studio/src/lib/plugin-operations-core.ts
