name: VC Recap formatting inspection (temporary, non-secret)
on:
  pull_request:
    paths:
      - 'apps/bot/src/plugins/vc-recap.ts'
      - 'apps/bot/src/plugins/vc-recap-notice-before-capture.test.ts'
      - 'apps/bot/src/voice/vc-recap-session-manager.ts'
      - 'apps/bot/src/voice/vc-recap-pending-start.test.ts'
      - '.github/workflows/vc-recap-format-helper.yml'
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier formatting-only diff for Issue 760
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/bot/src/plugins/vc-recap.ts \
            apps/bot/src/plugins/vc-recap-notice-before-capture.test.ts \
            apps/bot/src/voice/vc-recap-session-manager.ts \
            apps/bot/src/voice/vc-recap-pending-start.test.ts
          git diff --no-ext-diff --unified=3 -- \
            apps/bot/src/plugins/vc-recap.ts \
            apps/bot/src/plugins/vc-recap-notice-before-capture.test.ts \
            apps/bot/src/voice/vc-recap-session-manager.ts \
            apps/bot/src/voice/vc-recap-pending-start.test.ts
