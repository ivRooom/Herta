name: Temporary Prettier Giveaway

on:
  push:
    branches: [tmp/prettier-giveaway-160]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/giveaway.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: formatted-giveaway
          path: apps/bot/src/plugins/giveaway.ts
