  context: MiniGamesRuntimeContext,
  interaction: ChatInputCommandInteraction,
): Promise<void> {
  if (!interaction.guildId) {
    await replyEphemeral(interaction, 'このコマンドはDiscordサーバー内でのみ利用できます。');
    return;
  }
  const config = normalizeMiniGamesConfig(context.config);
  if (!config.enabled) {
    await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');
    return;
  }
  const count = clamp(interaction.options.getInteger('count') ?? 1, 1, 10);
  const sides = clamp(interaction.options.getInteger('sides') ?? 6, 2, 100);
  const dice = rollDice(sides, count);
  const sixes = sides === 6 ? dice.filter((value) => value === 6).length : 0;
  await recordMetricsSafely(
    context,
    [
      ['minigame_plays', 1],
      ['dice_plays', 1],
      ...(sixes > 0 ? ([['dice_sixes', sixes]] as const) : []),
    ],
    interaction.user.id,
  );
  const total = dice.reduce((sum, value) => sum + value, 0);
  await interaction.reply({
    content: [
      '🎲 **Dice**',
      `<@${interaction.user.id}> — **${count}d${sides}**`,
      dice.map((value) => `\`${value}\``).join(' '),
      count > 1 ? `合計: **${total}**` : '',
    ]
      .filter(Boolean)
      .join('\n'),
    allowedMentions: { parse: [] },
  });
}

async function executeChinchiro(
  context: MiniGamesRuntimeContext,
  interaction: ChatInputCommandInteraction,
): Promise<void> {
  if (!interaction.guildId) {
    await replyEphemeral(interaction, 'このコマンドはDiscordサーバー内でのみ利用できます。');
    return;
  }
  const config = normalizeMiniGamesConfig(context.config);
  if (!config.enabled) {
    await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');
    return;
  }
  const player = rollChinchiroHand();
  const dealer = rollChinchiroHand();
  const outcome = compareChinchiroHands(player, dealer);
  const special = ['pinzoro', 'triple', 'shigoro'].includes(player.kind);
  await recordMetricsSafely(
    context,
    [
      ['minigame_plays', 1],
      ['chinchiro_plays', 1],
      ...(outcome === 'player-win'
        ? ([
            ['chinchiro_wins', 1],
            ['minigame_wins', 1],
          ] as const)
        : []),
      ...(special ? ([['chinchiro_specials', 1]] as const) : []),
    ],
    interaction.user.id,
  );
  const result =
    outcome === 'player-win'
      ? '🎉 **あなたの勝ち！**'
      : outcome === 'dealer-win'
        ? '😵 **Dealerの勝ち**'
        : '🤝 **引き分け**';
  await interaction.reply({
    content: [
      '🎋 **チンチロ**',
      `あなた: ${formatChinchiroHand(player)}`,
      `Dealer: ${formatChinchiroHand(dealer)}`,
      '',
      result,
    ].join('\n'),
    allowedMentions: { parse: [] },
  });
}

async function executeGameLeaderboard(
  context: MiniGamesRuntimeContext,
  interaction: ChatInputCommandInteraction,
): Promise<void> {
  if (!interaction.guildId) {
    await replyEphemeral(interaction, 'このコマンドはDiscordサーバー内でのみ利用できます。');
    return;
  }
  const config = normalizeMiniGamesConfig(context.config);
  if (!config.enabled || !config.statsEnabled || !config.leaderboardEnabled) {
    await replyEphemeral(interaction, 'Arcade Leaderboardは現在無効です。');
    return;
  }
  const requested = interaction.options.getString('metric') ?? 'minigame_wins';
  const metrics: readonly MiniGameLeaderboardMetric[] = [
    'minigame_wins',
    'minigame_plays',
    'coinflip_wins',
    'highlow_best_streak',
    'blackjack_wins',
    'chinchiro_wins',
  ];
  const metric: MiniGameLeaderboardMetric = metrics.includes(
    requested as MiniGameLeaderboardMetric,
  )
    ? (requested as MiniGameLeaderboardMetric)
    : 'minigame_wins';
  const limit = clamp(interaction.options.getInteger('limit') ?? 10, 5, 25);
  const records = await listMiniGameLeaderboard(context.prisma, interaction.guildId, metric, limit);
  const labels: Record<MiniGameLeaderboardMetric, string> = {
    minigame_wins: '総勝利',
    minigame_plays: '総プレイ',
    coinflip_wins: 'Coin Flip 的中',
    highlow_best_streak: 'High-Low 最高連勝',
    blackjack_wins: 'Blackjack 勝利',
    chinchiro_wins: 'チンチロ 勝利',
  };
  const lines = records.map(
    (record, index) => `${index + 1}. <@${record.userId}> — **${record.value.toLocaleString()}**`,
  );
  await interaction.reply({
    content: [
      `**🏆 Arcade Leaderboard — ${labels[metric]}**`,
      ...(lines.length > 0 ? lines : ['まだランキングデータがありません。']),
    ]
      .join('\n')
      .slice(0, 1990),
    allowedMentions: { parse: [] },
  });
}

