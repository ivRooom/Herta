name: Role Manager removal policy fix

on:
  push:
    branches:
      - feat/role-manager-v2-panels

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply removal policy fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/bot/src/plugins/role-manager.ts')
          text = path.read_text()
          old = '''  if (!config.allowSelfRemoval && addRoleIds.length === 0 && removeRoleIds.length > 0) {
            return rejected('このサーバーではSelf Roleの自己解除が無効です', group.id);
          }
          return accepted(addRoleIds, removeRoleIds, 'Role Panelの選択を反映します', group.id);'''
          new = '''  const isSingleReplacement =
            group.mode === 'single' && addRoleIds.length === 1 && removeRoleIds.length === 1;
          if (!config.allowSelfRemoval && removeRoleIds.length > 0 && !isSingleReplacement) {
            return rejected('このサーバーではSelf Roleの自己解除が無効です', group.id);
          }
          return accepted(addRoleIds, removeRoleIds, 'Role Panelの選択を反映します', group.id);'''
          if old not in text:
              raise SystemExit('policy block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('apps/bot/src/plugins/role-manager.test.ts')
          text = path.read_text()
          anchor = '''  it('自己解除無効時はPanelの全解除を拒否する', () => {
            const plan = planRoleGroupSelection(
              makeConfig({ allowSelfRemoval: false }),
              'color',
              ['100'],
              [],
            );
            expect(plan.accepted).toBe(false);
          });'''
          addition = anchor + '''

          it('自己解除無効時はmultipleの追加と解除を混在させても解除を拒否する', () => {
            const plan = planRoleGroupSelection(
              makeConfig({ allowSelfRemoval: false }),
              'color',
              ['100', '200'],
              ['300'],
            );
            expect(plan.accepted).toBe(false);
            expect(plan.removeRoleIds).toEqual([]);
          });

          it('自己解除無効でもsingleの1対1切替は許可する', () => {
            const config = makeConfig({ allowSelfRemoval: false, groups: [makeSingleGroup()] });
            const plan = planRoleGroupSelection(config, 'platform', ['100'], ['200']);
            expect(plan.accepted).toBe(true);
            expect(plan.addRoleIds).toEqual(['200']);
            expect(plan.removeRoleIds).toEqual(['100']);
          });'''
          if anchor not in text:
              raise SystemExit('test anchor not found')
          path.write_text(text.replace(anchor, addition, 1))
          PY
          pnpm exec prettier --write apps/bot/src/plugins/role-manager.ts apps/bot/src/plugins/role-manager.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/role-manager.ts apps/bot/src/plugins/role-manager.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Role Panelの自己解除ポリシーを厳格化する"
          git push
