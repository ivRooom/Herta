name: Moderation Format Fix

on:
  push:
    branches:
      - feat/moderation-case-management

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-case-management
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo 'Formatting changes are not required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'style: Moderation Plugin v1の実装を整形'
          git push origin HEAD:feat/moderation-case-management
