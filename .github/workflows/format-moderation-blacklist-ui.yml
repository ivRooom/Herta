name: Format moderation blacklist UI

on:
  push:
    branches:
      - feat/moderation-enforcement
    paths:
      - .github/workflows/format-moderation-blacklist-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-enforcement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/dashboard/guilds/[guildId]/moderation/blacklist/page.tsx' \
            apps/studio/src/components/moderation-blacklist-toggle.tsx
      - run: |
          rm -f .github/workflows/format-moderation-blacklist-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: ブラックリスト管理UIを整形"
          git push origin HEAD:feat/moderation-enforcement
