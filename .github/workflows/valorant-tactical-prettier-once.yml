name: VALORANT tactical one-time source formatter
on:
  push:
    branches: [feat/valorant-evidence-aware-compositions-20261030]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/valorant-evidence-aware-compositions-20261030
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format files, remove temporary workflow, commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/bot/src/plugins/valorant-maps.ts apps/bot/src/plugins/valorant-maps.test.ts apps/bot/src/plugins/valorant.ts docs/VALORANT_RANDOM.md
          git rm .github/workflows/valorant-tactical-prettier-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(valorant): format tactical composition additions'
          git push origin HEAD:feat/valorant-evidence-aware-compositions-20261030
