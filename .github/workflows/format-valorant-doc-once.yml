name: Format VALORANT docs once
on:
  push:
    branches:
      - codex/valorant-pick-cards-20261031
    paths:
      - .github/workflows/format-valorant-doc-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format docs and remove temporary workflow
        run: |
          pnpm exec prettier --write docs/VALORANT_RANDOM.md
          rm .github/workflows/format-valorant-doc-once.yml
          git add -- docs/VALORANT_RANDOM.md .github/workflows/format-valorant-doc-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(valorant): format card documentation'
          git push origin HEAD:codex/valorant-pick-cards-20261031
