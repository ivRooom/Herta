name: Temporary finalize moderation detection history

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/moderation-detection-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-detection-history
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply final consistency updates
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          root_package_path = Path('package.json')
          root_package = json.loads(root_package_path.read_text())
          scripts = root_package['scripts']
          rebuilt_scripts = {}
          for key, value in scripts.items():
              rebuilt_scripts[key] = value
              if key == 'db:migrate':
                  rebuilt_scripts['db:migrate:deploy'] = 'dotenv -- pnpm --filter @herta/db migrate:deploy'
          root_package['scripts'] = rebuilt_scripts
          root_package_path.write_text(json.dumps(root_package, ensure_ascii=False, indent=2) + '\n')

          plugin_package_path = Path('plugins/moderation/package.json')
          plugin_package = json.loads(plugin_package_path.read_text())
          plugin_package['version'] = '2.1.0'
          plugin_package_path.write_text(json.dumps(plugin_package, ensure_ascii=False, indent=2) + '\n')

          manifest_path = Path('plugins/moderation/src/manifest.ts')
          manifest = manifest_path.read_text()
          manifest = manifest.replace("version: '2.0.0'", "version: '2.1.0'", 1)
          manifest_path.write_text(manifest)

          schema_path = Path('packages/db/prisma/schema.prisma')
          schema = schema_path.read_text()
          if 'moderationDetections ModerationDetectionEvent[]' not in schema:
              schema = schema.replace(
                  '  rules        Rule[]\n',
                  '  rules                Rule[]\n  moderationDetections ModerationDetectionEvent[]\n',
                  1,
              )
          relation = '  guild Guild @relation(fields: [guildId], references: [id], onDelete: Cascade)\n\n'
          marker = '  @@index([guildId, occurredAt(sort: Desc)])\n'
          if relation not in schema:
              schema = schema.replace(marker, relation + marker, 1)
          schema_path.write_text(schema)
          PY

          pnpm --filter @herta/db exec prisma format
          pnpm format

          if git diff --quiet; then
            echo "No final changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: Moderation検知履歴の運用整合性を調整"
          git push origin HEAD:feat/moderation-detection-history
