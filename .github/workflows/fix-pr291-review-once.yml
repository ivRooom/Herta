name: Fix PR291 review findings once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-pr291-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/birthday-card-member-preview' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply focused review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new))
                  return
              if new not in text:
                  raise SystemExit(f'expected snippet not found in {path}')

          route = 'apps/studio/src/app/api/guilds/[guildId]/birthday/member-preview/route.ts'
          replace(
              route,
              """  const registration = await getBirthdayRegistration(guildId, userId);\n  const currentYear = new Date().getUTCFullYear();\n""",
              """  const registration = await getBirthdayRegistration(guildId, userId);\n  const now = new Date();\n  const currentYear = now.getUTCFullYear();\n  const currentMonth = now.getUTCMonth() + 1;\n  const currentDay = now.getUTCDate();\n  const birthdayPassed =\n    registration !== null &&\n    (currentMonth > registration.month ||\n      (currentMonth === registration.month && currentDay >= registration.day));\n""",
          )
          replace(
              route,
              """                  : Math.max(0, currentYear - registration.birthYear),\n""",
              """                  : Math.max(\n                      0,\n                      currentYear - registration.birthYear - (birthdayPassed ? 0 : 1),\n                    ),\n""",
          )

          picker = 'apps/studio/src/components/birthday-card-member-picker.tsx'
          replace(
              picker,
              """    const controller = new AbortController();\n    const debounce = window.setTimeout(() => {\n      const timeout = window.setTimeout(() => controller.abort(), SEARCH_TIMEOUT_MS);\n      setLoading(true);\n      setError('');\n\n      const endpoint = new URL(`/api/guilds/${guildId}/discord/members`, window.location.origin);\n      endpoint.searchParams.set('query', normalizedQuery);\n      endpoint.searchParams.set('limit', '12');\n      void fetch(endpoint, { cache: 'no-store', signal: controller.signal })\n        .then(async (response) => {\n          const payload = (await response.json().catch(() => null)) as {\n            error?: unknown;\n            members?: GuildMemberOption[];\n          } | null;\n          if (!response.ok || !Array.isArray(payload?.members)) {\n            throw new Error(\n              typeof payload?.error === 'string'\n                ? payload.error\n                : 'Discordメンバーを検索できませんでした',\n            );\n          }\n          setOptions(payload.members.filter((member) => !member.bot));\n        })\n        .catch((cause: unknown) => {\n          if (cause instanceof Error && cause.name === 'AbortError') return;\n          setOptions([]);\n          setError(\n            cause instanceof Error ? cause.message : 'Discordメンバーを検索できませんでした',\n          );\n        })\n        .finally(() => {\n          window.clearTimeout(timeout);\n          if (!controller.signal.aborted) setLoading(false);\n        });\n    }, SEARCH_DEBOUNCE_MS);\n\n    return () => {\n      window.clearTimeout(debounce);\n      controller.abort();\n    };\n""",
              """    const controller = new AbortController();\n    let cancelled = false;\n    let timedOut = false;\n    let requestTimeout: number | undefined;\n    setOptions([]);\n    setLoading(true);\n    setError('');\n\n    const debounce = window.setTimeout(() => {\n      requestTimeout = window.setTimeout(() => {\n        timedOut = true;\n        controller.abort();\n      }, SEARCH_TIMEOUT_MS);\n\n      const endpoint = new URL(`/api/guilds/${guildId}/discord/members`, window.location.origin);\n      endpoint.searchParams.set('query', normalizedQuery);\n      endpoint.searchParams.set('limit', '12');\n      void fetch(endpoint, { cache: 'no-store', signal: controller.signal })\n        .then(async (response) => {\n          const payload = (await response.json().catch(() => null)) as {\n            error?: unknown;\n            members?: GuildMemberOption[];\n          } | null;\n          if (cancelled) return;\n          if (!response.ok || !Array.isArray(payload?.members)) {\n            throw new Error(\n              typeof payload?.error === 'string'\n                ? payload.error\n                : 'Discordメンバーを検索できませんでした',\n            );\n          }\n          setOptions(payload.members.filter((member) => !member.bot));\n        })\n        .catch((cause: unknown) => {\n          if (cancelled) return;\n          if (cause instanceof Error && cause.name === 'AbortError') {\n            if (!timedOut) return;\n            setOptions([]);\n            setError('Discordメンバー検索がタイムアウトしました。再試行してください');\n            return;\n          }\n          setOptions([]);\n          setError(\n            cause instanceof Error ? cause.message : 'Discordメンバーを検索できませんでした',\n          );\n        })\n        .finally(() => {\n          if (requestTimeout !== undefined) window.clearTimeout(requestTimeout);\n          if (!cancelled) setLoading(false);\n        });\n    }, SEARCH_DEBOUNCE_MS);\n\n    return () => {\n      cancelled = true;\n      window.clearTimeout(debounce);\n      if (requestTimeout !== undefined) window.clearTimeout(requestTimeout);\n      controller.abort();\n    };\n""",
          )
          replace(
              picker,
              """  if (value) {\n""",
              """  const listboxVisible = canSearch && !loading && !error && options.length > 0;\n  const emptyStateVisible = canSearch && !loading && !error && options.length === 0;\n\n  if (value) {\n""",
          )
          replace(
              picker,
              """          type=\"search\"\n          value={query}\n          disabled={disabled}\n          onChange={(event) => setQuery(event.target.value)}\n          placeholder=\"表示名・ユーザー名・Discord IDを検索\"\n          aria-controls={canSearch ? listboxId : undefined}\n          aria-expanded={canSearch}\n          aria-autocomplete=\"list\"\n""",
              """          type=\"search\"\n          role=\"combobox\"\n          value={query}\n          disabled={disabled}\n          onChange={(event) => setQuery(event.target.value)}\n          placeholder=\"表示名・ユーザー名・Discord IDを検索\"\n          aria-controls={listboxVisible ? listboxId : undefined}\n          aria-expanded={listboxVisible}\n          aria-autocomplete=\"list\"\n""",
          )
          replace(
              picker,
              """      {canSearch && !loading && !error ? (\n        <div\n          id={listboxId}\n          role=\"listbox\"\n          aria-label=\"Birthday Cardプレビューメンバー候補\"\n          className=\"max-h-64 overflow-y-auto rounded-xl border border-border bg-surface p-1\"\n        >\n          {options.length === 0 ? (\n            <p className=\"px-3 py-4 text-center text-xs text-muted\">\n              一致するDiscordメンバーが見つかりません。\n            </p>\n          ) : (\n            options.map((member) => (\n              <button\n                key={member.id}\n                type=\"button\"\n                role=\"option\"\n                aria-selected=\"false\"\n                onClick={() => {\n                  onChange(member);\n                  setQuery('');\n                  setOptions([]);\n                }}\n                className=\"flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition-colors hover:bg-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary\"\n              >\n                <span className=\"flex h-8 w-8 shrink-0 items-center justify-center overflow-hidden rounded-full border border-border bg-background\">\n                  {member.avatarUrl ? (\n                    <img src={member.avatarUrl} alt=\"\" className=\"h-full w-full object-cover\" />\n                  ) : (\n                    <UserRound className=\"h-4 w-4 text-muted\" aria-hidden=\"true\" />\n                  )}\n                </span>\n                <span className=\"min-w-0 flex-1\">\n                  <span className=\"block truncate text-sm font-medium\">{member.displayName}</span>\n                  <span className=\"block truncate text-xs text-muted\">@{member.username}</span>\n                </span>\n                <Check className=\"h-4 w-4 text-primary opacity-0\" aria-hidden=\"true\" />\n              </button>\n            ))\n          )}\n        </div>\n      ) : null}\n""",
              """      {emptyStateVisible ? (\n        <p className=\"rounded-xl border border-border bg-surface px-3 py-4 text-center text-xs text-muted\">\n          一致するDiscordメンバーが見つかりません。\n        </p>\n      ) : null}\n      {listboxVisible ? (\n        <div\n          id={listboxId}\n          role=\"listbox\"\n          aria-label=\"Birthday Cardプレビューメンバー候補\"\n          className=\"max-h-64 overflow-y-auto rounded-xl border border-border bg-surface p-1\"\n        >\n          {options.map((member) => (\n            <button\n              key={member.id}\n              type=\"button\"\n              role=\"option\"\n              aria-selected=\"false\"\n              onClick={() => {\n                onChange(member);\n                setQuery('');\n                setOptions([]);\n              }}\n              className=\"flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition-colors hover:bg-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary\"\n            >\n              <span className=\"flex h-8 w-8 shrink-0 items-center justify-center overflow-hidden rounded-full border border-border bg-background\">\n                {member.avatarUrl ? (\n                  <img src={member.avatarUrl} alt=\"\" className=\"h-full w-full object-cover\" />\n                ) : (\n                  <UserRound className=\"h-4 w-4 text-muted\" aria-hidden=\"true\" />\n                )}\n              </span>\n              <span className=\"min-w-0 flex-1\">\n                <span className=\"block truncate text-sm font-medium\">{member.displayName}</span>\n                <span className=\"block truncate text-xs text-muted\">@{member.username}</span>\n              </span>\n              <Check className=\"h-4 w-4 text-primary opacity-0\" aria-hidden=\"true\" />\n            </button>\n          ))}\n        </div>\n      ) : null}\n""",
          )

          preview = 'apps/studio/src/components/birthday-card-live-preview.tsx'
          replace(
              preview,
              """type ResizeKind = 'avatar' | 'text';\n""",
              """type ResizeKind = 'avatar' | 'text';\n\nconst MEMBER_PREVIEW_TIMEOUT_MS = 12_000;\n""",
          )
          replace(
              preview,
              """    const controller = new AbortController();\n    setResolvedMember(null);\n    setMemberPending(true);\n    setMemberStatus(`${selectedMember.displayName} の誕生日情報を確認中…`);\n\n    const endpoint = new URL(\n      `/api/guilds/${guildId}/birthday/member-preview`,\n      window.location.origin,\n    );\n    endpoint.searchParams.set('userId', selectedMember.id);\n    void fetch(endpoint, { cache: 'no-store', signal: controller.signal })\n      .then(async (response) => {\n        const payload = (await response.json().catch(() => null)) as {\n          error?: unknown;\n          member?: BirthdayCardPreviewMember;\n        } | null;\n        if (!response.ok || !payload?.member) {\n          throw new Error(\n            typeof payload?.error === 'string'\n              ? payload.error\n              : '実メンバーのBirthday情報を取得できませんでした',\n          );\n        }\n        setResolvedMember(payload.member);\n        setMemberStatus(\n          payload.member.birthday\n            ? `${payload.member.displayName} の登録済み誕生日をプレビューしています`\n            : `${payload.member.displayName} は誕生日未登録です`,\n        );\n      })\n      .catch((cause: unknown) => {\n        if (cause instanceof Error && cause.name === 'AbortError') return;\n        setResolvedMember(null);\n        setMemberStatus(\n          cause instanceof Error ? cause.message : '実メンバーのBirthday情報を取得できませんでした',\n        );\n      })\n      .finally(() => {\n        if (!controller.signal.aborted) setMemberPending(false);\n      });\n\n    return () => controller.abort();\n""",
              """    const controller = new AbortController();\n    let cancelled = false;\n    let timedOut = false;\n    const timeout = window.setTimeout(() => {\n      timedOut = true;\n      controller.abort();\n    }, MEMBER_PREVIEW_TIMEOUT_MS);\n    setResolvedMember(null);\n    setMemberPending(true);\n    setMemberStatus(`${selectedMember.displayName} の誕生日情報を確認中…`);\n\n    const endpoint = new URL(\n      `/api/guilds/${guildId}/birthday/member-preview`,\n      window.location.origin,\n    );\n    endpoint.searchParams.set('userId', selectedMember.id);\n    void fetch(endpoint, { cache: 'no-store', signal: controller.signal })\n      .then(async (response) => {\n        const payload = (await response.json().catch(() => null)) as {\n          error?: unknown;\n          member?: BirthdayCardPreviewMember;\n        } | null;\n        if (cancelled) return;\n        if (!response.ok || !payload?.member) {\n          throw new Error(\n            typeof payload?.error === 'string'\n              ? payload.error\n              : '実メンバーのBirthday情報を取得できませんでした',\n          );\n        }\n        setResolvedMember(payload.member);\n        setMemberStatus(\n          payload.member.birthday\n            ? `${payload.member.displayName} の登録済み誕生日をプレビューしています`\n            : `${payload.member.displayName} は誕生日未登録です`,\n        );\n      })\n      .catch((cause: unknown) => {\n        if (cancelled) return;\n        if (cause instanceof Error && cause.name === 'AbortError' && !timedOut) return;\n        setResolvedMember(null);\n        setMemberStatus(\n          timedOut\n            ? '実メンバーのBirthday情報取得がタイムアウトしました。再試行してください'\n            : cause instanceof Error\n              ? cause.message\n              : '実メンバーのBirthday情報を取得できませんでした',\n        );\n      })\n      .finally(() => {\n        window.clearTimeout(timeout);\n        if (!cancelled) setMemberPending(false);\n      });\n\n    return () => {\n      cancelled = true;\n      window.clearTimeout(timeout);\n      controller.abort();\n    };\n""",
          )
          replace(
              preview,
              """  if (words.length >= 2) {\n    return `${words[0]?.[0] ?? ''}${words[1]?.[0] ?? ''}`.toLocaleUpperCase('ja');\n  }\n  return normalized.slice(0, 2).toLocaleUpperCase('ja');\n""",
              """  if (words.length >= 2) {\n    const first = Array.from(words[0] ?? '')[0] ?? '';\n    const second = Array.from(words[1] ?? '')[0] ?? '';\n    return `${first}${second}`.toLocaleUpperCase('ja');\n  }\n  return Array.from(normalized).slice(0, 2).join('').toLocaleUpperCase('ja');\n""",
          )
          PY

          pnpm exec prettier --write \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/member-preview/route.ts' \
            apps/studio/src/components/birthday-card-member-picker.tsx \
            apps/studio/src/components/birthday-card-live-preview.tsx

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Review findings are already fixed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/member-preview/route.ts' \
            apps/studio/src/components/birthday-card-member-picker.tsx \
            apps/studio/src/components/birthday-card-live-preview.tsx
          git commit -m 'fix(birthday): address member preview review findings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
