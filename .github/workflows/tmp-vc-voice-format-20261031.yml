name: Temporary VC Voice Prettier
on:
  push:
    branches:
      - feat/vc-recap-pluggable-whisper-gpt-transcribe-20261031
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[voice-format-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/bot/src/voice/vc-recap-session-manager.ts" "apps/bot/src/voice/vc-recap-transcriber-config.ts" "apps/bot/src/voice/vc-recap-openai-file-transcriber.ts" "apps/bot/src/voice/vc-recap-openai-file-transcriber.test.ts" "apps/bot/src/voice/vc-recap-openai-audio-consent.ts" "apps/bot/src/voice/vc-recap-openai-audio-consent.test.ts"
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "apps/bot/src/voice/vc-recap-session-manager.ts" "apps/bot/src/voice/vc-recap-transcriber-config.ts" "apps/bot/src/voice/vc-recap-openai-file-transcriber.ts" "apps/bot/src/voice/vc-recap-openai-file-transcriber.test.ts" "apps/bot/src/voice/vc-recap-openai-audio-consent.ts" "apps/bot/src/voice/vc-recap-openai-audio-consent.test.ts"
            git commit -m "style(vc): format voice changes [voice-format-skip]"
            git push origin HEAD:feat/vc-recap-pluggable-whisper-gpt-transcribe-20261031
          fi
