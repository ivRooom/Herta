name: Temporary VC Voice Prettier
on:
  push:
    branches:
      - feat/vc-recap-explicit-consent-schema-20261030
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[voice-format-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/bot/src/commands/privacy.ts" "apps/bot/src/commands/privacy.test.ts" "packages/db/src/vc-recap-explicit-consent.ts" "packages/db/src/vc-recap-explicit-consent.test.ts" "packages/db/src/vc-recap-retention.test.ts" "apps/studio/src/lib/vc-recap-consent-admin.test.ts" "packages/db/src/user-data-consent.ts"
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "apps/bot/src/commands/privacy.ts" "apps/bot/src/commands/privacy.test.ts" "packages/db/src/vc-recap-explicit-consent.ts" "packages/db/src/vc-recap-explicit-consent.test.ts" "packages/db/src/vc-recap-retention.test.ts" "apps/studio/src/lib/vc-recap-consent-admin.test.ts" "packages/db/src/user-data-consent.ts"
            git commit -m "style(vc): format voice changes [voice-format-skip]"
            git push origin HEAD:feat/vc-recap-explicit-consent-schema-20261030
          fi
