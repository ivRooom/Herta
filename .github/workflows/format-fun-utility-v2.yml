name: Format Fun Utility v2

on:
  push:
    branches:
      - feat/fun-utility-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format files
        run: |
          pnpm exec prettier --write apps/bot/src/commands/fun-utility.ts apps/bot/src/commands/fun-utility.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/commands/fun-utility.ts apps/bot/src/commands/fun-utility.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fun Utility v2のコードを整形する"
          git push
