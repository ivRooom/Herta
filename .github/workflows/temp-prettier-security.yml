name: Temporary Prettier CI Formatter
on:
  push:
    branches: [security/pin-node-22-23-4-runtime-20261030]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print formatted workflow for review
        run: |
          pnpm exec prettier --write .github/workflows/ci.yml
          echo ===FORMATTED_CI_BEGIN===
          cat .github/workflows/ci.yml
          echo ===FORMATTED_CI_END===
