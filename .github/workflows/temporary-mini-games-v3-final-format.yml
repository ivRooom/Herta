name: Temporary Mini Games v3 final format

on:
  push:
    branches:
      - feature/mini-games-v3-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v3-final
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/bot/src/plugins/mini-games-repository.ts
          apps/bot/src/plugins/mini-games-stats.ts
          apps/bot/src/plugins/mini-games-stats.test.ts
          apps/bot/src/plugins/mini-games-v3-core.ts
          apps/bot/src/plugins/mini-games-v3-core.test.ts
          apps/bot/src/plugins/mini-games-v3.ts
          apps/bot/src/plugins/mini-games-v3.test.ts
          apps/bot/src/plugins/mini-games-v3-config.test.ts
          apps/bot/src/plugins/mini-games.ts
          apps/bot/src/plugins/mini-games.test.ts
          packages/plugin-catalog/src/manifests/mini-games.ts
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/temporary-mini-games-v3-final-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins packages/plugin-catalog/src/manifests .github/workflows
          git commit -m "Mini Games v3最終差分を整形する"
          git push origin HEAD:feature/mini-games-v3-final
