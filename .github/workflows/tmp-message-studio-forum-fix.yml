name: Temporary Message Studio Forum Fix

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Forum crosspost handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/worker/src/daily-content.ts')
          text = path.read_text()
          old = """  if (FORUM_CHANNEL_TYPES.has(channel.type)) {
            return publishDiscordForumPost(input);
          }
"""
          new = """  if (FORUM_CHANNEL_TYPES.has(channel.type)) {
            if (input.publishAnnouncement) {
              throw new DailyContentPublishError('DailyContentCrosspostUnsupportedForForum', 400);
            }
            return publishDiscordForumPost(input);
          }
"""
          if old not in text:
              raise SystemExit('forum branch pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm db:generate
      - run: pnpm exec prettier --write apps/worker/src/daily-content.ts apps/studio/src/lib/message-studio-request.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/daily-content.ts apps/studio/src/lib/message-studio-request.ts
          git commit -m 'Message StudioのForum Crosspost制約を明示する'
          git push origin HEAD:feat/message-studio-v2
