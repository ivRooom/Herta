name: VALORANT PR 791 test format one-shot
on:
  push:
    branches: [feat/valorant-expired-embed-reconcile-779]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/bot/src/plugins/valorant-expiry-reconcile.test.ts
          pnpm exec prettier --check apps/bot/src/plugins/valorant-expiry-reconcile.test.ts
          git diff -- apps/bot/src/plugins/valorant-expiry-reconcile.test.ts
      - name: Push only test formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/valorant-expiry-reconcile.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(valorant): normalize expiry test formatting (#779)"
            git push origin HEAD:refs/heads/feat/valorant-expired-embed-reconcile-779
          fi
