name: Verify Discord Visual Kit Rollout

on:
  push:
    branches:
      - feat/discord-visual-kit
    paths:
      - .github/workflows/verify-discord-visual-kit-rollout.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/discord-visual-kit
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Sync lockfile and install
        run: pnpm install --no-frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/discord-ui/package.json \
            packages/discord-ui/tsconfig.json \
            packages/discord-ui/src/index.ts \
            packages/discord-ui/src/index.test.ts \
            plugins/moderation/package.json \
            plugins/moderation/src/discord-ui.ts \
            plugins/lfg/package.json \
            plugins/lfg/src/presentation.ts \
            plugins/lfg/src/presentation.test.ts \
            plugins/team-split/package.json \
            plugins/team-split/src/presentation.ts \
            plugins/team-split/src/presentation.test.ts \
            'apps/studio/src/app/api/discord-assets/[plugin]/[variant]/route.tsx'

      - name: Verify shared package and migrated plugins
        run: |
          pnpm --filter @herta/discord-ui typecheck
          pnpm --filter @herta/discord-ui test
          pnpm --filter @herta/discord-ui build
          pnpm --filter @herta/plugin-moderation typecheck
          pnpm --filter @herta/plugin-moderation test
          pnpm --filter @herta/plugin-lfg typecheck
          pnpm --filter @herta/plugin-lfg test
          pnpm --filter @herta/plugin-lfg build
          pnpm --filter @herta/plugin-team-split typecheck
          pnpm --filter @herta/plugin-team-split test
          pnpm --filter @herta/plugin-team-split build

      - name: Remove temporary workflow
        run: rm -f .github/workflows/verify-discord-visual-kit-rollout.yml

      - name: Commit verified rollout
        run: |
          git config user.name 'mizzz-ivr'
          git config user.email '86910433+mizzz-ivr@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: Discord Visual KitをLFGとTeam Splitへ展開'
          git push origin HEAD:feat/discord-visual-kit
