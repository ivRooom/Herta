name: Temporary Dashboard Layout Format

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-server-context-bot-profile
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/studio/src/app/dashboard/layout.tsx
      - name: Commit formatted file
        shell: bash
        run: |
          git config user.name "mizzz-ivr"
          git config user.email "86910433+mizzz-ivr@users.noreply.github.com"
          git add apps/studio/src/app/dashboard/layout.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "Dashboard LayoutをPrettier整形"
          git fetch origin feature/studio-server-context-bot-profile
          git rebase origin/feature/studio-server-context-bot-profile
          git push origin HEAD:feature/studio-server-context-bot-profile
