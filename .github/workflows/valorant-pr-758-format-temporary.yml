# One-shot formatter for #763. Remove from the PR after the formatting commit.
name: VALORANT #763 formatting (temporary)
on:
  push:
    branches: [feat/valorant-vc-participant-management-753]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/valorant.ts apps/bot/src/plugins/valorant-session-repository.ts apps/bot/src/plugins/valorant-session-repository.test.ts apps/bot/src/plugins/valorant-management.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/bot/src/plugins/valorant.ts apps/bot/src/plugins/valorant-session-repository.ts apps/bot/src/plugins/valorant-session-repository.test.ts apps/bot/src/plugins/valorant-management.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(valorant): format #763 confirmation and tests"
            git push origin HEAD:refs/heads/feat/valorant-vc-participant-management-753
          fi
