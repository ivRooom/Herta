# Temporary one-shot workflow for formatting PR #758. Remove before merge.
name: VALORANT PR 758 formatting (temporary)
on:
  push:
    branches:
      - feat/valorant-vc-participant-management-753
permissions:
  contents: write
concurrency:
  group: valorant-pr-758-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only PR files
        run: |
          pnpm exec prettier --write \
            apps/bot/src/plugins/valorant-meta.ts \
            apps/bot/src/plugins/valorant-session-repository.integration.test.ts \
            apps/bot/src/plugins/valorant-session-repository.test.ts \
            apps/bot/src/plugins/valorant-session-repository.ts \
            apps/bot/src/plugins/valorant.test.ts \
            apps/bot/src/plugins/valorant.ts \
            docs/VALORANT_PARTICIPANTS_20261103.md
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/bot/src/plugins/valorant-meta.ts \
            apps/bot/src/plugins/valorant-session-repository.integration.test.ts \
            apps/bot/src/plugins/valorant-session-repository.test.ts \
            apps/bot/src/plugins/valorant-session-repository.ts \
            apps/bot/src/plugins/valorant.test.ts \
            apps/bot/src/plugins/valorant.ts \
            docs/VALORANT_PARTICIPANTS_20261103.md
          if ! git diff --cached --quiet; then
            git commit -m "style(valorant): apply Prettier to PR #758 changes"
            git push origin HEAD:refs/heads/feat/valorant-vc-participant-management-753
          fi
