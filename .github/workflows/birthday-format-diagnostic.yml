name: Birthday format diagnostic

on:
  push:
    branches:
      - feat/birthday-role-v1

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          pnpm exec prettier --write apps/bot/src/plugins/birthday-role.ts
          if git diff --quiet -- apps/bot/src/plugins/birthday-role.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/birthday-role.ts
          git commit -m "Birthday Roleのフォーマットを整える"
          git push
