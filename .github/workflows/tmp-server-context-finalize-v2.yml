name: Temporary Server Context Finalize V2

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-server-context-bot-profile
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final targeted patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              if old not in content:
                  raise RuntimeError(f'pattern not found: {path}: {old[:120]!r}')
              target.write_text(content.replace(old, new, 1))

          bot = 'apps/bot/src/bot.ts'
          replace_once(
              bot,
              "  BOT_PRESENCE_CONFIG_KEY,\n  DEFAULT_BOT_PRESENCE_CONFIG,\n  HERTA_WORKER_HEARTBEAT_KEY,\n  normalizeBotPresenceConfig,\n  type BotPresenceConfig,",
              "  DEFAULT_BOT_PRESENCE_CONFIG,\n  HERTA_WORKER_HEARTBEAT_KEY,\n  type BotPresenceConfig,",
          )
          replace_once(
              bot,
              "import { BotPresenceEventSubscriber } from './presence/runtime-events.js';",
              "import { BotPresenceEventSubscriber } from './presence/runtime-events.js';\nimport { loadStoredBotPresence } from './presence/store.js';",
          )
          replace_once(
              bot,
              "    await this.client.login(token);\n    this.applyBotPresence(DEFAULT_BOT_PRESENCE_CONFIG);\n\n    this.discordHealth.observe(this.client);",
              "    await this.client.login(token);\n    this.applyBotPresence(DEFAULT_BOT_PRESENCE_CONFIG);\n    try {\n      this.applyBotPresence(await loadStoredBotPresence(this.prisma));\n    } catch (error) {\n      this.logger.warn({ err: error }, '保存済みBot Presence設定のDB読み込みに失敗しました');\n    }\n\n    this.discordHealth.observe(this.client);",
          )
          replace_once(
              bot,
              "\n    try {\n      const storedPresence = await this.healthRedis.get(BOT_PRESENCE_CONFIG_KEY);\n      if (storedPresence) {\n        this.applyBotPresence(normalizeBotPresenceConfig(JSON.parse(storedPresence) as unknown));\n      }\n    } catch (error) {\n      this.logger.warn({ err: error }, '保存済みBot Presence設定の読み込みに失敗しました');\n    }\n",
              "\n",
          )

          nav = 'apps/studio/src/components/guild-context-nav.tsx'
          replace_once(
              nav,
              "  const [preferenceMessage, setPreferenceMessage] = useState<string | null>(null);",
              "  const [preferenceMessage, setPreferenceMessage] = useState<string | null>(null);\n  const [preferenceSaving, setPreferenceSaving] = useState(false);",
          )
          replace_once(
              nav,
              "  function handleDefaultToggle() {\n    if (!selectedGuild) return;\n    const nextDefaultGuildId = defaultGuildId === selectedGuild.id ? null : selectedGuild.id;\n    const saved = setDefaultGuild(nextDefaultGuildId);\n    setPreferenceMessage(\n      saved\n        ? nextDefaultGuildId\n          ? 'このサーバーをデフォルトに設定しました'\n          : 'デフォルトサーバーを解除しました'\n        : 'ブラウザ設定へ保存できませんでした',\n    );\n  }",
              "  async function handleDefaultToggle() {\n    if (!selectedGuild || preferenceSaving) return;\n    const nextDefaultGuildId = defaultGuildId === selectedGuild.id ? null : selectedGuild.id;\n    setPreferenceSaving(true);\n    setPreferenceMessage(null);\n    try {\n      const saved = await setDefaultGuild(nextDefaultGuildId);\n      setPreferenceMessage(\n        saved\n          ? nextDefaultGuildId\n            ? 'このサーバーをデフォルトに設定しました'\n            : 'デフォルトサーバーを解除しました'\n          : 'デフォルトサーバーを保存できませんでした',\n      );\n    } finally {\n      setPreferenceSaving(false);\n    }\n  }",
          )
          replace_once(
              nav,
              "                    onClick={handleDefaultToggle}\n                    className=",
              "                    onClick={() => void handleDefaultToggle()}\n                    disabled={preferenceSaving}\n                    className=",
          )

          profile = 'apps/studio/src/components/bot-profile-settings.tsx'
          replace_once(
              profile,
              "Redisへ接続できないため現在はデフォルト表示です。接続復旧後に保存してください。",
              "設定データベースへ接続できないため現在はデフォルト表示です。接続復旧後に保存してください。",
          )
          PY
      - name: Format changed source files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.ts' '*.tsx' '*.json' \
            | xargs -r pnpm exec prettier --write
      - name: Commit and push latest branch
        shell: bash
        run: |
          git rm .github/workflows/tmp-server-context-finalize-v2.yml
          git config user.name "mizzz-ivr"
          git config user.email "86910433+mizzz-ivr@users.noreply.github.com"
          git add -A
          git commit -m "Selected ServerとBotプロフィール実装を仕上げ"
          git fetch origin feature/studio-server-context-bot-profile
          git rebase origin/feature/studio-server-context-bot-profile
          git push origin HEAD:feature/studio-server-context-bot-profile
