name: Temporary Birthday Asset Review Fixes

on:
  push:
    branches:
      - feat/birthday-card-asset-library

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/birthday-card-asset-library
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Apply focused review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          editor = "apps/studio/src/components/birthday-card-editor.tsx"
          replace(
              editor,
              """  const selectedDraftAsset = config.birthdayCardAssetId
            ? (assets.find((asset) => asset.id === config.birthdayCardAssetId) ?? null)
            : null;
          """,
              """  const selectedDraftAsset =
            config.birthdayCardBackgroundSource === 'asset' && config.birthdayCardAssetId
              ? (assets.find((asset) => asset.id === config.birthdayCardAssetId) ?? null)
              : null;
          """,
          )
          replace(
              editor,
              """    if (!canWriteAssets || interactionPending || asset.id === config.birthdayCardAssetId) return;
          """,
              """    if (
              !canWriteAssets ||
              interactionPending ||
              (config.birthdayCardBackgroundSource === 'asset' &&
                asset.id === config.birthdayCardAssetId)
            )
              return;
          """,
          )

          route = "apps/studio/src/app/api/guilds/[guildId]/birthday/card-assets/[assetId]/route.ts"
          replace(
              route,
              """  if (hasPreset) {
            const presetAccess = await authorizeBirthdayStudioPermission(
              guildId,
              session.user.id,
              'studio.settings.write',
              studioBirthdayResource(guildId, 'card-presets'),
            );
            if (!presetAccess.ok) return presetAccess.response;
          }

          const before = await getBirthdayCardAssetMetadata(prisma, guildId, assetId);
          """,
              """  if (hasPreset) {
            const presetAccess = await authorizeBirthdayStudioPermission(
              guildId,
              session.user.id,
              'studio.settings.write',
              studioBirthdayResource(guildId, 'card-presets'),
            );
            if (!presetAccess.ok) return presetAccess.response;
          }

          // Preset management and asset-library metadata intentionally have separate IAM resources.
          // A preset-only mutation can succeed, but metadata is returned only with card-assets read access.
          const assetReadAccess = await authorizeBirthdayStudioPermission(
            guildId,
            session.user.id,
            'studio.settings.read',
            studioBirthdayResource(guildId, 'card-assets'),
          );

          const before = await getBirthdayCardAssetMetadata(prisma, guildId, assetId);
          """,
          )
          replace(
              route,
              """  return NextResponse.json({ asset: serializeAsset(asset) });
          """,
              """  if (!assetReadAccess.ok) return NextResponse.json({ updated: true });
            return NextResponse.json({ asset: serializeAsset(asset) });
          """,
          )

          schema = "packages/db/prisma/schema.prisma"
          replace(
              schema,
              """  settings               GuildSettings?
            birthdayCardBackground BirthdayCardBackground?
            members                GuildMember[]
          """,
              """  settings               GuildSettings?
            birthdayCardBackground BirthdayCardBackground?
            birthdayCardAssets     BirthdayCardAsset[]
            members                GuildMember[]
          """,
          )
          replace(
              schema,
              """model User {
          """,
              """model BirthdayCardAsset {
            id          String   @id
            guildId     String   @map(\"guild_id\")
            name        String   @db.VarChar(120)
            contentType String   @map(\"content_type\") @db.VarChar(32)
            content     Bytes
            sizeBytes   Int      @map(\"size_bytes\")
            width       Int
            height      Int
            sha256      String   @db.Char(64)
            isPreset    Boolean  @default(false) @map(\"is_preset\")
            createdBy   String   @map(\"created_by\")
            updatedBy   String   @map(\"updated_by\")
            createdAt   DateTime @default(now()) @map(\"created_at\") @db.Timestamptz(3)
            updatedAt   DateTime @default(now()) @updatedAt @map(\"updated_at\") @db.Timestamptz(3)

            guild Guild @relation(fields: [guildId], references: [id], onDelete: Cascade, onUpdate: Cascade)

            // Content, dimensions, and SHA-256 CHECK constraints are enforced by migration SQL.
            @@index([guildId, isPreset(sort: Desc), updatedAt(sort: Desc)], map: \"birthday_card_assets_guild_preset_updated_idx\")
            @@index([guildId, sha256], map: \"birthday_card_assets_guild_sha256_idx\")
            @@map(\"birthday_card_assets\")
          }

          model User {
          """,
          )

          preset_test = ".github/scripts/birthday-card-asset-library-preset-iam.test.mjs"
          replace(
              preset_test,
              """  assert.match(itemRoute, /studioBirthdayResource\\(guildId, 'card-presets'\\)/u);
          """,
              """  assert.match(itemRoute, /studioBirthdayResource\\(guildId, 'card-presets'\\)/u);
            assert.match(itemRoute, /'studio\\.settings\\.read'/u);
            assert.match(itemRoute, /if \\(!assetReadAccess\\.ok\\) return NextResponse\\.json\\(\\{ updated: true \\}\\)/u);
          """,
          )

          ui_test = ".github/scripts/birthday-card-asset-library-ui.test.mjs"
          replace(
              ui_test,
              """  assert.match(library, /この背景を使用/u);
          """,
              """  assert.match(library, /この背景を使用/u);
            assert.match(
              editor,
              /selectedDraftAsset =\\s*config\\.birthdayCardBackgroundSource === 'asset' &&/su,
            );
            assert.match(
              editor,
              /config\\.birthdayCardBackgroundSource === 'asset' &&\\s*asset\\.id === config\\.birthdayCardAssetId/su,
            );
          """,
          )

          migration_test = ".github/scripts/birthday-card-asset-library-migration.test.mjs"
          replace(
              migration_test,
              """const migration = readFileSync(
            'packages/db/prisma/migrations/20260821013000_birthday_card_asset_library/migration.sql',
            'utf8',
          );
          """,
              """const migration = readFileSync(
            'packages/db/prisma/migrations/20260821013000_birthday_card_asset_library/migration.sql',
            'utf8',
          );
          const schema = readFileSync('packages/db/prisma/schema.prisma', 'utf8');
          """,
          )
          replace(
              migration_test,
              """  assert.match(migration, /birthday_card_assets_guild_sha256_idx/u);
          """,
              """  assert.match(migration, /birthday_card_assets_guild_sha256_idx/u);
            assert.match(schema, /model BirthdayCardAsset/u);
            assert.match(schema, /birthdayCardAssets\\s+BirthdayCardAsset\\[\\]/u);
            assert.match(schema, /@@map\\(\"birthday_card_assets\"\\)/u);
          """,
          )
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/studio/src/components/birthday-card-editor.tsx \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/card-assets/[assetId]/route.ts' \
            .github/scripts/birthday-card-asset-library-preset-iam.test.mjs \
            .github/scripts/birthday-card-asset-library-ui.test.mjs \
            .github/scripts/birthday-card-asset-library-migration.test.mjs
          pnpm --filter @herta/db exec prisma format --schema prisma/schema.prisma
      - name: Commit focused fixes and remove temporary workflow
        run: |
          rm .github/workflows/temporary-birthday-asset-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(birthday): address asset library review findings'
          git push origin HEAD:feat/birthday-card-asset-library
