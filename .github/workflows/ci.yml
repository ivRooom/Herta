name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier and restore CI
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps/studio/src/lib/audit-logs.test.ts
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/lib/audit-logs.test.ts .github/workflows/ci.yml
          git commit -m "chore: format final audit regression test and restore CI"
          git push origin HEAD:${{ github.head_ref }}
