name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          apps/studio/src/lib/audit-logs.ts
          plugins/moderation/src/automatic-runtime.ts
      - name: Upload formatted sources
        uses: actions/upload-artifact@v7.0.1
        with:
          name: moderation-owner-decision-formatted
          path: |
            apps/studio/src/lib/audit-logs.ts
            plugins/moderation/src/automatic-runtime.ts
          if-no-files-found: error
          retention-days: 1
