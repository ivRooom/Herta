# ============================================================
# CI — Format / Lint / Typecheck / Test / Build / Supply Chain
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYFT_VERSION: 1.44.0
  GRYPE_VERSION: 0.112.0
  SYFT_CHECK_FOR_APP_UPDATE: 'false'
  GRYPE_CHECK_FOR_APP_UPDATE: 'false'
  # DB更新は専用stepで明示的に行い、各scan起動時の暗黙更新に依存しない。
  GRYPE_DB_AUTO_UPDATE: 'false'

jobs:
  verify:
    name: Format / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Supply chain policy tests
        run: node --test .github/scripts/*.test.mjs

      - name: Validate vulnerability exceptions
        run: |
          node .github/scripts/prepare-grype-config.mjs \
            .github/security/grype-allowlist.json \
            .ci/grype.yaml

      - name: Build
        run: pnpm build

      - name: Production Compose Validation
        env:
          DISCORD_CLIENT_ID: ci-client-id
          DISCORD_CLIENT_SECRET: ci-client-secret
          DISCORD_BOT_TOKEN: ci-bot-token
          TEAM_SPLIT_SECRET: ci-team-split-secret-for-compose-validation
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Origin protection configuration validation
        run: |
          bash -n deploy/scripts/enable-origin-protection.sh
          docker run --rm \
            -v "$PWD/deploy/docker/caddy/Caddyfile.aop:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null

      - name: SSM hybrid activation script構文検証
        run: bash -n deploy/scripts/ssm-hybrid-register.sh

      - name: Production Docker Build
        run: docker build --tag herta-app:ci .

      - name: Verify patched Node.js binary in final production image
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker run --rm --entrypoint node herta-app:ci --version)"
          test "$actual" = 'v22.23.4'
          echo "Verified final-image Node.js version: $actual"
          docker image inspect --format 'Built image ID: {{.Id}}' herta-app:ci

      - name: Verify production runtime
        run: |
          docker run --rm --entrypoint sh herta-app:ci -lc '
            set -eu

            test "$(id -u)" != "0"
            test ! -e /usr/local/lib/node_modules/npm
            test ! -e /usr/local/lib/node_modules/corepack
            test ! -e /usr/local/bin/npm
            test ! -e /usr/local/bin/npx
            test -f apps/api/dist/main.js
            test -f apps/bot/dist/main.js
            test -f apps/worker/dist/main.js
            test -f apps/studio/.next/standalone/apps/studio/server.js
            # External readiness uses the production image shell and bounded Prisma invocation.
            command -v timeout > /dev/null
            timeout 2 node -e "process.exit(0)"
            test -x packages/db/node_modules/.bin/prisma
            packages/db/node_modules/.bin/prisma --version > /dev/null

            test -n "$(find apps/studio/.next/standalone/apps/studio/.prisma/client \
              -maxdepth 1 -type f -name "libquery_engine-*.so.node" -print -quit)"

            for source_path in \
              apps/api/src \
              apps/bot/src \
              apps/worker/src \
              apps/studio/src \
              packages/db/src \
              packages/logger/src \
              packages/plugin-catalog/src \
              packages/plugin-sdk/src \
              packages/queue/src \
              packages/rule-engine/src \
              packages/shared/src \
              plugins/auto-response/src \
              plugins/daily-content/src \
              plugins/lfg/src \
              plugins/moderation/src \
              plugins/quote/src \
              plugins/team-split/src
            do
              test ! -e "$source_path"
            done

            test ! -e docs
            test ! -e examples
            test ! -e deploy
            test ! -e pnpm-lock.yaml

            cd apps/bot
            node --input-type=module -e "
              await import(\"@herta/db\");
              await import(\"@herta/logger\");
              await import(\"@herta/plugin-catalog\");
              await import(\"@herta/plugin-sdk\");
              await import(\"@herta/rule-engine\");
              await import(\"@herta/shared\");
            "
          '

      - name: Report runtime image size
        run: |
          size_bytes="$(docker image inspect herta-app:ci --format '{{.Size}}')"
          size_mib="$((size_bytes / 1024 / 1024))"
          echo "Runtime image size: ${size_mib} MiB (${size_bytes} bytes)"
          {
            echo "### Production runtime image"
            echo
            echo "- Size: **${size_mib} MiB**"
            echo "- Source / test / docs: excluded"
            echo "- Runtime user: non-root"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="$RUNNER_TEMP/herta-security-tools"
          download_dir="$RUNNER_TEMP/herta-security-downloads"
          mkdir -p "$tool_dir" "$download_dir"

          install_tool() {
            local tool="$1"
            local version="$2"
            local asset="${tool}_${version}_linux_amd64.tar.gz"
            local checksums="${tool}_${version}_checksums.txt"
            local release_url="https://github.com/anchore/${tool}/releases/download/v${version}"

            curl --fail --location --retry 3 --retry-delay 2 \
              --output "$download_dir/$asset" \
              "$release_url/$asset"
            curl --fail --location --retry 3 --retry-delay 2 \
              --output "$download_dir/$checksums" \
              "$release_url/$checksums"

            (
              cd "$download_dir"
              grep "  $asset$" "$checksums" | sha256sum --check --strict -
            )
            tar -xzf "$download_dir/$asset" -C "$tool_dir" "$tool"
            "$tool_dir/$tool" version
          }

          install_tool syft "$SYFT_VERSION"
          install_tool grype "$GRYPE_VERSION"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Refresh Grype vulnerability database
        env:
          GRYPE_DB_AUTO_UPDATE: 'true'
        run: grype db update

      - name: Verify vulnerability failure gate
        run: |
          set -euo pipefail

          mkdir -p reports/security
          printf '%s\n' 'gate-probe' > reports/security/gate-probe.txt
          probe_report="reports/security/gate-probe.grype.json"

          set +e
          grype "file:reports/security/gate-probe.txt" \
            --config .ci/grype.yaml \
            --fail-on critical \
            --output json \
            > "$probe_report"
          probe_status=$?
          set -e

          if [ "$probe_status" -ne 0 ]; then
            echo "Grype failure gate probe failed with exit code $probe_status" >&2
            cat "$probe_report" >&2
            exit "$probe_status"
          fi

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p reports/security
          syft herta-app:ci \
            --output cyclonedx-json=reports/security/herta-app.cdx.json

      - name: Scan production image for High and Critical vulnerabilities
        run: |
          grype herta-app:ci \
            --config .ci/grype.yaml \
            --fail-on high \
            --output json \
            > reports/security/grype-high-critical.json

      - name: Upload SBOM and vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: security-reports-${{ github.run_id }}
          path: reports/security
          if-no-files-found: warn
          retention-days: 14

  # Native GitHub-hosted ARM64 is available for this public repository.
  # Avoid QEMU on the Minecraft/production hosts and keep existing amd64 job intact.
  arm64-runtime:
    name: ARM64 Production Image / Node / Grype
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Verify native runner architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(node --version)" = v22.23.4

      - name: Generate reviewed vulnerability exception config
        run: |
          node .github/scripts/prepare-grype-config.mjs \
            .github/security/grype-allowlist.json \
            .ci/grype.yaml

      - name: Build native ARM64 production image
        run: docker build --platform linux/arm64 --tag herta-app:ci-arm64 .

      - name: Verify ARM64 final image and native runtime dependencies
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Architecture}}' herta-app:ci-arm64)" = arm64
          test "$(docker run --rm --entrypoint node herta-app:ci-arm64 --version)" = v22.23.4
          docker run --rm --entrypoint sh herta-app:ci-arm64 -lc '
            set -eu
            test "$(id -u)" != 0
            test -f apps/api/dist/main.js
            test -f apps/bot/dist/main.js
            test -f apps/worker/dist/main.js
            test -f apps/studio/.next/standalone/apps/studio/server.js
            test -x packages/db/node_modules/.bin/prisma
            packages/db/node_modules/.bin/prisma --version > /dev/null
            cd apps/bot
            node --input-type=module -e "await import(\"@herta/shared\")"
          '

      - name: Install checksum-verified ARM64 Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/security-bin" "$RUNNER_TEMP/security-downloads"
          for tool in syft grype; do
            if [ "$tool" = syft ]; then version="$SYFT_VERSION"; else version="$GRYPE_VERSION"; fi
            asset="${tool}_${version}_linux_arm64.tar.gz"
            checksums="${tool}_${version}_checksums.txt"
            url="https://github.com/anchore/${tool}/releases/download/v${version}"
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/security-downloads/$asset" "$url/$asset"
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/security-downloads/$checksums" "$url/$checksums"
            (cd "$RUNNER_TEMP/security-downloads" && grep "  $asset$" "$checksums" | sha256sum --check --strict -)
            tar -xzf "$RUNNER_TEMP/security-downloads/$asset" -C "$RUNNER_TEMP/security-bin" "$tool"
            "$RUNNER_TEMP/security-bin/$tool" version
          done
          echo "$RUNNER_TEMP/security-bin" >> "$GITHUB_PATH"

      - name: Refresh Grype vulnerability database (ARM64)
        env:
          GRYPE_DB_AUTO_UPDATE: 'true'
        run: grype db update

      - name: Generate ARM64 image SBOM and enforce High/Critical gate
        run: |
          set -euo pipefail
          mkdir -p reports/security
          syft herta-app:ci-arm64 --output cyclonedx-json=reports/security/herta-app-arm64.cdx.json
          grype herta-app:ci-arm64 \
            --config .ci/grype.yaml \
            --fail-on high \
            --output json \
            > reports/security/grype-arm64-high-critical.json

      - name: Upload ARM64 security evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: security-arm64-${{ github.run_id }}
          path: reports/security
          if-no-files-found: warn
          retention-days: 14
