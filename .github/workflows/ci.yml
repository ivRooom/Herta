name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-response-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format

      - name: Restore standard CI and push formatting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style(auto-response): 最新レビュー修正を整形'
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:feat/auto-response-plugin-v1
