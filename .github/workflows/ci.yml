name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-response-final-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.head_ref == 'feat/auto-response-plugin-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text()
              for before, after in replacements:
                  if after in text:
                      continue
                  if text.count(before) != 1:
                      raise RuntimeError(f'{path}: expected exactly one source block for {before[:80]!r}')
                  text = text.replace(before, after, 1)
              file.write_text(text)

          patch('plugins/auto-response/src/config.ts', [
              (
                  '  maxMessageLength: number;\n  regexEnabled: boolean;',
                  '  maxMessageLength: number;\n  maxRegexEvaluationsPerMessage: number;\n  regexEnabled: boolean;',
              ),
              (
                  '  maxMessageLength: 2000,\n  regexEnabled: true,',
                  '  maxMessageLength: 2000,\n  maxRegexEvaluationsPerMessage: 5,\n  regexEnabled: true,',
              ),
              (
                  '  const config = isRecord(value) ? value : {};\n  return {',
                  "  const config = isRecord(value) ? value : {};\n  const legacyCooldownSeconds =\n    typeof config.cooldownMs === 'number' && Number.isFinite(config.cooldownMs)\n      ? Math.ceil(config.cooldownMs / 1000)\n      : undefined;\n  return {",
              ),
              (
                  '    maxRules: clampInteger(config.maxRules, DEFAULT_AUTO_RESPONSE_CONFIG.maxRules, 1, 200),',
                  '    maxRules: clampInteger(\n      config.maxRules ?? config.maxResponses,\n      DEFAULT_AUTO_RESPONSE_CONFIG.maxRules,\n      1,\n      200,\n    ),',
              ),
              (
                  '      config.guildCooldownSeconds,\n      DEFAULT_AUTO_RESPONSE_CONFIG.guildCooldownSeconds,',
                  '      config.guildCooldownSeconds ?? legacyCooldownSeconds,\n      DEFAULT_AUTO_RESPONSE_CONFIG.guildCooldownSeconds,',
              ),
              (
                  '    regexEnabled: booleanValue(config.regexEnabled, DEFAULT_AUTO_RESPONSE_CONFIG.regexEnabled),',
                  '    maxRegexEvaluationsPerMessage: clampInteger(\n      config.maxRegexEvaluationsPerMessage,\n      DEFAULT_AUTO_RESPONSE_CONFIG.maxRegexEvaluationsPerMessage,\n      1,\n      10,\n    ),\n    regexEnabled: booleanValue(config.regexEnabled, DEFAULT_AUTO_RESPONSE_CONFIG.regexEnabled),',
              ),
          ])

          patch('plugins/auto-response/src/manifest.ts', [
              (
                  "      regexEnabled: {\n        type: 'boolean',",
                  "      maxRegexEvaluationsPerMessage: {\n        type: 'integer',\n        title: '1メッセージあたりの正規表現評価上限',\n        minimum: 1,\n        maximum: 10,\n        default: 5,\n      },\n      regexEnabled: {\n        type: 'boolean',",
              ),
              (
                  "      'maxMessageLength',\n      'regexEnabled',",
                  "      'maxMessageLength',\n      'maxRegexEvaluationsPerMessage',\n      'regexEnabled',",
              ),
          ])

          patch('plugins/auto-response/src/plugin.ts', [
              (
                  '  let responseCount = 0;\n  for (const rule of rules) {',
                  '  let responseCount = 0;\n  let regexEvaluationCount = 0;\n  let regexLimitLogged = false;\n  for (const rule of rules) {',
              ),
              (
                  '    if (!isRuleInScope(rule, message)) continue;\n\n    const startedAt = Date.now();',
                  "    if (!isRuleInScope(rule, message)) continue;\n    if (rule.matchMode === 'regex') {\n      if (regexEvaluationCount >= config.maxRegexEvaluationsPerMessage) {\n        if (!regexLimitLogged) {\n          context.logger.warn(\n            {\n              guildId: context.guildId,\n              channelId: message.channelId,\n              maxRegexEvaluationsPerMessage: config.maxRegexEvaluationsPerMessage,\n            },\n            'Auto Responseの正規表現評価上限に達しました',\n          );\n          regexLimitLogged = true;\n        }\n        continue;\n      }\n      regexEvaluationCount += 1;\n    }\n\n    const startedAt = Date.now();",
              ),
          ])

          patch('plugins/auto-response/src/config.test.ts', [
              (
                  "        regexExecutionBudgetMs: 999,\n      }),",
                  "        maxRegexEvaluationsPerMessage: 999,\n        regexExecutionBudgetMs: 999,\n      }),",
              ),
              (
                  "      guildCooldownSeconds: 0,\n      regexExecutionBudgetMs: 50,",
                  "      guildCooldownSeconds: 0,\n      maxRegexEvaluationsPerMessage: 10,\n      regexExecutionBudgetMs: 50,",
              ),
              (
                  "  });\n});\n\ndescribe('Auto Response rule validation'",
                  "  });\n\n  it('旧設定キーを現行設定へ移行する', () => {\n    expect(normalizeAutoResponseConfig({ maxResponses: 50, cooldownMs: 3000 })).toMatchObject({\n      maxRules: 50,\n      guildCooldownSeconds: 3,\n      maxRegexEvaluationsPerMessage: 5,\n    });\n  });\n});\n\ndescribe('Auto Response rule validation'",
              ),
          ])

          patch('apps/studio/src/lib/guild-plugins.ts', [
              (
                  "import { getAllPluginManifests, getPluginManifest } from '@herta/plugin-catalog';",
                  "import { getAllPluginManifests, getPluginManifest } from '@herta/plugin-catalog';\nimport { normalizeAutoResponseConfig } from '@herta/plugin-catalog/auto-response-service';",
              ),
              (
                  '  const candidate = { ...config };',
                  "  const candidate =\n    manifest.id === 'auto-response' ? { ...normalizeAutoResponseConfig(config) } : { ...config };",
              ),
          ])

          patch('apps/studio/src/app/dashboard/guilds/[guildId]/auto-response/page.tsx', [
              (
                  '  let stats: Awaited<ReturnType<typeof getAutoResponseStats>> = {',
                  '  let guildRuleCount = 0;\n  let stats: Awaited<ReturnType<typeof getAutoResponseStats>> = {',
              ),
              (
                  '    [result, stats] = await Promise.all([',
                  '    [result, stats, guildRuleCount] = await Promise.all([',
              ),
              (
                  '      getAutoResponseStats(prisma as unknown as AutoResponsePrismaClient, guildId),\n    ]);',
                  '      getAutoResponseStats(prisma as unknown as AutoResponsePrismaClient, guildId),\n      prisma.autoResponse.count({ where: { guildId } }),\n    ]);',
              ),
              (
                  '          {result.total} / {config.maxRules}件',
                  '          {guildRuleCount} / {config.maxRules}件',
              ),
          ])

          patch('docs/plugins/AUTO_RESPONSE.md', [
              (
                  '| `maxMessageLength`           | `2000`  | 評価対象本文の最大文字数  |\n| `regexEnabled`',
                  '| `maxMessageLength`           | `2000`  | 評価対象本文の最大文字数  |\n| `maxRegexEvaluationsPerMessage` | `5` | 1メッセージあたりの正規表現評価上限 |\n| `regexEnabled`',
              ),
              (
                  '評価対象メッセージにも長さ上限を設定します。実行時は`node:vm`の分離Contextで評価し、`regexExecutionBudgetMs`を超えた処理を強制停止します。',
                  '評価対象メッセージにも長さ上限を設定します。1メッセージで評価する正規表現ルールは既定5件・最大10件に制限します。実行時は`node:vm`の分離Contextで評価し、`regexExecutionBudgetMs`を超えた個別処理を強制停止します。',
              ),
          ])
          PY

      - run: pnpm format
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm test

      - name: Restore standard CI and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(auto-response): 旧設定移行と正規表現評価上限を追加'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/auto-response-plugin-v1
