# ============================================================
# CI — Format / Lint / Typecheck / Test / Build
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production Compose Validation
        env:
          DISCORD_CLIENT_ID: ci-client-id
          DISCORD_CLIENT_SECRET: ci-client-secret
          DISCORD_BOT_TOKEN: ci-bot-token
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Origin protection configuration validation
        run: |
          bash -n deploy/scripts/enable-origin-protection.sh
          docker run --rm \
            -v "$PWD/deploy/docker/caddy/Caddyfile.aop:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null

      - name: Production Docker Build
        run: docker build --tag herta-app:ci .

      - name: Verify non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id herta-app:ci -u)" != "0"
          docker run --rm --entrypoint sh herta-app:ci -c \
            'test -f apps/api/dist/main.js && test -f apps/bot/dist/main.js && test -f apps/worker/dist/main.js'
