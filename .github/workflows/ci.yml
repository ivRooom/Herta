name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-response-test-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-response-test:
    if: github.head_ref == 'feat/auto-response-plugin-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Auto Response tests
        run: pnpm --filter @herta/plugin-auto-response exec vitest run --reporter=verbose
