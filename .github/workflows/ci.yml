name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: >-
          pnpm exec prettier --write
          apps/studio/src/lib/audit-logs.ts
          plugins/moderation/src/automatic-runtime.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/studio/src/lib/audit-logs.ts plugins/moderation/src/automatic-runtime.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/lib/audit-logs.ts plugins/moderation/src/automatic-runtime.ts
          git commit -m "chore: format moderation owner decision changes"
          git push origin HEAD:${{ github.head_ref }}
