name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/moderation-delete-outcome'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply moderation patch
        run: python3 .github/scripts/tmp_moderation_delete_outcome.py
      - name: Format changed source
        run: pnpm exec prettier --write plugins/moderation/src/automatic-runtime.ts plugins/moderation/src/automatic-runtime.test.ts
      - name: Commit source changes
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins/moderation/src/automatic-runtime.ts plugins/moderation/src/automatic-runtime.test.ts; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/moderation/src/automatic-runtime.ts plugins/moderation/src/automatic-runtime.test.ts
          git commit -m 'fix(moderation): normalize automatic delete outcomes'
          git push origin HEAD:${{ github.head_ref }}
