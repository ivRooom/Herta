# ============================================================
# CI — Format / Lint / Typecheck / Test / Build
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          cat /tmp/typecheck.log

          if [ "$status" -ne 0 ]; then
            {
              echo "## Typecheck診断"
              echo
              echo '```text'
              tail -n 200 /tmp/typecheck.log
              echo '```'
            } > /tmp/typecheck-issue.md
            gh issue edit 44 --body-file /tmp/typecheck-issue.md
          fi

          exit "$status"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production Compose Validation
        env:
          DISCORD_CLIENT_ID: ci-client-id
          DISCORD_CLIENT_SECRET: ci-client-secret
          DISCORD_BOT_TOKEN: ci-bot-token
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Origin protection configuration validation
        run: |
          bash -n deploy/scripts/enable-origin-protection.sh
          docker run --rm \
            -v "$PWD/deploy/docker/caddy/Caddyfile.aop:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null

      - name: Production Docker Build
        run: docker build --tag herta-app:ci .

      - name: Verify production runtime
        run: |
          docker run --rm --entrypoint sh herta-app:ci -lc '
            set -eu
            test "$(id -u)" != "0"
            test -f apps/api/dist/main.js
            test -f apps/bot/dist/main.js
            test -f apps/worker/dist/main.js
            test -f apps/studio/.next/standalone/apps/studio/server.js
            test -n "$(find apps/studio/.next/standalone/apps/studio/.prisma/client \
              -maxdepth 1 -type f -name "libquery_engine-*.so.node" -print -quit)"
          '
