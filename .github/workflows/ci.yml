name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-response-test-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-diagnostic:
    if: github.head_ref == 'feat/auto-response-plugin-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Workspace tests with error-only logs
        run: pnpm exec turbo run test --output-logs=errors-only --summarize
