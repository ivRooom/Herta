name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Lint結果を保存
        shell: bash
        run: |
          set +e
          pnpm lint > lint-output.txt 2>&1
          status=$?
          set -e
          cat lint-output.txt
          echo "lint_status=${status}" >> "$GITHUB_ENV"

      - name: Lint結果をアップロード
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lint-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: lint-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Lint結果を検証
        run: test "$lint_status" -eq 0
