# ============================================================
# CI — Format / Lint / Typecheck / Test / Build / Supply Chain
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYFT_VERSION: 1.44.0
  GRYPE_VERSION: 0.112.0
  SYFT_CHECK_FOR_APP_UPDATE: 'false'
  GRYPE_CHECK_FOR_APP_UPDATE: 'false'

jobs:
  verify:
    name: Format / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Supply chain policy tests
        run: node --test .github/scripts/*.test.mjs

      - name: Validate vulnerability exceptions
        run: |
          node .github/scripts/prepare-grype-config.mjs \
            .github/security/grype-allowlist.json \
            .ci/grype.yaml

      - name: Build
        run: pnpm build

      - name: Production Compose Validation
        env:
          DISCORD_CLIENT_ID: ci-client-id
          DISCORD_CLIENT_SECRET: ci-client-secret
          DISCORD_BOT_TOKEN: ci-bot-token
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Origin protection configuration validation
        run: |
          bash -n deploy/scripts/enable-origin-protection.sh
          docker run --rm \
            -v "$PWD/deploy/docker/caddy/Caddyfile.aop:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null

      - name: Production Docker Build
        run: docker build --tag herta-app:ci .

      - name: Verify production runtime
        run: |
          docker run --rm --entrypoint sh herta-app:ci -lc '
            set -eu

            test "$(id -u)" != "0"
            test ! -e /usr/local/lib/node_modules/npm
            test ! -e /usr/local/lib/node_modules/corepack
            test ! -e /usr/local/bin/npm
            test ! -e /usr/local/bin/npx
            test -f apps/api/dist/main.js
            test -f apps/bot/dist/main.js
            test -f apps/worker/dist/main.js
            test -f apps/studio/.next/standalone/apps/studio/server.js
            test -x packages/db/node_modules/.bin/prisma
            packages/db/node_modules/.bin/prisma --version > /dev/null

            test -n "$(find apps/studio/.next/standalone/apps/studio/.prisma/client \
              -maxdepth 1 -type f -name "libquery_engine-*.so.node" -print -quit)"

            for source_path in \
              apps/api/src \
              apps/bot/src \
              apps/worker/src \
              apps/studio/src \
              packages/db/src \
              packages/logger/src \
              packages/plugin-catalog/src \
              packages/plugin-sdk/src \
              packages/queue/src \
              packages/rule-engine/src \
              packages/shared/src \
              plugins/auto-response/src \
              plugins/daily-content/src \
              plugins/lfg/src \
              plugins/moderation/src \
              plugins/quote/src \
              plugins/team-split/src
            do
              test ! -e "$source_path"
            done

            test ! -e docs
            test ! -e examples
            test ! -e deploy
            test ! -e pnpm-lock.yaml

            cd apps/bot
            node --input-type=module -e "
              await import(\"@herta/db\");
              await import(\"@herta/logger\");
              await import(\"@herta/plugin-catalog\");
              await import(\"@herta/plugin-sdk\");
              await import(\"@herta/rule-engine\");
              await import(\"@herta/shared\");
            "
          '

      - name: Report runtime image size
        run: |
          size_bytes="$(docker image inspect herta-app:ci --format '{{.Size}}')"
          size_mib="$((size_bytes / 1024 / 1024))"
          echo "Runtime image size: ${size_mib} MiB (${size_bytes} bytes)"
          {
            echo "### Production runtime image"
            echo
            echo "- Size: **${size_mib} MiB**"
            echo "- Source / test / docs: excluded"
            echo "- Runtime user: non-root"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail

          tool_dir="$RUNNER_TEMP/herta-security-tools"
          download_dir="$RUNNER_TEMP/herta-security-downloads"
          mkdir -p "$tool_dir" "$download_dir"

          install_tool() {
            local tool="$1"
            local version="$2"
            local asset="${tool}_${version}_linux_amd64.tar.gz"
            local checksums="${tool}_${version}_checksums.txt"
            local release_url="https://github.com/anchore/${tool}/releases/download/v${version}"

            curl --fail --location --retry 3 --retry-delay 2 \
              --output "$download_dir/$asset" \
              "$release_url/$asset"
            curl --fail --location --retry 3 --retry-delay 2 \
              --output "$download_dir/$checksums" \
              "$release_url/$checksums"

            (
              cd "$download_dir"
              grep -E "[[:space:]]${asset}$" "$checksums" | sha256sum --check --strict -
            )

            tar -xzf "$download_dir/$asset" -C "$download_dir" "$tool"
            install -m 0755 "$download_dir/$tool" "$tool_dir/$tool"
          }

          install_tool syft "$SYFT_VERSION"
          install_tool grype "$GRYPE_VERSION"

          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/syft" version
          "$tool_dir/grype" version

      - name: Verify vulnerability failure gate
        shell: bash
        run: |
          set +e
          grype \
            sbom:.github/security/fixtures/grype-known-vulnerable.cdx.json \
            --fail-on high \
            --output table \
            > "$RUNNER_TEMP/grype-gate-self-test.txt" 2>&1
          status=$?
          set -e

          cat "$RUNNER_TEMP/grype-gate-self-test.txt"

          if [[ "$status" -eq 0 ]]; then
            echo "::error::既知のHigh/Critical脆弱性でGrypeが失敗しませんでした"
            exit 1
          fi

          if ! grep -Eq 'CVE-2021-44228|GHSA-jfh8-c2jp-5v3q' "$RUNNER_TEMP/grype-gate-self-test.txt"; then
            echo "::error::Grype failure gateの自己テストでLog4Shellを検出できませんでした"
            exit 1
          fi

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="$RUNNER_TEMP/herta-supply-chain"
          artifact_dir="$GITHUB_WORKSPACE/security-artifacts"
          mkdir -p "$staging_dir" "$artifact_dir"

          syft herta-app:ci \
            --output "cyclonedx-json=$staging_dir/herta-app.cdx.json"

          node .github/scripts/assert-sbom-safe.mjs \
            "$staging_dir/herta-app.cdx.json"

          mv "$staging_dir/herta-app.cdx.json" \
            "$artifact_dir/herta-app.cdx.json"

          {
            syft version
            echo
            grype version
          } > "$artifact_dir/tool-versions.txt"

      - name: Scan production image for High and Critical vulnerabilities
        shell: bash
        run: |
          grype herta-app:ci \
            --config .ci/grype.yaml \
            --fail-on high \
            --output json \
            --file security-artifacts/grype-report.json

      - name: Upload SBOM and vulnerability report
        if: ${{ always() && hashFiles('security-artifacts/**') != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: herta-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-artifacts/
          if-no-files-found: error
          retention-days: 30

  auto-response-review-fixes:
    name: Apply Auto Response review fixes
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/auto-response-plugin-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply remaining review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text()
              if after in source:
                  return
              count = source.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one source block, found {count}')
              file.write_text(source.replace(before, after))

          replace_once(
              'packages/db/prisma/schema.prisma',
              '@@index([guildId, priority(sort: Desc), createdAt])',
              '@@index([guildId, priority(sort: Desc), createdAt(sort: Desc)])',
          )
          replace_once(
              'packages/db/prisma/migrations/20260728163100_auto_response_priority_index_concurrently/migration.sql',
              'ON "auto_responses"("guild_id", "priority" DESC, "created_at" ASC);',
              'ON "auto_responses"("guild_id", "priority" DESC, "created_at" DESC);',
          )
          replace_once(
              'plugins/auto-response/src/service.ts',
              '''  const page = positiveInteger(input.page, 1);
  const pageSize = Math.min(positiveInteger(input.pageSize, DEFAULT_PAGE_SIZE), MAX_PAGE_SIZE);
  const where = buildRuleWhere(input);
  const [items, total] = await Promise.all([
    prisma.autoResponse.findMany({
      where,
      orderBy: [{ priority: 'desc' }, { createdAt: 'desc' }],
      skip: (page - 1) * pageSize,
      take: pageSize,
    }),
    prisma.autoResponse.count({ where }),
  ]);

  return {
    items,
    total,
    page,
    pageSize,
    totalPages: Math.max(1, Math.ceil(total / pageSize)),
  };''',
              '''  const requestedPage = positiveInteger(input.page, 1);
  const pageSize = Math.min(positiveInteger(input.pageSize, DEFAULT_PAGE_SIZE), MAX_PAGE_SIZE);
  const where = buildRuleWhere(input);
  const total = await prisma.autoResponse.count({ where });
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const page = Math.min(requestedPage, totalPages);
  const items = await prisma.autoResponse.findMany({
    where,
    orderBy: [{ priority: 'desc' }, { createdAt: 'desc' }],
    skip: (page - 1) * pageSize,
    take: pageSize,
  });

  return {
    items,
    total,
    page,
    pageSize,
    totalPages,
  };''',
          )
          replace_once(
              'plugins/auto-response/src/plugin.ts',
              '''const VIEW_CHANNEL_PERMISSION = 1024n;
const SEND_MESSAGES_PERMISSION = 2048n;
const EMBED_LINKS_PERMISSION = 16384n;''',
              '''const VIEW_CHANNEL_PERMISSION = 1024n;
const SEND_MESSAGES_PERMISSION = 2048n;
const EMBED_LINKS_PERMISSION = 16384n;
const SEND_MESSAGES_IN_THREADS_PERMISSION = 274877906944n;''',
          )
          replace_once(
              'plugins/auto-response/src/plugin.ts',
              '''  channel: {
    isTextBased?(): boolean;
    permissionsFor?(member: unknown): { has(permission: bigint): boolean } | null;''',
              '''  channel: {
    isTextBased?(): boolean;
    isThread?(): boolean;
    permissionsFor?(member: unknown): { has(permission: bigint): boolean } | null;''',
          )
          replace_once(
              'plugins/auto-response/src/plugin.ts',
              '''  const permissions = message.channel.permissionsFor(botMember);
  if (
    !permissions?.has(VIEW_CHANNEL_PERMISSION) ||
    !permissions.has(SEND_MESSAGES_PERMISSION) ||
    (responseType === 'embed' && !permissions.has(EMBED_LINKS_PERMISSION))
  ) {''',
              '''  const permissions = message.channel.permissionsFor(botMember);
  const sendPermission = message.channel.isThread?.()
    ? SEND_MESSAGES_IN_THREADS_PERMISSION
    : SEND_MESSAGES_PERMISSION;
  if (
    !permissions?.has(VIEW_CHANNEL_PERMISSION) ||
    !permissions.has(sendPermission) ||
    (responseType === 'embed' && !permissions.has(EMBED_LINKS_PERMISSION))
  ) {''',
          )
          replace_once(
              'plugins/auto-response/src/service.test.ts',
              '''  it('別Guild IDで作成したルールを混在させない', async () => {''',
              '''  it('範囲外の要求ページを最終ページへ補正する', async () => {
    const { client, tx } = mockClient();
    vi.mocked(tx.autoResponse.count).mockResolvedValue(21);

    const result = await listAutoResponseRules(client, {
      guildId: GUILD_ID,
      page: 99,
      pageSize: 20,
    });

    expect(result.page).toBe(2);
    expect(result.totalPages).toBe(2);
    expect(tx.autoResponse.findMany).toHaveBeenCalledWith(
      expect.objectContaining({ skip: 20, take: 20 }),
    );
  });

  it('別Guild IDで作成したルールを混在させない', async () => {''',
          )
          replace_once(
              'plugins/auto-response/src/service.test.ts',
              '''  it('更新処理はGuild Advisory Lockを取得してからread/merge/writeする', async () => {
    const { client, tx } = mockClient();

    await updateAutoResponseRule(client, {
      guildId: GUILD_ID,
      ruleId: RULE_ID,
      actorId: USER_ID,
      source: 'dashboard',
      config: DEFAULT_AUTO_RESPONSE_CONFIG,
      patch: { name: 'Updated greeting' },
    });

    expect(tx.$queryRawUnsafe).toHaveBeenCalledWith(
      'SELECT pg_advisory_xact_lock(hashtext($1))',
      GUILD_ID,
    );
  });''',
              '''  it('更新処理はGuild Advisory Lockを取得してからread/merge/writeする', async () => {
    const { client, tx } = mockClient();
    const calls: string[] = [];
    vi.mocked(tx.$queryRawUnsafe).mockImplementation(async () => {
      calls.push('lock');
      return [];
    });
    vi.mocked(tx.autoResponse.findFirst).mockImplementation(async () => {
      calls.push('findFirst');
      return rule();
    });
    vi.mocked(tx.autoResponse.update).mockImplementation(async () => {
      calls.push('update');
      return rule({ name: 'Updated greeting' });
    });
    vi.mocked(tx.auditLog.create).mockImplementation(async () => {
      calls.push('auditLog.create');
      return {};
    });

    await updateAutoResponseRule(client, {
      guildId: GUILD_ID,
      ruleId: RULE_ID,
      actorId: USER_ID,
      source: 'dashboard',
      config: DEFAULT_AUTO_RESPONSE_CONFIG,
      patch: { name: 'Updated greeting' },
    });

    expect(tx.$queryRawUnsafe).toHaveBeenCalledWith(
      'SELECT pg_advisory_xact_lock(hashtext($1))',
      GUILD_ID,
    );
    expect(calls).toEqual(['lock', 'findFirst', 'update', 'auditLog.create']);
    expect(tx.autoResponse.findFirst).toHaveBeenCalledTimes(1);
    expect(tx.autoResponse.update).toHaveBeenCalledTimes(1);
    expect(tx.auditLog.create).toHaveBeenCalledTimes(1);
  });''',
          )
          PY

      - name: Format changed files
        run: pnpm format

      - name: Restore CI and remove temporary files
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f \
            .github/workflows/auto-response-review-round2.yml \
            auto-response-review-round2.trigger

      - name: Commit and push fixes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(auto-response): 追加レビュー指摘を反映'
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:feat/auto-response-plugin-v1
