name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-diagnostics:
    name: Format diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Prettierを適用
        run: pnpm format

      - name: 整形差分を保存
        run: git diff --binary > format.patch

      - name: 整形差分をアップロード
        uses: actions/upload-artifact@v4.6.2
        with:
          name: format-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: format.patch
          if-no-files-found: error
          retention-days: 1
