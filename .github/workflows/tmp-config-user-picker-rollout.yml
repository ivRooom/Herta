name: Temporary Config User Picker Rollout

on:
  push:
    branches:
      - feat/config-studio-user-picker-rollout
    paths:
      - scripts/tmp-config-user-picker-rollout.py
      - .github/workflows/tmp-config-user-picker-rollout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/config-studio-user-picker-rollout
          fetch-depth: 0

      - name: Apply rollout
        run: python3 scripts/tmp-config-user-picker-rollout.py

      - name: Remove temporary files
        run: |
          rm scripts/tmp-config-user-picker-rollout.py
          rm .github/workflows/tmp-config-user-picker-rollout.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/components/team-split-manager.tsx \
                  apps/studio/src/components/moderation-config-form.tsx \
                  scripts/tmp-config-user-picker-rollout.py \
                  .github/workflows/tmp-config-user-picker-rollout.yml
          git commit -m "feat: User Pickerを運用画面へ展開"
          git push origin HEAD:feat/config-studio-user-picker-rollout
