name: Temporary Build Event RSVP v1

on:
  push:
    branches:
      - tmp/event-rsvp-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/event-rsvp-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Implement Event RSVP v1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/db/prisma/migrations/20260811230000_event_rsvp_v1

          cat > packages/plugin-catalog/src/manifests/event-rsvp.ts <<'EOF'
