name: Temporary Message Studio Finalize

on:
  push:
    branches:
      - feat/message-studio-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Message Studio hardening
        run: python .github/scripts/tmp-message-studio-hardening.py
      - name: Prisma Generate
        run: pnpm db:generate
      - name: Format Message Studio files
        run: |
          pnpm exec prettier --write \
            packages/shared/src/types/plugin.ts \
            apps/bot/src/commands/registry.ts \
            apps/studio/src/components/daily-content-manager.tsx \
            apps/studio/src/app/dashboard/guilds/[guildId]/daily-content/page.tsx \
            apps/studio/src/app/api/guilds/[guildId]/daily-content/schedules/route.ts \
            apps/studio/src/app/api/guilds/[guildId]/daily-content/schedules/[scheduleId]/route.ts \
            apps/studio/src/lib/message-studio-request.ts \
            apps/worker/src/daily-content.ts \
            plugins/daily-content/package.json \
            plugins/daily-content/src/config.ts \
            plugins/daily-content/src/config.test.ts \
            plugins/daily-content/src/schedule.ts \
            plugins/daily-content/src/schedule.test.ts \
            plugins/daily-content/src/message.ts \
            plugins/daily-content/src/message.test.ts \
            plugins/daily-content/src/manifest.ts \
            plugins/daily-content/src/plugin.ts \
            plugins/daily-content/src/service.ts \
            plugins/daily-content/src/index.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit finalized Message Studio
        run: |
          rm .github/scripts/tmp-message-studio-hardening.py
          rm .github/workflows/tmp-message-studio-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Announcement Message Studio v2を完成する'
          git push origin HEAD:feat/message-studio-v2
