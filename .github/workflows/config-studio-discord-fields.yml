name: Config Studio Discord Fields

on:
  push:
    branches:
      - feat/config-studio-discord-fields
    paths:
      - scripts/patch-config-studio-discord-fields.py
      - .github/workflows/config-studio-discord-fields.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-discord-fields
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Discord Picker patch
        run: python3 scripts/patch-config-studio-discord-fields.py
      - name: Format changed files
        run: pnpm exec prettier --write apps/studio/src/components/plugin-config-studio-form.tsx apps/studio/src/components/plugin-config-form.tsx apps/studio/src/app/dashboard/guilds/'[guildId]'/plugins/'[pluginId]'/page.tsx apps/studio/src/lib/plugin-config-studio.ts
      - name: Typecheck Studio
        run: pnpm --dir apps/studio typecheck
      - name: Remove temporary files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-config-studio-discord-fields.py
          rm .github/workflows/config-studio-discord-fields.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio scripts/patch-config-studio-discord-fields.py .github/workflows/config-studio-discord-fields.yml
          git commit -m "feat: Config StudioにDiscord Pickerを統合"
          git push origin HEAD:feat/config-studio-discord-fields
