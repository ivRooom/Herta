name: Format Studio E2E config

on:
  push:
    branches: [fix/372-studio-picker-mobile-overlay]
    paths:
      - '.github/workflows/studio-e2e-format-372.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/372-studio-picker-mobile-overlay

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format Playwright config
        run: pnpm exec prettier --write apps/studio/playwright.config.ts

      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/studio/playwright.config.ts; then
            echo 'Playwright config is already formatted'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/playwright.config.ts
          git commit -m 'style(studio): format Playwright config'
          git push origin HEAD:fix/372-studio-picker-mobile-overlay
