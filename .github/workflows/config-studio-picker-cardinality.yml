name: Config Studio Picker Cardinality Fix

on:
  push:
    branches:
      - feat/config-studio-discord-fields
    paths:
      - scripts/patch-config-studio-picker-cardinality.py
      - .github/workflows/config-studio-picker-cardinality.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/config-studio-discord-fields
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-config-studio-picker-cardinality.py
      - run: pnpm exec prettier --write apps/studio/src/components/plugin-config-studio-form.tsx
      - run: pnpm --dir apps/studio typecheck
      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-config-studio-picker-cardinality.py
          rm .github/workflows/config-studio-picker-cardinality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/components/plugin-config-studio-form.tsx scripts/patch-config-studio-picker-cardinality.py .github/workflows/config-studio-picker-cardinality.yml
          git commit -m "fix: Discord PickerでSchema型を厳守"
          git push origin HEAD:feat/config-studio-discord-fields
