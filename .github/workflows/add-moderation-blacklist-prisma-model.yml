name: Add moderation blacklist Prisma model

on:
  push:
    branches:
      - feat/moderation-enforcement
    paths:
      - .github/workflows/add-moderation-blacklist-prisma-model.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-enforcement
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node scripts/add-moderation-blacklist-prisma-model.mjs
          pnpm --dir packages/db exec prisma format --schema prisma/schema.prisma
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Prisma schemaへModerationブラックリストを同期"
          git push origin HEAD:feat/moderation-enforcement
