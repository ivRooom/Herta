name: Temporary Mini Games v2 review contracts

on:
  push:
    branches:
      - feature/mini-games-v2-stats-challenges

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v2-stats-challenges
      - run: python3 .github/scripts/temp-mini-games-v2-review-contracts.py
      - name: Remove temporary files and commit
        run: |
          rm .github/scripts/temp-mini-games-v2-review-contracts.py
          rm .github/workflows/temporary-mini-games-v2-review-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins packages/plugin-catalog/src/manifests .github
          git commit -m "Mini Games v2のレビュー修正を回帰テストで固定する"
          git push origin HEAD:feature/mini-games-v2-stats-challenges
