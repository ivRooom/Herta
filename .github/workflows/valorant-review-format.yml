name: VALORANT review-fix formatter
on:
  push:
    branches: [feat/valorant-vc-random-20261029]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/valorant-vc-random-20261029
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format review fixes
        run: |
          pnpm exec prettier --write             apps/bot/src/plugins/valorant.ts             apps/bot/src/plugins/valorant.test.ts             apps/studio/src/components/valorant-config-form.tsx
      - name: Commit and remove temporary formatter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/valorant-review-format.yml
          git add apps/bot/src/plugins/valorant.ts             apps/bot/src/plugins/valorant.test.ts             apps/studio/src/components/valorant-config-form.tsx
          git commit -m "style(valorant): format reviewed fixes"
          git push origin HEAD:feat/valorant-vc-random-20261029
