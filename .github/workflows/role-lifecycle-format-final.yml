name: Format Role lifecycle final

on:
  push:
    branches:
      - feature/discord-role-lifecycle-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/discord-role-lifecycle-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/worker/src/discord-role-lifecycle.ts
      - run: git diff --check
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/discord-role-lifecycle.ts
          git commit -m 'style: Role lifecycle Workerを整形する'
          git push origin HEAD:feature/discord-role-lifecycle-v1
