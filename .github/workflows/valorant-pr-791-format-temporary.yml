# One-shot format normalization for PR #791. Remove before merge.
name: VALORANT PR 791 formatting temporary
on:
  push:
    branches:
      - feat/valorant-expired-embed-reconcile-779
permissions:
  contents: write
concurrency:
  group: valorant-pr-791-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/bot.ts apps/bot/src/plugins/valorant-expiry-reconcile.test.ts
      - name: Commit only the scoped formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/bot/src/bot.ts apps/bot/src/plugins/valorant-expiry-reconcile.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(valorant): format opt-in Canary scheduler and tests (#779)"
            git push origin HEAD:refs/heads/feat/valorant-expired-embed-reconcile-779
          fi
