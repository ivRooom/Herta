name: Repair birthday preset assets once

on:
  push:
    branches:
      - fix/birthday-card-preset-assets

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate valid WebP presets
        run: |
          cd apps/bot
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir } from 'node:fs/promises';
          import path from 'node:path';

          const width = 1672;
          const height = 941;
          const outputDir = path.resolve('../studio/public/birthday-card-presets');
          await mkdir(outputDir, { recursive: true });

          const presets = [
            {
              file: 'herta-night-board.webp',
              background: '#151127',
              accent: '#8d73d9',
              secondary: '#43376d',
            },
            {
              file: 'herta-lavender-tea.webp',
              background: '#f2eafd',
              accent: '#a687d9',
              secondary: '#d8c5ef',
            },
            {
              file: 'herta-lavender-gifts.webp',
              background: '#eee4fb',
              accent: '#8e70c8',
              secondary: '#c8afe8',
            },
          ];

          for (const preset of presets) {
            const svg = `
              <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
                <rect width="100%" height="100%" fill="${preset.background}"/>
                <circle cx="220" cy="190" r="280" fill="${preset.secondary}" opacity="0.55"/>
                <circle cx="1490" cy="120" r="250" fill="${preset.accent}" opacity="0.24"/>
                <circle cx="1380" cy="820" r="380" fill="${preset.secondary}" opacity="0.42"/>
                <path d="M0 760 C350 620 550 910 900 760 S1430 620 1672 760 L1672 941 L0 941 Z" fill="${preset.accent}" opacity="0.18"/>
                <g fill="none" stroke="${preset.accent}" stroke-width="8" opacity="0.3">
                  <circle cx="1120" cy="300" r="80"/>
                  <circle cx="1210" cy="370" r="38"/>
                  <path d="M90 590 Q350 390 640 590"/>
                </g>
              </svg>`;
            const outputPath = path.join(outputDir, preset.file);
            await sharp(Buffer.from(svg)).webp({ quality: 90 }).toFile(outputPath);
            const image = sharp(outputPath);
            const metadata = await image.metadata();
            if (metadata.format !== 'webp' || metadata.width !== width || metadata.height !== height) {
              throw new Error(`Invalid generated preset: ${preset.file}`);
            }
            await image.raw().toBuffer();
          }
          NODE
      - name: Commit repaired assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/public/birthday-card-presets/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "fix(birthday): replace invalid preset assets [skip ci]"
          git push
