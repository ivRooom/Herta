name: Role Manager format

on:
  push:
    branches:
      - feat/role-manager-v2-panels

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: |
          pnpm exec prettier --write apps/bot/src/plugins/role-manager.ts apps/bot/src/plugins/role-manager.test.ts
          if git diff --quiet -- apps/bot/src/plugins/role-manager.ts apps/bot/src/plugins/role-manager.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/role-manager.ts apps/bot/src/plugins/role-manager.test.ts
          git commit -m "Role Manager v2をPrettier整形する"
          git push
