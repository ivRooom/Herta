name: Temporary XP role format

on:
  push:
    branches:
      - feature/xp-reward-role-reconciliation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/xp-reward-role-reconciliation
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/bot/src/plugins/xp-reward-roles.ts
          apps/bot/src/plugins/xp-role-reconciliation-events.ts
      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/temporary-xp-role-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'XP報酬Role再同期コードをPrettierで整形する'
          git push origin HEAD:feature/xp-reward-role-reconciliation
