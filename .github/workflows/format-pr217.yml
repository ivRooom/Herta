name: Format PR 217

on:
  push:
    branches:
      - fix/minigames-runtime-and-spotify-secrets

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/minigames-runtime-and-spotify-secrets
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/bot/src/plugins/runtime-events.ts
          apps/bot/src/plugins/sync.ts
          apps/bot/src/plugins/runtime-events.test.ts
          apps/studio/src/lib/plugin-runtime-events.ts
          docker-compose.prod.yml
          .github/workflows/deploy-production.yml
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/bot/src/plugins/runtime-events.ts \
            apps/bot/src/plugins/sync.ts \
            apps/bot/src/plugins/runtime-events.test.ts \
            apps/studio/src/lib/plugin-runtime-events.ts \
            docker-compose.prod.yml \
            .github/workflows/deploy-production.yml
          git commit -m 'chore: apply Prettier to PR 217 [formatted]'
          git push origin HEAD:fix/minigames-runtime-and-spotify-secrets
