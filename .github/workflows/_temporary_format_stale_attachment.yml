name: Temporary format stale attachment

on:
  push:
    branches:
      - feat/studio-managed-access-policies-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/studio-managed-access-policies-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format attachment route
        run: pnpm exec prettier --write 'apps/studio/src/app/api/guilds/[guildId]/access-policies/attachments/route.ts'
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/studio/src/app/api/guilds/[guildId]/access-policies/attachments/route.ts'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format stale attachment cleanup'
          git push origin HEAD:feat/studio-managed-access-policies-v1
