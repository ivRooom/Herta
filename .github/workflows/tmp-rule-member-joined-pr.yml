name: Temporary Rule Member Joined PR Patch
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rule-studio-member-joined'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/rule-studio-member-joined
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tmp_rule_member_joined.py
      - name: Format
        run: |
          corepack enable
          pnpm prettier --write \
            apps/bot/src/rules/runtime.ts \
            apps/bot/src/rules/runtime.test.ts \
            apps/bot/src/bot.ts \
            apps/bot/src/main.ts \
            apps/studio/src/lib/rule-studio.ts \
            apps/studio/src/lib/rule-studio.test.ts \
            apps/studio/src/components/rule-studio-manager.tsx \
            'apps/studio/src/app/api/guilds/[guildId]/rules/route.ts'
      - name: Commit source changes when needed
        run: |
          if git diff --quiet -- apps/bot apps/studio; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot apps/studio
          git commit -m 'feat(rule-engine): add member joined trigger'
          git push origin HEAD:feat/rule-studio-member-joined
