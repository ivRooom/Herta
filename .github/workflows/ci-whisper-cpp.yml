name: VC Recap C++ Whisper security spike

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/whisper-cpp/**'
      - '.github/workflows/ci-whisper-cpp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whispercpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-native:
    name: Static CPU / ${{ matrix.arch }} / Grype
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      SYFT_VERSION: 1.44.0
      GRYPE_VERSION: 0.112.0
      GRYPE_DB_AUTO_UPDATE: 'false'
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Build scratch final image on native CPU architecture
        run: |
          set -euo pipefail
          docker build --platform "linux/${{ matrix.arch }}" -t herta-whispercpp:ci ./services/whisper-cpp
          test "$(docker image inspect --format '{{.Architecture}}' herta-whispercpp:ci)" = "${{ matrix.arch }}"

      - name: Synthetic contract self-test (no model or participant audio)
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /app/herta-whisper-cpp herta-whispercpp:ci --self-test
          # A service must not start without pinned local model + private token.
          if docker run --rm herta-whispercpp:ci; then
            echo 'ERROR: model/token missing, but native worker started' >&2
            exit 1
          fi
          # Scratch image must have only the static executable, with no package manager.
          docker image inspect herta-whispercpp:ci --format 'CPU image size bytes: {{.Size}}'

      - name: Install pinned Syft and Grype
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/whisper-security"
          mkdir -p "$dir"
          for item in "syft:${SYFT_VERSION}" "grype:${GRYPE_VERSION}"; do
            tool="${item%%:*}"
            ver="${item#*:}"
            asset="${tool}_${ver}_linux_${{ matrix.arch }}.tar.gz"
            checksums="${tool}_${ver}_checksums.txt"
            url="https://github.com/anchore/${tool}/releases/download/v${ver}"
            curl --fail --location --retry 3 --output "$dir/$asset" "$url/$asset"
            curl --fail --location --retry 3 --output "$dir/$checksums" "$url/$checksums"
            ( cd "$dir" && grep "  $asset$" "$checksums" | sha256sum --check --strict - )
            tar -xzf "$dir/$asset" -C "$dir" "$tool"
          done
          echo "$dir" >> "$GITHUB_PATH"

      - name: Update Grype vulnerability database
        run: grype db update

      - name: Generate SBOM and reject any High/Critical vulnerability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security
          syft herta-whispercpp:ci -o cyclonedx-json=reports/security/whispercpp-${{ matrix.arch }}.cdx.json
          grype herta-whispercpp:ci --fail-on high             --output json > reports/security/whispercpp-${{ matrix.arch }}.grype.json

      - name: Synthetic GGML model load and private HTTP smoke (amd64 only)
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          # CI runner only. Never download GGML weights on production.
          bash services/whisper-cpp/stage_model_offhost.sh "$RUNNER_TEMP/herta-ggml-test"
          test -s "$RUNNER_TEMP/herta-ggml-test/ggml-tiny.bin"
          test_token='synthetic-ci-token-32-characters-verified-only'
          docker run -d --name herta-whispercpp-smoke \
            --memory=768m --cpus=1 --pids-limit=96 --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs=/tmp:rw,noexec,nosuid,size=16m \
            -p 127.0.0.1:8765:8765 \
            -v "$RUNNER_TEMP/herta-ggml-test/ggml-tiny.bin:/models/ggml-tiny.bin:ro" \
            -e WHISPER_MODEL_PATH=/models/ggml-tiny.bin \
            -e VC_RECAP_LOCAL_WHISPER_TOKEN="$test_token" \
            herta-whispercpp:ci
          trap 'docker rm -f herta-whispercpp-smoke >/dev/null 2>&1 || true' EXIT
          timeout 150 python3 - <<'PY'
          import json
          import subprocess
          import threading
          import time
          import urllib.request
          import urllib.error

          base = 'http://127.0.0.1:8765'
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(base + '/healthz', timeout=2) as resp:
                      assert resp.status == 200
                      assert json.loads(resp.read())['status'] == 'ready'
                  break
              except (OSError, urllib.error.URLError):
                  time.sleep(1)
          else:
              raise RuntimeError('Whisper C++ model did not become healthy')

          pcm = b'\x00\x00' * 48000  # generated 1s silence only; no participant audio
          headers = {'Content-Type':'application/octet-stream','X-Audio-Sample-Rate':'48000'}
          request = urllib.request.Request(base+'/v1/transcribe', data=pcm, headers=headers)
          try:
              urllib.request.urlopen(request,timeout=5)
              raise AssertionError('Unauthenticated audio was accepted')
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          headers['Authorization'] = 'Bearer synthetic-ci-token-32-characters-verified-only'
          # Sample the combined parent+child cgroup *during* native inference.
          # Post-inference docker stats omits the short-lived child and is misleading.
          # CI samples are not production peak RSS measurements.
          def sampled_request(request, label, timeout):
              samples = []
              stop = threading.Event()
              def sample_memory():
                  while not stop.is_set():
                      try:
                          raw = subprocess.check_output(
                              ['docker', 'stats', '--no-stream', '--format', '{{.MemUsage}}',
                               'herta-whispercpp-smoke'],
                              text=True, timeout=4,
                          ).strip().splitlines()[0]
                          used = raw.split('/', 1)[0].strip()
                          for unit, factor in (
                              ('GiB', 1024**3), ('MiB', 1024**2),
                              ('KiB', 1024), ('B', 1),
                          ):
                              if used.endswith(unit):
                                  samples.append(int(float(used[:-len(unit)]) * factor))
                                  break
                      except (OSError, ValueError, IndexError, subprocess.SubprocessError):
                          pass  # The sample count assertion below fails closed.
                      stop.wait(0.15)
              sampler = threading.Thread(target=sample_memory, daemon=True)
              sampler.start()
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as resp:
                      assert resp.status == 200, resp.status
                      body = json.loads(resp.read())
              finally:
                  stop.set()
                  sampler.join(timeout=6)
              assert not sampler.is_alive(), 'memory sampler did not terminate'
              assert samples, 'no in-flight container memory samples were captured'
              elapsed = time.monotonic() - started
              print(
                  'Synthetic', label, 'inference elapsed_seconds=', round(elapsed, 2),
                  'sampled_peak_container_mib=', round(max(samples) / 1048576, 2),
                  'sample_count=', len(samples),
                  '(sampling can miss instantaneous peak; NOT production RSS)',
              )
              return body, elapsed

          request = urllib.request.Request(base+'/v1/transcribe',data=pcm,headers=headers)
          body, _ = sampled_request(request, '1s silence', 90)
          assert isinstance(body.get('text'),str)
          assert len(body['text']) <= 4000

          # Verify a full 8s PCM chunk completes within the bot's 20s stop
          # flush budget on an isolated 1-vCPU CI worker. This is a synthetic
          # smoke, not a Japanese CER or 2GB Lightsail acceptance benchmark.
          pcm8 = bytes(48000 * 8 * 2)
          request8 = urllib.request.Request(base+'/v1/transcribe',data=pcm8,headers=headers)
          result8, elapsed = sampled_request(request8, '8s silence', 45)
          assert isinstance(result8.get('text'),str)
          assert elapsed < 20, '8s local chunk exceeds the current 20s stop flush budget'

          # A client-side consent withdrawal closes the HTTP socket. Assert
          # the actual native decode subprocess disappears promptly, not just
          # the HTTP request, and the worker stays available afterwards.
          import socket
          import subprocess
          request_headers = (
              'POST /v1/transcribe HTTP/1.1\r\n'
              'Host: 127.0.0.1\r\n'
              'Authorization: Bearer synthetic-ci-token-32-characters-verified-only\r\n'
              'Content-Type: application/octet-stream\r\n'
              'X-Audio-Sample-Rate: 48000\r\n'
              f'Content-Length: {len(pcm8)}\r\n'
              'Connection: close\r\n\r\n'
          ).encode()
          conn = socket.create_connection(('127.0.0.1', 8765), timeout=5)
          try:
              conn.sendall(request_headers + pcm8)
              for attempt in range(45):
                  processes = subprocess.check_output(
                      ['docker', 'top', 'herta-whispercpp-smoke', '-eo', 'pid,args'],
                      text=True,
                  )
                  if '--infer-child' in processes:
                      break
                  time.sleep(.1)
              else:
                  raise AssertionError('native decode child never started')
          finally:
              # Equivalent to aborting the in-flight fetch on withdrawal.
              conn.close()
          for attempt in range(45):
              processes = subprocess.check_output(
                  ['docker', 'top', 'herta-whispercpp-smoke', '-eo', 'pid,args'],
                  text=True,
              )
              if '--infer-child' not in processes:
                  break
              time.sleep(.1)
          else:
              raise AssertionError('native decode subprocess survived HTTP abort')
          print('Synthetic HTTP withdrawal killed and reaped native decode child')
          with urllib.request.urlopen(
              urllib.request.Request(
                  base+'/v1/transcribe',
                  data=pcm,
                  headers=headers,
              ), timeout=45
          ) as resp:
              assert resp.status == 200
              assert isinstance(json.loads(resp.read()).get('text'), str)
          PY
          docker stats herta-whispercpp-smoke --no-stream \
            --format 'CI sample: name={{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}}'

      - name: Upload security evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whispercpp-security-${{ matrix.arch }}-${{ github.run_id }}
          path: reports/security
          if-no-files-found: warn
          retention-days: 14
