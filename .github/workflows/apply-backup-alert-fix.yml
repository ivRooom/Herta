name: Apply Backup Alert Fix

on:
  push:
    branches: [fix/backup-alert-metric-failure]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backup-alert-metric-failure

      - name: メトリクス障害時も通知を継続する
        run: |
          python3 - <<'PY'
          from pathlib import Path

          template_path = Path('deploy/aws/backup-monitoring/template.yml')
          template = template_path.read_text()
          old = '''              cloudwatch.put_metric_data(Namespace=MONITORING_NAMESPACE, MetricData=metric_data)
'''
          new = '''              try:
                  cloudwatch.put_metric_data(
                      Namespace=MONITORING_NAMESPACE,
                      MetricData=metric_data,
                  )
              except Exception as error:
                  print(
                      json.dumps(
                          {
                              "level": "warning",
                              "event": "cloudwatch_metric_publish_failed",
                              "error": str(error),
                          }
                      )
                  )
'''
          if old not in template:
              raise SystemExit('メトリクス送信処理の置換対象が見つかりません')
          template_path.write_text(template.replace(old, new, 1))

          workflow_path = Path('.github/workflows/backup-monitoring-iac-ci.yml')
          workflow = workflow_path.read_text()
          marker = "          grep -q 'LatestBackupAgeHours' \"$template\"\n"
          addition = (
              marker
              + "          grep -q 'cloudwatch_metric_publish_failed' \"$template\"\n"
              + "          grep -q 'except Exception as error:' \"$template\"\n"
          )
          if marker not in workflow:
              raise SystemExit('CI検証の挿入位置が見つかりません')
          workflow_path.write_text(workflow.replace(marker, addition, 1))

          docs_path = Path('docs/BACKUP_MONITORING_IAC.md')
          docs = docs_path.read_text()
          marker = '各メトリクスには`FunctionName`ディメンションが付与されます。\n'
          addition = marker + (
              '\nCloudWatchへのメトリクス送信はベストエフォートです。'
              '`PutMetricData`が失敗した場合は`cloudwatch_metric_publish_failed`を警告ログへ記録し、'
              'バックアップ未検出・鮮度超過時のSNS通知処理は継続します。\n'
          )
          if marker not in docs:
              raise SystemExit('Runbookの挿入位置が見つかりません')
          docs_path.write_text(docs.replace(marker, addition, 1))
          PY

      - name: 整形と構文を検証する
        run: |
          npx --yes prettier@3.9.6 --write \
            .github/workflows/backup-monitoring-iac-ci.yml \
            deploy/aws/backup-monitoring/template.yml \
            docs/BACKUP_MONITORING_IAC.md
          bash -n deploy/aws/backup-monitoring/deploy.sh

      - name: 修正をコミットする
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/backup-monitoring-iac-ci.yml \
            deploy/aws/backup-monitoring/template.yml \
            docs/BACKUP_MONITORING_IAC.md
          git commit -m 'fix: メトリクス障害時もバックアップ通知を継続する'
          git push origin HEAD:fix/backup-alert-metric-failure
