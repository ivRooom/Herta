name: Wire Onboarding v1

on:
  push:
    branches:
      - feat/onboarding-v1

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire plugin registry and member remove event
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/bot/src/plugins/registry.ts')
          text = path.read_text()
          replacements = [
              (
                  "import { channelPolicyPlugin } from './channel-policy.js';\nimport { roleManagerPlugin } from './role-manager.js';",
                  "import { channelPolicyPlugin } from './channel-policy.js';\nimport { onboardingPlugin } from './onboarding.js';\nimport { roleManagerPlugin } from './role-manager.js';",
              ),
              (
                  "  'moderation',\n  'quote',",
                  "  'moderation',\n  'onboarding',\n  'quote',",
              ),
              (
                  "  const quoteEntry = deps\n    ? toRuntimePluginEntry(",
                  "  const onboardingEntry = deps\n"
                  "    ? toRuntimePluginEntry(\n"
                  "        onboardingPlugin,\n"
                  "        (plugin, guildId, config) =>\n"
                  "          createPluginContext({\n"
                  "            client: deps.client,\n"
                  "            prisma: deps.prisma,\n"
                  "            logger: deps.logger,\n"
                  "            guildId,\n"
                  "            config,\n"
                  "            manifest: plugin.manifest,\n"
                  "          }) as Parameters<NonNullable<typeof onboardingPlugin.onEnable>>[0],\n"
                  "      )\n"
                  "    : undefined;\n"
                  "  const quoteEntry = deps\n"
                  "    ? toRuntimePluginEntry(",
              ),
              (
                  "    if (pluginId === 'moderation' && moderationEntry) return [moderationEntry];\n    if (pluginId === 'quote' && quoteEntry) return [quoteEntry];",
                  "    if (pluginId === 'moderation' && moderationEntry) return [moderationEntry];\n    if (pluginId === 'onboarding' && onboardingEntry) return [onboardingEntry];\n    if (pluginId === 'quote' && quoteEntry) return [quoteEntry];",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'registry anchor not found: {old[:40]}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('apps/bot/src/bot.ts')
          text = path.read_text()
          old = (
              "    this.client.on(Events.GuildMemberAdd, async (member) => {\n"
              "      await this.dispatchGuildPluginEvent(member.guild.id, Events.GuildMemberAdd, member);\n"
              "    });\n\n"
              "    this.client.on(Events.MessageCreate, async (message) => {"
          )
          new = (
              "    this.client.on(Events.GuildMemberAdd, async (member) => {\n"
              "      await this.dispatchGuildPluginEvent(member.guild.id, Events.GuildMemberAdd, member);\n"
              "    });\n\n"
              "    this.client.on(Events.GuildMemberRemove, async (member) => {\n"
              "      await this.dispatchGuildPluginEvent(member.guild.id, Events.GuildMemberRemove, member);\n"
              "    });\n\n"
              "    this.client.on(Events.MessageCreate, async (message) => {"
          )
          if old not in text:
              raise SystemExit('GuildMemberAdd anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/bot/src/plugins/registry.ts apps/bot/src/bot.ts apps/bot/src/plugins/onboarding.ts apps/bot/src/plugins/onboarding.test.ts packages/plugin-catalog/src/index.ts packages/plugin-catalog/src/manifests/onboarding.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins/registry.ts apps/bot/src/bot.ts apps/bot/src/plugins/onboarding.ts apps/bot/src/plugins/onboarding.test.ts packages/plugin-catalog/src/index.ts packages/plugin-catalog/src/manifests/onboarding.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "OnboardingをBot Runtimeへ接続する"
          git push
