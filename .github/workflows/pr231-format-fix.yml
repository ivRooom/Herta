name: PR231 Format Fix

on:
  push:
    branches:
      - feature/plugin-field-permissions-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/plugin-field-permissions-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format PR231 files
        run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/api/guilds/[guildId]/plugins/[pluginId]/route.ts' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/roles/plugins/page.tsx' \
            'apps/studio/src/components/plugin-permission-manager.tsx'
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'apps/studio/src/app/api/guilds/[guildId]/plugins/[pluginId]/route.ts' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/roles/plugins/page.tsx' \
            'apps/studio/src/components/plugin-permission-manager.tsx'
          if ! git diff --cached --quiet; then
            git commit -m 'style: format plugin permission files'
            git push origin HEAD:feature/plugin-field-permissions-v1
          fi
