name: Database topology contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: bash deploy/scripts/deploy-common.test.sh
      - run: bash deploy/scripts/database-mode.test.sh
      - run: node --test deploy/scripts/external-database.test.mjs
      - run: node --test deploy/scripts/production-quality-gate.test.mjs
      - run: python3 deploy/scripts/compose-database.test.py
      - run: python3 deploy/scripts/pg17-cutover-controller.test.py
      - run: sudo python3 deploy/scripts/pg17-source-fence.test.py
      - run: sudo python3 deploy/scripts/pg17-process-unit.test.py
      - run: sudo python3 deploy/scripts/pg17-source-watchdog.test.py
