name: Temporary Integrate Achievements v1

on:
  push:
    branches:
      - feat/achievements-v1

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/achievements-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate Achievements v1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('packages/plugin-catalog/src/index.ts')
          text = index.read_text()
          if "./manifests/achievements.js" not in text:
              text = text.replace("import { afkManifest } from './manifests/afk.js';", "import { achievementsManifest } from './manifests/achievements.js';\nimport { afkManifest } from './manifests/afk.js';")
              text = text.replace("export { afkManifest } from './manifests/afk.js';", "export { achievementsManifest } from './manifests/achievements.js';\nexport { afkManifest } from './manifests/afk.js';")
              text = text.replace("const pluginManifests: PluginManifest[] = [\n  afkManifest,", "const pluginManifests: PluginManifest[] = [\n  achievementsManifest,\n  afkManifest,")
          index.write_text(text)

          registry = Path('apps/bot/src/plugins/registry.ts')
          text = registry.read_text()
          if "./achievements.js" not in text:
              text = text.replace("import { afkPlugin } from './afk.js';", "import { achievementsPlugin } from './achievements.js';\nimport { afkPlugin } from './afk.js';")
              text = text.replace("const officialPluginIds = [\n  'afk',", "const officialPluginIds = [\n  'achievements',\n  'afk',")
              anchor = "function createOfficialEntries(deps?: DefaultPluginRegistryDeps): RuntimePluginEntry[] {\n  const afkEntry = deps"
              replacement = "function createOfficialEntries(deps?: DefaultPluginRegistryDeps): RuntimePluginEntry[] {\n  const achievementsEntry = deps\n    ? toRuntimePluginEntry(\n        achievementsPlugin,\n        (plugin, guildId, config) =>\n          createPluginContext({\n            client: deps.client,\n            prisma: deps.prisma,\n            logger: deps.logger,\n            guildId,\n            config,\n            manifest: plugin.manifest,\n          }) as Parameters<NonNullable<typeof achievementsPlugin.onEnable>>[0],\n      )\n    : undefined;\n  const afkEntry = deps"
              if anchor not in text:
                  raise SystemExit('registry entry anchor missing')
              text = text.replace(anchor, replacement, 1)
              text = text.replace("  return officialPluginIds.flatMap((pluginId) => {\n    if (pluginId === 'afk' && afkEntry) return [afkEntry];", "  return officialPluginIds.flatMap((pluginId) => {\n    if (pluginId === 'achievements' && achievementsEntry) return [achievementsEntry];\n    if (pluginId === 'afk' && afkEntry) return [afkEntry];", 1)
          registry.write_text(text)

          schema = Path('packages/db/prisma/schema.prisma')
          text = schema.read_text()
          marker = '// ============================================================\n// Plugin: Auto Response\n// ============================================================'
          model = '''// ============================================================
          // Plugin: Achievements / Badges
          // ============================================================

          model AchievementUnlock {
            guildId       String   @map("guild_id")
            userId        String   @map("user_id")
            achievementId String   @map("achievement_id")
            unlockedAt    DateTime @default(now()) @map("unlocked_at") @db.Timestamptz(3)

            @@id([guildId, userId, achievementId])
            @@index([guildId, userId, unlockedAt(sort: Desc)])
            @@index([guildId, achievementId, unlockedAt(sort: Desc)])
            @@map("achievement_unlocks")
          }

          '''
          if 'model AchievementUnlock {' not in text:
              if marker not in text:
                  raise SystemExit('schema marker missing')
              text = text.replace(marker, model + marker, 1)
          schema.write_text(text)

          overview = Path('apps/studio/src/components/plugin-setup-overview.tsx')
          text = overview.read_text()
          if 'achievements: [' not in text:
              text = text.replace("const pluginSetupNotes: Record<string, string[]> = {\n  'auto-response': [", "const pluginSetupNotes: Record<string, string[]> = {\n  achievements: [\n    'Achievementsは既存のXP・Poll・Giveaway・Event・Suggestion活動を読み取り、/achievements または /achievement sync 実行時に解除状態を同期します。',\n    'Secret Achievementを有効にすると、解除するまで条件と名称を一覧から隠せます。',\n  ],\n  'auto-response': [", 1)
          overview.write_text(text)
          PY

          pnpm exec prettier --write \
            packages/plugin-catalog/src/manifests/achievements.ts \
            packages/plugin-catalog/src/index.ts \
            apps/bot/src/plugins/achievements-repository.ts \
            apps/bot/src/plugins/achievements.ts \
            apps/bot/src/plugins/achievements.test.ts \
            apps/bot/src/plugins/registry.ts \
            apps/studio/src/components/plugin-setup-overview.tsx
          pnpm --filter @herta/db exec prisma format --schema prisma/schema.prisma
          pnpm --filter @herta/plugin-catalog build
          pnpm --filter @herta/bot test -- achievements.test.ts
          pnpm typecheck
          git rm .github/workflows/tmp-integrate-achievements.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages apps
          git commit -m 'Achievements v1を公式Pluginへ統合する'
          git push origin HEAD:feat/achievements-v1
