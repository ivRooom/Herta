# ============================================================
# Fallback Verify — Herta self-hosted runner pilot
# ------------------------------------------------------------
# Purpose: emergency fallback for when GitHub-hosted Actions
# minutes are exhausted. Normally DISABLED: the job only runs
# when the repository variable HERTA_FALLBACK_RUNNER_ENABLED
# is exactly "true" AND a runner with the label
# "herta-fallback" is online.
#
# This is a reduced subset of ci.yml's verify job: steps that
# need a Docker daemon (docker compose config, docker run
# caddy/nginx validation) are intentionally excluded because
# the fallback runner has no Docker access by design.
# ============================================================
name: Fallback Verify (self-hosted pilot)

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: fallback-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fallback:
    name: Fallback Verify (format / lint / typecheck / test / build)
    if: vars.HERTA_FALLBACK_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, linux, X64, herta-fallback]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Verify the CI Node.js security patch level
        run: test "$(node --version)" = v22.23.4

      - run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck --concurrency=1

      - name: Test
        run: pnpm test --concurrency=1

      - name: Build
        run: pnpm build --concurrency=1
