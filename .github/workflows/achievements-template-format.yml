name: Achievement Template Format

on:
  push:
    branches:
      - feature/achievements-v3-2-template-gallery
    paths:
      - 'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/templates/page.tsx'
      - 'apps/studio/src/components/achievement-template-gallery.tsx'
      - 'apps/studio/src/lib/achievement-templates.ts'
      - 'apps/studio/src/lib/achievement-templates.test.ts'
      - '.github/workflows/achievements-template-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/achievements-v3-2-template-gallery
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Template Gallery files
        run: >-
          pnpm exec prettier --write
          'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/templates/page.tsx'
          'apps/studio/src/components/achievement-template-gallery.tsx'
          'apps/studio/src/lib/achievement-templates.ts'
          'apps/studio/src/lib/achievement-templates.test.ts'
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/studio/src/app/dashboard/guilds/[guildId]/achievements/templates/page.tsx' apps/studio/src/components/achievement-template-gallery.tsx apps/studio/src/lib/achievement-templates.ts apps/studio/src/lib/achievement-templates.test.ts
          git commit -m 'Achievement Template Galleryのコード整形を適用'
          git push origin HEAD:feature/achievements-v3-2-template-gallery
