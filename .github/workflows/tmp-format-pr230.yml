name: Temp format PR230

on:
  push:
    branches:
      - feature/studio-role-policy-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-role-policy-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/bot/src/health/guild-members.ts \
            apps/studio/src/lib/bot-guild-members.ts \
            apps/studio/src/lib/studio-access-policy.ts \
            apps/studio/src/lib/studio-access-policy.test.ts \
            apps/studio/src/lib/studio-role-policy-store.ts \
            apps/studio/src/lib/studio-access.ts \
            'apps/studio/src/app/api/guilds/[guildId]/role-policies/route.ts' \
            apps/studio/src/components/role-policy-manager.tsx \
            'apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx' \
            apps/studio/src/lib/studio-selected-server-navigation.ts \
            apps/studio/src/lib/studio-selected-server-navigation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/bot/src/health/guild-members.ts apps/studio/src
          git commit -m 'style: format Role Manager implementation'
          git push origin HEAD:feature/studio-role-policy-v1
