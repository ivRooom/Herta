name: Temporary Prettier Core Utility v3

on:
  push:
    branches:
      - tmp/prettier-core-utility-v3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/commands/utility-v3.ts
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/commands/utility-v3.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Core Utility v3をPrettierで整形する"
          git push
