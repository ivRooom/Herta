name: Team Split User Picker

on:
  push:
    branches:
      - feat/team-split-user-picker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/team-split-user-picker
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: mainを取り込む
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
      - name: Team Split参加者をUser Pickerへ移行
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/studio/src/components/team-split-manager.tsx')
          text = path.read_text()

          channel_import = "import { DiscordChannelPicker } from './discord-entity-picker';"
          user_import = "import { DiscordUserPicker } from './discord-user-picker';"
          if user_import not in text:
              if channel_import not in text:
                  raise SystemExit('DiscordChannelPicker import not found')
              text = text.replace(channel_import, channel_import + "\n" + user_import, 1)

          marker = 'placeholder="DiscordユーザーID"'
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit('participant ID placeholder not found')
          input_start = text.rfind('<input', 0, marker_index)
          input_end = text.find('/>', marker_index)
          if input_start < 0 or input_end < 0:
              raise SystemExit('participant ID input boundary not found')
          input_end += 2
          replacement = '''<div className="mt-3">
                <DiscordUserPicker
                  guildId={guildId}
                  value={participantUserId || null}
                  includeBots={false}
                  placeholder="ユーザー名・表示名・IDで検索"
                  onChange={(next) =>
                    setParticipantUserId(Array.isArray(next) ? (next[0] ?? '') : (next ?? ''))
                  }
                />
              </div>'''
          text = text[:input_start] + replacement + text[input_end:]

          form_start = text.find('<form onSubmit={addParticipant}')
          if form_start < 0:
              raise SystemExit('addParticipant form not found')
          form_end = text.find('</form>', form_start)
          if form_end < 0:
              raise SystemExit('addParticipant form end not found')
          segment = text[form_start:form_end]
          old_disabled = "disabled={!pluginEnabled || loading || detail.session.status !== 'open'}"
          new_disabled = "disabled={!pluginEnabled || loading || !participantUserId || detail.session.status !== 'open'}"
          if old_disabled not in segment:
              raise SystemExit('participant submit disabled condition not found')
          segment = segment.replace(old_disabled, new_disabled, 1)
          text = text[:form_start] + segment + text[form_end:]

          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/studio/src/components/team-split-manager.tsx
      - run: pnpm --dir apps/studio typecheck
      - name: 変更をcommitして一時Workflowを削除
        run: |
          git rm .github/workflows/team-split-user-picker.yml
          git add apps/studio/src/components/team-split-manager.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: Team Split参加者をUser Pickerで選択可能にする"
          git push origin HEAD:feat/team-split-user-picker
