name: Herta temporary format diagnostics
on:
  pull_request:
    paths:
      - ".github/workflows/herta-format-diagnostics.yml"
jobs:
  preview:
    if: ${{ github.head_ref == 'codex/herta-pg17-restore-acl-gate-20261101' && github.event.pull_request.head.repo.full_name == 'ivRooom/Herta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Produce machine-readable formatted source-only files
        run: |
          pnpm exec prettier --write .github/workflows/herta-pg17-restore-acl.yml docs/HERTA_PG17_RESTORE_ACL_GATE.md docs/LIGHTSAIL_PG17_HERTA_CUTOVER.md
          echo 'FORMAT_JSON_BEGIN'
          node -e 'const fs=require("fs"); const x=[".github/workflows/herta-pg17-restore-acl.yml","docs/HERTA_PG17_RESTORE_ACL_GATE.md","docs/LIGHTSAIL_PG17_HERTA_CUTOVER.md"];console.log(JSON.stringify(Object.fromEntries(x.map(p=>[p,fs.readFileSync(p,"utf8")]))))'
          echo 'FORMAT_JSON_END'
