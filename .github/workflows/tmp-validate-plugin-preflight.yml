name: Temporary Plugin Preflight Validate

on:
  push:
    branches:
      - feat/plugin-hub-guild-preflight
    paths:
      - .github/workflows/tmp-validate-plugin-preflight.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugin-hub-guild-preflight
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/studio/src/components/plugin-hub-guild-preflight.tsx apps/studio/src/app/dashboard/custom-plugins/page.tsx apps/studio/src/lib/plugin-hub-preflight.ts apps/studio/src/lib/plugin-hub-preflight.test.ts apps/studio/src/lib/guild-plugins.ts apps/studio/package.json
      - run: pnpm db:generate
      - run: pnpm --filter @herta/studio typecheck
      - run: pnpm --filter @herta/studio test
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-validate-plugin-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Plugin Hub Guild Preflightのレビュー指摘を反映"
          git push origin HEAD:feat/plugin-hub-guild-preflight
