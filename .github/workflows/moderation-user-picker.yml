name: Moderation User Picker

on:
  push:
    branches:
      - feat/moderation-user-picker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-user-picker
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-moderation-user-picker.py
      - run: pnpm exec prettier --write apps/studio/src/components/moderation-config-form.tsx
      - run: pnpm --dir apps/studio typecheck
      - name: commitして一時ファイルを削除
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/moderation-user-picker.yml scripts/patch-moderation-user-picker.py
          git add apps/studio/src/components/moderation-config-form.tsx
          git commit -m "feat: Moderation除外Userを検索式Pickerへ移行"
          git push origin HEAD:feat/moderation-user-picker
