name: Apply status-ingest review fixes

on:
  push:
    branches: [feat/oci-status-ingest]
    paths:
      - '.github/workflows/apply-status-ingest-review-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/oci-status-ingest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: レビュー修正を適用
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('services/status-ingest/status_ingest.py')
          test_path = Path('services/status-ingest/test_app.py')
          docs_path = Path('docs/STATUS_INGEST_OCI.md')

          source = source_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')
          docs = docs_path.read_text(encoding='utf-8')

          if 'request_fingerprint TEXT NOT NULL' in source:
              print('レビュー修正は適用済みです。')
              raise SystemExit(0)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '''                CREATE TABLE IF NOT EXISTS status_nonces (\n                    nonce TEXT PRIMARY KEY,\n                    received_at_epoch INTEGER NOT NULL\n                );''',
              '''                CREATE TABLE IF NOT EXISTS status_nonces (\n                    nonce TEXT PRIMARY KEY,\n                    request_fingerprint TEXT NOT NULL,\n                    received_at_epoch INTEGER NOT NULL\n                );''',
              'nonce schema',
          )

          source = replace_once(
              source,
              '''        nonce: str,\n        request_id: str,\n        payload: dict[str, Any],\n        received_at: datetime,\n    ) -> None:''',
              '''        nonce: str,\n        request_fingerprint: str,\n        request_id: str,\n        payload: dict[str, Any],\n        received_at: datetime,\n    ) -> bool:''',
              'save signature',
          )

          source = replace_once(
              source,
              '''                connection.execute(\n                    "INSERT INTO status_nonces(nonce, received_at_epoch) VALUES (?, ?)",\n                    (nonce, received_epoch),\n                )\n                connection.execute(''',
              '''                existing_nonce = connection.execute(\n                    "SELECT request_fingerprint FROM status_nonces WHERE nonce = ?",\n                    (nonce,),\n                ).fetchone()\n                if existing_nonce is not None:\n                    connection.execute("ROLLBACK")\n                    if hmac.compare_digest(\n                        existing_nonce["request_fingerprint"],\n                        request_fingerprint,\n                    ):\n                        return False\n                    raise RequestError(\n                        HTTPStatus.CONFLICT,\n                        "replayed_nonce",\n                        "同じNonceを異なるリクエストへ再利用できません",\n                    )\n\n                connection.execute(\n                    """\n                    INSERT INTO status_nonces(\n                        nonce, request_fingerprint, received_at_epoch\n                    ) VALUES (?, ?, ?)\n                    """,\n                    (nonce, request_fingerprint, received_epoch),\n                )\n                connection.execute(''',
              'nonce insert',
          )

          source = replace_once(
              source,
              '''                connection.execute("COMMIT")\n            except sqlite3.IntegrityError as error:\n                connection.execute("ROLLBACK")\n                if "status_nonces.nonce" in str(error):\n                    raise RequestError(\n                        HTTPStatus.CONFLICT,\n                        "replayed_nonce",\n                        "同じNonceは再利用できません",\n                    ) from error\n                raise\n            except Exception:''',
              '''                connection.execute("COMMIT")\n                return True\n            except sqlite3.IntegrityError:\n                connection.execute("ROLLBACK")\n                raise\n            except Exception:''',
              'save return',
          )

          source = replace_once(
              source,
              '''class StatusHandler(BaseHTTPRequestHandler):\n    server: StatusServer\n    protocol_version = "HTTP/1.1"''',
              '''class StatusHandler(BaseHTTPRequestHandler):\n    server: StatusServer\n    protocol_version = "HTTP/1.1"\n    timeout = 30''',
              'socket timeout',
          )

          source = replace_once(
              source,
              '''        if content_length <= 0 or content_length > self.server.config.max_body_bytes:\n            raise RequestError(\n                HTTPStatus.REQUEST_ENTITY_TOO_LARGE,\n                "payload_too_large",\n                "リクエスト本文が上限を超えています",\n            )''',
              '''        if content_length <= 0:\n            raise RequestError(\n                HTTPStatus.BAD_REQUEST,\n                "invalid_content_length",\n                "Content-Lengthが不正です",\n            )\n        if content_length > self.server.config.max_body_bytes:\n            raise RequestError(\n                HTTPStatus.REQUEST_ENTITY_TOO_LARGE,\n                "payload_too_large",\n                "リクエスト本文が上限を超えています",\n            )''',
              'content length',
          )

          source = replace_once(
              source,
              '''        timestamp_epoch, nonce = self._verify_signature(body)\n        payload = validate_payload(''',
              '''        timestamp_epoch, nonce, request_fingerprint = self._verify_signature(body)\n        payload = validate_payload(''',
              'verify return usage',
          )

          source = replace_once(
              source,
              '''        self.server.store.save_observation(\n            nonce=nonce,\n            request_id=request_id,\n            payload=payload,\n            received_at=received_at,\n        )\n        self._send_json(''',
              '''        created = self.server.store.save_observation(\n            nonce=nonce,\n            request_fingerprint=request_fingerprint,\n            request_id=request_id,\n            payload=payload,\n            received_at=received_at,\n        )\n        self._send_json(''',
              'save call',
          )

          source = replace_once(
              source,
              '''                "accepted": True,\n                "request_id": request_id,''',
              '''                "accepted": True,\n                "duplicate": not created,\n                "request_id": request_id,''',
              'duplicate response',
          )

          source = replace_once(
              source,
              '''    def _verify_signature(self, body: bytes) -> tuple[int, str]:''',
              '''    def _verify_signature(self, body: bytes) -> tuple[int, str, str]:''',
              'verify return type',
          )

          source = replace_once(
              source,
              '''        return timestamp_epoch, nonce''',
              '''        request_fingerprint = hashlib.sha256(canonical).hexdigest()\n        return timestamp_epoch, nonce, request_fingerprint''',
              'fingerprint return',
          )

          source = replace_once(
              source,
              '''    if payload["status"] not in OVERALL_STATUSES:''',
              '''    status_value = payload["status"]\n    if not isinstance(status_value, str) or status_value not in OVERALL_STATUSES:''',
              'overall status type',
          )

          source = replace_once(
              source,
              '''    if any(checks[key] not in CHECK_STATUSES for key in CHECK_KEYS):''',
              '''    if any(\n        not isinstance(checks[key], str) or checks[key] not in CHECK_STATUSES\n        for key in CHECK_KEYS\n    ):''',
              'check status type',
          )

          source = replace_once(
              source,
              '''    if observed_at > sent_at:\n        raise RequestError(\n            HTTPStatus.UNPROCESSABLE_ENTITY,\n            "invalid_payload",\n            "observed_atはsent_at以前である必要があります",\n        )\n    return payload''',
              '''    if observed_at > sent_at:\n        raise RequestError(\n            HTTPStatus.UNPROCESSABLE_ENTITY,\n            "invalid_payload",\n            "observed_atはsent_at以前である必要があります",\n        )\n    payload["observed_at"] = format_rfc3339(observed_at)\n    payload["sent_at"] = format_rfc3339(sent_at)\n    return payload''',
              'timestamp normalization',
          )

          tests = replace_once(
              tests,
              '''    def test_rejects_replayed_nonce(self) -> None:\n        payload = self.payload()\n        first_status, _ = self.signed_request(payload)\n        second_status, response = self.signed_request(payload)\n        self.assertEqual(202, first_status)\n        self.assertEqual(409, second_status)\n        self.assertEqual("replayed_nonce", response["error"]["code"])\n\n        with self.store.connect() as connection:\n            count = connection.execute(\n                "SELECT COUNT(*) FROM status_observations"\n            ).fetchone()[0]\n        self.assertEqual(1, count)''',
              '''    def test_accepts_identical_retry_idempotently(self) -> None:\n        payload = self.payload()\n        signature_timestamp = int(time.time())\n        first_status, first_response = self.signed_request(\n            payload,\n            signature_timestamp=signature_timestamp,\n        )\n        second_status, second_response = self.signed_request(\n            payload,\n            signature_timestamp=signature_timestamp,\n        )\n        self.assertEqual(202, first_status)\n        self.assertEqual(202, second_status)\n        self.assertFalse(first_response["duplicate"])\n        self.assertTrue(second_response["duplicate"])\n\n        with self.store.connect() as connection:\n            count = connection.execute(\n                "SELECT COUNT(*) FROM status_observations"\n            ).fetchone()[0]\n        self.assertEqual(1, count)\n\n    def test_rejects_same_nonce_for_different_signed_request(self) -> None:\n        signature_timestamp = int(time.time())\n        first_payload = self.payload()\n        second_payload = self.payload()\n        second_payload["status"] = "degraded"\n        first_status, _ = self.signed_request(\n            first_payload,\n            signature_timestamp=signature_timestamp,\n        )\n        second_status, response = self.signed_request(\n            second_payload,\n            signature_timestamp=signature_timestamp,\n        )\n        self.assertEqual(202, first_status)\n        self.assertEqual(409, second_status)\n        self.assertEqual("replayed_nonce", response["error"]["code"])''',
              'replay tests',
          )

          tests = replace_once(
              tests,
              '''    def test_rejects_old_observation_with_current_signature(self) -> None:''',
              '''    def test_rejects_unhashable_status_values_as_invalid_payload(self) -> None:\n        payload = self.payload()\n        payload["status"] = ["operational"]\n        status, response = self.signed_request(payload)\n        self.assertEqual(422, status)\n        self.assertEqual("invalid_payload", response["error"]["code"])\n\n        payload = self.payload()\n        payload["checks"]["discord"] = {"status": "ok"}\n        status, response = self.signed_request(\n            payload,\n            nonce="abcdefabcdefabcdefabcdefabcdefab",\n        )\n        self.assertEqual(422, status)\n        self.assertEqual("invalid_payload", response["error"]["code"])\n\n    def test_rejects_empty_body_with_bad_request(self) -> None:\n        status, response = self.request(\n            "POST",\n            "/v1/observations",\n            body=b"",\n            headers={"Content-Type": "application/json", "Content-Length": "0"},\n        )\n        self.assertEqual(400, status)\n        self.assertEqual("invalid_content_length", response["error"]["code"])\n\n    def test_normalizes_rfc3339_timestamps_before_persistence(self) -> None:\n        now = datetime.now(UTC)\n        timestamp = now.isoformat(timespec="microseconds")\n        payload = self.payload(timestamp=timestamp)\n        status, _ = self.signed_request(payload)\n        self.assertEqual(202, status)\n        _, public = self.request("GET", "/api/status.json")\n        self.assertTrue(public["observed_at"].endswith("Z"))\n        self.assertNotIn(".", public["observed_at"])\n\n    def test_rejects_old_observation_with_current_signature(self) -> None:''',
              'additional tests',
          )

          docs = replace_once(
              docs,
              'X-IVRM-Timestamp: 2026-07-27T00:00:00Z',
              'X-IVRM-Timestamp: 1785120000',
              'timestamp docs',
          )
          docs = replace_once(
              docs,
              '''- `422 stale_observation`: 観測時刻が古い''',
              '''- `422 stale_observation`: 観測時刻が古い\n- `422 future_observation`: 観測時刻が未来\n- `422 unsupported_schema`: schema_versionをサポートしていない''',
              'error docs',
          )
          docs = replace_once(
              docs,
              '''- Nonce: 15分''',
              '''- Nonce: 15分（署名Timestamp許容差の2倍以上）''',
              'nonce docs',
          )

          source_path.write_text(source, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          docs_path.write_text(docs, encoding='utf-8')
          PY

          cd services/status-ingest
          python -m compileall -q status_ingest.py runner.py test_app.py
          python -m unittest -v test_app.py
          cd ../..

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/status-ingest/status_ingest.py services/status-ingest/test_app.py docs/STATUS_INGEST_OCI.md
          if git diff --cached --quiet; then
            echo '変更はありません。'
            exit 0
          fi
          git commit -m 'fix: status-ingestの再送と入力検証を強化'
          git push origin HEAD:feat/oci-status-ingest
