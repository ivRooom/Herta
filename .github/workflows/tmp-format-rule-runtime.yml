name: Temporary Rule Runtime Formatter

on:
  push:
    branches:
      - feat/rule-engine-production-runtime-v1

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/bot/src/main.ts
          apps/bot/src/rules/runtime.ts
          'apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx'
          apps/studio/src/components/rule-execution-history.tsx
          docs/RULE_ENGINE_RUNTIME.md
          packages/db/src/rule-runtime.ts
      - name: Verify formatting
        run: >-
          pnpm exec prettier --check
          apps/bot/src/main.ts
          apps/bot/src/rules/runtime.ts
          'apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx'
          apps/studio/src/components/rule-execution-history.tsx
          docs/RULE_ENGINE_RUNTIME.md
          packages/db/src/rule-runtime.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: formatted-rule-runtime
          path: |
            apps/bot/src/main.ts
            apps/bot/src/rules/runtime.ts
            apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx
            apps/studio/src/components/rule-execution-history.tsx
            docs/RULE_ENGINE_RUNTIME.md
            packages/db/src/rule-runtime.ts
          if-no-files-found: error
