name: Temporary Birthday Asset Format

on:
  push:
    branches:
      - feat/birthday-card-asset-library

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/birthday-card-asset-library

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format Birthday Asset Library files
        run: |
          pnpm exec prettier --write \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/card-assets/[assetId]/route.ts' \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/card-assets/route.ts' \
            'apps/studio/src/components/birthday-card-asset-library.tsx' \
            'apps/studio/src/components/birthday-card-editor.tsx' \
            'packages/db/src/birthday-card-background.test.ts'

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/card-assets/[assetId]/route.ts' \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/card-assets/route.ts' \
            'apps/studio/src/components/birthday-card-asset-library.tsx' \
            'apps/studio/src/components/birthday-card-editor.tsx' \
            'packages/db/src/birthday-card-background.test.ts'
          git commit -m 'style(birthday): format asset library implementation'
          git push origin HEAD:feat/birthday-card-asset-library
