name: Format VALORANT pick cards once
on:
  push:
    branches:
      - codex/valorant-pick-cards-20261031
    paths:
      - .github/workflows/format-valorant-pick-card-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format source and remove temporary workflow
        run: |
          pnpm exec prettier --write apps/bot/src/plugins/valorant-pick-card.ts apps/bot/src/plugins/valorant-pick-card.test.ts apps/bot/src/plugins/valorant.ts apps/bot/src/plugins/valorant.test.ts
          rm .github/workflows/format-valorant-pick-card-once.yml
          git add -- apps/bot/src/plugins/valorant-pick-card.ts apps/bot/src/plugins/valorant-pick-card.test.ts apps/bot/src/plugins/valorant.ts apps/bot/src/plugins/valorant.test.ts .github/workflows/format-valorant-pick-card-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(valorant): format pick card sources'
          git push origin HEAD:codex/valorant-pick-cards-20261031
