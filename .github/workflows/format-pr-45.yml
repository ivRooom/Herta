name: Format PR 45

on:
  push:
    branches: [feat/guild-install-onboarding]

permissions:
  contents: write

concurrency:
  group: format-pr-45
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guild-install-onboarding

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format

      - name: 整形結果をコミット
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "整形差分はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(onboarding): Prettierで変更ファイルを整形"
          git push origin HEAD:feat/guild-install-onboarding
