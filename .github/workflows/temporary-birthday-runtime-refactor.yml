name: Temporary Birthday Runtime Refactor

on:
  push:
    branches:
      - feat/birthday-card-asset-library

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/birthday-card-asset-library

      - name: Switch Birthday Role to bot-only runtime background resolver
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/bot/src/plugins/birthday-role.ts';
          let source = fs.readFileSync(path, 'utf8');
          const beforeImport = "import { getBirthdayCardBackground, type PrismaClient } from '@herta/db';";
          const afterImport = "import { getBirthdayCardRuntimeBackground, type PrismaClient } from '@herta/db';";
          const beforeCall = 'await getBirthdayCardBackground(context.prisma, context.guildId).catch((error) => {';
          const afterCall = 'await getBirthdayCardRuntimeBackground(context.prisma, context.guildId).catch((error) => {';
          if (!source.includes(beforeImport)) throw new Error('Birthday background import not found');
          if (!source.includes(beforeCall)) throw new Error('Birthday background runtime call not found');
          source = source.replace(beforeImport, afterImport).replace(beforeCall, afterCall);
          fs.writeFileSync(path, source);
          NODE

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/birthday-role.ts

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/plugins/birthday-role.ts
          git commit -m 'fix(birthday): use bot-only asset runtime resolver'
          git push origin HEAD:feat/birthday-card-asset-library
