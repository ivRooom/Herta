name: PR232 Body Limit Fix

on:
  push:
    branches:
      - feature/message-studio-drafts-voice-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/message-studio-drafts-voice-v1
      - name: Raise only Message Studio internal JSON limit
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/bot/src/health/server.ts')
          text = path.read_text()
          old = 'const MAX_MESSAGE_STUDIO_INTERNAL_BODY_BYTES = 12_000_000;'
          new = 'const MAX_MESSAGE_STUDIO_INTERNAL_BODY_BYTES = 30_000_000;'
          if old not in text:
              raise SystemExit('Message Studio body limit anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit body limit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/health/server.ts
          git commit -m 'fix: allow base64 encoded voice payloads internally'
          git push origin HEAD:feature/message-studio-drafts-voice-v1
