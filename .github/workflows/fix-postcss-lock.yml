name: Fix PostCSS Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Update PostCSS override and lockfile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(path, 'utf8'));
          packageJson.pnpm ??= {};
          packageJson.pnpm.overrides ??= {};
          packageJson.pnpm.overrides.postcss = '8.5.22';
          fs.writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm prettier --write package.json pnpm-lock.yaml
      - name: Commit dependency fix
        run: |
          if git diff --quiet; then
            echo "No dependency changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "fix: PostCSSを安全なバージョンへ固定"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
