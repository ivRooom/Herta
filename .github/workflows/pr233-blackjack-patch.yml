name: PR233 Blackjack Patch

on:
  push:
    branches:
      - feature/blackjack-pvp-animation-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/blackjack-pvp-animation-v1
      - name: Patch Blackjack manifest and runtime
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('packages/plugin-catalog/src/manifests/mini-games.ts')
          manifest = manifest_path.read_text()
          manifest = manifest.replace("version: '3.3.0'", "version: '3.4.0'")
          config_needle = """      blackjackDealerHitsSoft17: {
                type: 'boolean',
                title: 'DealerはSoft 17でHitする',
                default: false,
                'x-herta-ui': {
                  section: 'Blackjack',
                  help: 'OFFではDealerはSoft 17でもStandします。',
                },
              },"""
          config_replacement = """      blackjackAnimation: {
                type: 'boolean',
                title: 'Blackjackのカード配布演出を有効化する',
                default: true,
                'x-herta-ui': {
                  section: 'Blackjack',
                  help: '開始時・Hit時・Dealerターンを段階表示してカードゲームらしい演出を追加します。',
                },
              },
              blackjackAnimationDelayMs: {
                type: 'integer',
                title: 'Blackjack演出間隔（ms）',
                minimum: 250,
                maximum: 1500,
                default: 450,
                'x-herta-ui': {
                  section: 'Blackjack',
                  help: 'カード配布・ドロー演出のテンポを調整します。',
                },
              },
              blackjackDealerHitsSoft17: {
                type: 'boolean',
                title: 'DealerはSoft 17でHitする',
                default: false,
                'x-herta-ui': {
                  section: 'Blackjack',
                  help: 'OFFではDealerはSoft 17でもStandします。',
                },
              },"""
          if config_needle not in manifest:
              raise SystemExit('blackjack config needle not found')
          manifest = manifest.replace(config_needle, config_replacement)
          command_needle = "    { name: 'blackjack', description: 'Dealerと1対1でBlackjackを開始します' },"
          command_replacement = """    {
                name: 'blackjack',
                description: 'Dealer戦またはメンバー同士のBlackjackを開始します',
                options: [
                  {
                    name: 'member1',
                    description: '1人だけ指定すると自分との対戦、2人指定時は対戦する1人目',
                    type: 'user',
                  },
                  {
                    name: 'member2',
                    description: '2人の対戦を開始する場合の2人目',
                    type: 'user',
                  },
                ],
              },"""
          if command_needle not in manifest:
              raise SystemExit('blackjack command needle not found')
          manifest = manifest.replace(command_needle, command_replacement)
          manifest_path.write_text(manifest)

          path = Path('apps/bot/src/plugins/mini-games.ts')
          text = path.read_text()
          text = text.replace(
              "  type Interaction,\n} from 'discord.js';",
              "  type Interaction,\n  type User,\n} from 'discord.js';",
          )
          import_needle = "import { blackjackSettlementMetrics } from './mini-games-blackjack-metrics.js';"
          import_replacement = import_needle + "\nimport { isBlackjackHandComplete, settleBlackjackPvp } from './mini-games-blackjack-pvp.js';"
          if import_needle not in text:
              raise SystemExit('blackjack import needle not found')
          text = text.replace(import_needle, import_replacement)

          config_interface = """  highLowMaxRounds: number;
            blackjackDealerHitsSoft17: boolean;
          }"""
          config_interface_new = """  highLowMaxRounds: number;
            blackjackDealerHitsSoft17: boolean;
            blackjackAnimation: boolean;
            blackjackAnimationDelayMs: number;
          }"""
          if config_interface not in text:
              raise SystemExit('config interface needle not found')
          text = text.replace(config_interface, config_interface_new)

          session_pattern = re.compile(r"interface BlackjackSession extends GameSessionBase \{.*?\n\}\n\ntype GameSession = HighLowSession \| BlackjackSession;", re.S)
          session_replacement = """interface BlackjackDealerSession extends GameSessionBase {
            type: 'blackjack';
            mode: 'dealer';
            deck: PlayingCard[];
            player: PlayingCard[];
            dealer: PlayingCard[];
            dealerHitsSoft17: boolean;
          }

          interface BlackjackPvpPlayer {
            userId: string;
            cards: PlayingCard[];
            stood: boolean;
          }

          interface BlackjackPvpSession extends GameSessionBase {
            type: 'blackjack';
            mode: 'pvp';
            deck: PlayingCard[];
            players: [BlackjackPvpPlayer, BlackjackPvpPlayer];
            activePlayerIndex: 0 | 1;
          }

          type BlackjackSession = BlackjackDealerSession | BlackjackPvpSession;
          type GameSession = HighLowSession | BlackjackSession;"""
          text, count = session_pattern.subn(session_replacement, text, count=1)
          if count != 1:
              raise SystemExit('blackjack session block not found')

          normalize_needle = """    highLowMaxRounds: clamp(toInteger(source.highLowMaxRounds, 10), 3, 25),
              blackjackDealerHitsSoft17: source.blackjackDealerHitsSoft17 === true,
            };"""
          normalize_replacement = """    highLowMaxRounds: clamp(toInteger(source.highLowMaxRounds, 10), 3, 25),
              blackjackDealerHitsSoft17: source.blackjackDealerHitsSoft17 === true,
              blackjackAnimation:
                source.blackjackAnimation === undefined ? true : source.blackjackAnimation === true,
              blackjackAnimationDelayMs: clamp(
                toInteger(source.blackjackAnimationDelayMs, 450),
                250,
                1_500,
              ),
            };"""
          if normalize_needle not in text:
              raise SystemExit('normalize block not found')
          text = text.replace(normalize_needle, normalize_replacement)

          execute_pattern = re.compile(r"async function executeBlackjack\(.*?\n\}\n\nasync function handleGameButton", re.S)
          execute_replacement = r"""async function executeBlackjack(
            context: MiniGamesRuntimeContext,
            interaction: ChatInputCommandInteraction,
          ): Promise<void> {
            if (!interaction.guildId) {
              await replyEphemeral(interaction, 'このコマンドはDiscordサーバー内でのみ利用できます。');
              return;
            }
            const config = normalizeMiniGamesConfig(context.config);
            if (!config.enabled) {
              await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');
              return;
            }

            const member1 = interaction.options.getUser('member1');
            const member2 = interaction.options.getUser('member2');
            if (member1 || member2) {
              await executeBlackjackPvp(context, interaction, config, member1, member2);
              return;
            }
            await executeBlackjackDealer(context, interaction, config);
          }

          async function executeBlackjackDealer(
            context: MiniGamesRuntimeContext,
            interaction: ChatInputCommandInteraction,
            config: MiniGamesConfig,
          ): Promise<void> {
            const deck = createShuffledDeck();
            const player = [drawCard(deck), drawCard(deck)];
            const dealer = [drawCard(deck), drawCard(deck)];
            const id = createSessionId();
            const session: BlackjackDealerSession = {
              id,
              type: 'blackjack',
              mode: 'dealer',
              guildId: interaction.guildId!,
              userId: interaction.user.id,
              deck,
              player,
              dealer,
              dealerHitsSoft17: config.blackjackDealerHitsSoft17,
              expiresAt: 0,
              processing: false,
              async expireMessage() {
                await interaction
                  .editReply({
                    content: `${renderBlackjack(session, false)}\n\n⌛ **時間切れでゲーム終了**`,
                    components: [],
                  })
                  .catch(() => undefined);
              },
            };

            const openingPlayer = blackjackScore(player);
            const openingDealer = blackjackScore(dealer);
            const openingFinished = openingPlayer.blackjack || openingDealer.blackjack;
            if (!openingFinished) gameSessions.set(id, session);

            if (config.blackjackAnimation) {
              await interaction.reply({
                content: '🃏 **Blackjack**\n🔀 カードをシャッフルしています…',
                allowedMentions: { parse: [] },
              });
              await delay(config.blackjackAnimationDelayMs);
              await interaction.editReply({ content: renderBlackjackDealStage(session) });
              await delay(config.blackjackAnimationDelayMs);
              await interaction.editReply({
                content: openingFinished ? renderBlackjackFinal(session) : renderBlackjack(session, false),
                components: openingFinished ? [] : [buildBlackjackRow(session.id)],
              });
            } else {
              await interaction.reply({
                content: openingFinished ? renderBlackjackFinal(session) : renderBlackjack(session, false),
                components: openingFinished ? [] : [buildBlackjackRow(session.id)],
                allowedMentions: { parse: [] },
              });
            }

            if (!openingFinished) armSessionTimeout(session, config.sessionTimeoutSeconds);
            await recordMetricsSafely(
              context,
              [
                ['minigame_plays', 1],
                ['blackjack_plays', 1],
              ],
              interaction.user.id,
            );
            if (openingFinished) await recordBlackjackSettlement(context, session);
            await publishMiniGameCompletion(interaction);
          }

          async function executeBlackjackPvp(
            context: MiniGamesRuntimeContext,
            interaction: ChatInputCommandInteraction,
            config: MiniGamesConfig,
            member1: User | null,
            member2: User | null,
          ): Promise<void> {
            const first = member2 ? (member1 ?? interaction.user) : interaction.user;
            const second = member2 ?? member1;
            if (!second) {
              await replyEphemeral(interaction, '対戦するメンバーを指定してください。');
              return;
            }
            if (first.id === second.id) {
              await replyEphemeral(interaction, '同じメンバー同士では対戦できません。');
              return;
            }
            if (first.bot || second.bot) {
              await replyEphemeral(interaction, 'BotはBlackjack PvPへ参加できません。');
              return;
            }

            const deck = createShuffledDeck();
            const id = createSessionId();
            const session: BlackjackPvpSession = {
              id,
              type: 'blackjack',
              mode: 'pvp',
              guildId: interaction.guildId!,
              userId: interaction.user.id,
              deck,
              players: [
                { userId: first.id, cards: [drawCard(deck), drawCard(deck)], stood: false },
                { userId: second.id, cards: [drawCard(deck), drawCard(deck)], stood: false },
              ],
              activePlayerIndex: 0,
              expiresAt: 0,
              processing: false,
              async expireMessage() {
                await interaction
                  .editReply({
                    content: `${renderBlackjackPvp(session)}\n\n⌛ **時間切れで対戦終了**`,
                    components: [],
                  })
                  .catch(() => undefined);
              },
            };

            const openingFinished = session.players.some((player) => blackjackScore(player.cards).blackjack);
            if (!openingFinished) gameSessions.set(id, session);

            if (config.blackjackAnimation) {
              await interaction.reply({
                content: `🃏 **Blackjack PvP**\n<@${first.id}> vs <@${second.id}>\n🔀 カードをシャッフルしています…`,
                allowedMentions: { parse: [] },
              });
              await delay(config.blackjackAnimationDelayMs);
              await interaction.editReply({ content: renderBlackjackPvpDealStage(session) });
              await delay(config.blackjackAnimationDelayMs);
              await interaction.editReply({
                content: openingFinished ? renderBlackjackPvpFinal(session) : renderBlackjackPvp(session),
                components: openingFinished ? [] : [buildBlackjackRow(session.id)],
              });
            } else {
              await interaction.reply({
                content: openingFinished ? renderBlackjackPvpFinal(session) : renderBlackjackPvp(session),
                components: openingFinished ? [] : [buildBlackjackRow(session.id)],
                allowedMentions: { parse: [] },
              });
            }

            if (!openingFinished) armSessionTimeout(session, config.sessionTimeoutSeconds);
            for (const player of session.players) {
              await recordMetricsSafely(
                context,
                [
                  ['minigame_plays', 1],
                  ['blackjack_plays', 1],
                ],
                player.userId,
              );
            }
            if (openingFinished) await recordBlackjackPvpSettlement(context, session);
            await publishMiniGameCompletion(interaction);
          }

          async function handleGameButton"""
          text, count = execute_pattern.subn(execute_replacement, text, count=1)
          if count != 1:
              raise SystemExit('executeBlackjack block not found')

          ownership_needle = """  if (interaction.guildId !== session.guildId || interaction.user.id !== session.userId) {
              await replyEphemeral(interaction, 'このゲームは開始した本人だけ操作できます。');
              return;
            }"""
          ownership_replacement = """  if (interaction.guildId !== session.guildId || !canOperateGameSession(session, interaction.user.id)) {
              await replyEphemeral(
                interaction,
                session.type === 'blackjack' && session.mode === 'pvp'
                  ? 'このBlackjack対戦は参加メンバーだけ操作できます。'
                  : 'このゲームは開始した本人だけ操作できます。',
              );
              return;
            }"""
          if ownership_needle not in text:
              raise SystemExit('ownership block not found')
          text = text.replace(ownership_needle, ownership_replacement)

          handler_pattern = re.compile(r"async function handleBlackjackButton\(.*?\n\}\n\nasync function executeGameStats", re.S)
          handler_replacement = r"""async function handleBlackjackButton(
            context: MiniGamesRuntimeContext,
            session: BlackjackSession,
            action: string,
            config: MiniGamesConfig,
            interaction: ButtonInteraction,
          ): Promise<void> {
            if (session.mode === 'pvp') {
              await handleBlackjackPvpButton(context, session, action, config, interaction);
              return;
            }

            session.dealerHitsSoft17 = config.blackjackDealerHitsSoft17;
            if (action === 'hit') {
              const animated = config.blackjackAnimation;
              if (animated) {
                await interaction.update({
                  content: `${renderBlackjack(session, false)}\n\n🃏 カードを引いています…`,
                  components: [],
                });
                await delay(config.blackjackAnimationDelayMs);
              }
              session.player.push(drawCard(session.deck));
              const score = blackjackScore(session.player);
              if (score.bust || score.total === 21) {
                if (!score.bust) playDealer(session);
                endSession(session);
                await finishButtonMessage(interaction, animated, renderBlackjackFinal(session), []);
                await recordBlackjackSettlement(context, session);
                await publishMiniGameCompletion(interaction);
                return;
              }
              armSessionTimeout(session, config.sessionTimeoutSeconds);
              await finishButtonMessage(
                interaction,
                animated,
                renderBlackjack(session, false),
                [buildBlackjackRow(session.id)],
              );
              return;
            }
            if (action === 'stand') {
              const animated = config.blackjackAnimation;
              if (animated) {
                await interaction.update({
                  content: `${renderBlackjack(session, false)}\n\n🎩 Dealerのターン…`,
                  components: [],
                });
                await delay(config.blackjackAnimationDelayMs);
              }
              playDealer(session);
              endSession(session);
              await finishButtonMessage(interaction, animated, renderBlackjackFinal(session), []);
              await recordBlackjackSettlement(context, session);
              await publishMiniGameCompletion(interaction);
              return;
            }
            await replyEphemeral(interaction, '不明なBlackjack操作です。');
          }

          async function handleBlackjackPvpButton(
            context: MiniGamesRuntimeContext,
            session: BlackjackPvpSession,
            action: string,
            config: MiniGamesConfig,
            interaction: ButtonInteraction,
          ): Promise<void> {
            const playerIndex = session.players.findIndex((player) => player.userId === interaction.user.id);
            if (playerIndex < 0) {
              await replyEphemeral(interaction, 'このBlackjack対戦の参加者ではありません。');
              return;
            }
            if (playerIndex !== session.activePlayerIndex) {
              await replyEphemeral(interaction, '現在は相手のターンです。');
              return;
            }
            if (action !== 'hit' && action !== 'stand') {
              await replyEphemeral(interaction, '不明なBlackjack操作です。');
              return;
            }

            const player = session.players[playerIndex]!;
            const animated = config.blackjackAnimation;
            if (animated) {
              await interaction.update({
                content: `${renderBlackjackPvp(session)}\n\n${action === 'hit' ? '🃏 カードを引いています…' : '✋ Standを選択しました…'}`,
                components: [],
              });
              await delay(config.blackjackAnimationDelayMs);
            }

            if (action === 'hit') player.cards.push(drawCard(session.deck));
            if (action === 'stand') player.stood = true;
            const score = blackjackScore(player.cards);
            if (score.bust) {
              endSession(session);
              await finishButtonMessage(interaction, animated, renderBlackjackPvpFinal(session), []);
              await recordBlackjackPvpSettlement(context, session);
              await publishMiniGameCompletion(interaction);
              return;
            }
            if (score.total >= 21) player.stood = true;

            if (isBlackjackHandComplete(player.cards, player.stood)) {
              const otherIndex = playerIndex === 0 ? 1 : 0;
              const other = session.players[otherIndex]!;
              if (isBlackjackHandComplete(other.cards, other.stood)) {
                endSession(session);
                await finishButtonMessage(interaction, animated, renderBlackjackPvpFinal(session), []);
                await recordBlackjackPvpSettlement(context, session);
                await publishMiniGameCompletion(interaction);
                return;
              }
              session.activePlayerIndex = otherIndex;
            }

            armSessionTimeout(session, config.sessionTimeoutSeconds);
            await finishButtonMessage(
              interaction,
              animated,
              renderBlackjackPvp(session),
              [buildBlackjackRow(session.id)],
            );
          }

          async function finishButtonMessage(
            interaction: ButtonInteraction,
            alreadyAcknowledged: boolean,
            content: string,
            components: ActionRowBuilder<ButtonBuilder>[],
          ): Promise<void> {
            if (alreadyAcknowledged) {
              await interaction.editReply({ content, components });
            } else {
              await interaction.update({ content, components });
            }
          }

          async function executeGameStats"""
          text, count = handler_pattern.subn(handler_replacement, text, count=1)
          if count != 1:
              raise SystemExit('handleBlackjackButton block not found')

          text = text.replace(
              '  session: BlackjackSession,\n): Promise<void> {\n  await recordMetricsSafely(\n    context,\n    blackjackSettlementMetrics(session.player, session.dealer),',
              '  session: BlackjackDealerSession,\n): Promise<void> {\n  await recordMetricsSafely(\n    context,\n    blackjackSettlementMetrics(session.player, session.dealer),',
          )
          text = text.replace('function playDealer(session: BlackjackSession): void {', 'function playDealer(session: BlackjackDealerSession): void {')
          text = text.replace('function renderBlackjack(session: BlackjackSession, revealDealer: boolean): string {', 'function renderBlackjack(session: BlackjackDealerSession, revealDealer: boolean): string {')
          text = text.replace('function renderBlackjackFinal(session: BlackjackSession): string {', 'function renderBlackjackFinal(session: BlackjackDealerSession): string {')

          insert_marker = 'function buildHighLowRow(sessionId: string): ActionRowBuilder<ButtonBuilder> {'
          if insert_marker not in text:
              raise SystemExit('render insertion marker not found')
          helpers = r"""function renderBlackjackDealStage(session: BlackjackDealerSession): string {
            return [
              '🃏 **Blackjack — Dealing**',
              `Dealer: ${formatPlayingCard(session.dealer[0]!)} 🂠`,
              `あなた: ${formatPlayingCard(session.player[0]!)} 🂠`,
              '',
              'カードを配っています…',
            ].join('\n');
          }

          function renderBlackjackPvpDealStage(session: BlackjackPvpSession): string {
            const [first, second] = session.players;
            return [
              '🃏 **Blackjack PvP — Dealing**',
              `<@${first.userId}>: ${formatPlayingCard(first.cards[0]!)} 🂠`,
              `<@${second.userId}>: ${formatPlayingCard(second.cards[0]!)} 🂠`,
              '',
              'カードを配っています…',
            ].join('\n');
          }

          function renderBlackjackPvp(session: BlackjackPvpSession): string {
            const lines = session.players.map((player, index) => {
              const score = blackjackScore(player.cards);
              const turn = index === session.activePlayerIndex ? ' ◀ **TURN**' : '';
              const state = score.bust ? ' · BUST' : player.stood ? ' · STAND' : '';
              return `<@${player.userId}>: ${formatCards(player.cards)} **（${score.total}）**${state}${turn}`;
            });
            return [
              '🃏 **Blackjack PvP**',
              ...lines,
              '',
              '自分のターンでHit / Standを選んでください。',
            ].join('\n');
          }

          function renderBlackjackPvpFinal(session: BlackjackPvpSession): string {
            const [first, second] = session.players;
            const outcome = settleBlackjackPvp(first.cards, second.cards);
            const firstScore = blackjackScore(first.cards);
            const secondScore = blackjackScore(second.cards);
            const result =
              outcome === 'player1-win'
                ? `🏆 <@${first.userId}> **WIN!**`
                : outcome === 'player2-win'
                  ? `🏆 <@${second.userId}> **WIN!**`
                  : '🤝 **PUSH — 引き分け**';
            return [
              '🃏 **Blackjack PvP — Result**',
              `<@${first.userId}>: ${formatCards(first.cards)} **（${firstScore.total}）**`,
              `<@${second.userId}>: ${formatCards(second.cards)} **（${secondScore.total}）**`,
              '',
              result,
            ].join('\n');
          }

          async function recordBlackjackPvpSettlement(
            context: MiniGamesRuntimeContext,
            session: BlackjackPvpSession,
          ): Promise<void> {
            const outcome = settleBlackjackPvp(session.players[0].cards, session.players[1].cards);
            if (outcome === 'push') return;
            const winner = session.players[outcome === 'player1-win' ? 0 : 1]!;
            await recordMetricsSafely(
              context,
              [
                ['minigame_wins', 1],
                ['blackjack_wins', 1],
              ],
              winner.userId,
            );
          }

          function canOperateGameSession(session: GameSession, userId: string): boolean {
            if (session.type === 'blackjack' && session.mode === 'pvp') {
              return session.players.some((player) => player.userId === userId);
            }
            return session.userId === userId;
          }

          """
          text = text.replace(insert_marker, helpers + insert_marker)
          path.write_text(text)
          PY
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/bot/src/plugins/mini-games.ts \
            packages/plugin-catalog/src/manifests/mini-games.ts \
            apps/bot/src/plugins/mini-games.test.ts \
            apps/bot/src/plugins/mini-games-blackjack-pvp.ts \
            apps/bot/src/plugins/mini-games-blackjack-pvp.test.ts
      - name: Commit Blackjack implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/plugins/mini-games.ts packages/plugin-catalog/src/manifests/mini-games.ts apps/bot/src/plugins/mini-games.test.ts apps/bot/src/plugins/mini-games-blackjack-pvp.ts apps/bot/src/plugins/mini-games-blackjack-pvp.test.ts
          git commit -m 'feat: add animated Blackjack PvP' || exit 0
          git push origin HEAD:feature/blackjack-pvp-animation-v1
