name: Format Studio Operations

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/studio-operations-dashboard' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-operations-dashboard

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettierを適用
        run: |
          pnpm exec prettier --write \
            .env.example \
            .env.production.example \
            apps/studio/package.json \
            apps/studio/src/app/dashboard/layout.tsx \
            apps/studio/src/app/dashboard/operations/page.tsx \
            apps/studio/src/app/dashboard/page.tsx \
            apps/studio/src/components/refresh-health-button.tsx \
            apps/studio/src/lib/bot-health.test.ts \
            apps/studio/src/lib/bot-health.ts \
            docker-compose.prod.yml

      - name: 整形結果をコミット
        run: |
          if git diff --quiet; then
            echo '整形差分はありません'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .env.example \
            .env.production.example \
            apps/studio/package.json \
            apps/studio/src/app/dashboard/layout.tsx \
            apps/studio/src/app/dashboard/operations/page.tsx \
            apps/studio/src/app/dashboard/page.tsx \
            apps/studio/src/components/refresh-health-button.tsx \
            apps/studio/src/lib/bot-health.test.ts \
            apps/studio/src/lib/bot-health.ts \
            docker-compose.prod.yml
          git commit -m 'style: Bot稼働状況画面を整形する'
          git push origin HEAD:feat/studio-operations-dashboard
