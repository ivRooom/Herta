name: Temporary Birthday Concurrency Fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 300 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/birthday-card-asset-library
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply concurrency fixes
        run: python .github/scripts/temporary-apply-birthday-concurrency-fixes.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/plugin-catalog/src/manifests/birthday-role.ts \
            packages/db/src/birthday-card-assets.ts \
            apps/studio/src/lib/guild-plugins.ts \
            'apps/studio/src/app/api/guilds/[guildId]/plugins/[pluginId]/route.ts' \
            'apps/studio/src/app/api/guilds/[guildId]/birthday/card-assets/[assetId]/route.ts' \
            .github/scripts/birthday-card-asset-library-config.test.mjs \
            .github/scripts/birthday-card-asset-library-delete.test.mjs
      - name: Validate focused changes
        run: |
          pnpm format:check
          pnpm db:generate
          pnpm typecheck
          pnpm test
      - name: Commit fixes and remove temporary helpers
        run: |
          rm .github/workflows/temporary-birthday-concurrency-fixes.yml
          rm .github/scripts/temporary-apply-birthday-concurrency-fixes.py
          rm -f .github/.birthday-300-concurrency-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(birthday): serialize asset selection and deletion'
          git push origin HEAD:feat/birthday-card-asset-library
