name: Fix Plugin Event Ack

on:
  push:
    branches: [feat/team-split-plugin-v1]

permissions:
  contents: write

concurrency:
  group: fix-plugin-event-ack
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/team-split-plugin-v1
          fetch-depth: 0
          persist-credentials: false
      - run: python3 .github/scripts/fix-plugin-event-ack.py
      - name: 一時ファイルを削除して反映
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git rm -f .github/scripts/fix-plugin-event-ack.py
          git rm -f .github/workflows/fix-plugin-event-ack.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(bot): Pluginイベント配送結果とInteraction失敗応答を追加'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/team-split-plugin-v1
