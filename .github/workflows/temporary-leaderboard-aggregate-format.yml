name: Temporary leaderboard aggregate format

on:
  push:
    branches:
      - feature/leaderboard-v2
    paths:
      - .github/workflows/temporary-leaderboard-aggregate-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/leaderboard-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/studio/src/lib/community-leaderboard.ts
      - name: Commit formatted file and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-leaderboard-aggregate-format.yml
          git add apps/studio/src/lib/community-leaderboard.ts
          git diff --cached --check
          git commit -m 'Leaderboard活動集計のコードスタイルを整える'
          git push origin HEAD:feature/leaderboard-v2
