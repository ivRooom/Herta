name: fast-uri Lock Refresh

on:
  push:
    branches:
      - feature/achievements-v3-3-operations
    paths:
      - package.json
      - '.github/workflows/fast-uri-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/achievements-v3-3-operations
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fast-uri 4.1.1へlockfileを更新'
          git push origin HEAD:feature/achievements-v3-3-operations
