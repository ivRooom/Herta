name: Artifact Format Helper

on:
  push:
    branches:
      - feat/ai-artifact-runtime

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/bot/src/ai/artifact-message-handler.ts \
            apps/bot/src/plugins/ai.ts \
            packages/plugin-catalog/src/ai-artifact.ts
          git diff -- \
            apps/bot/src/ai/artifact-message-handler.ts \
            apps/bot/src/plugins/ai.ts \
            packages/plugin-catalog/src/ai-artifact.ts
