name: Prettier Diff Debug

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Prettier
        run: pnpm exec prettier --write docs/BACKUP_MONITORING_IAC.md

      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-runbook
          path: docs/BACKUP_MONITORING_IAC.md
          if-no-files-found: error
          retention-days: 1
