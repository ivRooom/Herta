name: Temporary Command Palette Quick Access Format

on:
  push:
    branches:
      - feature/command-palette-quick-access

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == '一時Prettierワークフローを追加する'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/command-palette-quick-access

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/studio/src/components/console-command-palette.tsx \
            apps/studio/src/lib/command-palette-preferences.ts \
            apps/studio/src/lib/command-palette-preferences.test.ts

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/studio/src/components/console-command-palette.tsx \
            apps/studio/src/lib/command-palette-preferences.ts \
            apps/studio/src/lib/command-palette-preferences.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Command Palette Quick Accessを整形する"
          git push origin HEAD:feature/command-palette-quick-access
