name: Temporary Discord Bot Profile Test

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: read

jobs:
  discord-bot-profile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @herta/shared build
      - working-directory: apps/studio
        run: node --experimental-strip-types --test src/lib/discord-bot-profile.test.ts
