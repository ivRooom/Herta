name: Temporary Message Studio Review Fixes

on:
  push:
    branches:
      - tmp/message-studio-review-fixes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0

      - name: Checkout runner files
        uses: actions/checkout@v7
        with:
          ref: tmp/message-studio-review-fixes
          path: .tmp-message-studio-runner

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply review fixes
        run: python3 .tmp-message-studio-runner/.github/scripts/tmp-message-studio-review-fixes.py

      - run: pnpm db:generate

      - name: Format modified files
        run: >-
          pnpm exec prettier --write
          plugins/daily-content/src/config.ts
          plugins/daily-content/src/service.ts
          plugins/daily-content/src/message.ts
          plugins/daily-content/src/plugin.ts
          plugins/daily-content/src/config.test.ts
          plugins/daily-content/src/message.test.ts
          plugins/daily-content/src/service.test.ts
          apps/worker/src/daily-content.ts
          apps/studio/src/components/daily-content-manager.tsx

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Push fixes to feature branch
        shell: bash
        run: |
          rm -rf .tmp-message-studio-runner
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/daily-content/src apps/worker/src/daily-content.ts apps/studio/src/components/daily-content-manager.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Message Studioのレビュー指摘を修正する'
          git push origin HEAD:feat/message-studio-v2
