name: Temporary Message Studio Review Fixes

on:
  push:
    branches:
      - tmp/message-studio-review-fixes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # config.ts: deterministic future guard + strict recurrence type.
          path = 'plugins/daily-content/src/config.ts'
          replace(path,
          """export function normalizeDailyContentInput(\n  input: DailyContentInput,\n  config: DailyContentConfig,\n): NormalizedDailyContentInput {""",
          """export function normalizeDailyContentInput(\n  input: DailyContentInput,\n  config: DailyContentConfig,\n  now = new Date(),\n): NormalizedDailyContentInput {""")
          replace(path,
          """  const onceAt = normalizeOnceAt(input.onceAt, recurrenceType);\n  const weekdays = normalizeWeekdays(input.weekdays, recurrenceType);""",
          """  const enabled = input.enabled ?? true;\n  const onceAt = normalizeOnceAt(input.onceAt, recurrenceType, enabled, now);\n  const weekdays = normalizeWeekdays(input.weekdays, recurrenceType);""")
          replace(path,
          """    enabled: input.enabled ?? true,""",
          """    enabled,""")
          replace(path,
          """function normalizeRecurrenceType(value: unknown): MessageStudioRecurrence {\n  return value === 'once' || value === 'weekly' || value === 'daily' ? value : 'daily';\n}""",
          """function normalizeRecurrenceType(value: unknown): MessageStudioRecurrence {\n  if (value === undefined || value === null) return 'daily';\n  if (value === 'once' || value === 'weekly' || value === 'daily') return value;\n  throw new DailyContentValidationError(\n    'recurrenceTypeはonce/daily/weeklyのいずれかを指定してください',\n  );\n}""")
          replace(path,
          """function normalizeOnceAt(\n  value: Date | string | null | undefined,\n  recurrence: MessageStudioRecurrence,\n) {\n  if (recurrence !== 'once') return null;\n  const date = value instanceof Date ? value : typeof value === 'string' ? new Date(value) : null;\n  if (!date || Number.isNaN(date.getTime())) {\n    throw new DailyContentValidationError('1回予約ではonceAtに有効な日時を指定してください');\n  }\n  return date;\n}""",
          """function normalizeOnceAt(\n  value: Date | string | null | undefined,\n  recurrence: MessageStudioRecurrence,\n  enabled: boolean,\n  now: Date,\n) {\n  if (recurrence !== 'once') return null;\n  const date = value instanceof Date ? value : typeof value === 'string' ? new Date(value) : null;\n  if (!date || Number.isNaN(date.getTime())) {\n    throw new DailyContentValidationError('1回予約ではonceAtに有効な日時を指定してください');\n  }\n  if (enabled && date.getTime() < now.getTime() + 60_000) {\n    throw new DailyContentValidationError('1回予約の日時は現在時刻より1分以上先を指定してください');\n  }\n  return date;\n}""")

          # service.ts: pass deterministic now, keep once enabled until successful scheduled delivery.
          path = 'plugins/daily-content/src/service.ts'
          replace(path,
          """  const normalized = normalizeDailyContentInput(input.schedule, input.config);""",
          """  const normalized = normalizeDailyContentInput(input.schedule, input.config, now);""")
          replace(path,
          """      input.config,\n    );""",
          """      input.config,\n      now,\n    );""")
          replace(path,
          """        nextRunAt,\n        lastScheduledAt: scheduledFor,\n        ...(schedule.recurrenceType === 'once' ? { enabled: false } : {}),""",
          """        nextRunAt,\n        lastScheduledAt: scheduledFor,""")
          replace(path,
          """  input: { deliveryId: string; scheduleId: string; messageId: string; sentAt?: Date },""",
          """  input: {\n    deliveryId: string;\n    scheduleId: string;\n    messageId: string;\n    sentAt?: Date;\n    completeOneShot?: boolean;\n  },""")
          replace(path,
          """    await tx.dailyContent.update({\n      where: { id: input.scheduleId },\n      data: { lastSentAt: sentAt },\n    });""",
          """    await tx.dailyContent.update({\n      where: { id: input.scheduleId },\n      data: {\n        lastSentAt: sentAt,\n        ...(input.completeOneShot ? { enabled: false, nextRunAt: null } : {}),\n      },\n    });""")

          # message.ts: Canary/PTB URLs and formatter-compatible separators.
          path = 'plugins/daily-content/src/message.ts'
          replace(path,
          """  /^https?:\\/\\/(?:www\\.)?(?:discord\\.com|discordapp\\.com)\\/channels\\/(\\d{17,20})\\/(\\d{17,20})\\/(\\d{17,20})(?:\\?.*)?$/i;""",
          """  /^https?:\\/\\/(?:(?:www|canary|ptb)\\.)?(?:discord\\.com|discordapp\\.com)\\/channels\\/(\\d{17,20})\\/(\\d{17,20})\\/(\\d{17,20})(?:\\?.*)?$/i;""")
          replace(path,
          """    .split(/[\\s,、/]+/)""",
          """    .split(/[\\s,、，・/]+/)""")

          # plugin.ts: safe guild verification, embed preview, format consistency, crosspost feedback.
          path = 'plugins/daily-content/src/plugin.ts'
          replace(path,
          """  parseMessageStudioWeekdays,\n  toDiscordApiEmbed,""",
          """  parseMessageStudioWeekdays,\n  safeEmbedFromJson,\n  toDiscordApiEmbed,""")
          replace(path,
          """interface DailyContentReplyOptions {\n  content: string;\n  flags?: number;""",
          """interface DailyContentReplyOptions {\n  content: string;\n  embeds?: unknown[];\n  flags?: number;""")
          replace(path,
          """interface MessageTargetChannel {\n  id: string;""",
          """interface MessageTargetChannel {\n  id: string;\n  guildId?: string | null;""")
          old_preview = """    const heading = schedule.title ? `**${escapeMarkdown(schedule.title)}**\\n` : '';\n    const body = `${heading}${schedule.content}`;\n    const truncated =\n      body.length > MAX_PREVIEW_LENGTH\n        ? `${body.slice(0, MAX_PREVIEW_LENGTH - 20)}\\n…（省略）`\n        : body;\n    await respond(\n      interaction,\n      `プレビュー（<#${schedule.channelId}> / ${schedule.scheduleTime} ${schedule.timezone}）\\n\\n${truncated}`,\n    );\n    return;"""
          new_preview = """    if (schedule.messageFormat === 'embed') {\n      const apiEmbed = toDiscordApiEmbed(safeEmbedFromJson(schedule.embedJson));\n      const title = schedule.title ? `\\n管理タイトル: ${escapeMarkdown(schedule.title)}` : '';\n      await respond(\n        interaction,\n        `プレビュー（<#${schedule.channelId}> / ${schedule.scheduleTime} ${schedule.timezone}）${title}`,\n        apiEmbed ? [apiEmbed] : undefined,\n      );\n      return;\n    }\n    const heading = schedule.title ? `**${escapeMarkdown(schedule.title)}**\\n` : '';\n    const body = `${heading}${schedule.content}`;\n    const truncated =\n      body.length > MAX_PREVIEW_LENGTH\n        ? `${body.slice(0, MAX_PREVIEW_LENGTH - 20)}\\n…（省略）`\n        : body;\n    await respond(\n      interaction,\n      `プレビュー（<#${schedule.channelId}> / ${schedule.scheduleTime} ${schedule.timezone}）\\n\\n${truncated}`,\n    );\n    return;"""
          replace(path, old_preview, new_preview)
          replace(path,
          """      context.client,\n      channelId,\n      payload,""",
          """      context.client,\n      context.guildId,\n      channelId,\n      payload,""")
          # second sendToTarget call
          replace(path,
          """      context.client,\n      channelId,\n      payload,""",
          """      context.client,\n      context.guildId,\n      channelId,\n      payload,""")
          replace(path,
          """    if (crosspost && sent.crosspost) {\n      try {""",
          """    if (crosspost && !sent.crosspost) {\n      crosspostWarning = ' / このチャンネルはAnnouncement ChannelではないためCrosspostしませんでした';\n    } else if (crosspost && sent.crosspost) {\n      try {""")
          replace(path,
          """    const channel = await context.client.channels.fetch(reference.channelId);\n    if (!channel?.messages)\n      throw new DailyContentValidationError('返信先チャンネルを取得できません');""",
          """    const channel = await context.client.channels.fetch(reference.channelId);\n    if (!channel?.messages)\n      throw new DailyContentValidationError('返信先チャンネルを取得できません');\n    if (channel.guildId !== context.guildId) {\n      throw new DailyContentValidationError('別サーバーのメッセージには返信できません');\n    }""")
          old_stored = """  const embed = readEmbed(interaction, config);\n  if (!content.trim() && !embed)\n    throw new DailyContentValidationError('本文またはEmbedを入力してください');\n  return {\n    content,\n    messageFormat:\n      interaction.options.getString('format') === 'embed' ? ('embed' as const) : ('text' as const),\n    embed,\n  };"""
          new_stored = """  const rawEmbed = readEmbed(interaction, config);\n  const requestedFormat = interaction.options.getString('format');\n  const messageFormat =\n    requestedFormat === 'embed' || (requestedFormat === null && rawEmbed) ? 'embed' : 'text';\n  const embed = messageFormat === 'embed' ? rawEmbed : null;\n  if (!content.trim() && !embed)\n    throw new DailyContentValidationError('本文またはEmbedを入力してください');\n  return { content, messageFormat, embed };"""
          replace(path, old_stored, new_stored)
          old_immediate = """  const embed = readEmbed(interaction, config);\n  const attachment = interaction.options.getAttachment('image');\n  if (!content && !embed && !attachment) {\n    throw new DailyContentValidationError('本文・Embed・画像のいずれかを入力してください');\n  }\n  const apiEmbed = toDiscordApiEmbed(embed);"""
          new_immediate = """  const rawEmbed = readEmbed(interaction, config);\n  const requestedFormat = interaction.options.getString('format');\n  const messageFormat =\n    requestedFormat === 'embed' || (requestedFormat === null && rawEmbed) ? 'embed' : 'text';\n  const embed = messageFormat === 'embed' ? rawEmbed : null;\n  const attachment = interaction.options.getAttachment('image');\n  if (!content && !embed && !attachment) {\n    throw new DailyContentValidationError('本文・Embed・画像のいずれかを入力してください');\n  }\n  const apiEmbed = toDiscordApiEmbed(embed);"""
          replace(path, old_immediate, new_immediate)
          replace(path,
          """async function sendToTarget(\n  client: MessageStudioClient,\n  channelId: string,""",
          """async function sendToTarget(\n  client: MessageStudioClient,\n  guildId: string,\n  channelId: string,""")
          replace(path,
          """  const channel = await client.channels.fetch(channelId);\n  if (!channel) throw new DailyContentValidationError('投稿先チャンネルを取得できません');""",
          """  const channel = await client.channels.fetch(channelId);\n  if (!channel) throw new DailyContentValidationError('投稿先チャンネルを取得できません');\n  if (channel.guildId !== guildId) {\n    throw new DailyContentValidationError('別サーバーのチャンネルには投稿できません');\n  }""")
          replace(path,
          """async function respond(\n  interaction: DailyContentCommandInteraction,\n  content: string,\n): Promise<void> {\n  const options: DailyContentReplyOptions = {\n    content,""",
          """async function respond(\n  interaction: DailyContentCommandInteraction,\n  content: string,\n  embeds?: unknown[],\n): Promise<void> {\n  const options: DailyContentReplyOptions = {\n    content,\n    ...(embeds?.length ? { embeds } : {}),""")

          # worker: honor stored format, finish one-shot only after success, inspect crosspost HTTP status.
          path = 'apps/worker/src/daily-content.ts'
          replace(path,
          """      embed: safeEmbedFromJson(delivery.dailyContent.embedJson),""",
          """      embed:\n        delivery.dailyContent.messageFormat === 'embed'\n          ? safeEmbedFromJson(delivery.dailyContent.embedJson)\n          : null,""")
          replace(path,
          """      nonce: createDeliveryNonce(delivery.idempotencyKey),\n    });""",
          """      nonce: createDeliveryNonce(delivery.idempotencyKey),\n      onCrosspostWarning: ({ messageId, status, errorName }) =>\n        options.logger.warn(\n          {\n            guildId: delivery.guildId,\n            scheduleId: delivery.dailyContent.id,\n            deliveryId: delivery.id,\n            channelId: delivery.dailyContent.channelId,\n            messageId,\n            status,\n            errorName,\n          },\n          'AnnouncementのCrosspostに失敗しました。元メッセージは配信済みです',\n        ),\n    });""")
          replace(path,
          """      messageId,\n    });""",
          """      messageId,\n      completeOneShot:\n        delivery.origin === 'scheduled' && delivery.dailyContent.recurrenceType === 'once',\n    });""")
          replace(path,
          """  nonce: string;\n}): Promise<string> {""",
          """  nonce: string;\n  onCrosspostWarning?: (details: {\n    messageId: string;\n    status?: number;\n    errorName: string;\n  }) => void;\n}): Promise<string> {""")
          # publishDiscordChannelMessage has its own input type; add callback there too.
          needle = """  publishAnnouncement: boolean;\n  nonce: string;\n}): Promise<string> {\n  const embed = toDiscordApiEmbed(input.embed);"""
          repl = """  publishAnnouncement: boolean;\n  nonce: string;\n  onCrosspostWarning?: (details: {\n    messageId: string;\n    status?: number;\n    errorName: string;\n  }) => void;\n}): Promise<string> {\n  const embed = toDiscordApiEmbed(input.embed);"""
          replace(path, needle, repl)
          old_crosspost = """  if (input.publishAnnouncement) {\n    try {\n      await fetch(\n        `${DISCORD_API_BASE_URL}/channels/${input.channelId}/messages/${message.id}/crosspost`,\n        {\n          method: 'POST',\n          headers: { Authorization: `Bot ${input.token}` },\n          signal: AbortSignal.timeout(10_000),\n        },\n      );\n    } catch {\n      // Base message is already sent. Do not retry and duplicate it only because crosspost failed.\n    }\n  }"""
          new_crosspost = """  if (input.publishAnnouncement) {\n    try {\n      const crosspostResponse = await fetch(\n        `${DISCORD_API_BASE_URL}/channels/${input.channelId}/messages/${message.id}/crosspost`,\n        {\n          method: 'POST',\n          headers: { Authorization: `Bot ${input.token}` },\n          signal: AbortSignal.timeout(10_000),\n        },\n      );\n      if (!crosspostResponse.ok) {\n        input.onCrosspostWarning?.({\n          messageId: message.id,\n          status: crosspostResponse.status,\n          errorName: 'DailyContentCrosspostFailed',\n        });\n      }\n    } catch (error) {\n      input.onCrosspostWarning?.({\n        messageId: message.id,\n        errorName: resolveErrorName(error),\n      });\n      // Base message is already sent. Do not retry and duplicate it only because crosspost failed.\n    }\n  }"""
          replace(path, old_crosspost, new_crosspost)

          # Studio: SSR-safe one-shot default, weekly guard, accessible editor, complete embed fields only.
          path = 'apps/studio/src/components/daily-content-manager.tsx'
          replace(path,
          """    onceAt: nextLocalDateTime(defaultTimezone),""",
          """    onceAt: '',""")
          replace(path,
          """  useEffect(() => setSchedules(initialSchedules), [initialSchedules]);\n  useEffect(() => setDeliveries(initialDeliveries), [initialDeliveries]);""",
          """  useEffect(() => setSchedules(initialSchedules), [initialSchedules]);\n  useEffect(() => setDeliveries(initialDeliveries), [initialDeliveries]);\n  useEffect(() => {\n    setForm((current) =>\n      current.onceAt ? current : { ...current, onceAt: nextLocalDateTime(current.timezone) },\n    );\n  }, []);""")
          replace(path,
          """  function resetForm() {\n    setEditingId(null);\n    setForm(createEmptyForm(defaultTimezone, defaultChannelId));\n  }""",
          """  function resetForm() {\n    setEditingId(null);\n    setForm({\n      ...createEmptyForm(defaultTimezone, defaultChannelId),\n      onceAt: nextLocalDateTime(defaultTimezone),\n    });\n  }""")
          replace(path,
          """              <label className=\"mt-3 block\">\n                <span className=\"text-xs font-medium text-muted\">通常本文</span>""",
          """              <div className=\"mt-3 block\">\n                <label htmlFor=\"message-studio-content\" className=\"text-xs font-medium text-muted\">\n                  通常本文\n                </label>""")
          replace(path,
          """                  <textarea\n                    ref={textareaRef}""",
          """                  <textarea\n                    id=\"message-studio-content\"\n                    ref={textareaRef}""")
          replace(path,
          """              </label>\n            </section>\n\n            {form.messageFormat === 'embed' ? (""",
          """              </div>\n            </section>\n\n            {form.messageFormat === 'embed' ? (""")
          replace(path,
          """                disabled={busyKey === 'save' || !form.channelId}""",
          """                disabled={\n                  busyKey === 'save' ||\n                  !form.channelId ||\n                  (form.recurrenceType === 'weekly' && form.weekdays.length === 0)\n                }""")
          replace(path,
          """          ...(form.fields.some((field) => field.name.trim() || field.value.trim())\n            ? {\n                fields: form.fields\n                  .filter((field) => field.name.trim() || field.value.trim())""",
          """          ...(form.fields.some((field) => field.name.trim() && field.value.trim())\n            ? {\n                fields: form.fields\n                  .filter((field) => field.name.trim() && field.value.trim())""")

          # Tests: strict recurrence, one-shot future guard, Canary/PTB and copied weekday separators.
          path = Path('plugins/daily-content/src/config.test.ts')
          text = path.read_text()
          text = text.replace("const onceAt = new Date('2026-08-20T11:00:00Z');", "const onceAt = new Date('2099-08-20T11:00:00Z');")
          insert = """

  it('未知のrecurrenceTypeをdailyへ黙って変換せず拒否する', () => {
    expect(() =>
      normalizeDailyContentInput(
        {
          channelId: '123456789012345678',
          content: 'content',
          scheduleTime: '09:00',
          recurrenceType: 'monthly' as never,
        },
        normalizeDailyContentConfig({}),
      ),
    ).toThrow('recurrenceTypeはonce/daily/weeklyのいずれかを指定してください');
  });

  it('有効な1回予約は現在時刻より1分以上先だけ受け付ける', () => {
    const now = new Date('2030-01-01T00:00:00Z');
    const base = {
      channelId: '123456789012345678',
      content: 'content',
      scheduleTime: '09:00',
      recurrenceType: 'once' as const,
    };
    expect(() =>
      normalizeDailyContentInput(
        { ...base, onceAt: new Date('2030-01-01T00:00:30Z') },
        normalizeDailyContentConfig({}),
        now,
      ),
    ).toThrow('1回予約の日時は現在時刻より1分以上先を指定してください');
    expect(
      normalizeDailyContentInput(
        { ...base, onceAt: new Date('2030-01-01T00:02:00Z') },
        normalizeDailyContentConfig({}),
        now,
      ).onceAt,
    ).toEqual(new Date('2030-01-01T00:02:00Z'));
  });
"""
          text = text.replace("\n});\n", insert + "\n});\n")
          path.write_text(text)

          path = Path('plugins/daily-content/src/message.test.ts')
          text = path.read_text()
          insert = """

  it('Canary/PTBのDiscordメッセージURLも受け付ける', () => {
    for (const host of ['canary.discord.com', 'ptb.discord.com']) {
      expect(
        parseDiscordMessageUrl(
          `https://${host}/channels/123456789012345678/223456789012345678/323456789012345678`,
        ),
      ).toMatchObject({ guildId: '123456789012345678', channelId: '223456789012345678' });
    }
  });

  it('一覧表示で使う中黒と全角カンマを曜日区切りとして再入力できる', () => {
    expect(parseMessageStudioWeekdays('月・水・金')).toEqual([1, 3, 5]);
    expect(parseMessageStudioWeekdays('月，水，金')).toEqual([1, 3, 5]);
  });
"""
          text = text.replace("\n});\n", insert + "\n});\n")
          path.write_text(text)

          # Focused service regression for the one-shot state transition.
          Path('plugins/daily-content/src/service.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
import {
  markDeliverySent,
  reserveDueDelivery,
  type DailyContentDeliveryRecord,
  type DailyContentPrismaClient,
  type DailyContentRecord,
  type DailyContentTransactionClient,
} from './service.js';

function createHarness() {
  const scheduledFor = new Date('2030-01-01T00:10:00Z');
  let schedule: DailyContentRecord = {
    id: 'schedule-1',
    guildId: 'guild-1',
    channelId: '123456789012345678',
    title: 'one-shot',
    content: 'content',
    scheduleTime: '09:10',
    timezone: 'UTC',
    enabled: true,
    recurrenceType: 'once',
    onceAt: scheduledFor,
    weekdays: [],
    messageFormat: 'text',
    embedJson: null,
    publishAnnouncement: false,
    nextRunAt: scheduledFor,
    lastScheduledAt: null,
    lastSentAt: null,
    deletedAt: null,
    createdBy: 'user-1',
    updatedBy: 'user-1',
    createdAt: new Date('2029-12-01T00:00:00Z'),
    updatedAt: new Date('2029-12-01T00:00:00Z'),
  };
  let delivery: DailyContentDeliveryRecord | null = null;

  const tx = {
    dailyContent: {
      count: async () => 1,
      findMany: async () => [schedule],
      findFirst: async () => schedule,
      create: async () => schedule,
      update: async (args: Record<string, unknown>) => {
        const data = (args['data'] ?? {}) as Partial<DailyContentRecord>;
        schedule = { ...schedule, ...data, updatedAt: new Date() };
        return schedule;
      },
      delete: async () => schedule,
    },
    dailyContentDelivery: {
      findMany: async () => (delivery ? [delivery] : []),
      findFirst: async () => delivery,
      create: async (args: Record<string, unknown>) => {
        const data = args['data'] as Record<string, unknown>;
        const now = new Date('2030-01-01T00:10:00Z');
        delivery = {
          id: 'delivery-1',
          dailyContentId: String(data['dailyContentId']),
          guildId: String(data['guildId']),
          idempotencyKey: String(data['idempotencyKey']),
          origin: 'scheduled',
          scheduledFor: data['scheduledFor'] as Date,
          status: 'pending',
          attemptCount: 0,
          messageId: null,
          errorName: null,
          queuedAt: null,
          startedAt: null,
          nextAttemptAt: data['nextAttemptAt'] as Date,
          sentAt: null,
          failedAt: null,
          createdAt: now,
          updatedAt: now,
        };
        return delivery;
      },
      update: async (args: Record<string, unknown>) => {
        if (!delivery) throw new Error('delivery missing');
        const data = (args['data'] ?? {}) as Partial<DailyContentDeliveryRecord>;
        delivery = { ...delivery, ...data, updatedAt: new Date() };
        return delivery;
      },
    },
    auditLog: { create: async () => ({}) },
    guildPlugin: { findUnique: async () => ({ enabled: true }) },
    $queryRawUnsafe: async () => [],
  } as unknown as DailyContentTransactionClient;

  const prisma = {
    ...tx,
    $transaction: async <T>(callback: (client: DailyContentTransactionClient) => Promise<T>) =>
      callback(tx),
  } as unknown as DailyContentPrismaClient;

  return {
    prisma,
    scheduledFor,
    getSchedule: () => schedule,
    getDelivery: () => delivery,
  };
}

describe('Message Studio one-shot delivery lifecycle', () => {
  it('予約確保時は有効のまま、予約配信成功後にだけ無効化する', async () => {
    const harness = createHarness();
    const reserved = await reserveDueDelivery(
      harness.prisma,
      'schedule-1',
      harness.scheduledFor,
    );

    expect(reserved?.status).toBe('pending');
    expect(harness.getSchedule().enabled).toBe(true);
    expect(harness.getSchedule().nextRunAt).toBeNull();

    const sentAt = new Date('2030-01-01T00:10:05Z');
    await markDeliverySent(harness.prisma, {
      deliveryId: reserved!.id,
      scheduleId: 'schedule-1',
      messageId: 'message-1',
      sentAt,
      completeOneShot: true,
    });

    expect(harness.getDelivery()?.status).toBe('sent');
    expect(harness.getSchedule().enabled).toBe(false);
    expect(harness.getSchedule().lastSentAt).toEqual(sentAt);
  });

  it('手動配信成功では1回予約そのものを停止しない', async () => {
    const harness = createHarness();
    await markDeliverySent(harness.prisma, {
      deliveryId: 'delivery-1',
      scheduleId: 'schedule-1',
      messageId: 'manual-message',
      completeOneShot: false,
    }).catch(() => undefined);
    expect(harness.getSchedule().enabled).toBe(true);
  });
});
''')
          PY

      - run: pnpm db:generate
      - name: Format modified files
        run: >-
          pnpm exec prettier --write
          plugins/daily-content/src/config.ts
