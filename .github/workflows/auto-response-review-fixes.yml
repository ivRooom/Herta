name: Auto Response Review Fixes

on:
  push:
    branches:
      - feat/auto-response-plugin-v1
    paths:
      - 'auto-response-review-fixes.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply and validate review fixes
        id: apply
        shell: bash
        run: |
          set +e
          {
            node .github/scripts/apply-auto-response-review-fixes.mjs &&
            pnpm format &&
            pnpm db:generate &&
            pnpm --filter @herta/plugin-auto-response typecheck &&
            pnpm --filter @herta/plugin-auto-response test &&
            pnpm --filter @herta/bot typecheck &&
            pnpm --filter @herta/studio typecheck &&
            pnpm format:check &&
            git diff --check
          } > auto-response-review-result.txt 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "EXIT_CODE=${status}" >> auto-response-review-result.txt

      - name: Commit result and remove temporary automation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -f \
            .github/scripts/apply-auto-response-review-fixes.mjs \
            .github/workflows/auto-response-review-fixes.yml \
            auto-response-review-fixes.trigger
          if [ "${{ steps.apply.outputs.status }}" = '0' ]; then
            rm -f auto-response-review-result.txt
            message='fix(auto-response): レビュー指摘と本番安全性を改善'
          else
            message='ci(auto-response): レビュー修正失敗ログを記録'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "$message"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:feat/auto-response-plugin-v1
