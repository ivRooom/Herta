name: Auto Response Review Fixes

on:
  push:
    branches:
      - feat/auto-response-plugin-v1
    paths:
      - 'auto-response-review-fixes.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-plugin-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review fixes
        run: node .github/scripts/apply-auto-response-review-fixes.mjs
      - name: Format repository
        run: pnpm format
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/auto-response/src/config.ts plugins/auto-response/src/config.test.ts docs/plugins/AUTO_RESPONSE.md
          git commit -m 'fix(auto-response): 正規表現評価を実タイムアウトで保護'
          git push origin HEAD:feat/auto-response-plugin-v1
