name: Temporary Prisma Relation Sync

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-server-context-bot-profile
          fetch-depth: 0
      - name: Sync user preference relation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/db/prisma/schema.prisma')
          content = path.read_text()
          user_old = '  memberships GuildMember[]\n\n  @@map("users")'
          user_new = '  memberships      GuildMember[]\n  studioPreference StudioUserPreference?\n\n  @@map("users")'
          if user_old in content:
              content = content.replace(user_old, user_new, 1)
          pref_old = '  updatedAt      DateTime @updatedAt @map("updated_at") @db.Timestamptz(3)\n\n  @@map("studio_user_preferences")'
          pref_new = '  updatedAt      DateTime @updatedAt @map("updated_at") @db.Timestamptz(3)\n\n  user User @relation(fields: [userId], references: [id], onDelete: Cascade, onUpdate: Cascade)\n\n  @@map("studio_user_preferences")'
          if pref_old in content:
              content = content.replace(pref_old, pref_new, 1)
          path.write_text(content)
          PY
      - name: Commit and clean up
        shell: bash
        run: |
          git rm .github/workflows/tmp-schema-relation-sync.yml
          git config user.name "mizzz-ivr"
          git config user.email "86910433+mizzz-ivr@users.noreply.github.com"
          git add packages/db/prisma/schema.prisma
          git commit -m "Studioユーザー設定のPrisma relationを同期"
          git fetch origin feature/studio-server-context-bot-profile
          git rebase origin/feature/studio-server-context-bot-profile
          git push origin HEAD:feature/studio-server-context-bot-profile
