name: Regenerate Studio E2E lockfile

on:
  push:
    branches: [fix/372-studio-picker-mobile-overlay]
    paths:
      - 'apps/studio/package.json'
      - '.github/workflows/studio-e2e-lockfile-regenerate-372.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/372-studio-picker-mobile-overlay

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile with repository pnpm
        run: pnpm install --lockfile-only

      - name: Verify diff
        run: |
          git diff --check
          git diff -- apps/studio/package.json pnpm-lock.yaml

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(studio): regenerate lockfile for Playwright E2E'
          git push origin HEAD:fix/372-studio-picker-mobile-overlay
