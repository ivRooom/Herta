name: LFG Rich Config

on:
  push:
    branches:
      - feat/lfg-rich-config
    paths:
      - scripts/patch-lfg-rich-config.py
      - .github/workflows/lfg-rich-config.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/lfg-rich-config
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-lfg-rich-config.py
      - run: pnpm exec prettier --write apps/studio/src/components/lfg-manager.tsx apps/studio/src/app/dashboard/guilds/'[guildId]'/lfg/page.tsx
      - run: pnpm --dir apps/studio typecheck
      - name: Commit and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-lfg-rich-config.py
          rm .github/workflows/lfg-rich-config.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio scripts/patch-lfg-rich-config.py .github/workflows/lfg-rich-config.yml
          git commit -m "feat: LFG設定を検索式UIへ移行"
          git push origin HEAD:feat/lfg-rich-config
