name: Diagnose Quote Plugin Lint

on:
  push:
    branches: [feat/quote-plugin-v1]
    paths: [.github/workflows/diagnose-quote-lint.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/quote-plugin-v1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Lint結果を保存
        shell: bash
        run: |
          set +e
          pnpm lint > /tmp/quote-lint.log 2>&1
          status=$?
          set -e

          mkdir -p .ci
          {
            echo "exit_status=${status}"
            echo
            tail -n 800 /tmp/quote-lint.log
          } > .ci/quote-lint-output.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/quote-lint-output.txt
          git commit -m "ci(diag): Quote Lint結果を保存"
          git push origin HEAD:feat/quote-plugin-v1
