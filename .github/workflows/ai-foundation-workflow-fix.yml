name: AI Foundation Validation Workflow Fix

on:
  push:
    branches:
      - feat/ai-foundation-console-credentials

permissions:
  contents: write

jobs:
  fix-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Remove env files from explicit Prettier targets
        run: |
          sed -i '/^[[:space:]]*\.env\.example \\/d' .github/workflows/ai-foundation-draft-validate.yml
          sed -i '/^[[:space:]]*\.env\.production\.example \\/d' .github/workflows/ai-foundation-draft-validate.yml
          git diff --check
      - name: Commit workflow fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ai-foundation-draft-validate.yml
          git commit -m 'chore(ci): fix AI draft formatter targets'
          git push origin HEAD:feat/ai-foundation-console-credentials
