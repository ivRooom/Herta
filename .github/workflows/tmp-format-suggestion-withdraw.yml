name: Temporary Suggestion Formatter

on:
  push:
    branches: [feat/suggestion-author-withdraw]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec prettier --write \
            apps/bot/src/plugins/suggestion-repository.ts \
            apps/bot/src/plugins/suggestion-withdraw.test.ts \
            apps/bot/src/plugins/suggestion.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: suggestion-withdraw-prettier
          path: |
            apps/bot/src/plugins/suggestion-repository.ts
            apps/bot/src/plugins/suggestion-withdraw.test.ts
            apps/bot/src/plugins/suggestion.ts
          retention-days: 1
