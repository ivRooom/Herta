name: Temporary Fix AFK Unused

on:
  push:
    branches: [tmp/fix-afk-unused]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/bot/src/plugins/afk.ts')
          text = path.read_text()
          text = text.replace('const MAX_REASON_LENGTH = 200;\n', '')
          path.write_text(text)
          PY
          rm .github/workflows/tmp-fix-afk-unused.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AFKの未使用定数を削除する"
          git push origin HEAD
