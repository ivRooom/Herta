name: Team Split Review Fixes

on:
  push:
    branches: [feat/team-split-plugin-v1]

permissions:
  contents: write

concurrency:
  group: team-split-review-fixes
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/team-split-plugin-v1
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: レビュー修正を適用
        run: python3 .github/scripts/fix-team-split-review.py
      - name: Prisma Generate
        run: pnpm --filter @herta/db generate
      - name: Format
        run: pnpm format
      - name: Team Split Test
        run: pnpm --filter @herta/plugin-team-split test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: 一時ファイルを削除して反映
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git rm -f .github/scripts/fix-team-split-review.py
          git rm -f .github/workflows/team-split-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(team-split): レビュー指摘の競合・権限・復旧問題を修正'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/team-split-plugin-v1
