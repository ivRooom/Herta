name: PR233 Test Diagnostic

on:
  push:
    branches:
      - feature/blackjack-pvp-animation-v1

permissions:
  contents: read

jobs:
  test-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Run tests and show only failure tail
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/pr233-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '===== TEST FAILURE TAIL ====='
            tail -n 220 /tmp/pr233-tests.log
            exit "$status"
          fi
          echo 'All tests passed.'
