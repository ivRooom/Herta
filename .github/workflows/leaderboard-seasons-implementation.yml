name: Polish Leaderboard Seasons

on:
  push:
    branches:
      - feature/leaderboard-seasons
    paths:
      - .github/workflows/leaderboard-seasons-implementation.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-account-menu
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Season表示と入力検証を仕上げる
        shell: bash
        run: |
          set -euo pipefail
          git checkout feature/leaderboard-seasons
          python3 - <<'PY'
          from pathlib import Path

          shared = Path('packages/shared/src/community-leaderboard.ts')
          text = shared.read_text()
          text = text.replace("    description: '現在のCommunity Challenge Seasonで獲得したPoint',", "    description: 'Community Challenge Seasonで獲得したPoint',", 1)
          text = text.replace("  season: 'Current Season',", "  season: 'Season',", 1)
          text = text.replace(
              "  const safeLimit = Math.max(1, Math.min(12, Math.trunc(limit)));",
              "  const normalizedLimit = Number.isFinite(limit)\n    ? Math.trunc(limit)\n    : COMMUNITY_LEADERBOARD_SEASON_HISTORY_LIMIT;\n  const safeLimit = Math.max(1, Math.min(12, normalizedLimit));",
              1,
          )
          shared.write_text(text)

          page = Path('apps/studio/src/app/dashboard/guilds/[guildId]/leaderboard/page.tsx')
          text = page.read_text()
          text = text.replace(
              '          label="現在の1位"',
              "          label={query.metric === 'season' ? 'Season 1位' : '現在の1位'}",
              1,
          )
          text = text.replace(
              "                  candidate.metric === 'season' ? selectedSeason.key : null,",
              "                  candidate.metric === 'season'\n                    ? query.metric === 'season'\n                      ? selectedSeason.key\n                      : currentSeason.key\n                    : null,",
              1,
          )
          text = text.replace(
              '<div className="mt-4 flex gap-2 overflow-x-auto pb-1" aria-label="Season選択">',
              '<nav className="mt-4 flex gap-2 overflow-x-auto pb-1" aria-label="Season選択">',
              1,
          )
          text = text.replace(
              "            })}\n          </div>\n\n          <div className=\"mt-4 grid gap-3 border-t border-border pt-4 sm:grid-cols-2\">",
              "            })}\n          </nav>\n\n          <div className=\"mt-4 grid gap-3 border-t border-border pt-4 sm:grid-cols-2\">",
              1,
          )
          page.write_text(text)

          test_file = Path('apps/studio/src/lib/community-leaderboard-core.test.ts')
          text = test_file.read_text()
          marker = "  const seasons = listCommunityLeaderboardSeasons(now, 3);\n\n"
          if "Number.NaN" not in text:
              text = text.replace(
                  marker,
                  marker + "  assert.equal(listCommunityLeaderboardSeasons(now, Number.NaN).length, 6);\n\n",
                  1,
              )
          test_file.write_text(text)
          PY

      - name: 変更ファイルを整形
        run: >-
          pnpm exec prettier --write
          packages/shared/src/community-leaderboard.ts
          apps/studio/src/lib/community-leaderboard-core.test.ts
          'apps/studio/src/app/dashboard/guilds/[guildId]/leaderboard/page.tsx'

      - name: 変更をpush
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/community-leaderboard.ts \
            apps/studio/src/lib/community-leaderboard-core.test.ts \
            'apps/studio/src/app/dashboard/guilds/[guildId]/leaderboard/page.tsx'
          git commit -m "Leaderboard Seasonsの表示と検証を仕上げる"
          git push origin HEAD:feature/leaderboard-seasons
