name: Auto Response Smart Pickers

on:
  push:
    branches:
      - feat/auto-response-rich-config
    paths:
      - scripts/patch-auto-response-smart-pickers.py
      - .github/workflows/auto-response-smart-pickers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auto-response-rich-config
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: python3 scripts/patch-auto-response-smart-pickers.py
      - run: pnpm exec prettier --write apps/studio/src/components/auto-response-rule-manager.tsx apps/studio/src/app/dashboard/guilds/'[guildId]'/auto-response/page.tsx
      - run: pnpm --dir apps/studio typecheck
      - name: Commit and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-auto-response-smart-pickers.py
          rm .github/workflows/auto-response-smart-pickers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio scripts/patch-auto-response-smart-pickers.py .github/workflows/auto-response-smart-pickers.yml
          git commit -m "feat: Auto Responseに検索式Channel Role Pickerを導入"
          git push origin HEAD:feat/auto-response-rich-config
