name: Polish Discord Role lifecycle v2

on:
  push:
    branches:
      - feature/discord-role-lifecycle-v1

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/discord-role-lifecycle-v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply safety polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 marker, got {text.count(old)}')
              return text.replace(old, new, 1)

          route_path = Path('apps/studio/src/app/api/guilds/[guildId]/discord-roles/route.ts')
          route = route_path.read_text()
          route = replace_once(
              route,
              "  if (claim.count === 0) {\n    const existing = await prisma.discordRoleLifecycleOperation.findUnique({ where: { id: operation.id } });\n    return NextResponse.json({ operation: existing }, { status: 200 });\n  }",
              "  if (claim.count === 0) {\n    const existing = await prisma.discordRoleLifecycleOperation.findUnique({\n      where: { id: operation.id },\n    });\n    if (existing?.status === 'attention') {\n      return NextResponse.json(\n        {\n          error: '前回のRole作成結果を確定できません。Discord上のRoleを確認してください。',\n          operation: existing,\n          attention: true,\n        },\n        { status: 409 },\n      );\n    }\n    if (existing?.status === 'failed') {\n      return NextResponse.json(\n        { error: '前回のRole作成は失敗しています。再試行してください。', operation: existing },\n        { status: 409 },\n      );\n    }\n    return NextResponse.json({ operation: existing }, { status: 200 });\n  }",
              'route claim',
          )
          route = replace_once(
              route,
              "  } catch (error) {\n    await compensateCreatedRole(guildId, createdRole.id);\n    await prisma.discordRoleLifecycleOperation.update({\n      where: { id: operation.id },\n      data: { status: 'failed', lastError: 'RolePersistenceFailed' },\n    }).catch(() => undefined);\n    return NextResponse.json({ error: 'Role作成後の永続化に失敗したため作成を取り消しました' }, { status: 503 });\n  }",
              "  } catch {\n    const compensated = await compensateCreatedRole(guildId, createdRole.id);\n    const persistenceStatus = compensated ? 'failed' : 'attention';\n    try {\n      await prisma.discordRoleLifecycleOperation.update({\n        where: { id: operation.id },\n        data: {\n          status: persistenceStatus,\n          lastError: compensated ? 'RolePersistenceFailed' : 'RolePersistenceCompensationFailed',\n        },\n      });\n    } catch (persistenceError) {\n      console.error('Discord Role lifecycle operationの障害状態保存に失敗しました', {\n        operationId: operation.id,\n        errorName: safeErrorCode(persistenceError),\n      });\n    }\n    return NextResponse.json(\n      {\n        error: compensated\n          ? 'Role作成後の永続化に失敗したため作成を取り消しました'\n          : 'Role作成後の永続化と補償削除を確認できません。Discord上のRoleを確認してください。',\n        attention: !compensated,\n      },\n      { status: 503 },\n    );\n  }",
              'route compensation block',
          )
          route = replace_once(
              route,
              "async function compensateCreatedRole(guildId: string, roleId: string): Promise<void> {\n  try {\n    await deleteBotGuildRole(guildId, roleId);\n  } catch {\n    // Operationをfailedとして残し、Role Managerの「要確認」対象として追跡できる。\n  }\n}",
              "async function compensateCreatedRole(guildId: string, roleId: string): Promise<boolean> {\n  try {\n    await deleteBotGuildRole(guildId, roleId);\n    return true;\n  } catch {\n    return false;\n  }\n}",
              'route compensation helper',
          )
          route_path.write_text(route)

          manager_path = Path('apps/studio/src/components/role-lifecycle-manager.tsx')
          manager = manager_path.read_text()
          manager = replace_once(manager, "import { useMemo, useState } from 'react';", "import { useMemo, useRef, useState } from 'react';", 'manager import')
          manager = replace_once(manager, "  const router = useRouter();\n  const [name, setName]", "  const router = useRouter();\n  const requestIdRef = useRef<string | null>(null);\n  const [name, setName]", 'manager ref')
          create_start = manager.index('  async function createRole() {')
          delete_start = manager.index('\n  async function deleteRole()', create_start)
          create = manager[create_start:delete_start]
          create = replace_once(create, "    setPending(true);\n    setNotice(null);\n    try {", "    const requestId = requestIdRef.current ?? crypto.randomUUID();\n    requestIdRef.current = requestId;\n    setPending(true);\n    setNotice(null);\n    try {", 'create request id')
          create = replace_once(create, "          requestId: crypto.randomUUID(),", "          requestId,", 'create payload')
          create = replace_once(create, "      if (!response.ok) {\n        throw new Error(", "      if (!response.ok) {\n        if (!result?.attention) requestIdRef.current = null;\n        throw new Error(", 'create error')
          create = replace_once(create, "      if (timing === 'now') setName('');\n      router.refresh();", "      requestIdRef.current = null;\n      if (timing === 'now') setName('');\n      router.refresh();", 'create success')
          manager = manager[:create_start] + create + manager[delete_start:]
          manager_path.write_text(manager)

          worker_path = Path('apps/worker/src/discord-role-lifecycle.ts')
          worker = worker_path.read_text()
          worker = replace_once(worker, "import type { PrismaClient } from '@herta/db';", "import type { DiscordRoleLifecycleOperation, PrismaClient } from '@herta/db';", 'worker db import')
          worker = replace_once(worker, "import type { Logger } from 'pino';", "import type { Logger } from 'pino';\nimport { findHertaRoleReferences, removeStudioRolePolicyReference } from './discord-role-references.js';", 'worker helper import')
          old_type = "Awaited<ReturnType<PrismaClient['discordRoleLifecycleOperation']['findFirst']>> & {}"
          if worker.count(old_type) != 2:
              raise SystemExit(f'worker types: expected 2 markers, got {worker.count(old_type)}')
          worker = worker.replace(old_type, 'DiscordRoleLifecycleOperation')
          delete_start = worker.index('async function executeDelete(')
          recover_start = worker.index('\nasync function recoverStaleOperations', delete_start)
          delete_section = worker[delete_start:recover_start]
          delete_section = replace_once(delete_section, "  if (!operation?.roleId) throw new Error('RoleDeleteTargetMissing');\n  const result = await callDeleteRole(input, operation.guildId, operation.roleId);", "  if (!operation.roleId) throw new Error('RoleDeleteTargetMissing');\n  const references = await findHertaRoleReferences(\n    input.prisma,\n    operation.guildId,\n    operation.roleId,\n  );\n  if (references.length > 0) {\n    throw new Error(`RoleStillReferencedByHertaConfig:${references.join(',')}`);\n  }\n  const result = await callDeleteRole(input, operation.guildId, operation.roleId);", 'worker reference guard')
          delete_section = replace_once(delete_section, "  await input.prisma.$transaction(async (tx) => {\n    await tx.discordRoleLifecycleOperation.update({", "  await input.prisma.$transaction(async (tx) => {\n    await removeStudioRolePolicyReference(tx, operation.guildId, operation.roleId);\n    await tx.discordRoleLifecycleOperation.update({", 'worker policy cleanup')
          worker = worker[:delete_start] + delete_section + worker[recover_start:]
          worker_path.write_text(worker)
          PY
      - name: Format changed sources
        run: |
          pnpm --filter @herta/db exec prisma format
          pnpm exec prettier --write \
            apps/bot/src/health/guild-role-lifecycle-http.ts \
            apps/bot/src/health/guild-role-lifecycle.test.ts \
            apps/bot/src/health/guild-role-lifecycle.ts \
            apps/bot/src/health/server.ts \
            apps/studio/package.json \
            'apps/studio/src/app/api/guilds/[guildId]/discord-roles/[roleId]/route.ts' \
            'apps/studio/src/app/api/guilds/[guildId]/discord-roles/route.ts' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/roles/page.tsx' \
            apps/studio/src/components/role-lifecycle-manager.tsx \
            apps/studio/src/lib/bot-guild-role-lifecycle.ts \
            apps/studio/src/lib/discord-role-lifecycle.test.ts \
            apps/studio/src/lib/discord-role-lifecycle.ts \
            apps/studio/src/lib/studio-access-policy.ts \
            apps/worker/src/discord-role-lifecycle.ts \
            apps/worker/src/discord-role-references.ts \
            apps/worker/src/main.ts \
            docker-compose.prod.yml \
            packages/shared/src/index.ts \
            packages/shared/src/json-reference.ts \
            packages/shared/src/studio-access.ts
          git diff --check
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: Role lifecycleの再実行安全性と参照整合性を強化する'
          git push origin HEAD:feature/discord-role-lifecycle-v1
