name: Temporary VC OpenAI Docs Prettier
on:
  push:
    branches:
      - feat/vc-recap-pluggable-whisper-gpt-transcribe-20261031
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[doc-format-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/VC_RECAP_OPENAI_TRANSCRIPTION_ROLLOUT.md
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/VC_RECAP_OPENAI_TRANSCRIPTION_ROLLOUT.md
            git commit -m "style(docs): format VC OpenAI rollout [doc-format-skip]"
            git push origin HEAD:feat/vc-recap-pluggable-whisper-gpt-transcribe-20261031
          fi
