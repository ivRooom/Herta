name: Temporary PR #768 Prettier formatter
on:
  push:
    branches: [release/valorant-prod-backup-gate-767]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write deploy/scripts/production-quality-gate.test.mjs
      - name: Commit scoped formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- deploy/scripts/production-quality-gate.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(release): format migration safety gate test (#767)"
            git push origin HEAD:refs/heads/release/valorant-prod-backup-gate-767
          fi
