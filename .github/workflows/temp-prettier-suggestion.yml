name: Temp Prettier Suggestion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/suggestion.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: temp-prettier-suggestion
          path: apps/bot/src/plugins/suggestion.ts
          retention-days: 1
