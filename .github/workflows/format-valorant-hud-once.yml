name: Format VALORANT HUD once
on:
  push:
    branches:
      - codex/valorant-hud-card-issues-619-623
    paths:
      - .github/workflows/format-valorant-hud-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format HUD source/tests/docs and remove this workflow
        run: |
          pnpm exec prettier --write apps/bot/src/plugins/valorant-pick-card.ts apps/bot/src/plugins/valorant-pick-card-hud.ts apps/bot/src/plugins/valorant-pick-card.test.ts docs/VALORANT_RANDOM.md
          rm .github/workflows/format-valorant-hud-once.yml
          git add -- apps/bot/src/plugins/valorant-pick-card.ts apps/bot/src/plugins/valorant-pick-card-hud.ts apps/bot/src/plugins/valorant-pick-card.test.ts docs/VALORANT_RANDOM.md .github/workflows/format-valorant-hud-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(valorant): format HUD card and tests'
          git push origin HEAD:codex/valorant-hud-card-issues-619-623
