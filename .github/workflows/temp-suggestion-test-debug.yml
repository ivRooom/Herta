name: Temp Suggestion Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/suggestion-author-withdraw
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('apps/bot/src/plugins/suggestion.ts')
          source = source_path.read_text()

          if 'message?: TextMessage;' not in source:
              source = source.replace(
                  "  customId?: string;\n  user: { id: string };\n",
                  "  customId?: string;\n  message?: TextMessage;\n  user: { id: string };\n",
                  1,
              )

          source = source.replace(
              '  await reconcileSuggestionMessage(context, snapshot).catch((error) =>\n'
              '    context.logger.warn(\n'
              '      { err: error, suggestionId: parsed.id },\n'
              "      '投票後のSuggestionメッセージ再同期に失敗しました',\n",
              '  await reconcileSuggestionMessage(context, snapshot, interaction.message).catch((error) =>\n'
              '    context.logger.warn(\n'
              '      { err: error, suggestionId: parsed.id },\n'
              "      '投票後のSuggestionメッセージ再同期に失敗しました',\n",
              1,
          )

          reconcile_pattern = re.compile(
              r"async function reconcileSuggestionMessage\([\s\S]*?\n}\n\nasync function updateStoredMessage\([\s\S]*?\n}\n\nexport function formatSuggestionListPages",
              re.MULTILINE,
          )
          reconcile_replacement = '''async function reconcileSuggestionMessage(
            context: SuggestionContext,
            initial: SuggestionSnapshot,
            fallbackMessage?: TextMessage,
          ): Promise<void> {
            const queueKey = `${initial.guildId}:${initial.id}`;
            const previous = suggestionMessageQueues.get(queueKey) ?? Promise.resolve();
            const task = previous
              .catch(() => undefined)
              .then(async () => {
                let rendered = initial;
                await updateStoredMessage(context, rendered, fallbackMessage);

                for (let attempt = 0; attempt < MAX_MESSAGE_RECONCILE_ATTEMPTS; attempt += 1) {
                  const current = await getSuggestionSnapshot(context.prisma, rendered.id, rendered.guildId);
                  if (!current || !shouldRepairSuggestionMessage(rendered, current)) return;
                  await updateStoredMessage(context, current, fallbackMessage);
                  rendered = current;
                }

                const current = await getSuggestionSnapshot(context.prisma, rendered.id, rendered.guildId);
                if (current && shouldRepairSuggestionMessage(rendered, current)) {
                  await updateStoredMessage(context, current, fallbackMessage);
                }
              });

            suggestionMessageQueues.set(queueKey, task);
            try {
              await task;
            } finally {
              if (suggestionMessageQueues.get(queueKey) === task) suggestionMessageQueues.delete(queueKey);
            }
          }

          async function updateStoredMessage(
            context: SuggestionContext,
            snapshot: SuggestionSnapshot,
            fallbackMessage?: TextMessage,
          ): Promise<void> {
            if (fallbackMessage) {
              await fallbackMessage.edit(buildSuggestionMessage(snapshot));
              return;
            }
            if (!snapshot.messageId) return;
            const channel = await context.client.channels.fetch(snapshot.channelId);
            if (!channel?.isTextBased()) throw new Error('SuggestionChannelUnavailable');
            const message = await channel.messages.fetch(snapshot.messageId);
            await message.edit(buildSuggestionMessage(snapshot));
          }

          export function formatSuggestionListPages'''
          source, count = reconcile_pattern.subn(reconcile_replacement, source, count=1)
          if count != 1:
              raise RuntimeError('reconciliation block not found')
          source_path.write_text(source)

          withdraw_path = Path('apps/bot/src/plugins/suggestion-withdraw.test.ts')
          withdraw = withdraw_path.read_text()
          withdraw = withdraw.replace(
              '    const update = vi.fn(async () => undefined);\n'
              '    const interaction = {\n'
              "      guildId: '123',\n"
              '      customId: `herta:suggestion:v1:vote:${ID}:up`,\n'
              "      user: { id: '777' },\n"
              '      isButton: () => true,\n'
              '      reply: vi.fn(async () => undefined),\n'
              '      update,\n'
              '    };',
              '    const deferUpdate = vi.fn(async () => undefined);\n'
              '    const interaction = {\n'
              "      guildId: '123',\n"
              '      customId: `herta:suggestion:v1:vote:${ID}:up`,\n'
              "      user: { id: '777' },\n"
              '      isButton: () => true,\n'
              '      reply: vi.fn(async () => undefined),\n'
              '      deferUpdate,\n'
              '    };',
              1,
          )
          withdraw = withdraw.replace(
              '    expect(update).toHaveBeenCalledWith(\n'
              '      expect.objectContaining({\n'
              "        content: expect.stringContaining('📝 未確認'),\n"
              '      }),\n'
              '    );',
              '    expect(deferUpdate).toHaveBeenCalledTimes(1);\n'
              '    expect(edit).toHaveBeenCalledWith(\n'
              '      expect.objectContaining({\n'
              "        content: expect.stringContaining('📝 未確認'),\n"
              '      }),\n'
              '    );',
              1,
          )
          withdraw_path.write_text(withdraw)

          reconciliation_path = Path('apps/bot/src/plugins/suggestion-message-reconciliation.test.ts')
          reconciliation = reconciliation_path.read_text()
          helper_pattern = re.compile(
              r"function createVoteInteraction\([\s\S]*?\n}\n\nasync function executeVote",
              re.MULTILINE,
          )
          helper_replacement = '''function createVoteInteraction(
            deferUpdate = vi.fn(async () => undefined),
            message?: { id: string; edit(options: unknown): Promise<unknown> },
          ) {
            return {
              guildId: '123',
              customId: `herta:suggestion:v1:vote:${ID}:up`,
              message,
              user: { id: '777' },
              isButton: () => true,
              reply: vi.fn(async () => undefined),
              deferUpdate,
            };
          }

          async function executeVote'''
          reconciliation, count = helper_pattern.subn(helper_replacement, reconciliation, count=1)
          if count != 1:
              raise RuntimeError('vote interaction helper not found')

          marker = "  it('投票ackが失敗しても公開メッセージ再同期後に元のエラーを返す', async () => {"
          if 'messageId保存前の投票でもcomponent messageを更新する' not in reconciliation:
              regression = '''  it('messageId保存前の投票でもcomponent messageを更新する', async () => {
            const pending = makeSnapshot({ messageId: null, upvotes: 4 });
            const { context, edit } = createVoteContext([pending]);
            const componentEdit = vi.fn(async () => undefined);
            const interaction = createVoteInteraction(vi.fn(async () => undefined), {
              id: '999',
              edit: componentEdit,
            });

            await executeVote(context, interaction);

            expect(interaction.deferUpdate).toHaveBeenCalledTimes(1);
            expect(componentEdit).toHaveBeenCalledWith(
              expect.objectContaining({ content: expect.stringContaining('👍 4') }),
            );
            expect(edit).not.toHaveBeenCalled();
          });

          '''
              reconciliation = reconciliation.replace(marker, regression + marker, 1)
          reconciliation_path.write_text(reconciliation)
          PY
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/suggestion.ts apps/bot/src/plugins/suggestion-withdraw.test.ts apps/bot/src/plugins/suggestion-message-reconciliation.test.ts
      - name: Commit fixes
        run: |
          git config user.name "mizzz-ivr"
          git config user.email "86910433+mizzz-ivr@users.noreply.github.com"
          git add apps/bot/src/plugins/suggestion.ts apps/bot/src/plugins/suggestion-withdraw.test.ts apps/bot/src/plugins/suggestion-message-reconciliation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Suggestion投票の表示同期を強化"
          git push origin HEAD:feat/suggestion-author-withdraw
