name: Temp Suggestion Test Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @herta/db prisma generate
      - run: pnpm --filter @herta/bot exec vitest run src/plugins/suggestion-message-reconciliation.test.ts --reporter=verbose
