name: Temporary Mini Games v2 typefix

on:
  push:
    branches:
      - feature/mini-games-v2-stats-challenges

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v2-stats-challenges
      - name: Fix fixtures and require userId
        run: |
          python3 <<'PY'
          from pathlib import Path

          achievement_fields = """  minigamePlays: 0,
          minigameWins: 0,
          coinflipWins: 0,
          highLowBestStreak: 0,
          highLowClears: 0,
          blackjackWins: 0,
          blackjackNaturals: 0,
          """

          for path in [
              'apps/bot/src/plugins/achievements.test.ts',
              'apps/bot/src/plugins/community-profile-v3.test.ts',
          ]:
              p = Path(path)
              s = p.read_text()
              old = '  seasonPoints: 0,\n' if path.endswith('achievements.test.ts') else '  seasonPoints: 490,\n'
              assert old in s, path
              s = s.replace(old, old + achievement_fields, 1)
              p.write_text(s)

          p = Path('apps/bot/src/plugins/community-challenge.test.ts')
          s = p.read_text()
          old = "        minecraft_seconds: 100_000,\n"
          assert old in s
          s = s.replace(
              old,
              old
              + "        minigame_plays: 0,\n"
              + "        minigame_wins: 0,\n"
              + "        highlow_round_wins: 0,\n"
              + "        blackjack_wins: 0,\n",
              1,
          )
          p.write_text(s)

          p = Path('apps/bot/src/plugins/mini-games.ts')
          s = p.read_text()
          old = "  metrics: readonly (readonly [MiniGameMetric, number])[],\n  userId?: string,\n"
          new = "  metrics: readonly (readonly [MiniGameMetric, number])[],\n  userId: string,\n"
          assert old in s
          s = s.replace(old, new, 1)
          old = "incrementMiniGameMetric(context.prisma, context.guildId, userId ?? '', metric, amount)"
          assert old in s
          s = s.replace(
              old,
              "incrementMiniGameMetric(context.prisma, context.guildId, userId, metric, amount)",
              1,
          )
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/achievements.test.ts apps/bot/src/plugins/community-profile-v3.test.ts apps/bot/src/plugins/community-challenge.test.ts apps/bot/src/plugins/mini-games.ts
      - name: Commit changes
        run: |
          rm .github/workflows/temporary-mini-games-v2-typefix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mini Games v2のMetric fixtureとuserId型を修正する'
          git push origin HEAD:feature/mini-games-v2-stats-challenges
