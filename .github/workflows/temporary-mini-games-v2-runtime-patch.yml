name: Temporary Mini Games v2 runtime patch

on:
  push:
    branches:
      - feature/mini-games-v2-stats-challenges

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v2-stats-challenges
      - name: Patch Mini Games runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/bot/src/plugins/mini-games.ts')
          s = p.read_text()
          def rep(old, new):
              global s
              assert old in s, f'missing pattern: {old[:80]!r}'
              s = s.replace(old, new, 1)

          rep("import { miniGamesManifest } from '@herta/plugin-catalog';", "import type { PrismaClient } from '@herta/db';\nimport { miniGamesManifest } from '@herta/plugin-catalog';")
          rep("} from './mini-games-core.js';\n\nconst CUSTOM_ID_PREFIX", "} from './mini-games-core.js';\nimport {\n  getMiniGameStats,\n  incrementMiniGameMetric,\n  recordMiniGameMaximum,\n  type MiniGameMetric,\n} from './mini-games-repository.js';\nimport { formatMiniGameStats } from './mini-games-stats.js';\n\nconst CUSTOM_ID_PREFIX")
          rep("export interface MiniGamesConfig {\n  enabled: boolean;", "export interface MiniGamesConfig {\n  enabled: boolean;\n  statsEnabled: boolean;")
          rep("type MiniGamesRuntimeContext = PluginRuntimeContext<MiniGamesConfig, unknown, unknown>;", "type MiniGamesRuntimeContext = PluginRuntimeContext<MiniGamesConfig, unknown, PrismaClient>;")
          rep("export const miniGamesPlugin = definePlugin<MiniGamesConfig, unknown, unknown>({", "export const miniGamesPlugin = definePlugin<MiniGamesConfig, unknown, PrismaClient>({")
          rep("    const blackjack: CommandHandler<ChatInputCommandInteraction> = {\n      definition: miniGamesManifest.commands[2]!,\n      async execute(interaction) {\n        await executeBlackjack(context, interaction);\n      },\n    };\n    return [coinflip, highlow, blackjack];", "    const blackjack: CommandHandler<ChatInputCommandInteraction> = {\n      definition: miniGamesManifest.commands[2]!,\n      async execute(interaction) {\n        await executeBlackjack(context, interaction);\n      },\n    };\n    const gamestats: CommandHandler<ChatInputCommandInteraction> = {\n      definition: miniGamesManifest.commands[3]!,\n      async execute(interaction) {\n        await executeGameStats(context, interaction);\n      },\n    };\n    return [coinflip, highlow, blackjack, gamestats];")
          rep("    enabled: source.enabled === undefined ? true : source.enabled === true,\n    coinflipAnimation:", "    enabled: source.enabled === undefined ? true : source.enabled === true,\n    statsEnabled: source.statsEnabled === undefined ? true : source.statsEnabled === true,\n    coinflipAnimation:")
          rep("  const result = flipCoin();\n\n  if (!config.coinflipAnimation)", "  const result = flipCoin();\n  await recordMetricsSafely(context, [\n    ['minigame_plays', 1],\n    ['coinflip_plays', 1],\n    ...(choice ? ([['coinflip_predictions', 1]] as const) : []),\n    ...(choice === result\n      ? ([\n          ['coinflip_wins', 1],\n          ['minigame_wins', 1],\n        ] as const)\n      : []),\n  ]);\n\n  if (!config.coinflipAnimation)")
          rep("  if (!config.enabled) {\n    await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');\n    return;\n  }\n\n  const deck = createShuffledDeck();\n  const id = createSessionId();\n  const session: HighLowSession", "  if (!config.enabled) {\n    await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');\n    return;\n  }\n\n  await recordMetricsSafely(context, [\n    ['minigame_plays', 1],\n    ['highlow_plays', 1],\n  ]);\n  const deck = createShuffledDeck();\n  const id = createSessionId();\n  const session: HighLowSession")
          # Replace the second identical config/deck block (Blackjack) after High-Low was changed.
          target = "  if (!config.enabled) {\n    await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');\n    return;\n  }\n\n  const deck = createShuffledDeck();\n  const player = [drawCard(deck), drawCard(deck)];"
          rep(target, "  if (!config.enabled) {\n    await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');\n    return;\n  }\n\n  await recordMetricsSafely(context, [\n    ['minigame_plays', 1],\n    ['blackjack_plays', 1],\n  ]);\n  const deck = createShuffledDeck();\n  const player = [drawCard(deck), drawCard(deck)];")
          rep("  if (openingPlayer.blackjack || openingDealer.blackjack) {\n    await interaction.reply({", "  if (openingPlayer.blackjack || openingDealer.blackjack) {\n    await recordBlackjackSettlement(context, session);\n    await interaction.reply({")
          rep("      await handleHighLowButton(session, parsed.action, config, interaction);\n    } else {\n      await handleBlackjackButton(session, parsed.action, config, interaction);", "      await handleHighLowButton(context, session, parsed.action, config, interaction);\n    } else {\n      await handleBlackjackButton(context, session, parsed.action, config, interaction);")
          rep("async function handleHighLowButton(\n  session: HighLowSession,", "async function handleHighLowButton(\n  context: MiniGamesRuntimeContext,\n  session: HighLowSession,")
          rep("  session.streak += 1;\n  if (session.streak >= session.maxRounds) {", "  session.streak += 1;\n  await recordMetricsSafely(context, [['highlow_round_wins', 1]]);\n  await recordMaximumSafely(context, session.guildId, session.userId, session.streak);\n  if (session.streak >= session.maxRounds) {\n    await recordMetricsSafely(context, [\n      ['highlow_clears', 1],\n      ['minigame_wins', 1],\n    ]);")
          rep("async function handleBlackjackButton(\n  session: BlackjackSession,", "async function handleBlackjackButton(\n  context: MiniGamesRuntimeContext,\n  session: BlackjackSession,")
          rep("    if (score.bust) {\n      endSession(session);\n      await interaction.update({ content: renderBlackjackFinal(session), components: [] });", "    if (score.bust) {\n      endSession(session);\n      await recordBlackjackSettlement(context, session);\n      await interaction.update({ content: renderBlackjackFinal(session), components: [] });")
          rep("    if (score.total === 21) {\n      playDealer(session);\n      endSession(session);\n      await interaction.update({ content: renderBlackjackFinal(session), components: [] });", "    if (score.total === 21) {\n      playDealer(session);\n      endSession(session);\n      await recordBlackjackSettlement(context, session);\n      await interaction.update({ content: renderBlackjackFinal(session), components: [] });")
          rep("  if (action === 'stand') {\n    playDealer(session);\n    endSession(session);\n    await interaction.update({ content: renderBlackjackFinal(session), components: [] });", "  if (action === 'stand') {\n    playDealer(session);\n    endSession(session);\n    await recordBlackjackSettlement(context, session);\n    await interaction.update({ content: renderBlackjackFinal(session), components: [] });")
          rep("function playDealer(session: BlackjackSession): void {", "async function executeGameStats(\n  context: MiniGamesRuntimeContext,\n  interaction: ChatInputCommandInteraction,\n): Promise<void> {\n  if (!interaction.guildId) {\n    await replyEphemeral(interaction, 'このコマンドはDiscordサーバー内でのみ利用できます。');\n    return;\n  }\n  const config = normalizeMiniGamesConfig(context.config);\n  if (!config.enabled) {\n    await replyEphemeral(interaction, 'Mini Games Pluginは現在無効です。');\n    return;\n  }\n  if (!config.statsEnabled) {\n    await replyEphemeral(interaction, 'Mini Gamesの戦績記録は現在無効です。');\n    return;\n  }\n  const userId = interaction.options.getUser('user')?.id ?? interaction.user.id;\n  const stats = await getMiniGameStats(context.prisma, interaction.guildId, userId);\n  await interaction.reply({\n    content: formatMiniGameStats(userId, stats),\n    allowedMentions: { parse: [] },\n  });\n}\n\nasync function recordBlackjackSettlement(\n  context: MiniGamesRuntimeContext,\n  session: BlackjackSession,\n): Promise<void> {\n  const outcome = settleBlackjack(session.player, session.dealer);\n  const metrics: Array<readonly [MiniGameMetric, number]> = [];\n  if (outcome === 'player-win' || outcome === 'player-blackjack') {\n    metrics.push(['blackjack_wins', 1], ['minigame_wins', 1]);\n  }\n  if (outcome === 'push') metrics.push(['blackjack_pushes', 1]);\n  if (outcome === 'player-blackjack') metrics.push(['blackjack_naturals', 1]);\n  await recordMetricsSafely(context, metrics);\n}\n\nasync function recordMetricsSafely(\n  context: MiniGamesRuntimeContext,\n  metrics: readonly (readonly [MiniGameMetric, number])[],\n): Promise<void> {\n  if (!normalizeMiniGamesConfig(context.config).statsEnabled || metrics.length === 0) return;\n  const results = await Promise.allSettled(\n    metrics.map(([metric, amount]) =>\n      incrementMiniGameMetric(context.prisma, context.guildId, context.userId ?? '', metric, amount),\n    ),\n  );\n  if (results.some((result) => result.status === 'rejected')) {\n    context.logger.warn({ guildId: context.guildId }, 'Mini Games戦績の保存に一部失敗しました');\n  }\n}\n\nasync function recordMaximumSafely(\n  context: MiniGamesRuntimeContext,\n  guildId: string,\n  userId: string,\n  streak: number,\n): Promise<void> {\n  if (!normalizeMiniGamesConfig(context.config).statsEnabled) return;\n  try {\n    await recordMiniGameMaximum(context.prisma, guildId, userId, 'highlow_best_streak', streak);\n  } catch (error) {\n    context.logger.warn({ err: error, guildId, userId }, 'High-Low最高連勝の保存に失敗しました');\n  }\n}\n\nfunction playDealer(session: BlackjackSession): void {")
          # recordMetricsSafely must use the actual player, not a context user that does not exist.
          rep("async function recordMetricsSafely(\n  context: MiniGamesRuntimeContext,\n  metrics: readonly (readonly [MiniGameMetric, number])[],", "async function recordMetricsSafely(\n  context: MiniGamesRuntimeContext,\n  metrics: readonly (readonly [MiniGameMetric, number])[],\n  userId?: string,")
          rep("incrementMiniGameMetric(context.prisma, context.guildId, context.userId ?? '', metric, amount)", "incrementMiniGameMetric(context.prisma, context.guildId, userId ?? '', metric, amount)")
          # Add user IDs to all command/session calls where the context has no userId.
          rep("  await recordMetricsSafely(context, [\n    ['minigame_plays', 1],\n    ['coinflip_plays', 1],", "  await recordMetricsSafely(context, [\n    ['minigame_plays', 1],\n    ['coinflip_plays', 1],")
          # Target the closing of coinflip metrics list.
          rep("      : []),\n  ]);\n\n  if (!config.coinflipAnimation)", "      : []),\n  ], interaction.user.id);\n\n  if (!config.coinflipAnimation)")
          rep("  await recordMetricsSafely(context, [\n    ['minigame_plays', 1],\n    ['highlow_plays', 1],\n  ]);", "  await recordMetricsSafely(\n    context,\n    [\n      ['minigame_plays', 1],\n      ['highlow_plays', 1],\n    ],\n    interaction.user.id,\n  );")
          rep("  await recordMetricsSafely(context, [\n    ['minigame_plays', 1],\n    ['blackjack_plays', 1],\n  ]);", "  await recordMetricsSafely(\n    context,\n    [\n      ['minigame_plays', 1],\n      ['blackjack_plays', 1],\n    ],\n    interaction.user.id,\n  );")
          rep("  await recordMetricsSafely(context, [['highlow_round_wins', 1]]);", "  await recordMetricsSafely(context, [['highlow_round_wins', 1]], session.userId);")
          rep("    await recordMetricsSafely(context, [\n      ['highlow_clears', 1],\n      ['minigame_wins', 1],\n    ]);", "    await recordMetricsSafely(\n      context,\n      [\n        ['highlow_clears', 1],\n        ['minigame_wins', 1],\n      ],\n      session.userId,\n    );")
          rep("  await recordMetricsSafely(context, metrics);", "  await recordMetricsSafely(context, metrics, session.userId);")
          p.write_text(s)
          PY
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/bot/src/plugins/mini-games.ts apps/bot/src/plugins/mini-games-repository.ts apps/bot/src/plugins/mini-games-stats.ts apps/bot/src/plugins/mini-games-stats.test.ts packages/plugin-catalog/src/manifests/mini-games.ts
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/temporary-mini-games-v2-runtime-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mini Games v2の戦績記録をランタイムへ接続する'
          git push origin HEAD:feature/mini-games-v2-stats-challenges
