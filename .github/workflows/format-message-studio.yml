name: Format Message Studio

on:
  push:
    branches:
      - feature/message-studio-console

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/message-studio-console
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/bot/src/health/message-studio-send.test.ts
          apps/bot/src/health/message-studio-send.ts
          apps/studio/src/components/message-studio-quick-send.tsx
          apps/studio/src/lib/message-studio-discord.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/health/message-studio-send.test.ts apps/bot/src/health/message-studio-send.ts apps/studio/src/components/message-studio-quick-send.tsx apps/studio/src/lib/message-studio-discord.ts
          git commit -m 'style: Message Studio差分を整形'
          git push origin HEAD:feature/message-studio-console
