name: Prettier Debug

on:
  push:
    branches: [feat/ai-role-mention-trigger]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier apps/bot/src/ai/artifact-message-handler.ts --write
          git diff -- apps/bot/src/ai/artifact-message-handler.ts
