# ============================================================
# Deploy — Production (AWS Lightsail)
# ============================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'デプロイするブランチ / タグ (既定: main)'
        required: false
        default: main

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/ivrooom/herta

jobs:
  build-image:
    name: Build and push production image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: 配布するimage参照を決定
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REPOSITORY}:$(git rev-parse HEAD)"
          echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"
          echo "HERTA_IMAGE=${IMAGE_REF}" >> "${GITHUB_ENV}"

      - name: Docker Buildxを準備
        uses: docker/setup-buildx-action@v4

      - name: GHCRへログイン
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Production Docker imageをbuild
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.image_ref }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha,scope=herta-production
          cache-to: type=gha,mode=max,scope=herta-production

      - name: 本番成果物を検証
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "${HERTA_IMAGE}" -lc '
            set -eu
            test -f apps/api/dist/main.js
            test -f apps/bot/dist/main.js
            test -f apps/worker/dist/main.js
            test -f apps/studio/.next/standalone/apps/studio/server.js
            test -n "$(find apps/studio/.next/standalone/apps/studio/.prisma/client \
              -maxdepth 1 -type f -name "libquery_engine-*.so.node" -print -quit)"
            test "$(id -u)" != "0"
          '

      - name: GHCRへpush
        shell: bash
        run: |
          set -euo pipefail
          docker push "${HERTA_IMAGE}"

          DEPLOY_REF='${{ github.event.inputs.ref || 'main' }}'
          if [ "${DEPLOY_REF}" = 'main' ]; then
            docker push "${IMAGE_REPOSITORY}:latest"
          fi

  deploy:
    name: SSH Deploy to Lightsail
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
      HERTA_IMAGE: ${{ needs.build-image.outputs.image_ref }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}

    steps:
      - name: AWS credentialsを設定
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::911291529944:role/ivrm-web-github-deploy-role
          aws-region: ap-northeast-1
          allowed-account-ids: '911291529944'
          role-session-name: HertaProductionDeploy

      - name: Spotify runtime secretsをSSMから取得
        shell: bash
        run: |
          set -euo pipefail

          SPOTIFY_CLIENT_ID_VALUE="$(aws ssm get-parameter \
            --region ap-northeast-1 \
            --name '/ivrm/runtime/spotify/client-id' \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          SPOTIFY_CLIENT_SECRET_VALUE="$(aws ssm get-parameter \
            --region ap-northeast-1 \
            --name '/ivrm/runtime/spotify/client-secret' \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"

          if [ -z "${SPOTIFY_CLIENT_ID_VALUE}" ] || [ "${SPOTIFY_CLIENT_ID_VALUE}" = 'None' ] || \
             [ -z "${SPOTIFY_CLIENT_SECRET_VALUE}" ] || [ "${SPOTIFY_CLIENT_SECRET_VALUE}" = 'None' ]; then
            echo "ERROR: Spotify runtime secretsがSSMにありません。" >&2
            exit 1
          fi

          echo "::add-mask::${SPOTIFY_CLIENT_ID_VALUE}"
          echo "::add-mask::${SPOTIFY_CLIENT_SECRET_VALUE}"
          {
            echo "SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID_VALUE}"
            echo "SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET_VALUE}"
          } >> "${GITHUB_ENV}"

          echo "Spotify runtime secretsをGitHub Actions側で取得しました（値は非表示、ID=${#SPOTIFY_CLIENT_ID_VALUE} chars / Secret=${#SPOTIFY_CLIENT_SECRET_VALUE} chars）"
          unset SPOTIFY_CLIENT_ID_VALUE SPOTIFY_CLIENT_SECRET_VALUE

      - name: LightsailへSSHデプロイ
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: DEPLOY_REF,HERTA_IMAGE,GHCR_USERNAME,GHCR_TOKEN,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET
          command_timeout: 15m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.LIGHTSAIL_APP_DIR }}"
            ENV_FILE="${APP_DIR}/.env.production"
            COMPOSE="docker compose --env-file ${ENV_FILE} -f docker-compose.prod.yml"
            export HERTA_IMAGE

            echo "=== Herta. 本番デプロイ開始 (ref: ${DEPLOY_REF}) ==="
            echo "配布image: ${HERTA_IMAGE}"
            cd "${APP_DIR}"

            if [ ! -r "${ENV_FILE}" ]; then
              echo "ERROR: ${ENV_FILE} が存在しないか読み取れません。" >&2
              exit 1
            fi

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "ERROR: tracked fileに未commitの変更があります。" >&2
              git status --short --untracked-files=no
              exit 1
            fi

            git fetch --prune --tags origin
            if git show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
              git checkout -B "${DEPLOY_REF}" "origin/${DEPLOY_REF}"
            else
              git checkout --detach "${DEPLOY_REF}"
            fi

            echo "=== Optional runtime secretsをGitHub Actionsから同期 ==="
            if [ -z "${SPOTIFY_CLIENT_ID:-}" ] || [ -z "${SPOTIFY_CLIENT_SECRET:-}" ]; then
              echo "ERROR: GitHub ActionsからSpotify runtime secretsが渡されていません。" >&2
              exit 1
            fi

            upsert_env() {
              key="$1"
              value="$2"
              tmp="$(mktemp)"
              awk -F= -v target="${key}" '$1 != target { print }' "${ENV_FILE}" > "${tmp}"
              printf '%s=%s\n' "${key}" "${value}" >> "${tmp}"
              chmod 600 "${tmp}"
              mv "${tmp}" "${ENV_FILE}"
            }
            upsert_env SPOTIFY_CLIENT_ID "${SPOTIFY_CLIENT_ID}"
            upsert_env SPOTIFY_CLIENT_SECRET "${SPOTIFY_CLIENT_SECRET}"
            echo "Spotify runtime secretsを同期しました（値は非表示）"

            # target revisionのdeploy helperを使ってimage/migration/service操作を行う。
            # readinessだけはworkflow側の現行security boundaryとして固定し、
            # workflow_dispatchでAOP-aware helper導入前のrefを選んでも
            # certificateなしlocalhost -> Caddy checkへ退行させない。
            source deploy/scripts/_common.sh
            wait_for_health() {
              echo "=== Internal API health check (api:3001) ==="
              for i in $(seq 1 24); do
                if ${COMPOSE} exec -T api node -e \
                  "fetch('http://127.0.0.1:3001/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))" \
                  > /dev/null 2>&1; then
                  echo "API internal health check 成功"
                  return 0
                fi
                echo "API 応答待ち... (${i}/24)"
                sleep 5
              done
              echo "ERROR: API internal health check に失敗しました。" >&2
              ${COMPOSE} logs --tail=100 api || true
              return 1
            }
            wait_for_auth() {
              echo "=== Internal Auth.js health check (studio:3000) ==="
              for i in $(seq 1 12); do
                if ${COMPOSE} exec -T studio node -e \
                  "fetch('http://127.0.0.1:3000/api/auth/providers').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))" \
                  > /dev/null 2>&1; then
                  echo "Auth.js internal health check 成功"
                  return 0
                fi
                echo "Studio認証応答待ち... (${i}/12)"
                sleep 5
              done
              echo "ERROR: Auth.js internal health check に失敗しました。" >&2
              ${COMPOSE} logs --tail=100 studio || true
              return 1
            }
            install_deploy_exit_trap

            ${COMPOSE} config --quiet

            printf '%s' "${GHCR_TOKEN}" | \
              docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin

            pull_production_images

            echo "=== 配布image内の成果物を検証 ==="
            docker run --rm --entrypoint sh "${HERTA_IMAGE}" -lc '
              set -eu
              test -f apps/api/dist/main.js
              test -f apps/bot/dist/main.js
              test -f apps/worker/dist/main.js
              test -f apps/studio/.next/standalone/apps/studio/server.js
              test -n "$(find apps/studio/.next/standalone/apps/studio/.prisma/client \
                -maxdepth 1 -type f -name "libquery_engine-*.so.node" -print -quit)"
            '

            ${COMPOSE} up -d --no-build --remove-orphans

            echo "=== nginx / caddy再起動 (upstream再解決) ==="
            ${COMPOSE} restart nginx caddy
            sleep 10
            ${COMPOSE} ps -a

            verify_running_services
            verify_migration

            # AOP有効後、localhost -> Caddy HTTPSはclient certificateなしで
            # 拒否されるのが正常。application healthはcontainer内部で確認する。
            wait_for_health
            wait_for_auth
            wait_for_bot

            docker logout ghcr.io > /dev/null 2>&1 || true
            clear_deploy_exit_trap
            echo "=== Herta. 本番デプロイ成功 ==="

      - name: Cloudflare経由の外部Health check
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://herta.ivrm.jp/api/v1/health > /dev/null
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://herta.ivrm.jp/api/auth/providers > /dev/null
