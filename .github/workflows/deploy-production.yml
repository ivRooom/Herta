# ============================================================
# Deploy — Production (AWS Lightsail)
# ------------------------------------------------------------
# main への push、または手動実行 (workflow_dispatch) で起動します。
# GitHub Actions から Lightsail へ SSH 接続し、
# git pull → docker compose build → up -d → health check を実行します。
#
# PR ではこのワークフローは実行されません (CI のみ)。
#
# 必要な GitHub Secrets:
#   LIGHTSAIL_HOST     … Lightsail の固定 IP または DNS 名
#   LIGHTSAIL_USER     … SSH ユーザー (例: ubuntu)
#   LIGHTSAIL_SSH_KEY  … SSH 秘密鍵 (PEM 全文)
#   LIGHTSAIL_APP_DIR  … アプリ配置ディレクトリ (例: /app/herta)
# ============================================================
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'デプロイするブランチ / タグ (既定: main)'
        required: false
        default: main

permissions:
  contents: read

# 本番デプロイは同時に 1 つだけ (進行中の実行はキャンセルしない)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Deploy to Lightsail
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Lightsail へ SSH デプロイ
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # 手動実行時は入力の ref、push 時は main を使用
          envs: DEPLOY_REF
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.LIGHTSAIL_APP_DIR }}"
            DEPLOY_REF="${{ github.event.inputs.ref || 'main' }}"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "=== Herta. 本番デプロイ開始 (ref: ${DEPLOY_REF}) ==="
            cd "${APP_DIR}"

            # 最新コードを取得
            git fetch --prune origin
            git checkout "${DEPLOY_REF}"
            git pull --ff-only origin "${DEPLOY_REF}"

            # 公開イメージだけをpullし、共有アプリイメージは1回だけbuildする。
            # api / studio / bot / worker / migrator は同じ herta-app:latest を利用する。
            ${COMPOSE} pull postgres redis nginx caddy
            ${COMPOSE} build api
            ${COMPOSE} up -d --no-build --remove-orphans
            ${COMPOSE} ps

            # up -d で api 等が recreate される一方 nginx/caddy は既存コンテナのまま
            # running のため、nginx upstream が古い api コンテナ IP を掴んだままになり
            # Caddy → nginx → api の経路で 502 が発生することがある。
            # プロキシを明示的に再起動して upstream を張り直す。
            echo "=== nginx / caddy 再起動 (upstream 再解決) ==="
            ${COMPOSE} restart nginx caddy
            sleep 5

            # Origin内部経路のHealth check。Origin CA証明書のためローカル確認では-kを使用する。
            echo "=== Origin health check ==="
            for i in $(seq 1 24); do
              if curl -fsS -k --resolve herta.ivrm.jp:443:127.0.0.1 https://herta.ivrm.jp/api/v1/health; then
                echo ""
                echo "Origin API health check 成功"
                exit 0
              fi
              echo "API 応答待ち... (${i}/24)"
              sleep 5
            done

            echo "API health check に失敗しました。ログを確認してください:"
            ${COMPOSE} logs --tail=100 api
            ${COMPOSE} logs --tail=100 nginx
            ${COMPOSE} logs --tail=100 caddy
            exit 1

      - name: Cloudflare経由の外部Health check
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://herta.ivrm.jp/api/v1/health
