name: Temporary Studio Permission Feedback Integration

on:
  push:
    branches:
      - feat/studio-permission-feedback
    paths:
      - .github/workflows/tmp-studio-permission-feedback.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/studio-permission-feedback
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Apply UI integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, path, count=1):
              if old not in text:
                  raise SystemExit(f'{path}: marker not found: {old[:100]!r}')
              return text.replace(old, new, count)

          files = [
              'apps/studio/src/components/managed-policy-manager.tsx',
              'apps/studio/src/components/access-group-manager.tsx',
              'apps/studio/src/components/role-lifecycle-manager.tsx',
          ]

          for path in files:
              p = Path(path)
              text = p.read_text()
              anchor = "import { useRouter } from 'next/navigation';\n"
              extra = (
                  "import { describeStudioApiError } from '@/lib/studio-api-feedback';\n"
                  "import { PermissionDisabledHint, ReadOnlyPermissionNotice, OWNER_ROOT_PERMISSION_HINT } "
                  "from '@/components/permission-disabled-hint';\n"
              )
              if "PermissionDisabledHint" not in text:
                  text = must_replace(text, anchor, anchor + extra, path)
              p.write_text(text)

          # Managed Policy
          path = 'apps/studio/src/components/managed-policy-manager.tsx'
          p = Path(path)
          text = p.read_text()
          text = must_replace(
              text,
              """      if (!response.ok) {\n        throw new Error(\n          [result?.error, ...(result?.details ?? [])].filter(Boolean).join(' / ') ||\n            '保存に失敗しました',\n        );\n      }""",
              """      if (!response.ok) {\n        throw new Error(\n          describeStudioApiError(response.status, result, '保存に失敗しました', 'access-control'),\n        );\n      }""",
              path,
          )
          text = must_replace(
              text,
              "if (!response.ok) throw new Error(result?.error || '削除に失敗しました');",
              "if (!response.ok) {\n        throw new Error(describeStudioApiError(response.status, result, '削除に失敗しました', 'access-control'));\n      }",
              path,
          )
          text = must_replace(
              text,
              "if (!response.ok) throw new Error(result?.error || 'Attachment更新に失敗しました');",
              "if (!response.ok) {\n        throw new Error(describeStudioApiError(response.status, result, 'Attachment更新に失敗しました', 'access-control'));\n      }",
              path,
          )
          header_marker = """      <div className=\"mt-6 grid gap-6 xl:grid-cols-[18rem_minmax(0,1fr)]\">"""
          text = must_replace(
              text,
              header_marker,
              """      {!canEdit ? <ReadOnlyPermissionNotice /> : null}\n\n      <div className=\"mt-6 grid gap-6 xl:grid-cols-[18rem_minmax(0,1fr)]\">""",
              path,
          )
          text = text.replace(
              'className="inline-flex items-center gap-2 rounded-xl border border-border px-3 py-2 text-sm font-semibold disabled:opacity-50"',
              'className="inline-flex items-center gap-2 rounded-xl border border-border px-3 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:grayscale disabled:opacity-40"',
          )
          text = text.replace(
              'className="inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground disabled:opacity-50"',
              'className="inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2 text-sm font-semibold text-primary-foreground disabled:cursor-not-allowed disabled:grayscale disabled:opacity-40"',
          )
          text = text.replace(
              'className="inline-flex items-center gap-2 rounded-xl border border-red-500/30 px-4 py-2 text-sm font-semibold text-red-600 disabled:opacity-50"',
              'className="inline-flex items-center gap-2 rounded-xl border border-red-500/30 px-4 py-2 text-sm font-semibold text-red-600 disabled:cursor-not-allowed disabled:grayscale disabled:opacity-40"',
          )
          text = text.replace(
              'disabled={!canEdit || pending}\n                maxLength={100}',
              'disabled={!canEdit || pending}\n                title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                maxLength={100}',
              1,
          )
          text = text.replace(
              'disabled={!canEdit || pending}\n                maxLength={500}',
              'disabled={!canEdit || pending}\n                title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                maxLength={500}',
              1,
          )
          text = text.replace(
              'readOnly={!canEdit}\n                spellCheck={false}',
              'readOnly={!canEdit}\n                title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                spellCheck={false}',
              1,
          )
          text = text.replace(
              'disabled={!canEdit || pending || !parsedDraft}\n                      />',
              'disabled={!canEdit || pending || !parsedDraft}\n                        title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                      />',
          )
          text = text.replace(
              'disabled={!canEdit || pending}\n                      className="rounded-full',
              'disabled={!canEdit || pending}\n                      title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                      className="rounded-full',
          )
          text = text.replace(
              'disabled={disabled}\n            />',
              'disabled={disabled}\n              title={disabled ? OWNER_ROOT_PERMISSION_HINT : undefined}\n            />',
          )
          # Wrap primary action buttons with focusable tooltip wrappers.
          text = text.replace(
              """        <button\n          type=\"button\"\n          onClick={startNew}\n          disabled={!canEdit || pending}""",
              """        <PermissionDisabledHint blocked={!canEdit}>\n        <button\n          type=\"button\"\n          onClick={startNew}\n          disabled={!canEdit || pending}""",
              1,
          )
          text = text.replace(
              """          <Plus className=\"h-4 w-4\" aria-hidden=\"true\" /> 新規Policy\n        </button>""",
              """          <Plus className=\"h-4 w-4\" aria-hidden=\"true\" /> 新規Policy\n        </button>\n        </PermissionDisabledHint>""",
              1,
          )
          text = text.replace('role="status"\n              className={`rounded-xl border px-3 py-2 text-sm ${', "role={notice.kind === 'error' ? 'alert' : 'status'}\n              className={`whitespace-pre-line rounded-xl border px-3 py-2 text-sm ${")
          p.write_text(text)

          # Access Group
          path = 'apps/studio/src/components/access-group-manager.tsx'
          p = Path(path)
          text = p.read_text()
          for old, fallback in [
              ("if (!response.ok) throw new Error(result?.error || 'Groupの保存に失敗しました');", 'Groupの保存に失敗しました'),
              ("if (!response.ok) throw new Error(result?.error || 'Groupの削除に失敗しました');", 'Groupの削除に失敗しました'),
              ("if (!response.ok) throw new Error(result?.error || 'Group Member更新に失敗しました');", 'Group Member更新に失敗しました'),
          ]:
              text = must_replace(text, old, f"if (!response.ok) {{\n        throw new Error(describeStudioApiError(response.status, result, '{fallback}', 'access-control'));\n      }}", path)
          text = must_replace(
              text,
              '<div className="mt-6 grid gap-6 xl:grid-cols-[18rem_minmax(0,1fr)]">',
              '{!canEdit ? <ReadOnlyPermissionNotice /> : null}\n\n      <div className="mt-6 grid gap-6 xl:grid-cols-[18rem_minmax(0,1fr)]">',
              path,
          )
          text = text.replace('disabled={!canEdit || pending}\n                maxLength={100}', 'disabled={!canEdit || pending}\n                title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                maxLength={100}', 1)
          text = text.replace('disabled={!canEdit || pending}\n                maxLength={500}', 'disabled={!canEdit || pending}\n                title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                maxLength={500}', 1)
          text = text.replace('disabled={!canEdit || pending}\n                  className="min-w-0', 'disabled={!canEdit || pending}\n                  title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                  className="min-w-0', 1)
          text = text.replace('disabled={!canEdit || pending}\n                    className="rounded-full', 'disabled={!canEdit || pending}\n                    title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                    className="rounded-full')
          text = text.replace('disabled:opacity-50', 'disabled:cursor-not-allowed disabled:grayscale disabled:opacity-40')
          text = text.replace('role="status"\n              className={`rounded-xl border px-3 py-2 text-sm ${', "role={notice.kind === 'error' ? 'alert' : 'status'}\n              className={`whitespace-pre-line rounded-xl border px-3 py-2 text-sm ${")
          text = text.replace(
              """        <button\n          type=\"button\"\n          onClick={startNew}\n          disabled={!canEdit || pending}""",
              """        <PermissionDisabledHint blocked={!canEdit}>\n        <button\n          type=\"button\"\n          onClick={startNew}\n          disabled={!canEdit || pending}""",
              1,
          )
          text = text.replace(
              """          新規Group\n        </button>""",
              """          新規Group\n        </button>\n        </PermissionDisabledHint>""",
              1,
          )
          p.write_text(text)

          # Role Lifecycle
          path = 'apps/studio/src/components/role-lifecycle-manager.tsx'
          p = Path(path)
          text = p.read_text()
          for old, fallback in [
              ("if (!response.ok) throw new Error(result?.error || 'Role作成の受付に失敗しました');", 'Role作成の受付に失敗しました'),
              ("if (!response.ok) throw new Error(result?.error || 'Role削除の受付に失敗しました');", 'Role削除の受付に失敗しました'),
          ]:
              text = must_replace(text, old, f"if (!response.ok) {{\n        throw new Error(describeStudioApiError(response.status, result, '{fallback}', 'role-lifecycle'));\n      }}", path)
          text = must_replace(
              text,
              '<div className="grid gap-5 xl:grid-cols-2">',
              '{!canEdit ? <ReadOnlyPermissionNotice /> : null}\n\n      <div className="grid gap-5 xl:grid-cols-2">',
              path,
          )
          text = text.replace('disabled={!canEdit || pendingAction !== null}', 'disabled={!canEdit || pendingAction !== null}\n              title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}', 1)
          text = text.replace('disabled={!canEdit || pendingAction !== null}\n                    className=', 'disabled={!canEdit || pendingAction !== null}\n                    title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                    className=')
          text = text.replace('disabled={!canEdit || pendingAction !== null}\n                  className=', 'disabled={!canEdit || pendingAction !== null}\n                  title={!canEdit ? OWNER_ROOT_PERMISSION_HINT : undefined}\n                  className=')
          text = text.replace('disabled:opacity-50', 'disabled:cursor-not-allowed disabled:grayscale disabled:opacity-40')
          text = text.replace('role="status"\n          className={`rounded-xl border px-3 py-2 text-sm ${', "role={notice.kind === 'error' ? 'alert' : 'status'}\n          className={`whitespace-pre-line rounded-xl border px-3 py-2 text-sm ${")
          old_warning = """            <p>\n              Herta\n              Botに「ロールの管理」権限がありません。Discord側で権限を付与するまでRole本体の変更は実行できません。\n            </p>"""
          new_warning = """            <div>\n              <p className=\"font-semibold\">Herta BotのDiscord権限が不足しています</p>\n              <p className=\"mt-1 leading-6\">\n                必要な権限は「ロールの管理」です。Discordのサーバー設定 → ロールでHerta\n                Botへ権限を付与し、Herta BotのRoleを操作対象Roleより上に配置してください。\n              </p>\n            </div>"""
          text = must_replace(text, old_warning, new_warning, path)
          p.write_text(text)

          # Add the focused helper test to the Studio test command.
          pkg = Path('apps/studio/package.json')
          text = pkg.read_text()
          marker = 'src/lib/studio-managed-access.test.ts src/lib/prisma-raw-error.test.ts'
          replacement = 'src/lib/studio-managed-access.test.ts src/lib/studio-api-feedback.test.ts src/lib/prisma-raw-error.test.ts'
          if replacement not in text:
              text = must_replace(text, marker, replacement, 'apps/studio/package.json')
              pkg.write_text(text)
          PY
      - run: pnpm prettier --write apps/studio/package.json apps/studio/src/components/permission-disabled-hint.tsx apps/studio/src/lib/studio-api-feedback.ts apps/studio/src/lib/studio-api-feedback.test.ts apps/studio/src/components/managed-policy-manager.tsx apps/studio/src/components/access-group-manager.tsx apps/studio/src/components/role-lifecycle-manager.tsx
      - run: pnpm --filter @herta/studio typecheck
      - run: node --experimental-strip-types --test apps/studio/src/lib/studio-api-feedback.test.ts
      - name: Commit integration
        run: |
          git config user.name "mizzz-ivr"
          git config user.email "mizzz._.dev@outlook.jp"
          git add apps/studio
          git diff --cached --quiet && exit 0
          git commit -m "feat(studio): make permission restrictions explicit"
          git push origin HEAD:feat/studio-permission-feedback
