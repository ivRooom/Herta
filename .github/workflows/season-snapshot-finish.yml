name: Season Snapshot Finish

on:
  push:
    branches:
      - feature/leaderboard-season-snapshots
    paths:
      - .github/workflows/season-snapshot-finish.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/leaderboard-season-snapshots
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch implementation
        run: |
          python <<'PY'
          from pathlib import Path

          leaderboard = Path('packages/db/src/community-leaderboard.ts')
          text = leaderboard.read_text()
          duplicate = """  const start = input.start ?? new Date('1970-01-01T00:00:00.000Z');\n  const databaseMetric = activityMetric(input.metric);"""
          if text.count(duplicate) != 1:
              raise SystemExit(f'expected one duplicate start block, got {text.count(duplicate)}')
          text = text.replace(duplicate, "  const databaseMetric = activityMetric(input.metric);", 1)
          leaderboard.write_text(text)

          schema = Path('packages/db/prisma/schema.prisma')
          text = schema.read_text()
          if 'model CommunitySeasonSnapshot {' not in text:
              marker = "// ============================================================\n// Plugin: Auto Response\n// ============================================================"
              models = r'''model CommunitySeasonSnapshot {
            guildId          String   @map("guild_id")
            seasonKey        String   @map("season_key") @db.VarChar(32)
            seasonIndex      Int      @map("season_index")
            startsAt         DateTime @map("starts_at") @db.Timestamptz(3)
            endsAt           DateTime @map("ends_at") @db.Timestamptz(3)
            participantCount Int      @default(0) @map("participant_count")
            sourceVersion    Int      @default(1) @map("source_version")
            finalizedAt      DateTime @default(now()) @map("finalized_at") @db.Timestamptz(3)

            entries CommunitySeasonSnapshotEntry[]

            @@id([guildId, seasonKey])
            @@index([seasonKey, finalizedAt(sort: Desc)])
            @@map("community_season_snapshots")
          }

          model CommunitySeasonSnapshotEntry {
            guildId   String  @map("guild_id")
            seasonKey String  @map("season_key") @db.VarChar(32)
            userId    String  @map("user_id")
            rank      Int
            points    Int
            awardTier String? @map("award_tier") @db.VarChar(16)

            snapshot CommunitySeasonSnapshot @relation(fields: [guildId, seasonKey], references: [guildId, seasonKey], onDelete: Cascade)

            @@id([guildId, seasonKey, userId])
            @@unique([guildId, seasonKey, rank])
            @@index([guildId, seasonKey, awardTier, rank])
            @@map("community_season_snapshot_entries")
          }

          '''
              if marker not in text:
                  raise SystemExit('schema marker not found')
              text = text.replace(marker, models + marker, 1)
              schema.write_text(text)

          page = Path('apps/studio/src/app/dashboard/guilds/[guildId]/leaderboard/page.tsx')
          text = page.read_text()
          text = text.replace('Leaderboard v3 · Seasons', 'Leaderboard v4 · Season Finals', 1)
          text = text.replace(
              'XPだけでなく、発言・Reaction・VC・Minecraft・Achievement・Season\n              Pointを同じ画面で比較できます。',
              'XPだけでなく、発言・Reaction・VC・Minecraft・Achievement・Season\n              Pointを比較できます。終了済みSeasonは確定Snapshotを優先して表示します。',
              1,
          )
          text = text.replace(
              '現在と過去5シーズンを切り替えて、Season PointとChampionを比較できます。',
              '現在と過去5シーズンを切り替えて、Season Point・Champion・確定Awardを比較できます。',
              1,
          )
          old_status = """{communityLeaderboardSeasonStatus(selectedSeason, now) === 'current'\n                ? `残り${communityLeaderboardSeasonDaysRemaining(selectedSeason, now)}日`\n                : 'Completed'}"""
          new_status = """{communityLeaderboardSeasonStatus(selectedSeason, now) === 'current'\n                ? `残り${communityLeaderboardSeasonDaysRemaining(selectedSeason, now)}日`\n                : snapshot.seasonSnapshot\n                  ? 'Official Final'\n                  : 'Finalization pending'}"""
          if old_status not in text:
              raise SystemExit('season status block not found')
          text = text.replace(old_status, new_status, 1)

          text = text.replace(
              'className="mt-4 grid gap-3 border-t border-border pt-4 sm:grid-cols-2"',
              'className="mt-4 grid gap-3 border-t border-border pt-4 sm:grid-cols-2 xl:grid-cols-3"',
              1,
          )
          champion_end = """            </div>\n          </div>\n        </section>\n      ) : null}"""
          snapshot_card = """            </div>\n            <div className=\"flex items-start gap-3 rounded-xl bg-background/60 p-3\">\n              <Medal className=\"mt-0.5 h-4 w-4 shrink-0 text-primary\" aria-hidden=\"true\" />\n              <div>\n                <p className=\"text-xs font-medium text-muted\">Season Final</p>\n                <p className=\"mt-1 text-sm font-semibold\">\n                  {snapshot.seasonSnapshot\n                    ? 'Official Snapshot'\n                    : communityLeaderboardSeasonStatus(selectedSeason, now) === 'current'\n                      ? 'Live Ranking'\n                      : 'Finalization pending'}\n                </p>\n                <p className=\"mt-0.5 text-xs text-muted\">\n                  {snapshot.seasonSnapshot\n                    ? `${formatFinalizedAt(snapshot.seasonSnapshot.finalizedAt)} · source v${snapshot.seasonSnapshot.sourceVersion}`\n                    : communityLeaderboardSeasonStatus(selectedSeason, now) === 'current'\n                      ? 'Season終了後に自動確定します'\n                      : 'Workerが確定処理を実行すると固定されます'}\n                </p>\n              </div>\n            </div>\n          </div>\n        </section>\n      ) : null}\n\n      {query.metric === 'season' && snapshot.seasonSnapshot && snapshot.seasonAwards.length > 0 ? (\n        <section\n          aria-labelledby=\"season-awards-title\"\n          className=\"rounded-2xl border border-primary/20 bg-surface p-4 shadow-card sm:p-5\"\n        >\n          <div className=\"flex items-start gap-3\">\n            <div className=\"flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary\">\n              <Medal className=\"h-5 w-5\" aria-hidden=\"true\" />\n            </div>\n            <div>\n              <h2 id=\"season-awards-title\" className=\"font-semibold\">Official Season Awards</h2>\n              <p className=\"mt-1 text-xs leading-5 text-muted\">\n                Season終了時の確定SnapshotからChampion / Top 3 / Top 10を表示します。\n              </p>\n            </div>\n          </div>\n          <div className=\"mt-4 grid gap-2 sm:grid-cols-2 xl:grid-cols-5\">\n            {snapshot.seasonAwards.map((award) => (\n              <article key={award.userId} className=\"rounded-xl border border-border bg-background/60 p-3\">\n                <div className=\"flex items-center justify-between gap-2\">\n                  <span className=\"rounded-full bg-primary/10 px-2 py-1 text-[11px] font-semibold text-primary\">\n                    {seasonAwardTierLabel(award.awardTier)}\n                  </span>\n                  <span className=\"text-xs font-semibold text-muted\">#{award.rank}</span>\n                </div>\n                <p className=\"mt-3 truncate text-sm font-semibold\">\n                  {displayName(memberMap.get(award.userId), award.userId)}\n                </p>\n                <p className=\"mt-1 text-xs text-muted\">{award.points.toLocaleString()} pt</p>\n              </article>\n            ))}\n          </div>\n        </section>\n      ) : null}"""
          if champion_end not in text:
              raise SystemExit('champion section end not found')
          text = text.replace(champion_end, snapshot_card, 1)

          helper_marker = 'function SummaryCard({' 
          helpers = """function seasonAwardTierLabel(tier: 'champion' | 'top3' | 'top10'): string {\n  if (tier === 'champion') return 'Champion';\n  if (tier === 'top3') return 'Top 3';\n  return 'Top 10';\n}\n\nfunction formatFinalizedAt(value: Date): string {\n  return new Intl.DateTimeFormat('ja-JP', {\n    timeZone: 'Asia/Tokyo',\n    year: 'numeric',\n    month: '2-digit',\n    day: '2-digit',\n    hour: '2-digit',\n    minute: '2-digit',\n  }).format(value);\n}\n\n"""
          if helper_marker not in text:
              raise SystemExit('summary helper marker not found')
          text = text.replace(helper_marker, helpers + helper_marker, 1)
          page.write_text(text)
          PY
      - name: Format Prisma and TypeScript
        run: |
          pnpm exec prisma format --schema packages/db/prisma/schema.prisma
          pnpm exec prettier --write \
            packages/db/src/community-leaderboard.ts \
            packages/db/src/community-season-snapshot.ts \
            packages/db/src/community-season-snapshot.test.ts \
            packages/db/src/index.ts \
            apps/worker/src/community-seasons.ts \
            apps/worker/src/main.ts \
            apps/studio/src/lib/community-leaderboard.ts \
            'apps/studio/src/app/dashboard/guilds/[guildId]/leaderboard/page.tsx'
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/db/prisma/schema.prisma packages/db/src apps/worker/src apps/studio/src
          git commit -m 'Season SnapshotのスキーマとUIを仕上げる'
          git push origin HEAD:feature/leaderboard-season-snapshots
