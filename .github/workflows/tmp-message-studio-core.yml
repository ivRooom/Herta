name: Temporary Message Studio Core

on:
  push:
    branches:
      - feat/message-studio-v2

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Message Studio core
        run: |
          python .github/scripts/tmp-message-studio-core.py
          python .github/scripts/tmp-message-studio-core-fix.py
      - name: Prisma Generate
        run: pnpm db:generate
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            packages/shared/src/types/plugin.ts \
            apps/bot/src/commands/registry.ts \
            plugins/daily-content/src/config.ts \
            plugins/daily-content/src/schedule.ts \
            plugins/daily-content/src/message.ts \
            plugins/daily-content/src/manifest.ts \
            plugins/daily-content/src/plugin.ts \
            plugins/daily-content/src/service.ts \
            apps/worker/src/daily-content.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit core
        run: |
          rm .github/scripts/tmp-message-studio-core.py
          rm .github/scripts/tmp-message-studio-core-fix.py
          rm .github/workflows/tmp-message-studio-core.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Announcement Message Studio v2のCoreを実装する'
          git push origin HEAD:feat/message-studio-v2
