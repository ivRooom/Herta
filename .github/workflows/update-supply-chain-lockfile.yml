name: Update Supply Chain Lockfile

on:
  push:
    branches: [security/add-sbom-cve-scan]
    paths: [.github/workflows/update-supply-chain-lockfile.yml]

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/add-sbom-cve-scan

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --lockfile-only

      - name: lockfileをコミット
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "lockfile差分はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security(deps): 修正版Runtime依存をlockfileへ反映"
          git push origin HEAD:security/add-sbom-cve-scan
