name: Temporary security lockfile regeneration #376

on:
  push:
    branches:
      - fix/376-security-gate
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    name: Regenerate pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Verify security override regression test
        run: node --test .github/scripts/security-overrides.test.mjs

      - name: Verify lockfile contains patched overrides
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'browserslist: 4.28.7' pnpm-lock.yaml
          grep -Fq 'fast-uri: 4.1.3' pnpm-lock.yaml
          git diff --check

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml did not change; refusing to create an empty commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): regenerate lockfile for security overrides'
          git push origin HEAD:fix/376-security-gate
