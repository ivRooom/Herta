name: Herta PG17 restore ACL synthetic gate
on:
  pull_request:
    paths:
      - '.github/workflows/herta-pg17-restore-acl.yml'
      - 'scripts/check-herta-restored-acl.sql'
      - 'scripts/test-herta-restore-acl-gate.sh'
jobs:
  isolated-acl:
    name: Offline PG17 default grant regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Confirm no production credentials and reproduce default grants
        run: bash scripts/test-herta-restore-acl-gate.sh
