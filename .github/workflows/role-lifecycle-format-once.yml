name: Role Lifecycle Format Once

on:
  push:
    branches:
      - feat/role-manager-lifecycle

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format role lifecycle repository and remove this temporary workflow
        shell: bash
        run: |
          pnpm exec prettier --write packages/db/src/discord-role-operations.ts
          rm .github/workflows/role-lifecycle-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/db/src/discord-role-operations.ts .github/workflows/role-lifecycle-format-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format Discord role operation repository'
          git push origin HEAD:feat/role-manager-lifecycle
