name: Format Discord Visual UI

on:
  push:
    branches:
      - feat/discord-embed-ui
    paths:
      - .github/workflows/format-discord-visual-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/discord-embed-ui
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: |
          pnpm exec prettier --write \
            plugins/moderation/src/discord-ui.ts \
            plugins/moderation/src/discord-ui.test.ts
          rm -f .github/workflows/format-discord-visual-ui.yml

      - name: Commit
        run: |
          git config user.name 'mizzz-ivr'
          git config user.email '86910433+mizzz-ivr@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'style: Discord Visual UIを整形'
          git push origin HEAD:feat/discord-embed-ui
