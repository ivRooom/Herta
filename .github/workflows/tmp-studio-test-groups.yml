name: Temporary Studio Test Reproduction

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: read

jobs:
  studio-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Reproduce Studio test through Turbo dependency pipeline
        run: pnpm turbo run test --filter=@herta/studio
