name: Temporary Mini Games format

on:
  push:
    branches:
      - feature/mini-games-coinflip-blackjack-highlow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-coinflip-blackjack-highlow
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/bot/src/plugins/mini-games-core.ts
          apps/bot/src/plugins/mini-games.ts
      - name: Commit formatted files and remove temporary workflow
        run: |
          rm .github/workflows/temporary-mini-games-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mini GamesをPrettierで整形する'
          git push origin HEAD:feature/mini-games-coinflip-blackjack-highlow
