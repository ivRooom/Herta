name: Team Split Sync Main

on:
  push:
    branches: [feat/team-split-plugin-v1]

permissions:
  contents: write

concurrency:
  group: team-split-sync-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/team-split-plugin-v1
          fetch-depth: 0
          persist-credentials: false
      - name: 最新mainをmergeして一時Workflowを削除
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-commit origin/main
          git rm -f .github/workflows/team-split-sync-main.yml
          git commit -m 'chore(team-split): 最新mainを取り込み'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/team-split-plugin-v1
