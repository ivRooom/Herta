name: Temporary Mini Games v3 wiring

on:
  push:
    branches:
      - feature/mini-games-v3-arcade-leaderboard-dice-chinchiro

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mini-games-v3-arcade-leaderboard-dice-chinchiro
      - name: Apply wiring patch
        run: python3 .github/scripts/temp-mini-games-v3-wire.py
      - name: Commit wiring and remove temporary files
        run: |
          rm .github/scripts/temp-mini-games-v3-wire.py
          rm .github/workflows/temporary-mini-games-v3-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bot/src/plugins .github
          git commit -m "Mini Games v3を既存Pluginへ接続する"
          git push origin HEAD:feature/mini-games-v3-arcade-leaderboard-dice-chinchiro
