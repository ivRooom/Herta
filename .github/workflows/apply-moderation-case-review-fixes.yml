name: Apply moderation case review fixes

on:
  push:
    branches:
      - feat/moderation-detection-case
    paths:
      - .github/workflows/apply-moderation-case-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-detection-case
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: レビュー指摘修正を適用
        run: |
          node scripts/apply-moderation-case-review-fixes.mjs
          pnpm exec prettier --write \
            'plugins/moderation/src/service.ts' \
            'plugins/moderation/src/detection-case.ts' \
            'plugins/moderation/src/detection-history.ts' \
            'plugins/moderation/src/detection-case.test.ts' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/moderation/detections/page.tsx' \
            'apps/studio/src/app/dashboard/guilds/[guildId]/moderation/[caseNumber]/page.tsx'
      - name: 修正結果をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 自動検知ケースのGuild境界と導線を改善"
          git push origin HEAD:feat/moderation-detection-case
