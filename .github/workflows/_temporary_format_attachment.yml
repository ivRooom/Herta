name: Temporary format attachment

on:
  push:
    branches:
      - feat/studio-managed-access-policies-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/studio-managed-access-policies-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and remove temporary workflow
        run: |
          pnpm prettier --write 'apps/studio/src/app/api/guilds/[guildId]/access-policies/attachments/route.ts'
          git rm .github/workflows/_temporary_format_attachment.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/app/api/guilds/[guildId]/access-policies/attachments/route.ts
          git commit -m "style: format stale attachment cleanup"
          git push origin HEAD:feat/studio-managed-access-policies-v1
