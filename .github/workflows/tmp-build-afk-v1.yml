                  },
                },
                notifyOnMention: {
                  type: 'boolean',
                  title: 'AFK中のメンバーがメンションされたら通知する',
                  default: true,
                  'x-herta-ui': {
                    section: 'メンション通知',
                    help: '既存のDISCORD_ENABLE_MESSAGE_CONTENT_INTENT設定を利用します。',
                  },
                },
                notificationCooldownSeconds: {
                  type: 'integer',
                  title: '同じAFKメンバーへの通知Cooldown（秒）',
                  minimum: 0,
                  maximum: 300,
                  default: 15,
                  'x-herta-ui': { section: 'メンション通知' },
                },
                maxMentionNotices: {
                  type: 'integer',
                  title: '1メッセージで通知するAFK人数',
                  minimum: 1,
                  maximum: 10,
                  default: 5,
                  'x-herta-ui': { section: 'メンション通知' },
                },
                maxListEntries: {
                  type: 'integer',
                  title: '/afk list の最大表示人数',
                  minimum: 5,
                  maximum: 50,
                  default: 25,
                  'x-herta-ui': { section: '一覧表示' },
                },
              },
              required: [
                'enabled',
                'ephemeralResponses',
                'defaultReason',
                'maxReasonLength',
                'autoClearOnMessage',
                'notifyOnMention',
                'notificationCooldownSeconds',
                'maxMentionNotices',
                'maxListEntries',
              ],
            },
            events: ['messageCreate'],
            commands: [
              {
                name: 'afk',
                description: 'AFK状態を設定・解除・確認します',
                subcommands: [
                  {
                    name: 'set',
                    description: 'AFK状態を設定します',
                    options: [
                      {
                        name: 'reason',
                        description: 'AFK理由（任意）',
                        type: 'string',
                      },
                    ],
                  },
                  {
                    name: 'clear',
                    description: '自分のAFK状態を解除します',
