          EOF

          mkdir -p packages/db/prisma/migrations/20260811081500_afk_plugin_v1
          cat > packages/db/prisma/migrations/20260811081500_afk_plugin_v1/migration.sql <<'EOF'
          CREATE TABLE "afk_statuses" (
            "guild_id" TEXT NOT NULL,
            "user_id" TEXT NOT NULL,
            "reason" VARCHAR(200) NOT NULL,
            "started_at" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updated_at" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            CONSTRAINT "afk_statuses_pkey" PRIMARY KEY ("guild_id", "user_id"),
            CONSTRAINT "afk_statuses_reason_length_check" CHECK (char_length("reason") BETWEEN 1 AND 200)
          );

          CREATE INDEX "afk_statuses_guild_started_at_idx"
            ON "afk_statuses" ("guild_id", "started_at" DESC);
          EOF

          node <<'NODE'
          const fs = require('fs');

          const catalogPath = 'packages/plugin-catalog/src/index.ts';
          let catalog = fs.readFileSync(catalogPath, 'utf8');
          if (!catalog.includes("import { afkManifest } from './manifests/afk.js';")) {
            catalog = catalog.replace(
              "import type { PluginManifest } from '@herta/shared';",
              "import type { PluginManifest } from '@herta/shared';\nimport { afkManifest } from './manifests/afk.js';",
            );
          }
          if (!catalog.includes("export { afkManifest } from './manifests/afk.js';")) {
            catalog = catalog.replace(
              "export { birthdayRoleManifest } from './manifests/birthday-role.js';",
              "export { afkManifest } from './manifests/afk.js';\nexport { birthdayRoleManifest } from './manifests/birthday-role.js';",
            );
          }
          if (!catalog.includes('  afkManifest,')) {
            catalog = catalog.replace('const pluginManifests: PluginManifest[] = [\n', 'const pluginManifests: PluginManifest[] = [\n  afkManifest,\n');
          }
          fs.writeFileSync(catalogPath, catalog);

          const registryPath = 'apps/bot/src/plugins/registry.ts';
          let registry = fs.readFileSync(registryPath, 'utf8');
          if (!registry.includes("import { afkPlugin } from './afk.js';")) {
            registry = registry.replace(
              "import type { SlashCommand } from '../commands/registry.js';",
              "import type { SlashCommand } from '../commands/registry.js';\nimport { afkPlugin } from './afk.js';",
            );
          }
          if (!registry.includes("  'afk',")) {
            registry = registry.replace('const officialPluginIds = [\n', "const officialPluginIds = [\n  'afk',\n");
          }
          if (!registry.includes('const afkEntry = deps')) {
            const marker = '  const autoResponseEntry = deps\n';
            const block = `  const afkEntry = deps\n    ? toRuntimePluginEntry(\n        afkPlugin,\n        (plugin, guildId, config) =>\n          createPluginContext({\n            client: deps.client,\n            prisma: deps.prisma,\n            logger: deps.logger,\n            guildId,\n            config,\n            manifest: plugin.manifest,\n          }) as Parameters<NonNullable<typeof afkPlugin.onEnable>>[0],\n      )\n    : undefined;\n`;
            if (!registry.includes(marker)) throw new Error('registry insertion marker missing');
            registry = registry.replace(marker, block + marker);
          }
          if (!registry.includes("if (pluginId === 'afk' && afkEntry)")) {
            registry = registry.replace(
              '  return officialPluginIds.flatMap((pluginId) => {\n',
              "  return officialPluginIds.flatMap((pluginId) => {\n    if (pluginId === 'afk' && afkEntry) return [afkEntry];\n",
            );
          }
          fs.writeFileSync(registryPath, registry);
          NODE

          pnpm exec prettier --write \
            apps/bot/src/plugins/afk-repository.ts \
            apps/bot/src/plugins/afk.ts \
            apps/bot/src/plugins/afk.test.ts \
            apps/bot/src/plugins/registry.ts \
            packages/plugin-catalog/src/index.ts \
            packages/plugin-catalog/src/manifests/afk.ts
          rm .github/workflows/tmp-build-afk-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AFK v1を実装する"
          git push origin HEAD
