name: Temporary IAM Formatter

on:
  push:
    branches:
      - feat/ivrm-admin-iam-integration
    paths:
      - .github/workflows/temp-format-ivrm-iam.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ivrm-admin-iam-integration
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format IAM integration
        run: pnpm exec prettier --write 'apps/studio/src/app/api/integrations/ivrm/guilds/[guildId]/iam/route.ts'
      - name: Commit formatted source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-format-ivrm-iam.yml
          git add 'apps/studio/src/app/api/integrations/ivrm/guilds/[guildId]/iam/route.ts'
          git commit -m "style(studio): apply repository formatter to IAM integration"
          git push origin HEAD:feat/ivrm-admin-iam-integration
