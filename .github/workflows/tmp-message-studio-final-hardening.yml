name: Temporary Message Studio Review Hardening

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Forum crosspost handling
        run: python -c 'from pathlib import Path; p=Path("apps/worker/src/daily-content.ts"); t=p.read_text(); old="  if (FORUM_CHANNEL_TYPES.has(channel.type)) {\n    return publishDiscordForumPost(input);\n  }\n"; new="  if (FORUM_CHANNEL_TYPES.has(channel.type)) {\n    if (input.publishAnnouncement) {\n      throw new DailyContentPublishError(\"DailyContentCrosspostUnsupportedForForum\", 400);\n    }\n    return publishDiscordForumPost(input);\n  }\n"; assert old in t, "forum branch pattern not found"; p.write_text(t.replace(old,new,1))'
      - run: pnpm db:generate
      - run: pnpm exec prettier --write apps/worker/src/daily-content.ts apps/studio/src/lib/message-studio-request.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push hardening to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/worker/src/daily-content.ts apps/studio/src/lib/message-studio-request.ts
          git commit -m 'Message StudioのForum Crosspost制約を明示する'
          git push origin HEAD:feat/message-studio-v2
