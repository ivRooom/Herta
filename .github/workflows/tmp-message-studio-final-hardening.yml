name: Temporary Message Studio Review Hardening

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          request_path = Path('apps/studio/src/lib/message-studio-request.ts')
          request = request_path.read_text()
          old = """import { parseLocalDateTime } from '@herta/plugin-catalog/daily-content-service';

export function normalizeMessageStudioRequestBody(
  body: Record<string, unknown>,
  defaultTimezone: string,
): Record<string, unknown> {
  const normalized = { ...body };
  const onceAt = normalized.onceAt;
  if (typeof onceAt === 'string' && onceAt.trim()) {
    const timezone =
      typeof normalized.timezone === 'string' && normalized.timezone.trim()
        ? normalized.timezone.trim()
        : defaultTimezone;
    normalized.onceAt = parseLocalDateTime(onceAt.trim().replace('T', ' '), timezone);
  }
  return normalized;
}
"""
          new = """import {
  DailyContentValidationError,
  parseLocalDateTime,
} from '@herta/plugin-catalog/daily-content-service';

const ISO_OFFSET_PATTERN = /(?:Z|[+-]\\d{2}:\\d{2})$/i;

export function normalizeMessageStudioRequestBody(
  body: Record<string, unknown>,
  defaultTimezone: string,
): Record<string, unknown> {
  const normalized = { ...body };
  const onceAt = normalized.onceAt;
  if (typeof onceAt === 'string' && onceAt.trim()) {
    const value = onceAt.trim();
    const timezone =
      typeof normalized.timezone === 'string' && normalized.timezone.trim()
        ? normalized.timezone.trim()
        : defaultTimezone;
    if (ISO_OFFSET_PATTERN.test(value)) {
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) {
        throw new DailyContentValidationError('onceAtの日時形式が不正です');
      }
      normalized.onceAt = parsed;
    } else {
      normalized.onceAt = parseLocalDateTime(value.replace('T', ' '), timezone);
    }
  }
  return normalized;
}
"""
          if old not in request:
              raise SystemExit('message-studio-request pattern not found')
          request_path.write_text(request.replace(old, new, 1))

          worker_path = Path('apps/worker/src/daily-content.ts')
          worker = worker_path.read_text()
          old = """  if (FORUM_CHANNEL_TYPES.has(channel.type)) {
    return publishDiscordForumPost(input);
  }
"""
          new = """  if (FORUM_CHANNEL_TYPES.has(channel.type)) {
    if (input.publishAnnouncement) {
      throw new DailyContentPublishError('DailyContentCrosspostUnsupportedForForum', 400);
    }
    return publishDiscordForumPost(input);
  }
"""
          if old not in worker:
              raise SystemExit('forum publish pattern not found')
          worker_path.write_text(worker.replace(old, new, 1))

          test_path = Path('apps/studio/src/lib/message-studio-request.test.ts')
          test_path.write_text("""import assert from 'node:assert/strict';
import test from 'node:test';

import { normalizeMessageStudioRequestBody } from './message-studio-request.ts';

test('offset付きISO onceAtを同じ絶対時刻として保持する', () => {
  const result = normalizeMessageStudioRequestBody(
    { onceAt: '2026-08-20T11:00:00.000Z' },
    'Asia/Tokyo',
  );
  assert.ok(result.onceAt instanceof Date);
  assert.equal(result.onceAt.toISOString(), '2026-08-20T11:00:00.000Z');
});

test('datetime-local onceAtは指定Timezoneの壁時計時刻として解釈する', () => {
  const result = normalizeMessageStudioRequestBody(
    { onceAt: '2026-08-20T20:00', timezone: 'Asia/Tokyo' },
    'UTC',
  );
  assert.ok(result.onceAt instanceof Date);
  assert.equal(result.onceAt.toISOString(), '2026-08-20T11:00:00.000Z');
});
""")

          package_path = Path('apps/studio/package.json')
          package = package_path.read_text()
          needle = 'src/lib/plugin-hub-preflight.test.ts'
          if 'src/lib/message-studio-request.test.ts' not in package:
              if needle not in package:
                  raise SystemExit('studio test script pattern not found')
              package = package.replace(
                  needle,
                  needle + ' src/lib/message-studio-request.test.ts',
                  1,
              )
              package_path.write_text(package)
          PY
      - run: pnpm db:generate
      - run: pnpm exec prettier --write apps/studio/src/lib/message-studio-request.ts apps/studio/src/lib/message-studio-request.test.ts apps/studio/package.json apps/worker/src/daily-content.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push hardening to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/src/lib/message-studio-request.ts apps/studio/src/lib/message-studio-request.test.ts apps/studio/package.json apps/worker/src/daily-content.ts
          git commit -m 'Message StudioのISO予約とForum Crosspostを強化する'
          git push origin HEAD:feat/message-studio-v2
