name: Temporary Message Studio Final Review Fixes

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add Prisma client dependency
        run: pnpm add '@prisma/client@^6.2.1' --filter @herta/plugin-daily-content
      - name: Apply Prisma JSON null and DST fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('plugins/daily-content/src/service.ts')
          service = service_path.read_text()
          import_anchor = "import {\n  DailyContentValidationError,"
          if "import { Prisma } from '@prisma/client';" not in service:
              service = service.replace(import_anchor, "import { Prisma } from '@prisma/client';\n\n" + import_anchor, 1)
          service = service.replace('embedJson: embed,', 'embedJson: embed ?? Prisma.DbNull,')
          service_path.write_text(service)

          schedule_path = Path('plugins/daily-content/src/schedule.ts')
          schedule = schedule_path.read_text()
          schedule = schedule.replace(
              ' * DSTで存在しない時刻は次の日へ送り、重複する時刻はafterより後の早い方を採用する。',
              ' * DSTで存在しない時刻は次の日へ送り、重複する時刻は同じ現地日で最初の候補だけを採用する。',
              1,
          )
          old = """    const next = candidates.find((candidate) => candidate.getTime() > input.after.getTime());
    if (next) return next;
"""
          new = """    const firstCandidate = candidates[0];
    if (firstCandidate && firstCandidate.getTime() > input.after.getTime()) {
      return firstCandidate;
    }
"""
          if old not in schedule:
              raise SystemExit('schedule candidate pattern not found')
          schedule = schedule.replace(old, new, 1)
          schedule_path.write_text(schedule)

          test_path = Path('plugins/daily-content/src/schedule.test.ts')
          tests = test_path.read_text()
          old_test = """  it('DST終了で重複する時刻はafterより後の候補を選ぶ', () => {
    const result = nextDailyOccurrence({
      scheduleTime: '01:30',
      timezone: 'America/New_York',
      after: new Date('2026-11-01T05:45:00.000Z'),
    });
    expect(result.toISOString()).toBe('2026-11-01T06:30:00.000Z');
  });
"""
          new_test = """  it('DST終了で同じ現地時刻が重複しても同日に2回配信しない', () => {
    const result = nextDailyOccurrence({
      scheduleTime: '01:30',
      timezone: 'America/New_York',
      after: new Date('2026-11-01T05:45:00.000Z'),
    });
    expect(result.toISOString()).toBe('2026-11-02T06:30:00.000Z');
  });
"""
          if old_test not in tests:
              raise SystemExit('daily DST test pattern not found')
          tests = tests.replace(old_test, new_test, 1)
          anchor = """  it('週次は指定した次の曜日だけを返す', () => {
    const result = nextWeeklyOccurrence({
      scheduleTime: '20:00',
      timezone: 'Asia/Tokyo',
      weekdays: [1, 3, 5],
      after: new Date('2026-08-12T12:00:00.000Z'),
    });
    expect(result.toISOString()).toBe('2026-08-14T11:00:00.000Z');
  });
"""
          addition = anchor + """

  it('週次もDST終了日の重複時刻を同日に再予約しない', () => {
    const result = nextWeeklyOccurrence({
      scheduleTime: '01:30',
      timezone: 'America/New_York',
      weekdays: [7],
      after: new Date('2026-11-01T05:30:00.000Z'),
    });
    expect(result.toISOString()).toBe('2026-11-08T06:30:00.000Z');
  });
"""
          if anchor not in tests:
              raise SystemExit('weekly test anchor not found')
          tests = tests.replace(anchor, addition, 1)
          test_path.write_text(tests)
          PY
      - run: pnpm db:generate
      - run: pnpm exec prettier --write plugins/daily-content/package.json plugins/daily-content/src/service.ts plugins/daily-content/src/schedule.ts plugins/daily-content/src/schedule.test.ts pnpm-lock.yaml
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push fixes to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/daily-content/package.json plugins/daily-content/src/service.ts plugins/daily-content/src/schedule.ts plugins/daily-content/src/schedule.test.ts pnpm-lock.yaml
          git commit -m 'Message StudioのJSON nullとDST重複予約を修正する'
          git pull --rebase origin feat/message-studio-v2
          git push origin HEAD:feat/message-studio-v2
