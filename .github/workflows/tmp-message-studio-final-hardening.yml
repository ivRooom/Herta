name: Temporary Message Studio Final Hardening

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest_path = Path('plugins/daily-content/src/manifest.ts')
          manifest = manifest_path.read_text()
          old = """          options: [{ ...targetOption, required: true }, ...contentOptions],"""
          new = """          options: [{ ...targetOption, required: true }, forumTitleOption, ...contentOptions],"""
          if old not in manifest:
              raise SystemExit('say send options pattern not found')
          manifest_path.write_text(manifest.replace(old, new, 1))

          plugin_path = Path('plugins/daily-content/src/plugin.ts')
          plugin = plugin_path.read_text()
          old = """    if (crosspost && sent.crosspost) await sent.crosspost();
              await respond(interaction, `📢 <#${channelId}> へお知らせを投稿しました（${sent.id}）`);"""
          new = """    let crosspostWarning = '';
              if (crosspost && sent.crosspost) {
                try {
                  await sent.crosspost();
                } catch (error) {
                  crosspostWarning = ' / Crosspostのみ失敗';
                  context.logger.warn(
                    { error, guildId: context.guildId, channelId, messageId: sent.id },
                    'AnnouncementのCrosspostに失敗しました。元メッセージは投稿済みです',
                  );
                }
              }
              await respond(
                interaction,
                `📢 <#${channelId}> へお知らせを投稿しました（${sent.id}）${crosspostWarning}`,
              );"""
          if old not in plugin:
              raise SystemExit('crosspost pattern not found')
          plugin_path.write_text(plugin.replace(old, new, 1))
          PY
      - run: pnpm db:generate
      - run: pnpm exec prettier --write plugins/daily-content/src/manifest.ts plugins/daily-content/src/plugin.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push hardening to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/daily-content/src/manifest.ts plugins/daily-content/src/plugin.ts
          git commit -m 'Message StudioのForum発言とCrosspost失敗処理を強化する'
          git push origin HEAD:feat/message-studio-v2
