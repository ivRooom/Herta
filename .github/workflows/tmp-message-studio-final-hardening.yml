name: Temporary Message Studio Final Review Fixes

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch DB null execution
        run: |
          python -c "from pathlib import Path; p=Path('plugins/daily-content/src/service.ts'); t=p.read_text(); t=t.replace('  \u0024queryRawUnsafe(query: string, ...values: unknown[]): Promise<unknown>;','  \u0024queryRawUnsafe(query: string, ...values: unknown[]): Promise<unknown>;\n  \u0024executeRawUnsafe(query: string, ...values: unknown[]): Promise<number>;'); t=t.replace(\"await tx.\u0024queryRawUnsafe('UPDATE daily_contents SET embed_json = NULL WHERE id = \u00241', current.id);\",\"await tx.\u0024executeRawUnsafe('UPDATE daily_contents SET embed_json = NULL WHERE id = \u00241', current.id);\"); p.write_text(t)"
          python -c "from pathlib import Path; p=Path('plugins/daily-content/src/service.test.ts'); t=p.read_text(); t=t.replace('    \u0024queryRawUnsafe: async () => [],','    \u0024queryRawUnsafe: async () => [],\n    \u0024executeRawUnsafe: async () => 1,'); p.write_text(t)"
      - name: Patch DST duplicate occurrence handling
        run: |
          python -c "from pathlib import Path; p=Path('plugins/daily-content/src/schedule.ts'); t=p.read_text(); t=t.replace(' * DSTで存在しない時刻は次の日へ送り、重複する時刻はafterより後の早い方を採用する。',' * DSTで存在しない時刻は次の日へ送り、重複する時刻は同じ現地日で最初の候補だけを採用する。'); old='    const next = candidates.find((candidate) => candidate.getTime() > input.after.getTime());\n    if (next) return next;'; new='    const firstCandidate = candidates[0];\n    if (firstCandidate && firstCandidate.getTime() > input.after.getTime()) {\n      return firstCandidate;\n    }'; assert old in t; p.write_text(t.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('plugins/daily-content/src/schedule.test.ts'); t=p.read_text(); old=\"  it('DST終了で重複する時刻はafterより後の候補を選ぶ', () => {\\n    const result = nextDailyOccurrence({\\n      scheduleTime: '01:30',\\n      timezone: 'America/New_York',\\n      after: new Date('2026-11-01T05:45:00.000Z'),\\n    });\\n    expect(result.toISOString()).toBe('2026-11-01T06:30:00.000Z');\\n  });\"; new=\"  it('DST終了で同じ現地時刻が重複しても同日に2回配信しない', () => {\\n    const result = nextDailyOccurrence({\\n      scheduleTime: '01:30',\\n      timezone: 'America/New_York',\\n      after: new Date('2026-11-01T05:45:00.000Z'),\\n    });\\n    expect(result.toISOString()).toBe('2026-11-02T06:30:00.000Z');\\n  });\"; assert old in t; t=t.replace(old,new,1); anchor=\"  it('週次は指定した次の曜日だけを返す', () => {\\n    const result = nextWeeklyOccurrence({\\n      scheduleTime: '20:00',\\n      timezone: 'Asia/Tokyo',\\n      weekdays: [1, 3, 5],\\n      after: new Date('2026-08-12T12:00:00.000Z'),\\n    });\\n    expect(result.toISOString()).toBe('2026-08-14T11:00:00.000Z');\\n  });\"; add=anchor+\"\\n\\n  it('週次もDST終了日の重複時刻を同日に再予約しない', () => {\\n    const result = nextWeeklyOccurrence({\\n      scheduleTime: '01:30',\\n      timezone: 'America/New_York',\\n      weekdays: [7],\\n      after: new Date('2026-11-01T05:30:00.000Z'),\\n    });\\n    expect(result.toISOString()).toBe('2026-11-08T06:30:00.000Z');\\n  });\"; assert anchor in t; p.write_text(t.replace(anchor,add,1))"
      - run: pnpm db:generate
      - run: pnpm exec prettier --write plugins/daily-content/src/service.ts plugins/daily-content/src/service.test.ts plugins/daily-content/src/schedule.ts plugins/daily-content/src/schedule.test.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/daily-content/src/service.ts plugins/daily-content/src/service.test.ts plugins/daily-content/src/schedule.ts plugins/daily-content/src/schedule.test.ts
          git commit -m 'Message StudioのDB null処理とDST重複予約を修正する'
          git pull --rebase origin feat/message-studio-v2
          git push origin HEAD:feat/message-studio-v2
