name: Temporary Message Studio Timezone Display Fix

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply timezone display fix
        run: |
          sed -i 's/formatDate(schedule.onceAt)/formatDate(schedule.onceAt, schedule.timezone)/' apps/studio/src/components/daily-content-manager.tsx
          sed -i 's/function formatDate(value: string | null): string {/function formatDate(value: string | null, timezone?: string): string {/' apps/studio/src/components/daily-content-manager.tsx
          python -c 'from pathlib import Path; p=Path("apps/studio/src/components/daily-content-manager.tsx"); t=p.read_text(); old="return new Intl.DateTimeFormat(\u0027ja-JP\u0027, {\n    year: \u0027numeric\u0027,"; new="return new Intl.DateTimeFormat(\u0027ja-JP\u0027, {\n    ...(timezone ? { timeZone: timezone } : {}),\n    year: \u0027numeric\u0027,"; assert old in t; p.write_text(t.replace(old,new,1))'
      - run: pnpm db:generate
      - run: pnpm exec prettier --write apps/studio/src/components/daily-content-manager.tsx plugins/daily-content/src/service.test.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/src/components/daily-content-manager.tsx plugins/daily-content/src/service.test.ts
          git commit -m 'Message Studioのone-shot時刻表示をTimezone準拠にする'
          git pull --rebase origin feat/message-studio-v2
          git push origin HEAD:feat/message-studio-v2
