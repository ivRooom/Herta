name: Temporary Message Studio DB Null Final Fix

on:
  push:
    branches:
      - tmp/message-studio-final-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/message-studio-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch DB null execution
        run: |
          python -c "from pathlib import Path; p=Path('plugins/daily-content/src/service.ts'); t=p.read_text(); old='  \u0024queryRawUnsafe(query: string, ...values: unknown[]): Promise<unknown>;'; new=old+'\n  \u0024executeRawUnsafe(query: string, ...values: unknown[]): Promise<number>;'; assert old in t; t=t.replace(old,new,1); old2=\"await tx.\u0024queryRawUnsafe(\\n        'UPDATE daily_contents SET embed_json = NULL WHERE id = \u00241',\\n        current.id,\\n      );\"; new2=\"await tx.\u0024executeRawUnsafe(\\n        'UPDATE daily_contents SET embed_json = NULL WHERE id = \u00241',\\n        current.id,\\n      );\"; assert old2 in t; p.write_text(t.replace(old2,new2,1))"
          python -c "from pathlib import Path; p=Path('plugins/daily-content/src/service.test.ts'); t=p.read_text(); old='    \u0024queryRawUnsafe: async () => [],'; assert old in t; p.write_text(t.replace(old,old+'\n    \u0024executeRawUnsafe: async () => 1,',1))"
      - run: pnpm db:generate
      - run: pnpm exec prettier --write plugins/daily-content/src/service.ts plugins/daily-content/src/service.test.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/daily-content/src/service.ts plugins/daily-content/src/service.test.ts
          git commit -m 'Message Studioのnullable JSON更新を安全化する'
          git pull --rebase origin feat/message-studio-v2
          git push origin HEAD:feat/message-studio-v2
