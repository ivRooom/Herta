name: Format moderation rule builder

on:
  push:
    branches:
      - feat/moderation-rule-builder-ui
    paths:
      - .github/workflows/format-moderation-rule-builder.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/moderation-rule-builder-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettierを適用
        run: |
          pnpm exec prettier --write \
            apps/studio/src/components/moderation-config-form.tsx \
            apps/studio/src/lib/moderation-config-ui.ts \
            apps/studio/src/lib/moderation-config-ui.test.ts
          rm .github/workflows/format-moderation-rule-builder.yml
      - name: 整形結果をcommit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: Moderation Rule Builder UIを整形"
          git push origin HEAD:feat/moderation-rule-builder-ui
