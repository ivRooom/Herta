name: PR349 format

on:
  push:
    branches:
      - 'feat/345-image-generation-runtime'

permissions:
  contents: write

jobs:
  format-and-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format image validation
        run: pnpm exec prettier --write apps/bot/src/ai/image-artifact-validation.ts
      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/pr349-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/bot/src/ai/image-artifact-validation.ts .github/workflows/pr349-format.yml
          git commit -m 'style(ai): format sharp 0.35 validation'
          git push
