name: PR232 Final Format

on:
  push:
    branches:
      - feature/message-studio-drafts-voice-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/message-studio-drafts-voice-v1
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write 'apps/studio/src/app/api/guilds/[guildId]/message-studio/drafts/route.ts'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'apps/studio/src/app/api/guilds/[guildId]/message-studio/drafts/route.ts'
          if ! git diff --cached --quiet; then
            git commit -m 'style: format final Message Studio draft route'
            git push origin HEAD:feature/message-studio-drafts-voice-v1
          fi
