name: Temporary Server Context Large Files Patch

on:
  push:
    branches:
      - feature/studio-server-context-bot-profile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/studio-server-context-bot-profile
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch large source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bot_path = Path('apps/bot/src/bot.ts')
          bot = bot_path.read_text()
          import_anchor = "import { searchGuildMemberOptions, type GuildMemberOption } from './health/guild-members.js';\n"
          profile_import = """import {
            getGuildBotProfile as getDiscordGuildBotProfile,
            updateGuildBotProfile as updateDiscordGuildBotProfile,
            type GuildBotProfile,
            type GuildBotProfileUpdate,
          } from './profile/guild-bot-profile.js';
          """
          if profile_import.strip() not in bot:
              if import_anchor not in bot:
                  raise RuntimeError('bot profile import anchor not found')
              bot = bot.replace(import_anchor, import_anchor + profile_import, 1)

          method_anchor = "  async getGuildConfigurationOptions(guildId: string): Promise<GuildConfigurationOptions | null> {\n"
          methods = """  async getGuildBotProfile(guildId: string): Promise<GuildBotProfile | null> {
            return getDiscordGuildBotProfile(this.client, guildId);
          }

          async updateGuildBotProfile(
            guildId: string,
            input: GuildBotProfileUpdate,
          ): Promise<GuildBotProfile | null> {
            return updateDiscordGuildBotProfile(this.client, guildId, input);
          }

          """
          if 'async updateGuildBotProfile(' not in bot:
              if method_anchor not in bot:
                  raise RuntimeError('bot profile method anchor not found')
              bot = bot.replace(method_anchor, methods + method_anchor, 1)
          bot_path.write_text(bot)

          palette_path = Path('apps/studio/src/components/console-command-palette.tsx')
          palette = palette_path.read_text()
          old_count = palette.count('currentGuild')
          if old_count not in (0, 5):
              raise RuntimeError(f'unexpected currentGuild count: {old_count}')
          palette_path.write_text(palette.replace('currentGuild', 'selectedGuild'))
          PY
      - name: Format patched files
        run: pnpm exec prettier --write apps/bot/src/bot.ts apps/studio/src/components/console-command-palette.tsx
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-server-context-large-files.yml
          git config user.name "mizzz-ivr"
          git config user.email "86910433+mizzz-ivr@users.noreply.github.com"
          git add apps/bot/src/bot.ts apps/studio/src/components/console-command-palette.tsx
          git commit -m "Bot内部プロフィール接続とCommand Paletteを修正"
          git fetch origin feature/studio-server-context-bot-profile
          git rebase origin/feature/studio-server-context-bot-profile
          git push origin HEAD:feature/studio-server-context-bot-profile
