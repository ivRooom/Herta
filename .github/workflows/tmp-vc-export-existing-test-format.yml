name: Temporary VC Export Existing Test Formatter
on:
  push:
    branches:
      - security/vc-recap-export-exact-iam-20261030
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[vc-format-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/studio/src/lib/studio-policy-resources.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- apps/studio/src/lib/studio-policy-resources.test.ts
            git commit -m "style(studio): format permission regression test [vc-format-skip]"
            git push origin HEAD:security/vc-recap-export-exact-iam-20261030
          fi
