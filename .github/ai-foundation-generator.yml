name: AI Foundation Draft Validation

on:
  push:
    branches:
      - feat/ai-foundation-console-credentials

permissions:
  contents: write

jobs:
  prepare-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply AI Foundation integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('packages/plugin-catalog/src/ai-service.ts')
          text = service.read_text()
          text = text.replace("'gpt-5.6-sol': { inputUsdPerMillion: 2.5, outputUsdPerMillion: 15 },", "'gpt-5.6-sol': { inputUsdPerMillion: 4, outputUsdPerMillion: 20 },")
          text = text.replace("'gpt-5.6-terra': { inputUsdPerMillion: 1.25, outputUsdPerMillion: 7.5 },", "'gpt-5.6-terra': { inputUsdPerMillion: 2, outputUsdPerMillion: 12 },")
          text = text.replace("'gpt-5.6-luna': { inputUsdPerMillion: 0.5, outputUsdPerMillion: 3 },", "'gpt-5.6-luna': { inputUsdPerMillion: 0.2, outputUsdPerMillion: 1.2 },")
          old_tuple = """function numericTuple(value: unknown, length: number): number[] {
            if (!Array.isArray(value) || value.length < length) throw new AiFoundationError('internal_error');
            return value.slice(0, length).map((item) => numericScalar(item));
          }
          """
          new_tuple = """function numericTuple(value: unknown, length: 2): [number, number];
          function numericTuple(value: unknown, length: 3): [number, number, number];
          function numericTuple(
            value: unknown,
            length: 2 | 3,
          ): [number, number] | [number, number, number] {
            if (!Array.isArray(value) || value.length < length) {
              throw new AiFoundationError('internal_error');
            }
            if (length === 2) return [numericScalar(value[0]), numericScalar(value[1])];
            return [numericScalar(value[0]), numericScalar(value[1]), numericScalar(value[2])];
          }
          """
          if old_tuple not in text:
              raise SystemExit('numericTuple source block not found')
          service.write_text(text.replace(old_tuple, new_tuple))

          tests = Path('packages/plugin-catalog/src/ai-service.test.ts')
          text = tests.read_text()
          text = text.replace('expect(result.estimatedCost).toBe(0.0001);', 'expect(result.estimatedCost).toBe(0.00016);')
          text = text.replace("expect(estimateOpenAiCostMicroUsd('gpt-5.6-terra', 20, 10)).toBe(100);", "expect(estimateOpenAiCostMicroUsd('gpt-5.6-terra', 20, 10)).toBe(160);")
          tests.write_text(text)

          registry = Path('apps/bot/src/plugins/registry.ts')
          text = registry.read_text()
          needle = "  'afk',\n  'auto-response',"
          if needle not in text:
              raise SystemExit('official plugin id insertion point not found')
          registry.write_text(text.replace(needle, "  'afk',\n  'ai',\n  'auto-response',", 1))

          compose = Path('docker-compose.prod.yml')
          text = compose.read_text()
          needle = "      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}\n      DISCORD_CLIENT_ID:"
          ai_env = """      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
                HERTA_RUNTIME_SECRET_KEY: ${HERTA_RUNTIME_SECRET_KEY:-}
                OPENAI_API_KEY: ${OPENAI_API_KEY:-}
                HERTA_AI_ENABLED: ${HERTA_AI_ENABLED:-false}
                HERTA_AI_KILL_SWITCH: ${HERTA_AI_KILL_SWITCH:-false}
                HERTA_AI_PROVIDER: ${HERTA_AI_PROVIDER:-openai}
                HERTA_AI_MODEL_PROFILE: ${HERTA_AI_MODEL_PROFILE:-balanced}
                HERTA_AI_MODEL: ${HERTA_AI_MODEL:-}
                HERTA_AI_MAX_INPUT_CHARS: ${HERTA_AI_MAX_INPUT_CHARS:-8000}
                HERTA_AI_MAX_INPUT_BYTES: ${HERTA_AI_MAX_INPUT_BYTES:-24000}
                HERTA_AI_MAX_OUTPUT_TOKENS: ${HERTA_AI_MAX_OUTPUT_TOKENS:-800}
                HERTA_AI_MAX_OUTPUT_CHARS: ${HERTA_AI_MAX_OUTPUT_CHARS:-6000}
                HERTA_AI_TIMEOUT_MS: ${HERTA_AI_TIMEOUT_MS:-12000}
                HERTA_AI_PROVIDER_RESPONSE_MAX_BYTES: ${HERTA_AI_PROVIDER_RESPONSE_MAX_BYTES:-524288}
                HERTA_AI_USER_RATE_LIMIT: ${HERTA_AI_USER_RATE_LIMIT:-6}
                HERTA_AI_GUILD_RATE_LIMIT: ${HERTA_AI_GUILD_RATE_LIMIT:-30}
                HERTA_AI_RATE_WINDOW_MS: ${HERTA_AI_RATE_WINDOW_MS:-60000}
                HERTA_AI_GUILD_QUOTA_MICRO_USD: ${HERTA_AI_GUILD_QUOTA_MICRO_USD:-1000000}
                HERTA_AI_QUOTA_WINDOW_MS: ${HERTA_AI_QUOTA_WINDOW_MS:-86400000}
                HERTA_AI_GLOBAL_CONCURRENCY: ${HERTA_AI_GLOBAL_CONCURRENCY:-4}
                HERTA_AI_PER_REQUEST_COST_LIMIT_MICRO_USD: ${HERTA_AI_PER_REQUEST_COST_LIMIT_MICRO_USD:-30000}
                DISCORD_CLIENT_ID:"""
          if needle not in text:
              raise SystemExit('bot compose insertion point not found')
          compose.write_text(text.replace(needle, ai_env, 1))

          ai_section = """
          # --- AI Foundation v1 ---
          # 既定OFF。Gate 0 / Credential Console rollout完了後に明示的に有効化する。
          HERTA_AI_ENABLED=false
          # 緊急停止。trueならGuild設定に関係なくproviderを呼ばない。
          HERTA_AI_KILL_SWITCH=false
          HERTA_AI_PROVIDER=openai
          # quality=Sol / balanced=Terra / economy=Luna。clientから任意model指定は受け付けない。
          HERTA_AI_MODEL_PROFILE=balanced
          # 通常は空欄。server-side allowlist内で明示overrideする場合のみ指定する。
          HERTA_AI_MODEL=
          HERTA_AI_MAX_INPUT_CHARS=8000
          HERTA_AI_MAX_INPUT_BYTES=24000
          HERTA_AI_MAX_OUTPUT_TOKENS=800
          HERTA_AI_MAX_OUTPUT_CHARS=6000
          HERTA_AI_TIMEOUT_MS=12000
          HERTA_AI_PROVIDER_RESPONSE_MAX_BYTES=524288
          HERTA_AI_USER_RATE_LIMIT=6
          HERTA_AI_GUILD_RATE_LIMIT=30
          HERTA_AI_RATE_WINDOW_MS=60000
          # micro USD。既定はGuildあたり24hで$1、1 request $0.03。
          HERTA_AI_GUILD_QUOTA_MICRO_USD=1000000
          HERTA_AI_QUOTA_WINDOW_MS=86400000
          HERTA_AI_GLOBAL_CONCURRENCY=4
          HERTA_AI_PER_REQUEST_COST_LIMIT_MICRO_USD=30000
          """
          for env_name in ['.env.example', '.env.production.example']:
              path = Path(env_name)
              text = path.read_text()
              marker = '\n# --- JWT'
              if marker not in text:
                  raise SystemExit(f'JWT marker not found in {env_name}')
              path.write_text(text.replace(marker, '\n' + ai_section.strip() + '\n' + marker, 1))
          PY

          mkdir -p apps/bot/src/ai
          cat > apps/bot/src/ai/factory.ts <<'EOF'
          import {
            OPENAI_API_KEY_RUNTIME_SECRET,
            RuntimeSecretError,
            readRuntimeSecret,
          } from '@herta/db';
          import {
            AiFoundationService,
            OpenAiResponsesProvider,
            RedisAiGuardStore,
            resolveAiFoundationConfig,
            type AiTelemetrySink,
            type RedisEvalClient,
          } from '@herta/plugin-catalog/ai-service';

          type RuntimeSecretPrisma = Parameters<typeof readRuntimeSecret>[0];
          type RuntimeSecretReader = typeof readRuntimeSecret;

          export type AiCredentialSource = 'runtime_secret' | 'environment';
          export type AiRuntimeBootstrapStatus = 'disabled' | 'credential_unavailable' | 'ready';

          export interface AiCredentialResolution {
            apiKey: string | null;
            source: AiCredentialSource | null;
            failure: string | null;
          }

          export interface AiFoundationRuntimeBootstrap {
            service: AiFoundationService | null;
            status: AiRuntimeBootstrapStatus;
            credentialSource: AiCredentialSource | null;
          }

          export interface AiFoundationRuntimeOptions {
            prisma: RuntimeSecretPrisma;
            redis: RedisEvalClient;
            env?: Record<string, string | undefined>;
            telemetry?: AiTelemetrySink;
            readSecret?: RuntimeSecretReader;
          }

          /**
           * Runtime Secret Storeを最優先し、まだconsole credentialが無い場合だけenv fallbackを使う。
           * encrypted secretが存在するのにmaster key不正/復号失敗ならfail closedし、envへ逃がさない。
           */
          export async function resolveAiOpenAiCredential(
            options: Pick<AiFoundationRuntimeOptions, 'prisma' | 'env' | 'readSecret'>,
          ): Promise<AiCredentialResolution> {
            const env = options.env ?? process.env;
            const readSecret = options.readSecret ?? readRuntimeSecret;
            try {
              const stored = await readSecret(options.prisma, OPENAI_API_KEY_RUNTIME_SECRET, env);
              if (stored) return { apiKey: stored, source: 'runtime_secret', failure: null };
            } catch (error) {
              if (error instanceof RuntimeSecretError) {
                return { apiKey: null, source: null, failure: error.code };
              }
              // DB障害時だけmigration/emergency fallbackを許可する。
              // raw provider errorやcredential値はここではlogしない。
            }

            const fallback = env['OPENAI_API_KEY']?.trim();
            return fallback
              ? { apiKey: fallback, source: 'environment', failure: null }
              : { apiKey: null, source: null, failure: 'missing_credential' };
          }

          /**
           * Bot-side bootstrap。AIがOFF/kill-switch中、またはcredential不成立でもBot本体は起動可能にする。
           * 実際のDiscord Q&A surfaceは後続PRからこのserviceを利用する。
           */
          export async function createAiFoundationRuntime(
            options: AiFoundationRuntimeOptions,
          ): Promise<AiFoundationRuntimeBootstrap> {
            const env = options.env ?? process.env;
            const config = resolveAiFoundationConfig(env);
            if (!config.enabled || config.killSwitch) {
              return { service: null, status: 'disabled', credentialSource: null };
            }

            const credential = await resolveAiOpenAiCredential(options);
            if (!credential.apiKey) {
              return { service: null, status: 'credential_unavailable', credentialSource: null };
            }

            return {
              service: new AiFoundationService({
                config,
                provider: new OpenAiResponsesProvider({ apiKey: credential.apiKey }),
                guardStore: new RedisAiGuardStore({ redis: options.redis }),
                telemetry: options.telemetry,
              }),
              status: 'ready',
              credentialSource: credential.source,
            };
          }
          EOF

          cat > apps/bot/src/ai/factory.test.ts <<'EOF'
          import { RuntimeSecretError, readRuntimeSecret } from '@herta/db';
          import type { RedisEvalClient } from '@herta/plugin-catalog/ai-service';
          import { describe, expect, it } from 'vitest';
          import { createAiFoundationRuntime, resolveAiOpenAiCredential } from './factory.js';

          const prisma = {} as Parameters<typeof readRuntimeSecret>[0];
          const redis: RedisEvalClient = {
            eval: async () => 1,
          };

          describe('AI Foundation Bot credential bootstrap', () => {
            it('runtime secretをenv fallbackより優先する', async () => {
              const result = await resolveAiOpenAiCredential({
                prisma,
                env: { OPENAI_API_KEY: 'env-key' },
                readSecret: async () => 'stored-key',
              });
              expect(result).toEqual({ apiKey: 'stored-key', source: 'runtime_secret', failure: null });
            });

            it('runtime secret未登録時だけOPENAI_API_KEY fallbackを使う', async () => {
              const result = await resolveAiOpenAiCredential({
                prisma,
                env: { OPENAI_API_KEY: 'env-key' },
                readSecret: async () => null,
              });
              expect(result).toEqual({ apiKey: 'env-key', source: 'environment', failure: null });
            });

            it('master key/decrypt failureはenv fallbackへ逃がさずfail closedする', async () => {
              const result = await resolveAiOpenAiCredential({
                prisma,
                env: { OPENAI_API_KEY: 'env-key' },
                readSecret: async () => {
                  throw new RuntimeSecretError('decrypt_failed');
                },
              });
              expect(result).toEqual({ apiKey: null, source: null, failure: 'decrypt_failed' });
            });

            it('DB unavailable時はemergency env fallbackを許可する', async () => {
              const result = await resolveAiOpenAiCredential({
                prisma,
                env: { OPENAI_API_KEY: 'env-key' },
                readSecret: async () => {
                  throw new Error('database unavailable');
                },
              });
              expect(result).toEqual({ apiKey: 'env-key', source: 'environment', failure: null });
            });

            it('AI既定OFFならcredentialを読まずBotを壊さない', async () => {
              const result = await createAiFoundationRuntime({
                prisma,
                redis,
                env: {},
                readSecret: async () => {
                  throw new Error('must not read credential while disabled');
                },
              });
              expect(result).toEqual({ service: null, status: 'disabled', credentialSource: null });
            });

            it('AI ONかつcredentialありでserviceを構築する', async () => {
              const result = await createAiFoundationRuntime({
                prisma,
                redis,
                env: { HERTA_AI_ENABLED: 'true' },
                readSecret: async () => 'stored-key',
              });
              expect(result.status).toBe('ready');
              expect(result.credentialSource).toBe('runtime_secret');
              expect(result.service).not.toBeNull();
            });
          });
          EOF

          cat > docs/AI_FOUNDATION.md <<'EOF'
          # AI Foundation v1

          Hertaの生成AI機能をDiscord/RAG機能から分離し、provider呼び出し前に共通の安全境界を提供するserver-side foundationです。

          ## Rollout state

          - production既定: `HERTA_AI_ENABLED=false`
          - provider: `openai` only
          - provider credential: Studio Runtime Secret Store `openai.api_key` をprimary source
          - `OPENAI_API_KEY`: migration / emergency fallback only
          - Guild Plugin configへprovider secret/model/quotaは保存しない
          - Discord mention/Q&A surfaceとRAG corpusは後続PR

          ## Model allowlist

          | Profile | Model | Standard input / 1M | Standard output / 1M |
          | --- | --- | ---: | ---: |
          | quality | `gpt-5.6-sol` | $4.00 | $20.00 |
          | balanced | `gpt-5.6-terra` | $2.00 | $12.00 |
          | economy | `gpt-5.6-luna` | $0.20 | $1.20 |

          2026-08-26時点のOpenAI標準text token価格をcode-reviewed constantとして保持します。Herta v1の入力上限は24,000 bytesのため、272K tokens超リクエスト向けの高倍率価格帯には到達しません。cost guardはcached-input割引を前提にせず標準価格で保守的に見積もります。

          ## Default guards

          - max input: 8,000 chars / 24,000 bytes
          - max output: 800 tokens / 6,000 chars
          - timeout: 12s
          - provider response body: 512 KiB
          - per-user: 6 req / 60s
          - per-Guild: 30 req / 60s
          - per-Guild budget: $1 / 24h
          - global concurrency: 4
          - per-request preflight cost cap: $0.03
          - global kill switch: `HERTA_AI_KILL_SWITCH`

          `quality` profileの最大入力+最大出力は既定$0.03 request capを超え得ます。これは意図したcost guardで、qualityを使う場合も無条件にcapを広げず、利用実績を確認してserver-side envで明示調整します。

          ## Enablement gates

          Provider callにはすべて必要です。

          1. global `HERTA_AI_ENABLED=true`
          2. kill switch OFF
          3. server-side authorization OK
          4. request Guild scope一致
          5. AI Plugin enabled
          6. Guild config `enabled=true` opt-in
          7. bounded input
          8. per-user / per-Guild rate limit
          9. per-Guild quota reservation
          10. global concurrency lease
          11. provider/model allowlist

          ## Credential resolution

          Bot-side factory `apps/bot/src/ai/factory.ts` は次の順でOpenAI credentialを解決します。

          1. encrypted Runtime Secret Store `openai.api_key`
          2. secret未登録時のみ `OPENAI_API_KEY`
          3. DB自体がunavailableの場合はemergency fallbackとして `OPENAI_API_KEY`

          Runtime Secretが存在するのにmaster key不正/復号失敗の場合はfail closedし、env fallbackへ逃がしません。credential値はstructured log、telemetry、Plugin configへ出しません。

          ## Error taxonomy

          外部surfaceへ流すcategoryは以下だけです。

          - `disabled`
          - `unauthorized`
          - `rate_limited`
          - `quota_exceeded`
          - `invalid_input`
          - `timeout`
          - `provider_unavailable`
          - `provider_rejected`
          - `malformed_response`
          - `output_too_large`
          - `internal_error`

          Provider本文/error bodyをそのまま利用者やlogへ返しません。

          ## Privacy / observability

          raw prompt / raw responseはdefaultで永続保存・structured loggingしません。許可するAI telemetry metadataは以下です。

          - requestId
          - feature
          - provider
          - model
          - latency
          - input/output/total tokens
          - estimated cost
          - result category
          - error category

          Redis rate/quota keyではraw Guild ID / User IDをSHA-256由来の短いprivacy keyへ変換します。

          ## OpenAI Responses API

          - endpoint: `/v1/responses`
          - `store:false`
          - `truncation:'disabled'`
          - `reasoning.effort:'low'`
          - `max_output_tokens` server-side bound
          - AbortController timeout
          - bounded provider response parsing

          `store:false`はHerta側のprivacy方針の一部ですが、provider側のabuse-monitoring retention等をゼロにする保証として扱いません。

          ## Production rollout

          Gate 0 / AOPとCredential Consoleを先に完了します。

          1. #328/#333等のorigin protection deployment pathをproductionへ反映
          2. Cloudflare Global AOPを有効化しCloudflare経由200 / direct-origin TLS拒否を確認
          3. Credential Console migrationを適用
          4. `HERTA_RUNTIME_SECRET_KEY` をserver-sideへ一度設定
          5. Studio SettingsからOpenAI API keyを登録
          6. Semantic Search等でconsole credentialを確認
          7. AI Foundation自体は `HERTA_AI_ENABLED=false` のままdeploy
          8. Discord Q&A/RAG surface完成後、限定Guildでopt-inして段階有効化

          ## Emergency response

          Provider障害・予算異常・abuse疑い時は最優先で `HERTA_AI_KILL_SWITCH=true`。非AI機能は継続できる設計を維持します。
          EOF

          pnpm exec prettier --write \
            packages/plugin-catalog/src/ai-service.ts \
            packages/plugin-catalog/src/ai-service.test.ts \
            apps/bot/src/plugins/registry.ts \
            apps/bot/src/ai/factory.ts \
            apps/bot/src/ai/factory.test.ts \
            docker-compose.prod.yml \
            .env.example \
            .env.production.example \
            docs/AI_FOUNDATION.md

      - name: Prisma Generate
        run: pnpm db:generate
      - name: Format Check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Production Compose Validation
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null

      - name: Commit validated integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/plugin-catalog/src/ai-service.ts \
            packages/plugin-catalog/src/ai-service.test.ts \
            apps/bot/src/plugins/registry.ts \
            apps/bot/src/ai/factory.ts \
            apps/bot/src/ai/factory.test.ts \
            docker-compose.prod.yml \
            .env.example \
            .env.production.example \
            docs/AI_FOUNDATION.md
          git commit -m 'feat(ai): integrate runtime credential foundation'
          git push origin HEAD:feat/ai-foundation-console-credentials
